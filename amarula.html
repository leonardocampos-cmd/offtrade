<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campanha Amarula 2026</title>
  <script src="amarula_data.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           #0d0b08;
      --card:         #1c1812;
      --card2:        #26211a;
      --accent:       #d4962a;
      --accent-light: #f5d48a;
      --green:        #4ade80;
      --text:         #ede8de;
      --muted:        #9a8a76;
      --border:       #33291e;
      --gold-grad:    linear-gradient(135deg, #d4962a, #c07820);
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      padding: 16px;
      max-width: 920px;
      margin: 0 auto;
    }

    /* ── Header ──────────────────────────────────────────────── */
    header {
      text-align: center;
      padding: 28px 20px 22px;
      margin-bottom: 22px;
      border-bottom: 1px solid var(--border);
    }
    .camp-badge {
      display: inline-block;
      background: var(--gold-grad);
      color: #fff;
      font-size: 0.62rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      padding: 3px 12px;
      border-radius: 20px;
      margin-bottom: 12px;
    }
    header h1 {
      font-size: 2rem;
      font-weight: 800;
      color: var(--accent);
      letter-spacing: -0.02em;
      margin-bottom: 4px;
    }
    .camp-sub {
      font-size: 0.78rem;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .camp-periodo {
      display: inline-block;
      background: var(--card2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 5px 16px;
      font-size: 0.85rem;
      color: var(--accent-light);
      font-weight: 600;
      margin-bottom: 18px;
    }
    .camp-premios {
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
    }
    .camp-premio-box {
      background: var(--card2);
      border: 1px solid #d4962a44;
      border-radius: 10px;
      padding: 10px 24px;
      text-align: center;
      min-width: 160px;
    }
    .camp-premio-label {
      font-size: 0.63rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .camp-premio-val {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--accent);
    }

    /* ── KPIs ─────────────────────────────────────────────────── */
    .kpis {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 22px;
    }
    .kpi {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 12px;
      text-align: center;
    }
    .kpi-label {
      font-size: 0.63rem;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--muted);
      margin-bottom: 5px;
    }
    .kpi-val {
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--accent-light);
      line-height: 1;
    }
    .kpi-sub {
      font-size: 0.62rem;
      color: var(--muted);
      margin-top: 4px;
    }

    /* ── Rankings ─────────────────────────────────────────────── */
    .rankings {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 24px;
    }
    .rank-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }
    .rank-header {
      padding: 13px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card2);
    }
    .rank-title {
      font-size: 0.88rem;
      font-weight: 700;
    }
    .rank-prize-label {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--accent);
    }
    .rank-list { padding: 4px 0; }
    .rank-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 14px;
      border-bottom: 1px solid rgba(51,41,30,0.5);
      transition: background 0.15s;
    }
    .rank-row:last-child { border-bottom: none; }
    .rank-row:hover { background: var(--card2); }
    .rank-row.primeiro {
      background: linear-gradient(90deg, #2a1e0a, #1c1812);
      border-left: 3px solid var(--accent);
    }
    .rank-pos {
      font-size: 1.05rem;
      width: 26px;
      text-align: center;
      flex-shrink: 0;
    }
    .rank-nome {
      flex: 1;
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .rank-val-box { text-align: right; flex-shrink: 0; }
    .rank-val {
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--accent-light);
      white-space: nowrap;
    }
    .rank-prize-tag {
      display: block;
      background: var(--gold-grad);
      color: #111;
      font-size: 0.6rem;
      font-weight: 800;
      padding: 1px 6px;
      border-radius: 4px;
      margin-top: 3px;
      text-align: center;
    }
    .rank-empty {
      padding: 40px 16px;
      text-align: center;
      color: var(--muted);
      font-size: 0.85rem;
      line-height: 1.6;
    }

    /* ── Footer ──────────────────────────────────────────────── */
    .nav-back { display:inline-flex; align-items:center; gap:6px; color:var(--muted); font-size:0.8rem; text-decoration:none; margin-bottom:20px; transition:color .15s; }
    .nav-back:hover { color:var(--accent-light); }

    footer {
      text-align: center;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.72rem;
      line-height: 1.8;
    }
    footer strong { color: var(--text); }

    @media (max-width: 620px) {
      .rankings { grid-template-columns: 1fr; }
      .kpis     { grid-template-columns: 1fr 1fr; }
      header h1 { font-size: 1.5rem; }
    }
    @media (max-width: 380px) {
      .kpis { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <a class="nav-back" href="index.html">&#8592; Home</a>

  <header>
    <div class="camp-badge">Campanha Ativa</div>
    <h1>Campanha Amarula</h1>
    <p class="camp-sub">Empresa toda — On Trade + Off Trade</p>
    <div class="camp-periodo">25/05/2026 a 25/06/2026</div>
    <div class="camp-premios">
      <div class="camp-premio-box">
        <div class="camp-premio-label">Melhor Positivacao</div>
        <div class="camp-premio-val">R$ 3.000</div>
      </div>
      <div class="camp-premio-box">
        <div class="camp-premio-label">Melhor Faturamento</div>
        <div class="camp-premio-val">R$ 3.000</div>
      </div>
    </div>
  </header>

  <div class="kpis" id="kpis"></div>

  <div class="rankings">
    <div class="rank-card">
      <div class="rank-header">
        <span class="rank-title">Positivacao</span>
        <span class="rank-prize-label">Premio R$ 3.000</span>
      </div>
      <div class="rank-list" id="rank-pos"></div>
    </div>
    <div class="rank-card">
      <div class="rank-header">
        <span class="rank-title">Faturamento</span>
        <span class="rank-prize-label">Premio R$ 3.000</span>
      </div>
      <div class="rank-list" id="rank-fat"></div>
    </div>
  </div>

  <footer>
    Atualizado em <strong id="atualizado"></strong>
    &bull; Todos os produtos com a palavra <strong>Amarula</strong>
    &bull; Refresh em <strong><span id="countdown">5:00</span></strong>
  </footer>

  <script>
    const D = AMARULA_DATA;
    const MEDALS = ['🥇', '🥈', '🥉'];

    document.getElementById('atualizado').textContent = D.atualizado_em;

    // ── KPIs ──────────────────────────────────────────────────
    function fmtFat(v) {
      return 'R$ ' + v.toLocaleString('pt-BR', {minimumFractionDigits: 2, maximumFractionDigits: 2});
    }
    function fmtPos(v) {
      return v.toLocaleString('pt-BR');
    }

    document.getElementById('kpis').innerHTML = [
      { label: 'Vendedores',           val: fmtPos(D.total_vendedores),  sub: 'participando' },
      { label: 'Positivacao Total',    val: fmtPos(D.total_positivacao), sub: 'clientes unicos' },
      { label: 'Faturamento Total',    val: fmtFat(D.total_faturamento), sub: 'em Amarula' },
    ].map(k => `
      <div class="kpi">
        <div class="kpi-label">${k.label}</div>
        <div class="kpi-val">${k.val}</div>
        <div class="kpi-sub">${k.sub}</div>
      </div>`).join('');

    // ── Rankings ───────────────────────────────────────────────
    function buildRanking(containerId, rows, tipo) {
      const el = document.getElementById(containerId);
      if (!rows || !rows.length) {
        el.innerHTML = '<div class="rank-empty">Sem vendas Amarula registradas ainda.<br>A campanha comeca em 25/05/2026.</div>';
        return;
      }
      el.innerHTML = rows.map((r, i) => {
        const pos = i < 3 ? MEDALS[i] : (i + 1);
        const val = tipo === 'fat'
          ? fmtFat(r.valor)
          : fmtPos(r.valor) + ' clientes';
        const prizeTag = i === 0
          ? '<span class="rank-prize-tag">R$ 3.000</span>'
          : '';
        const rowCls = i === 0 ? ' primeiro' : '';
        return `
          <div class="rank-row${rowCls}">
            <span class="rank-pos">${pos}</span>
            <span class="rank-nome" title="${r.vendedor}">${r.vendedor}</span>
            <div class="rank-val-box">
              <div class="rank-val">${val}</div>
              ${prizeTag}
            </div>
          </div>`;
      }).join('');
    }

    buildRanking('rank-pos', D.ranking_positivacao, 'pos');
    buildRanking('rank-fat', D.ranking_faturamento, 'fat');

    // ── Countdown auto-refresh (5 min) ────────────────────────
    let secs = 300;
    setInterval(() => {
      secs--;
      if (secs <= 0) { location.reload(); return; }
      const m = Math.floor(secs / 60);
      const s = String(secs % 60).padStart(2, '0');
      document.getElementById('countdown').textContent = `${m}:${s}`;
    }, 1000);
  </script>
</body>
</html>
