<head>
  <script>
    // Gate específico desta página — NÃO usa o auth.js compartilhado de
    // propósito: auth.js/_GESTORES_PERMITIDOS é uma lista única usada por
    // ~30 páginas "só gestor"; adicionar um e-mail lá dá acesso a todas elas.
    // joao.diniz@rigarr.com.br tem acesso restrito só à Promotoria (pedido
    // do usuário em 2026-08-26) — ver também o bloco "_ACESSO_RESTRITO" em
    // login.html, que autentica esse e-mail via Google sem marcar
    // sessionStorage.rg_auth (o "flag de gestor" que as outras páginas
    // aceitam), então ele nunca passa no gate de nenhuma outra página.
    (function _redirectLocalToVps() {
      if (location.hostname !== 'offtrade.duckdns.org') {
        location.replace('https://offtrade.duckdns.org/' + location.pathname.split(/[\\/]/).pop() + location.search);
      }
    })();

    const _AUTH_HASH = 'b4ba917b95850dc43cce91dba3be9fd1a4f029e18b81d6846a7183839c81d8dd';
    const _AUTH_KEY  = 'rg_auth';
    const _GESTORES_PERMITIDOS = [
      'danielle.soares@rigarr.com.br',
      'allan.correa@rigarr.com.br',
      'leonardo.campos@rigarr.com.br',
      'alexsandro.nunes@rigarr.com.br',
      'giovani.cabral@rigarr.com.br',
      'kaliel.caro@rigarr.com.br',
      'artur.furlan@rigarr.com.br',
      'daniel.diniz@rigarr.com.br',
      'marcus.tanamachi@rigarr.com.br',
      'geovanna.lescano@rigarr.com.br',
      'fernando.risson@rigarr.com.br',
      'erocles.oliveira@rigarr.com.br',
      'andre.massensini@rigarr.com.br',
      'priscilla.zambrano@rigarr.com.br',
      'anderson.canaveis@rigarr.com.br',
    ];
    // Só essa pessoa, só nessa página.
    const _EMAIL_RESTRITO_ESTA_PAGINA = 'joao.diniz@rigarr.com.br';

    function _getCookie(name) {
      const m = document.cookie.match(new RegExp('(?:^|; )' + name + '=([^;]*)'));
      return m ? decodeURIComponent(m[1]) : null;
    }
    function _decodeEmailFromCookie() {
      try {
        const raw = _getCookie('offtrade_token');
        if (!raw) return '';
        const idToken = JSON.parse(raw).id_token || '';
        let payload = idToken.split('.')[1] || '';
        payload = payload.replace(/-/g, '+').replace(/_/g, '/');
        payload += '='.repeat((4 - payload.length % 4) % 4);
        return (JSON.parse(atob(payload)).email || '').toLowerCase();
      } catch (e) {
        return '';
      }
    }

    (function checkAuth() {
      // Gestor de verdade (mesmo atalho de auth.js) OU o e-mail restrito
      // já validado nesta aba.
      if (sessionStorage.getItem(_AUTH_KEY) === _AUTH_HASH && sessionStorage.getItem('rg_email')) return;
      if (sessionStorage.getItem('rg_email_restrito') === _EMAIL_RESTRITO_ESTA_PAGINA) return;

      const _email = _decodeEmailFromCookie();
      if (_email && _GESTORES_PERMITIDOS.includes(_email)) {
        sessionStorage.setItem(_AUTH_KEY, _AUTH_HASH);
        sessionStorage.setItem('rg_email', _email);
        return;
      }
      if (_email === _EMAIL_RESTRITO_ESTA_PAGINA) {
        sessionStorage.setItem('rg_email_restrito', _email);
        return;
      }

      sessionStorage.setItem('rg_redirect', location.pathname + location.search);
      location.replace('login.html');
    })();
  </script>

    * { box-sizing: border-box; margin: 0; padding: 0; }

    @media (max-width: 640px) {

<script>
const DATA = typeof PROMOTORIA_DATA !== 'undefined' ? PROMOTORIA_DATA : null;
let aba = 'pesquisas';
let paginaAtual = 1;
const TAM_PAGINA = 200; // dataset pode passar de 100k linhas — sem paginação o navegador trava renderizando tudo

function _esc(v) {
  if (v === null || v === undefined) return '';
  return String(v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function _escAttr(v) {
  return _esc(v).replace(/'/g, '&#39;');
}

function _clienteLabel(r) {
  return r.fantasia && r.fantasia !== r.razao_social ? `${r.razao_social} (${r.fantasia})` : (r.razao_social || '');
}

// Tarefas tipo CHECK_IN/CHECK_OUT não têm pergunta/resposta de verdade — é
// só um contador interno de foto anexada ("Checkin | Checkout" → "2"), sem
// sentido mostrado como resposta (usuário perguntou "dá pra saber quais são
// as respostas?" em 2026-08-31). Mostra a contagem de fotos em vez disso.
function _perguntaResposta(r) {
  if (r.tipo_checklist === 'CHECK_IN' || r.tipo_checklist === 'CHECK_OUT') {
    const n = (r.fotos || []).length || r.qtd_fotos || 0;
    return { pergunta: '', resposta: n ? `${n} foto(s) anexada(s)` : 'sem foto anexada' };
  }
  return { pergunta: r.pergunta || '', resposta: r.resposta || '' };
}

function _parseDataBr(d) {
  // 'dd/mm/aaaa' -> 'aaaa-mm-dd' (comparável com input[type=date])
  if (!d) return '';
  const [dd, mm, aaaa] = d.split('/');
  return `${aaaa}-${mm}-${dd}`;
}

function _fmtHora(dt) {
  return dt.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
}

function _duracaoVisita(r) {
  if (!r.check_in || !r.check_out) return '—';
  const min = Math.round((new Date(r.check_out) - new Date(r.check_in)) / 60000);
  return `${min} min`;
}

// Nome do arquivo do Max Promotor carrega o horário real da captura:
// RESP_PESQUISA_ITEM_MARCA_<hash>_DD_MM_AAAA_HH_MM_SS.jpg — extrai pra
// comparar com check_in/check_out sem precisar abrir a foto (achado real:
// visita de Alexandre Arruda/DOM ATACADISTA em 28/08/2026 tinha fotos
// tiradas 2h10min ANTES do check-in registrado).
function _timestampFoto(url) {
  const m = (url || '').match(/_(\d{2})_(\d{2})_(\d{4})_(\d{2})_(\d{2})_(\d{2})\.\w+(?:\?|$)/);
  if (!m) return null;
  const [, dd, mm, aaaa, hh, mi, ss] = m.map(Number);
  return new Date(aaaa, mm - 1, dd, hh, mi, ss);
}

// Análise automática — só o que dá pra calcular com os dados já coletados
// (timestamp do nome do arquivo, check_in/check_out, contagem de fotos).
// NÃO tenta avaliar ruptura/execução/precificação por visão computacional
// nas fotos (pedido do usuário em 2026-08-28: só a parte automatizável por
// dado, a leitura visual fica pra análise manual sob demanda).
function _analisarVisita(r) {
  const linhas = [];
  const checkIn  = r.check_in  ? new Date(r.check_in)  : null;
  const checkOut = r.check_out ? new Date(r.check_out) : null;

  if (checkIn && checkOut) {
    const minutos = Math.round((checkOut - checkIn) / 60000);
    linhas.push({ ok: true, texto: `Duração da visita: ${_fmtHora(checkIn)} → ${_fmtHora(checkOut)} (${minutos} min)` });
  }

  const timestamps = (r.fotos || []).map(_timestampFoto).filter(Boolean);
  if (!timestamps.length) {
    linhas.push({ ok: true, texto: (r.fotos || []).length ? 'Não foi possível ler o horário de captura das fotos (nome de arquivo fora do padrão esperado).' : 'Nenhuma foto anexada a esta pesquisa.' });
    return linhas;
  }

  const fotoMin = new Date(Math.min(...timestamps));
  const fotoMax = new Date(Math.max(...timestamps));
  linhas.push({ ok: true, texto: `Fotos tiradas entre ${_fmtHora(fotoMin)} e ${_fmtHora(fotoMax)} (${timestamps.length} de ${r.qtd_fotos ?? timestamps.length} esperada(s)).` });

  if (checkIn && checkOut) {
    // Margem de 5min pra não acusar falso-positivo por pequeno desvio de
    // relógio do aparelho — só sinaliza gap grande o suficiente pra ser
    // um caso real de foto fora da visita.
    const MARGEM_MS = 5 * 60000;
    const foraAntes  = checkIn.getTime()  - fotoMax.getTime();
    const foraDepois = fotoMin.getTime() - checkOut.getTime();
    const gapMs = Math.max(foraAntes, foraDepois, 0);
    if (gapMs > MARGEM_MS) {
      const gapMin = Math.round(gapMs / 60000);
      const horas = Math.floor(gapMin / 60);
      const gapTxt = horas > 0 ? `${horas}h${String(gapMin % 60).padStart(2, '0')}min` : `${gapMin}min`;
      linhas.push({ ok: false, texto: `⚠️ Fotos fora da janela do check-in/check-out (diferença de ${gapTxt}) — confirmar se não são fotos reaproveitadas ou se o relógio do aparelho está desconfigurado.` });
    } else {
      linhas.push({ ok: true, texto: '✅ Fotos dentro da janela do check-in/check-out.' });
    }
  }
  return linhas;
}

let _linhasPaginaAtual = [];

// Fotos abrem num carrossel dentro da própria página, não em outra aba —
// pedido do usuário em 2026-09-01. _fotosModalAtual guarda o array de fotos
// do modal aberto no momento; o carrossel navega por índice nele.
// _legendasModalAtual: url -> assunto do item que gerou a foto (só pesquisa
// recente tem isso — fotos_legendas do backend); sem legenda, cai pra
// "Foto N" (pedido do usuário em 2026-09-01: "trocar a legenda das fotos,
// pelo nome que vem nas fotos").
let _fotosModalAtual = [];
let _legendasModalAtual = {};

function _legendaFoto(url, i) {
  return (_legendasModalAtual && _legendasModalAtual[url]) || `Foto ${i + 1}`;
}

function _fotosHtml(fotos, legendas) {
  _fotosModalAtual = fotos || [];
  _legendasModalAtual = legendas || {};
  return _fotosModalAtual.length
    ? `<div class="foto-grid">${_fotosModalAtual.map((u, i) => `
        <a href="javascript:void(0)" onclick="abrirCarrossel(${i})">
          <img src="${_esc(u)}" alt="${_esc(_legendaFoto(u, i))}" loading="lazy">
          <div class="foto-num">${_esc(_legendaFoto(u, i))}</div>
        </a>`).join('')}</div>`
    : '<div class="sem-foto">Nenhuma foto anexada.</div>';
}

let _carrosselIndex = 0;

function abrirCarrossel(i) {
  _carrosselIndex = i;
  _renderCarrossel();
  document.getElementById('carrossel-overlay').classList.add('open');
}

function _renderCarrossel() {
  const url = _fotosModalAtual[_carrosselIndex];
  document.getElementById('carrossel-img').src = url;
  document.getElementById('carrossel-contador').textContent =
    `${_legendaFoto(url, _carrosselIndex)} — ${_carrosselIndex + 1} / ${_fotosModalAtual.length}`;
}

function carrosselNav(delta) {
  const total = _fotosModalAtual.length;
  _carrosselIndex = (_carrosselIndex + delta + total) % total;
  _renderCarrossel();
}

function fecharCarrossel() {
  document.getElementById('carrossel-overlay').classList.remove('open');
}

document.addEventListener('keydown', (ev) => {
  if (!document.getElementById('carrossel-overlay').classList.contains('open')) return;
  if (ev.key === 'Escape') fecharCarrossel();
  else if (ev.key === 'ArrowLeft') carrosselNav(-1);
  else if (ev.key === 'ArrowRight') carrosselNav(1);
});

// Expande/recolhe a linha de assuntos+respostas abaixo da pesquisa — pedido
// do usuário em 2026-09-01 ("ao clicar na linha da pesquisa, abrir com os
// assuntos e resposta abaixo"). Estado vive só no DOM (hidden), sem Set
// global — mais simples e sempre correto após qualquer re-render.
function toggleDetalhePesquisa(i) {
  const el = document.getElementById('detalhe-pesq-' + i);
  if (el) el.hidden = !el.hidden;
}

function _respostasPorAssuntoHtml(r) {
  let itens = r.itens_detalhe || [];
  if (!itens.length) {
    return '<div class="sem-foto">Detalhe item a item só fica disponível pra pesquisas dos últimos 30 dias.</div>';
  }
  // Com um assunto selecionado no filtro (sel-assunto), a resposta expandida
  // mostra só esse assunto — pedido do usuário em 2026-09-01 ("ao
  // selecionar o assunto, precisa filtrar... as respostas abaixo").
  const assuntoFiltro = document.getElementById('sel-assunto').value;
  if (assuntoFiltro) itens = itens.filter(it => it.assunto === assuntoFiltro);
  if (!itens.length) {
    return `<div class="sem-foto">Nenhuma resposta de "${_esc(assuntoFiltro)}" nessa pesquisa.</div>`;
  }
  const porAssunto = {};
  itens.forEach(it => {
    const chave = it.assunto || '(sem assunto)';
    (porAssunto[chave] = porAssunto[chave] || []).push(it);
  });
  return Object.entries(porAssunto).map(([assunto, lista]) => `
    <div class="assunto-detalhe-grupo">
      <div class="assunto-detalhe-titulo">${_esc(assunto)}</div>
      ${lista.map(it => `<div class="analise-linha">${_esc(it.item_avaliado)}${it.item_avaliado ? ' — ' : ''}${_esc(it.pergunta)} → <strong>${_esc(it.resposta)}</strong></div>`).join('')}
    </div>`).join('');
}

function abrirDetalhes(idx) {
  const r = _linhasPaginaAtual[idx];
  if (!r) return;
  if (aba === 'visitas') return abrirDetalhesVisita(r);

  const analise = _analisarVisita(r);
  document.getElementById('modal-conteudo').innerHTML = `
    <div class="modal-head">
      <div>
        <h2>${_esc(_clienteLabel(r))}</h2>
        <p>${_esc(r.data)} · ${_esc(r.usuario)} · ${_esc(r.pesquisa || r.tarefa)}</p>
      </div>
      <button class="modal-close" onclick="fecharDetalhes()">✕</button>
    </div>
    <div class="modal-sec-title">Análise automática</div>
    ${analise.map(l => `<div class="analise-linha ${l.ok ? 'analise-ok' : 'analise-warn'}">${_esc(l.texto)}</div>`).join('')}
    ${(r.itens_detalhe || []).length ? `
      <div class="modal-sec-title">Respostas (${r.itens_detalhe.length} de ${r.qtd_itens})</div>
      ${r.itens_detalhe.map(it => `<div class="analise-linha">${_esc(it.item_avaliado)}${it.item_avaliado ? ' — ' : ''}${_esc(it.pergunta)} → <strong>${_esc(it.resposta)}</strong></div>`).join('')}
    ` : aba === 'pesquisas' ? `
      <div class="modal-sec-title">Respostas</div>
      <div class="sem-foto">Detalhe item a item só fica disponível pra pesquisas dos últimos 30 dias.</div>
    ` : ''}
    <div class="modal-sec-title">Fotos (${(r.fotos || []).length})</div>
    ${_fotosHtml(r.fotos, r.fotos_legendas)}
  `;
  document.getElementById('modal-detalhes').classList.add('open');
}

// Distância acima da qual sinaliza check-in/checkout longe do endereço
// cadastrado do PDV — 300m dá folga pra imprecisão normal de GPS urbano.
const DIST_AVISO_M = 300;

function abrirDetalhesVisita(r) {
  const checkIn  = r.check_in  ? new Date(r.check_in)  : null;
  const checkOut = r.check_out ? new Date(r.check_out) : null;

  const contexto = [];
  contexto.push({ ok: true, texto: `Check-in: ${checkIn ? _fmtHora(checkIn) : '—'}` + (r.dist_checkin_m != null ? ` (${r.dist_checkin_m}m do endereço cadastrado do PDV)` : '') });
  if (r.dist_checkin_m != null && r.dist_checkin_m > DIST_AVISO_M) {
    contexto.push({ ok: false, texto: `⚠️ Check-in registrado a ${r.dist_checkin_m}m do endereço cadastrado do PDV.` });
  }
  if (checkOut) {
    contexto.push({ ok: true, texto: `Check-out: ${_fmtHora(checkOut)}` + (r.dist_checkout_m != null ? ` (${r.dist_checkout_m}m do endereço cadastrado do PDV)` : '') });
    if (r.dist_checkout_m != null && r.dist_checkout_m > DIST_AVISO_M) {
      contexto.push({ ok: false, texto: `⚠️ Check-out registrado a ${r.dist_checkout_m}m do endereço cadastrado do PDV.` });
    }
  } else {
    contexto.push({ ok: false, texto: '⚠️ Sem check-out registrado.' });
  }
  if (r.motivo_visita) contexto.push({ ok: true, texto: `Motivo da visita: ${r.motivo_visita}` });
  if (r.tipo_justificativa) contexto.push({ ok: true, texto: `Tipo: ${r.tipo_justificativa}` });
  if (r.observacao_visita) contexto.push({ ok: true, texto: `Observação do promotor: ${r.observacao_visita}` });

  const timeline = [];
  timeline.push(`Check-in${checkIn ? ' — ' + _fmtHora(checkIn) : ''}`);
  (r.pesquisas || []).forEach(p => timeline.push(`Pesquisa respondida: ${p.pesquisa}${p.assuntos ? ' (' + p.assuntos + ')' : ''}`));
  (r.tarefas || []).forEach(t => {
    const pr = _perguntaResposta(t);
    timeline.push(`Tarefa respondida: ${t.tarefa}${pr.pergunta ? ' — ' + pr.pergunta + ' → ' + (pr.resposta || '—') : pr.resposta ? ' — ' + pr.resposta : ''}`);
  });
  timeline.push(checkOut ? `Check-out — ${_fmtHora(checkOut)}` : 'Check-out — não registrado');

  document.getElementById('modal-conteudo').innerHTML = `
    <div class="modal-head">
      <div>
        <h2>${_esc(_clienteLabel(r))}</h2>
        <p>${_esc(r.data)} · ${_esc(r.usuario)} · ${_esc(r.cidade)}${r.bairro ? ' / ' + _esc(r.bairro) : ''}</p>
      </div>
      <button class="modal-close" onclick="fecharDetalhes()">✕</button>
    </div>
    <div class="modal-sec-title">Contexto da visita</div>
    ${contexto.map(l => `<div class="analise-linha ${l.ok ? 'analise-ok' : 'analise-warn'}">${_esc(l.texto)}</div>`).join('')}
    <div class="modal-sec-title">Análise da IA</div>
    ${r.analise_ia ? `<div class="analise-linha">${_esc(r.analise_ia)}</div>` : '<div class="sem-foto">Análise ainda não gerada para esta visita.</div>'}
    <div class="modal-sec-title">Timeline</div>
    ${timeline.map(t => `<div class="analise-linha">${_esc(t)}</div>`).join('')}
    <div class="modal-sec-title">Fotos (${(r.fotos || []).length})</div>
    ${_fotosHtml(r.fotos)}
  `;
  document.getElementById('modal-detalhes').classList.add('open');
}

function fecharDetalhes() {
  document.getElementById('modal-detalhes').classList.remove('open');
}

function init() {
  if (!DATA) {
    document.getElementById('kpis').innerHTML = '<div class="empty">Nenhum dado carregado (promotoria_data.js ausente).</div>';
    return;
  }
  // Nome exibido no cabeçalho trocado a pedido do usuário em 2026-09-01
  // ("só trocar o nome do título") — continua rastreando o mesmo supervisor
  // (DATA.supervisor.codigo, mesma equipe de sempre), só o rótulo mudou.
  const NOME_EXIBIDO_SUPERVISOR = 'João Pedro Diniz';
  document.getElementById('header-sub').textContent =
    `${NOME_EXIBIDO_SUPERVISOR} (cód. ${DATA.supervisor.codigo}) · Atualizado ${DATA.atualizado_em}`;

  document.getElementById('kpis').innerHTML = `
    <div class="kpi"><div class="label">Linhas de Pesquisa</div><div class="val">${DATA.pesquisas.length}</div></div>
    <div class="kpi"><div class="label">Linhas de Tarefa</div><div class="val">${DATA.tarefas.length}</div></div>
    <div class="kpi"><div class="label">Período</div><div class="val" style="font-size:.95rem">${DATA.periodo.inicio.split('-').reverse().join('/')} — ${DATA.periodo.fim ? DATA.periodo.fim.split('-').reverse().join('/') : 'hoje'}</div></div>
  `;

  const visitas = DATA.visitas || [];
  document.getElementById('tabs').innerHTML = `
    <button class="tab-btn active" id="tab-pesquisas" onclick="mudarAba('pesquisas')">Pesquisas (${DATA.pesquisas.length})</button>
    <button class="tab-btn" id="tab-tarefas" onclick="mudarAba('tarefas')">Tarefas (${DATA.tarefas.length})</button>
    <button class="tab-btn" id="tab-visitas" onclick="mudarAba('visitas')">Visitas (${visitas.length})</button>
  `;

  const usuarios = [...new Set([...DATA.pesquisas, ...DATA.tarefas].map(r => r.usuario).filter(Boolean))].sort();
  const selUsuario = document.getElementById('sel-usuario');
  usuarios.forEach(u => {
    const o = document.createElement('option');
    o.value = u; o.textContent = u;
    selUsuario.appendChild(o);
  });

  // 'assuntos' é string "Assunto A; Assunto B" (uma resposta de pesquisa
  // pode cobrir vários assuntos) — separa e tira únicos pra montar o filtro.
  const assuntos = [...new Set(
    DATA.pesquisas.flatMap(r => (r.assuntos || '').split(';').map(a => a.trim()).filter(Boolean))
  )].sort();
  const selAssunto = document.getElementById('sel-assunto');
  assuntos.forEach(a => {
    const o = document.createElement('option');
    o.value = a; o.textContent = a;
    selAssunto.appendChild(o);
  });

  aplicarFiltro();
}

function mudarAba(nova) {
  aba = nova;
  paginaAtual = 1;
  document.getElementById('tab-pesquisas').classList.toggle('active', aba === 'pesquisas');
  document.getElementById('tab-tarefas').classList.toggle('active', aba === 'tarefas');
  document.getElementById('tab-visitas').classList.toggle('active', aba === 'visitas');
  document.getElementById('tabela-pesquisas').style.display = aba === 'pesquisas' ? '' : 'none';
  document.getElementById('tabela-tarefas').style.display = aba === 'tarefas' ? '' : 'none';
  document.getElementById('tabela-visitas').style.display = aba === 'visitas' ? '' : 'none';
  // Assunto só existe em pesquisas — some nas abas de tarefas/visitas.
  document.getElementById('sel-assunto').style.display = aba === 'pesquisas' ? '' : 'none';
  aplicarFiltro();
}

function irParaPagina(delta) {
  paginaAtual += delta;
  aplicarFiltro();
}

function _linhasFiltradas() {
  if (!DATA) return [];
  const usuario = document.getElementById('sel-usuario').value;
  const assunto = document.getElementById('sel-assunto').value;
  const busca = document.getElementById('busca').value.trim().toLowerCase();
  const de = document.getElementById('data-de').value;
  const ate = document.getElementById('data-ate').value;
  const base = aba === 'pesquisas' ? DATA.pesquisas : aba === 'tarefas' ? DATA.tarefas : (DATA.visitas || []);

  const filtradas = base.filter(r => {
    if (usuario && r.usuario !== usuario) return false;
    if (aba === 'pesquisas' && assunto) {
      const assuntosLinha = (r.assuntos || '').split(';').map(a => a.trim());
      if (!assuntosLinha.includes(assunto)) return false;
    }
    const dataOrd = _parseDataBr(r.data);
    if (de && dataOrd && dataOrd < de) return false;
    if (ate && dataOrd && dataOrd > ate) return false;
    if (busca) {
      const alvo = aba === 'pesquisas'
        ? [r.razao_social, r.fantasia, r.pesquisa, r.assuntos]
        : aba === 'tarefas'
        ? [r.razao_social, r.fantasia, r.tarefa, r.pergunta, r.resposta]
        : [r.razao_social, r.fantasia, r.cidade, r.bairro, r.cnpj];
      if (!alvo.some(v => (v || '').toLowerCase().includes(busca))) return false;
    }
    return true;
  });
  // Sem isso, a ordem era só "por usuário" (ordem de iteração do pipeline),
  // não por data — quem visse a página 1 via achar que só tinha dado até o
  // último dia do 1º usuário da lista, mesmo com atividade mais recente de
  // outros usuários mais abaixo (achado pelo usuário em 2026-08-31).
  filtradas.sort((a, b) => _parseDataBr(b.data).localeCompare(_parseDataBr(a.data)));
  return filtradas;
}

function aplicarFiltro() {
  const todasLinhas = _linhasFiltradas();
  document.getElementById('info-count').textContent = `${todasLinhas.length} registro(s)`;

  const totalPaginas = Math.max(1, Math.ceil(todasLinhas.length / TAM_PAGINA));
  paginaAtual = Math.min(Math.max(1, paginaAtual), totalPaginas);
  const inicio = (paginaAtual - 1) * TAM_PAGINA;
  const linhas = todasLinhas.slice(inicio, inicio + TAM_PAGINA);

  document.getElementById('info-pagina').textContent = `Página ${paginaAtual} de ${totalPaginas}`;
  document.getElementById('btn-pag-ant').disabled = paginaAtual <= 1;
  document.getElementById('btn-pag-prox').disabled = paginaAtual >= totalPaginas;

  _linhasPaginaAtual = linhas;
  if (aba === 'pesquisas') {
    document.getElementById('tbody-pesquisas').innerHTML = linhas.length ? linhas.map((r, i) => `
      <tr class="linha-pesquisa" onclick="toggleDetalhePesquisa(${i})">
        <td>${_esc(r.data)}</td>
        <td>${_esc(r.usuario)}</td>
        <td class="wrap">${_esc(_clienteLabel(r))}</td>
        <td class="hide-mob">${_esc(r.cidade)}</td>
        <td class="wrap">${_esc(r.pesquisa)}</td>
        <td>${_esc(r.qtd_itens)}</td>
        <td><button class="btn-detalhes" onclick="event.stopPropagation(); abrirDetalhes(${i})">🔍 Ver detalhes</button></td>
      </tr>
      <tr class="linha-detalhe-pesquisa" id="detalhe-pesq-${i}" hidden>
        <td colspan="7">${_respostasPorAssuntoHtml(r)}</td>
      </tr>`).join('') : '<tr><td colspan="7" class="empty">Nenhum registro encontrado.</td></tr>';
  } else if (aba === 'tarefas') {
    document.getElementById('tbody-tarefas').innerHTML = linhas.length ? linhas.map((r, i) => `
      <tr>
        <td>${_esc(r.data)}</td>
        <td>${_esc(r.usuario)}</td>
        <td class="wrap">${_esc(_clienteLabel(r))}</td>
        <td class="wrap">${_esc(r.tarefa)}</td>
        <td class="hide-mob">${_esc(r.tipo_tarefa)}</td>
        <td class="wrap">${_esc(_perguntaResposta(r).pergunta)}</td>
        <td class="wrap">${_esc(_perguntaResposta(r).resposta)}</td>
        <td><button class="btn-detalhes" onclick="abrirDetalhes(${i})">🔍 Ver detalhes</button></td>
      </tr>`).join('') : '<tr><td colspan="8" class="empty">Nenhum registro encontrado.</td></tr>';
  } else {
    document.getElementById('tbody-visitas').innerHTML = linhas.length ? linhas.map((r, i) => `
      <tr>
        <td>${_esc(r.data)}</td>
        <td>${_esc(r.usuario)}</td>
        <td class="wrap">${_esc(_clienteLabel(r))}</td>
        <td class="hide-mob">${_esc(r.cidade)}</td>
        <td class="hide-mob">${_esc(r.bairro)}</td>
        <td>${_esc(_duracaoVisita(r))}</td>
        <td><button class="btn-detalhes" onclick="abrirDetalhes(${i})">🔍 Ver detalhes</button></td>
      </tr>`).join('') : '<tr><td colspan="7" class="empty">Nenhum registro encontrado.</td></tr>';
  }
}

function exportarCSV() {
  const linhas = _linhasFiltradas();
  if (!linhas.length) return;
  const colunas = aba === 'pesquisas'
    ? ['data', 'usuario', 'razao_social', 'fantasia', 'cidade', 'pesquisa', 'assuntos', 'qtd_itens', 'qtd_fotos', 'fotos']
    : aba === 'tarefas'
    ? ['data', 'usuario', 'razao_social', 'fantasia', 'tarefa', 'tipo_tarefa', 'pergunta', 'resposta', 'qtd_fotos', 'fotos']
    : ['data', 'usuario', 'razao_social', 'fantasia', 'cnpj', 'cidade', 'bairro', 'check_in', 'check_out', 'dist_checkin_m', 'dist_checkout_m', 'qtd_pesquisas', 'qtd_tarefas', 'qtd_fotos', 'analise_ia'];
  const csvEsc = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const valorColuna = (r, c) => {
    if (c === 'qtd_pesquisas') return (r.pesquisas || []).length;
    if (c === 'qtd_tarefas') return (r.tarefas || []).length;
    if (c === 'qtd_fotos' && aba === 'visitas') return (r.fotos || []).length;
    return r[c];
  };
  const linhasCsv = [colunas.join(',')].concat(
    linhas.map(r => colunas.map(c => csvEsc(valorColuna(r, c))).join(','))
  );
  const blob = new Blob(['﻿' + linhasCsv.join('\n')], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `promotoria_${aba}_${new Date().toISOString().slice(0, 10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

init();
</script>
