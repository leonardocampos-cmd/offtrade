<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <script src="auth.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Promotoria — Max Promotor</title>
  <script src="promotoria_data.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f1117; --card: #1a1d27; --card2: #22263a;
      --accent: #f5c518; --blue: #3b82f6; --text: #e2e8f0;
      --muted: #94a3b8; --border: #2d3144; --green: #22c55e;
      --red: #ef4444; --orange: #f97316;
    }
    body {
      background: var(--bg); color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh; padding: 16px;
    }
    header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 20px; padding-bottom: 16px;
      border-bottom: 1px solid var(--border); gap: 12px; flex-wrap: wrap;
    }
    header h1 { font-size: 1.1rem; font-weight: 700; color: var(--accent); }
    header p  { font-size: .8rem; color: var(--muted); margin-top: 3px; }
    .kpis { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
    .kpi {
      background: var(--card); border: 1px solid var(--border); border-radius: 10px;
      padding: 14px 18px; flex: 1; min-width: 160px;
    }
    .kpi .label {
      font-size: .65rem; text-transform: uppercase; letter-spacing: .08em;
      color: var(--muted); margin-bottom: 6px;
    }
    .kpi .val { font-size: 1.25rem; font-weight: 800; }
    .tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
    .tab-btn {
      background: var(--card); border: 1px solid var(--border); color: var(--muted);
      border-radius: 8px; padding: 9px 16px; font-size: .85rem; font-weight: 700;
      cursor: pointer; font-family: inherit;
    }
    .tab-btn.active { background: var(--accent); color: #0f1117; border-color: var(--accent); }
    .tab-btn:disabled { opacity: .4; cursor: not-allowed; }
    .controls {
      display: flex; gap: 10px; flex-wrap: wrap;
      margin-bottom: 16px; align-items: center;
    }
    select, input[type=text], input[type=date] {
      background: var(--card); border: 1px solid var(--border);
      color: var(--text); border-radius: 8px; padding: 8px 12px;
      font-size: .88rem; outline: none; font-family: inherit;
    }
    select:focus, input[type=text]:focus, input[type=date]:focus { border-color: var(--blue); }
    select { min-width: 220px; }
    input[type=text] { min-width: 220px; }
    .info { font-size: .8rem; color: var(--muted); margin-left: auto; }
    .table-wrap { overflow-x: auto; border-radius: 10px; border: 1px solid var(--border); }
    table { width: 100%; border-collapse: collapse; font-size: .82rem; }
    thead th {
      background: var(--card2); padding: 10px 12px; text-align: left;
      font-size: .72rem; text-transform: uppercase; letter-spacing: .05em;
      color: var(--muted); border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    tbody tr { border-bottom: 1px solid var(--border); }
    tbody tr:hover { background: var(--card2); }
    tbody td { padding: 9px 12px; vertical-align: middle; white-space: nowrap; max-width: 260px; overflow: hidden; text-overflow: ellipsis; }
    td.wrap { white-space: normal; }
    a.foto-link { color: var(--blue); text-decoration: none; font-size: .78rem; }
    a.foto-link:hover { text-decoration: underline; }
    .empty { text-align: center; padding: 48px; color: var(--muted); font-size: .9rem; }

    @media (max-width: 640px) {
      body { padding: 12px; }
      .kpi { min-width: 130px; padding: 12px 14px; }
      select { min-width: 150px; }
      input[type=text] { min-width: 150px; }
      table { font-size: .76rem; }
      thead th, tbody td { padding: 8px 9px; }
      .hide-mob { display: none; }
    }
  </style>
</head>
<body>

<header>
  <div>
    <h1>🧑‍💼 PROMOTORIA — MAX PROMOTOR</h1>
    <p id="header-sub">—</p>
  </div>
  <a href="index.html" style="color:var(--muted);font-size:.8rem;text-decoration:none">← Painel</a>
</header>

<div class="kpis" id="kpis"></div>

<div class="tabs" id="tabs"></div>

<div class="controls">
  <select id="sel-usuario" onchange="paginaAtual=1;aplicarFiltro()">
    <option value="">Todos os Usuários</option>
  </select>
  <input type="text" id="busca" placeholder="Buscar por cliente/PDV, pesquisa, tarefa..." oninput="paginaAtual=1;aplicarFiltro()">
  <label style="font-size:.78rem;color:var(--muted)">De: <input type="date" id="data-de" onchange="paginaAtual=1;aplicarFiltro()"></label>
  <label style="font-size:.78rem;color:var(--muted)">Até: <input type="date" id="data-ate" onchange="paginaAtual=1;aplicarFiltro()"></label>
  <button class="tab-btn" onclick="exportarCSV()">↓ Exportar CSV</button>
  <span class="info" id="info-count"></span>
</div>

<div class="table-wrap">
  <table id="tabela-pesquisas">
    <thead>
      <tr>
        <th>Data</th>
        <th>Usuário</th>
        <th>Cliente/PDV</th>
        <th class="hide-mob">Cidade</th>
        <th>Pesquisa</th>
        <th>Assuntos</th>
        <th>Itens Respondidos</th>
        <th>Fotos</th>
      </tr>
    </thead>
    <tbody id="tbody-pesquisas"></tbody>
  </table>

  <table id="tabela-tarefas" style="display:none">
    <thead>
      <tr>
        <th>Data</th>
        <th>Usuário</th>
        <th>Cliente/PDV</th>
        <th>Tarefa</th>
        <th class="hide-mob">Tipo</th>
        <th>Pergunta</th>
        <th>Resposta</th>
        <th>Foto</th>
      </tr>
    </thead>
    <tbody id="tbody-tarefas"></tbody>
  </table>
</div>

<div class="controls" style="justify-content:center">
  <button class="tab-btn" onclick="irParaPagina(-1)" id="btn-pag-ant">← Anterior</button>
  <span class="info" id="info-pagina" style="margin-left:0"></span>
  <button class="tab-btn" onclick="irParaPagina(1)" id="btn-pag-prox">Próxima →</button>
</div>

<script>
const DATA = typeof PROMOTORIA_DATA !== 'undefined' ? PROMOTORIA_DATA : null;
let aba = 'pesquisas';
let paginaAtual = 1;
const TAM_PAGINA = 200; // dataset pode passar de 100k linhas — sem paginação o navegador trava renderizando tudo

function _esc(v) {
  if (v === null || v === undefined) return '';
  return String(v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function _clienteLabel(r) {
  return r.fantasia && r.fantasia !== r.razao_social ? `${r.razao_social} (${r.fantasia})` : (r.razao_social || '');
}

function _fotoLink(url) {
  return url ? `<a class="foto-link" href="${_esc(url)}" target="_blank" rel="noopener">Ver foto</a>` : '';
}

function _fotoLinks(urls) {
  if (!urls || !urls.length) return '';
  return urls.map((u, i) => `<a class="foto-link" href="${_esc(u)}" target="_blank" rel="noopener">Foto ${i + 1}</a>`).join(' ');
}

function _parseDataBr(d) {
  // 'dd/mm/aaaa' -> 'aaaa-mm-dd' (comparável com input[type=date])
  if (!d) return '';
  const [dd, mm, aaaa] = d.split('/');
  return `${aaaa}-${mm}-${dd}`;
}

function init() {
  if (!DATA) {
    document.getElementById('kpis').innerHTML = '<div class="empty">Nenhum dado carregado (promotoria_data.js ausente).</div>';
    return;
  }
  document.getElementById('header-sub').textContent =
    `${DATA.supervisor.nome} (cód. ${DATA.supervisor.codigo}) · Atualizado ${DATA.atualizado_em}`;

  document.getElementById('kpis').innerHTML = `
    <div class="kpi"><div class="label">Linhas de Pesquisa</div><div class="val">${DATA.pesquisas.length}</div></div>
    <div class="kpi"><div class="label">Linhas de Tarefa</div><div class="val">${DATA.tarefas.length}</div></div>
    <div class="kpi"><div class="label">Período</div><div class="val" style="font-size:.95rem">${DATA.periodo.inicio.split('-').reverse().join('/')} — ${DATA.periodo.fim ? DATA.periodo.fim.split('-').reverse().join('/') : 'hoje'}</div></div>
  `;

  document.getElementById('tabs').innerHTML = `
    <button class="tab-btn active" id="tab-pesquisas" onclick="mudarAba('pesquisas')">Pesquisas (${DATA.pesquisas.length})</button>
    <button class="tab-btn" id="tab-tarefas" onclick="mudarAba('tarefas')">Tarefas (${DATA.tarefas.length})</button>
  `;

  const usuarios = [...new Set([...DATA.pesquisas, ...DATA.tarefas].map(r => r.usuario).filter(Boolean))].sort();
  const selUsuario = document.getElementById('sel-usuario');
  usuarios.forEach(u => {
    const o = document.createElement('option');
    o.value = u; o.textContent = u;
    selUsuario.appendChild(o);
  });

  aplicarFiltro();
}

function mudarAba(nova) {
  aba = nova;
  paginaAtual = 1;
  document.getElementById('tab-pesquisas').classList.toggle('active', aba === 'pesquisas');
  document.getElementById('tab-tarefas').classList.toggle('active', aba === 'tarefas');
  document.getElementById('tabela-pesquisas').style.display = aba === 'pesquisas' ? '' : 'none';
  document.getElementById('tabela-tarefas').style.display = aba === 'tarefas' ? '' : 'none';
  aplicarFiltro();
}

function irParaPagina(delta) {
  paginaAtual += delta;
  aplicarFiltro();
}

function _linhasFiltradas() {
  if (!DATA) return [];
  const usuario = document.getElementById('sel-usuario').value;
  const busca = document.getElementById('busca').value.trim().toLowerCase();
  const de = document.getElementById('data-de').value;
  const ate = document.getElementById('data-ate').value;
  const base = aba === 'pesquisas' ? DATA.pesquisas : DATA.tarefas;

  return base.filter(r => {
    if (usuario && r.usuario !== usuario) return false;
    const dataOrd = _parseDataBr(r.data);
    if (de && dataOrd && dataOrd < de) return false;
    if (ate && dataOrd && dataOrd > ate) return false;
    if (busca) {
      const alvo = aba === 'pesquisas'
        ? [r.razao_social, r.fantasia, r.pesquisa, r.assuntos]
        : [r.razao_social, r.fantasia, r.tarefa, r.pergunta, r.resposta];
      if (!alvo.some(v => (v || '').toLowerCase().includes(busca))) return false;
    }
    return true;
  });
}

function aplicarFiltro() {
  const todasLinhas = _linhasFiltradas();
  document.getElementById('info-count').textContent = `${todasLinhas.length} registro(s)`;

  const totalPaginas = Math.max(1, Math.ceil(todasLinhas.length / TAM_PAGINA));
  paginaAtual = Math.min(Math.max(1, paginaAtual), totalPaginas);
  const inicio = (paginaAtual - 1) * TAM_PAGINA;
  const linhas = todasLinhas.slice(inicio, inicio + TAM_PAGINA);

  document.getElementById('info-pagina').textContent = `Página ${paginaAtual} de ${totalPaginas}`;
  document.getElementById('btn-pag-ant').disabled = paginaAtual <= 1;
  document.getElementById('btn-pag-prox').disabled = paginaAtual >= totalPaginas;

  if (aba === 'pesquisas') {
    document.getElementById('tbody-pesquisas').innerHTML = linhas.length ? linhas.map(r => `
      <tr>
        <td>${_esc(r.data)}</td>
        <td>${_esc(r.usuario)}</td>
        <td class="wrap">${_esc(_clienteLabel(r))}</td>
        <td class="hide-mob">${_esc(r.cidade)}</td>
        <td class="wrap">${_esc(r.pesquisa)}</td>
        <td class="wrap">${_esc(r.assuntos)}</td>
        <td>${_esc(r.qtd_itens)}</td>
        <td class="wrap">${_fotoLinks(r.fotos)}</td>
      </tr>`).join('') : '<tr><td colspan="8" class="empty">Nenhum registro encontrado.</td></tr>';
  } else {
    document.getElementById('tbody-tarefas').innerHTML = linhas.length ? linhas.map(r => `
      <tr>
        <td>${_esc(r.data)}</td>
        <td>${_esc(r.usuario)}</td>
        <td class="wrap">${_esc(_clienteLabel(r))}</td>
        <td class="wrap">${_esc(r.tarefa)}</td>
        <td class="hide-mob">${_esc(r.tipo_tarefa)}</td>
        <td class="wrap">${_esc(r.pergunta)}</td>
        <td class="wrap">${_esc(r.resposta)}</td>
        <td>${_fotoLink(r.foto)}</td>
      </tr>`).join('') : '<tr><td colspan="8" class="empty">Nenhum registro encontrado.</td></tr>';
  }
}

function exportarCSV() {
  const linhas = _linhasFiltradas();
  if (!linhas.length) return;
  const colunas = aba === 'pesquisas'
    ? ['data', 'usuario', 'razao_social', 'fantasia', 'cidade', 'pesquisa', 'assuntos', 'qtd_itens', 'qtd_fotos', 'fotos']
    : ['data', 'usuario', 'razao_social', 'fantasia', 'tarefa', 'tipo_tarefa', 'pergunta', 'resposta', 'foto'];
  const csvEsc = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const linhasCsv = [colunas.join(',')].concat(
    linhas.map(r => colunas.map(c => csvEsc(r[c])).join(','))
  );
  const blob = new Blob(['﻿' + linhasCsv.join('\n')], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `promotoria_${aba}_${new Date().toISOString().slice(0, 10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

init();
</script>
</body>
</html>
