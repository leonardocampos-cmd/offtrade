  <script>
    // Acesso restrito: gestor (mesmo hash/cookie do auth.js) OU a sessão de
    // vendedor com RCA 588 (W.S — mesma conta que aparece em
    // sp.html?vendedor=W.S, o usuário Winthor usado pro canal Mercos). Pedido
    // do usuário em 2026-08-27: só quem acessa aquela página de vendedor
    // pode ver Pedidos Mercos, não é auth.js padrão de gestor-only.
    (function () {
      const HASH = 'b4ba917b95850dc43cce91dba3be9fd1a4f029e18b81d6846a7183839c81d8dd';
      const RCA_MERCOS = '588';

      function _b64urlEncode(obj) {
        const b64 = btoa(unescape(encodeURIComponent(JSON.stringify(obj))));
        return b64.replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
      }
      function _refreshSsoCookie(email) {
        if (!email) return;
        const header  = _b64urlEncode({ alg: 'none', typ: 'JWT' });
        const payload = _b64urlEncode({ email });
        const ssoToken = JSON.stringify({ id_token: `${header}.${payload}.sso` });
        document.cookie = 'offtrade_token=' + encodeURIComponent(ssoToken) +
          '; path=/; max-age=' + (60 * 60 * 8) + '; SameSite=Lax; Secure';
      }

      if (sessionStorage.getItem('rg_auth') === HASH) {
        _refreshSsoCookie(sessionStorage.getItem('rg_email'));
        return; // gestor: acesso total
      }

      try {
        const s = JSON.parse(sessionStorage.getItem('rg_vendedor') || '{}');
        if (String(s.rca) !== RCA_MERCOS) throw 0;
        _refreshSsoCookie(s.email);
      } catch {
        sessionStorage.setItem('rg_redirect', location.pathname + location.search);
        location.replace('login.html');
      }
    })();
  </script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      /* paleta extraida da logo da SPON Distribuidora (navy + branco) */
      --bg: #000000; --card: rgba(255,255,255,.06); --card2: rgba(255,255,255,.1);
      --accent: #ffffff; --blue: #7c86ff; --text: #e7e6f5;
      --muted: #9aa0a6; --border: rgba(255,255,255,.14); --green: #22c55e;
      --red: #ef4444; --orange: #f97316;
    }
    body {
      background: var(--bg); color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh; padding: 16px;
    }
    header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 20px; padding-bottom: 16px;
      border-bottom: 1px solid var(--border); gap: 12px; flex-wrap: wrap;
    }
    header h1 { font-size: 1.1rem; font-weight: 700; color: var(--accent); }
    header p  { font-size: .8rem; color: var(--muted); margin-top: 3px; }
    .kpis { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
    .kpi {
      background: var(--card); border: 1px solid var(--border); border-radius: 10px;
      padding: 14px 18px; flex: 1; min-width: 160px;
    }
    .kpi .label {
      font-size: .65rem; text-transform: uppercase; letter-spacing: .08em;
      color: var(--muted); margin-bottom: 6px;
    }
    .kpi .val { font-size: 1.25rem; font-weight: 800; }
    .controls {
      display: flex; gap: 10px; flex-wrap: wrap;
      margin-bottom: 16px; align-items: center;
    }
    select, input[type=text], input[type=date] {
      background: var(--card); border: 1px solid var(--border);
      color: var(--text); border-radius: 8px; padding: 8px 12px;
      font-size: .88rem; outline: none; font-family: inherit;
    }
    select:focus, input[type=text]:focus, input[type=date]:focus { border-color: var(--blue); }
    select option { background: #1a1a1a; color: var(--text); }
    select { min-width: 200px; }
    input[type=text] { min-width: 240px; }
    input[type=date]::-webkit-calendar-picker-indicator { filter: invert(1); cursor: pointer; }
    .btn-csv {
      background: var(--green); color: #0f1117; border: none;
      border-radius: 8px; padding: 8px 16px; font-size: .88rem;
      font-weight: 700; cursor: pointer; font-family: inherit;
    }
    .btn-csv:hover { opacity: .88; }
    .info { font-size: .8rem; color: var(--muted); margin-left: auto; }
    .table-wrap { overflow-x: auto; border-radius: 10px; border: 1px solid var(--border); }
    table { width: 100%; border-collapse: collapse; font-size: .82rem; }
    thead th {
      background: var(--card2); padding: 10px 12px; text-align: left;
      font-size: .72rem; text-transform: uppercase; letter-spacing: .05em;
      color: var(--muted); border-bottom: 1px solid var(--border);
      white-space: nowrap; cursor: pointer;
    }
    thead th:hover { color: var(--text); }
    tbody tr.linha-pedido { border-bottom: 1px solid var(--border); cursor: pointer; }
    tbody tr.linha-pedido:hover { background: var(--card2); }
    tbody td { padding: 9px 12px; vertical-align: middle; white-space: nowrap; }
    .cod  { color: var(--muted); font-size: .78rem; font-family: monospace; }
    .rca-badge {
      display: inline-block; background: var(--card2); border: 1px solid var(--border);
      border-radius: 5px; padding: 2px 7px; font-size: .72rem; color: var(--accent);
    }
    .expand-icon { display: inline-block; width: 14px; color: var(--muted); }
    tr.linha-itens td { background: #14161f; padding: 0; }
    .itens-wrap { padding: 10px 12px 14px 40px; }
    .itens-wrap table { font-size: .78rem; }
    .itens-wrap th { background: transparent; color: var(--muted); padding: 4px 10px; cursor: default; }
    .itens-wrap td { padding: 4px 10px; white-space: normal; }
    .itens-acoes { display: flex; gap: 8px; margin-bottom: 10px; }
    .btn-acao {
      background: var(--card); border: 1px solid var(--border); color: var(--text);
      border-radius: 8px; padding: 6px 12px; font-size: .78rem; font-weight: 700;
      cursor: pointer; font-family: inherit; display: inline-flex; align-items: center; gap: 6px;
    }
    .btn-acao:hover { border-color: var(--blue); }
    .btn-acao.whatsapp:hover { border-color: #25D366; }
    .valor { font-weight: 700; }
    .empty { text-align: center; padding: 48px; color: var(--muted); font-size: .9rem; }
    .status { font-weight: 700; padding: 2px 8px; border-radius: 20px; font-size: .72rem; white-space: nowrap; }
    .status-integral { background: rgba(34,197,94,.15); color: var(--green); }
    .status-corte { background: rgba(249,115,22,.15); color: var(--orange); }
    .status-nao_encontrado { background: rgba(239,68,68,.15); color: var(--red); }
    .status-montado { background: rgba(124,134,255,.15); color: var(--blue); }
    .status-cliente_nao_cadastrado { background: rgba(168,85,247,.18); color: #c084fc; }
    .status-cancelado, .status-cancelado_spon { background: rgba(148,163,184,.18); color: var(--muted); text-decoration: line-through; }
    .status-indisponivel { background: var(--card2); color: var(--muted); }
    .spon-info { font-size: .72rem; color: var(--muted); margin-top: 2px; }
    .inadimplente-badge {
      display: inline-block; margin-left: 6px; font-weight: 700; font-size: .68rem;
      padding: 1px 7px; border-radius: 20px; white-space: nowrap;
      background: rgba(239,68,68,.18); color: var(--red); border: 1px solid rgba(239,68,68,.4);
    }
    tr.item-cortado td { background: rgba(249,115,22,.08); }

    .btn {
      background: var(--card); border: 1px solid var(--border); color: var(--text);
      border-radius: 8px; padding: 7px 14px; font-size: .8rem; font-weight: 700;
      cursor: pointer; font-family: inherit;
    }
    .btn:hover { border-color: var(--blue); }
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.6);
      display: flex; align-items: center; justify-content: center; z-index: 100;
    }
    .modal-overlay[hidden] { display: none; }
    .modal-card {
      background: #14161f; border: 1px solid var(--border); border-radius: 12px;
      padding: 22px; width: 90%; max-width: 420px;
    }
    .modal-card h3 { font-size: 1rem; margin-bottom: 6px; }
    .modal-card .modal-sub { font-size: .78rem; color: var(--muted); margin-bottom: 16px; }
    .modal-card label { font-size: .74rem; color: var(--muted); display: block; margin-bottom: 4px; margin-top: 12px; }
    .modal-card input[type=text] { width: 100%; min-width: 0; }
    .modal-card .modal-acoes { display: flex; gap: 10px; margin-top: 20px; justify-content: flex-end; }
    .modal-checkbox { display: flex !important; align-items: flex-start; gap: 8px; margin-top: 16px; font-size: .74rem; color: var(--muted); cursor: pointer; }
    .modal-checkbox input[type=checkbox] { margin-top: 2px; flex-shrink: 0; width: auto; }

    @media (max-width: 640px) {
      body { padding: 12px; }
      .kpi { min-width: 130px; padding: 12px 14px; }
      select { min-width: 140px; }
      input[type=text] { min-width: 140px; }
      table { font-size: .76rem; }
      thead th, tbody td { padding: 8px 9px; }
      .hide-mob { display: none; }
    }
  </style>
</head>
<body>

<header>

    <div>
      <h1>PEDIDOS MERCOS</h1>
      <p id="header-sub">—</p>
    </div>
  </div>
  <div style="display:flex;gap:14px;align-items:center">
    <button class="btn" onclick="abrirConfigZapi()">⚙️ WhatsApp</button>
    <a href="estoque_mercos.html" style="color:var(--blue);font-size:.8rem;text-decoration:none;font-weight:700">📦 Estoque</a>
    <a href="kanban_mercos.html" style="color:var(--blue);font-size:.8rem;text-decoration:none;font-weight:700">📋 Tarefas</a>
    <a href="sp.html?vendedor=W.S" style="color:var(--blue);font-size:.8rem;text-decoration:none;font-weight:700">Ver painel SP (W.S) →</a>

<div class="kpis" id="kpis"></div>

<div class="controls">

  </select>

  </select>

<div class="table-wrap">
  <table id="tabela">
    <thead>
      <tr>
        <th style="width:18px"></th>
        <th onclick="ordenarPor('data')">Data</th>
        <th onclick="ordenarPor('numped')">Pedido</th>
        <th onclick="ordenarPor('cod_vendedor')">Vendedor</th>
        <th class="hide-mob" onclick="ordenarPor('cnpj')">CNPJ</th>
        <th onclick="ordenarPor('cliente')">Cliente</th>
        <th class="hide-mob" onclick="ordenarPor('representada')">Representada</th>
        <th onclick="ordenarPor('qt_pedido')">Qtd</th>
        <th onclick="ordenarPor('subtotal_pedido')">Subtotal</th>
        <th onclick="ordenarPor('status_spon')">Status SPON</th>
        <th class="hide-mob">Pedido SPON</th>
        <th class="hide-mob">Nota</th>
        <th onclick="ordenarPor('status_logistica')">Status Logística</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

<script>
const DATA = typeof PEDIDOS_MERCOS_DATA !== 'undefined' ? PEDIDOS_MERCOS_DATA : null;
const PEDIDOS = DATA ? DATA.pedidos : [];

const STATUS_LABEL = {
  integral: 'Faturado integral',
  corte: 'Faturado com corte',
  excesso: 'Faturado (valor maior)',
  montado: 'Montado (aguardando faturamento)',
  nao_encontrado: 'Não encontrado no SPON',
  cliente_nao_cadastrado: 'Cliente não cadastrado',
  cancelado: 'Cancelado no Mercos',
  cancelado_spon: 'Cancelado no SPON',
  indisponivel: 'Indisponível',
};

let _ordem = { campo: 'data', asc: false };
let _expandidos = new Set();

if (!DATA) {
  document.getElementById('tbody').innerHTML = '<tr><td colspan="13" class="empty">Dados não encontrados. Gere pedidos_mercos_data.js a partir dos relatórios exportados da Mercos.</td></tr>';
} else {
  document.getElementById('header-sub').textContent =
    'Atualizado ' + DATA.atualizado_em + ' · Período: ' + DATA.periodo +
    (DATA.fontes_indisponiveis && DATA.fontes_indisponiveis.length
      ? ' · ⚠️ fonte(s) fora do ar: ' + DATA.fontes_indisponiveis.join(', ')
      : '');
  montarFiltros();
  aplicarFiltro();
}

function montarKpis(lista) {
  const totalPedidos = lista.length;
  const totalValor = lista.reduce((s, p) => s + (p.subtotal_pedido || 0), 0);
  const clientes = new Set(lista.map(p => p.cnpj)).size;
  const ticket = totalPedidos ? totalValor / totalPedidos : 0;
  const naoFaturados = lista.filter(p => ['nao_encontrado', 'cliente_nao_cadastrado', 'montado'].includes(p.status_spon)).length;
  const cancelados = lista.filter(p => (p.status_spon || '').startsWith('cancelado')).length;
  document.getElementById('kpis').innerHTML = `
    <div class="kpi">
      <div class="label">Pedidos</div>
      <div class="val">${totalPedidos}</div>
    </div>
    <div class="kpi">
      <div class="label">Clientes Atendidos</div>
      <div class="val">${clientes}</div>
    </div>
    <div class="kpi">
      <div class="label">Total em Pedidos</div>
      <div class="val" style="color:var(--green)">${brl(totalValor)}</div>
    </div>
    <div class="kpi">
      <div class="label">Ticket Médio</div>
      <div class="val">${brl(ticket)}</div>
    </div>
    <div class="kpi">
      <div class="label">Não Faturados no SPON</div>
      <div class="val" style="color:var(--red)">${naoFaturados}</div>
    </div>
    <div class="kpi">
      <div class="label">Cancelados</div>
      <div class="val" style="color:var(--muted)">${cancelados}</div>
    </div>`;
}

function montarFiltros() {
  const repAtual = document.getElementById('sel-representada').value;
  const selRep = document.getElementById('sel-representada');
  selRep.innerHTML = '<option value="">Todas as Representadas</option>';
  [...new Set(PEDIDOS.map(p => p.representada).filter(Boolean))].sort().forEach(r => {
    const o = document.createElement('option');
    o.value = r; o.textContent = r;
    if (r === repAtual) o.selected = true;
    selRep.appendChild(o);
  });

  const vendAtual = document.getElementById('sel-vendedor').value;
  const selVend = document.getElementById('sel-vendedor');
  selVend.innerHTML = '<option value="">Todos os Vendedores</option>';
  [...new Set(PEDIDOS.map(p => p.cod_vendedor + ' - ' + p.vendedor).filter(Boolean))].sort().forEach(v => {
    const o = document.createElement('option');
    o.value = v; o.textContent = v;
    if (v === vendAtual) o.selected = true;
    selVend.appendChild(o);
  });
}

function ordenarPor(campo) {
  if (_ordem.campo === campo) {
    _ordem.asc = !_ordem.asc;
  } else {
    _ordem = { campo, asc: true };
  }
  aplicarFiltro();
}

function _filtrados() {
  if (!DATA) return [];
  const representada = document.getElementById('sel-representada').value;
  const vendedor      = document.getElementById('sel-vendedor').value;
  const status        = document.getElementById('sel-status').value;
  const busca         = document.getElementById('busca').value.trim().toLowerCase();
  const dataDe        = document.getElementById('data-de').value;
  const dataAte       = document.getElementById('data-ate').value;
  let lista = PEDIDOS.filter(p => {
    const matchRep    = !representada || p.representada === representada;
    const matchVend   = !vendedor || (p.cod_vendedor + ' - ' + p.vendedor) === vendedor;
    const matchStatus = !status || p.status_spon === status;
    const dataIso     = _dataISO(p.data);
    const matchDataDe  = !dataDe || (dataIso && dataIso >= dataDe);
    const matchDataAte = !dataAte || (dataIso && dataIso <= dataAte);
    const matchBusca = !busca || [p.numped, p.cliente, p.cnpj, ...(p.itens || []).map(i => i.descricao), ...(p.itens || []).map(i => i.codprod)]
      .some(v => v && String(v).toLowerCase().includes(busca));
    return matchRep && matchVend && matchStatus && matchDataDe && matchDataAte && matchBusca;
  });
  const { campo, asc } = _ordem;
  lista = [...lista].sort((a, b) => {
    let va = a[campo], vb = b[campo];
    if (campo === 'data') { va = _dataISO(va); vb = _dataISO(vb); }
    if (va === null || va === undefined) va = asc ? Infinity : -Infinity;
    if (vb === null || vb === undefined) vb = asc ? Infinity : -Infinity;
    if (typeof va === 'string') { va = va.toLowerCase(); vb = String(vb || '').toLowerCase(); }
    if (va < vb) return asc ? -1 : 1;
    if (va > vb) return asc ? 1 : -1;
    return 0;
  });
  return lista;
}

function aplicarFiltro() {
  const lista = _filtrados();
  montarKpis(lista);
  document.getElementById('info-count').textContent = lista.length + ' pedido(s)';

  const tbody = document.getElementById('tbody');
  if (!lista.length) {
    tbody.innerHTML = '<tr><td colspan="13" class="empty">Nenhum pedido encontrado.</td></tr>';
    return;
  }

  tbody.innerHTML = lista.map(p => {
    const aberto = _expandidos.has(p.numped);
    let html = `
    <tr class="linha-pedido" onclick="toggleItens('${_escAttr(p.numped)}')">
      <td><span class="expand-icon">${aberto ? '▾' : '▸'}</span></td>
      <td class="cod">${_esc(p.data)}</td>
      <td class="cod">#${_esc(p.numped)}</td>
      <td><span class="rca-badge">${_esc(p.cod_vendedor)} - ${_esc(p.vendedor)}</span></td>
      <td class="cod hide-mob">${_formatCnpj(p.cnpj)}</td>
      <td>${_esc(p.cliente)}${_inadimplenteBadge(p)}</td>
      <td class="hide-mob">${_esc(p.representada)}</td>
      <td>${_qt(p.qt_pedido)}</td>
      <td class="valor">${brl(p.subtotal_pedido)}</td>
      <td>${_statusBadge(p)}</td>
      <td class="cod hide-mob">${(p.numped_spon || []).join(', ') || '—'}</td>
      <td class="cod hide-mob">${(p.numnota_spon || []).join(', ') || '—'}</td>
      <td>${_logisticaBadge(p)}</td>
    </tr>`;
    if (aberto) {
      const cortados = {};
      (p.itens_cortados || []).forEach(ic => { cortados[String(ic.codprod)] = ic; });
      // PDF/WhatsApp também disponíveis pra pedido cancelado (pedido do
      // usuário em 2026-09-02) — _mensagemFaturamento/_construirPdfPedido já
      // tratam status_spon cancelado/cancelado_spon com texto próprio (não
      // fala em "faturado" pra um pedido cancelado).
      let aviso = '';
      if (p.status_spon === 'cancelado') {
        aviso = `<p style="color:var(--muted);font-size:.85rem;padding:0 4px 8px">Pedido cancelado no Mercos — sem detalhamento de itens disponível (a Mercos não exporta produtos de pedidos cancelados).</p>`;
      } else if (p.status_spon === 'cancelado_spon') {
        aviso = `<p style="color:var(--muted);font-size:.85rem;padding:0 4px 8px">Pedido cancelado no SPON (Winthor)${p.motivo_cancelamento ? ' — motivo: ' + _esc(p.motivo_cancelamento) : ''}.${p.cliente === 'Cliente não identificado' ? ' Cliente não identificado (a fonte desse dado no Winthor não guarda o cliente).' : ''}</p>`;
      }
      html += `<tr class="linha-itens"><td colspan="13"><div class="itens-wrap">
        ${aviso}
        <div class="itens-acoes">
          <button class="btn-acao" onclick="event.stopPropagation(); gerarPdfPedido('${_escAttr(p.numped)}')">📄 Gerar PDF</button>
          <button class="btn-acao whatsapp" onclick="event.stopPropagation(); enviarWhatsapp('${_escAttr(p.numped)}', this)">📱 Enviar WhatsApp</button>
          ${(p.numnota_spon || []).length ? `<button class="btn-acao" onclick="event.stopPropagation(); baixarDanfe('${_escAttr(p.numped)}', this)">📄 DANFE</button>` : ''}
        </div>
        <table><thead><tr><th>Código</th><th>Produto</th><th>Qtd</th><th>Preço Líquido</th><th>Subtotal</th><th>Faturado no SPON</th></tr></thead><tbody>
        ${(p.itens || []).map(it => {
          const ic = cortados[String(it.codprod)];
          return `<tr${ic ? ' class="item-cortado"' : ''}>
          <td class="cod">${_esc(it.codprod)}</td>
          <td>${_esc(it.descricao)}</td>
          <td>${_qt(it.qt)}</td>
          <td>${brl(it.preco_liquido)}</td>
          <td>${brl(it.subtotal)}</td>
          <td>${_itemStatusBadge(p, ic)}</td>
        </tr>`;
        }).join('')}
        </tbody></table>
      </div></td></tr>`;
    }
    return html;
  }).join('');
}

// Cruzado em gerar_pedidos_mercos_data.py (CNPJ do pedido -> CODCLI no SPON
// -> titulo vencido em aberto de inadimplencia_data.js) — pedido do usuário
// em 2026-09-02, pra ver na hora de mandar pedido/cobrança se o cliente já
// está devendo.
function _inadimplenteBadge(p) {
  if (!p.inadimplente) return '';
  const titulo = `${p.inadimplencia_qtd_titulos} título(s) vencido(s), ${p.inadimplencia_dias_atraso}d de atraso`;
  return `<span class="inadimplente-badge" title="${_escAttr(titulo)}">⚠️ Inadimplente ${brl(p.inadimplencia_valor)}</span>`;
}

function _statusBadge(p) {
  const label = STATUS_LABEL[p.status_spon] || p.status_spon || '—';
  let badge = `<span class="status status-${_esc(p.status_spon)}">${_esc(label)}</span>`;
  if ((p.status_spon === 'corte' || p.status_spon === 'excesso') && p.valor_spon !== null && p.valor_spon !== undefined) {
    badge += `<div class="spon-info">SPON: ${brl(p.valor_spon)}</div>`;
  }
  if (p.status_spon === 'cancelado_spon' && p.motivo_cancelamento) {
    badge += `<div class="spon-info">${_esc(p.motivo_cancelamento)}${p.cancelado_por ? ' · ' + _esc(p.cancelado_por) : ''}</div>`;
  }
  return badge;
}

function _logisticaClasse(status) {
  const s = (status || '').toUpperCase();
  if (s === 'ENTREGUE' || s.includes('ENTREGA TOTAL') || s === 'COMPROVADO' || s === 'EM ROTA') return 'ok';
  if (s === 'RETORNO' || s.includes('ENTREGA PARCIAL')) return 'corte';
  if (s === 'CANCELADA') return 'nao_encontrado';
  return 'indisponivel';
}

function _logisticaBadge(p) {
  const status = p.status_logistica;
  if (!status) return '<span class="status status-indisponivel">—</span>';
  const cls = { ok: 'status-integral', corte: 'status-corte', nao_encontrado: 'status-nao_encontrado', indisponivel: 'status-indisponivel' }[_logisticaClasse(status)];
  let badge = `<span class="status ${cls}">${_esc(status)}</span>`;
  if (p.logistica_rota) {
    badge += `<div class="spon-info">${_esc(p.logistica_rota)}${p.logistica_data_entrega ? ' · ' + _esc(p.logistica_data_entrega) : ''}</div>`;
  }
  return badge;
}

const STATUS_COM_COMPARACAO = ['integral', 'corte', 'excesso'];

function _itemStatusBadge(p, ic) {
  if (ic) {
    return `<span class="status status-corte">Cortado: ${_qt(ic.qt_cortada)} un (faturou ${_qt(ic.qt_faturada)})</span>`;
  }
  if (STATUS_COM_COMPARACAO.includes(p.status_spon)) {
    return '<span class="status status-integral">OK</span>';
  }
  if (p.status_spon === 'montado') {
    return '<span class="status status-montado">Aguardando faturamento</span>';
  }
  if (p.status_spon === 'cancelado_spon') {
    return '<span class="status status-cancelado_spon">Cancelado</span>';
  }
  return '<span class="status status-nao_encontrado" style="opacity:.7">Sem dado no SPON</span>';
}

// Mesmo texto de _itemStatusBadge, sem HTML — usado no PDF e no resumo do
// WhatsApp (pedido do usuário em 2026-09-01: "o pdf que gera precisa
// conter a info do corte").
function _itemStatusTexto(p, ic) {
  if (ic) return `Cortado: ${_qt(ic.qt_cortada)} un (faturou ${_qt(ic.qt_faturada)})`;
  if (STATUS_COM_COMPARACAO.includes(p.status_spon)) return 'OK';
  if (p.status_spon === 'montado') return 'Aguardando faturamento';
  if (p.status_spon === 'cancelado_spon') return 'Cancelado';
  return 'Sem dado no SPON';
}

function _cortadosPorCodigo(p) {
  const cortados = {};
  (p.itens_cortados || []).forEach(ic => { cortados[String(ic.codprod)] = ic; });
  return cortados;
}

function toggleItens(numped) {
  if (_expandidos.has(numped)) _expandidos.delete(numped);
  else _expandidos.add(numped);
  aplicarFiltro();
}

// Mensagem curta de aviso de faturamento (pedido do usuário em 2026-09-01:
// "Olá (vendedor) seu pedido (numero) foi faturado e houve os seguintes
// cortes (se houver)") — os detalhes completos item a item vão só no PDF
// anexado, não nessa mensagem. Pedido cancelado (Mercos ou SPON) usa texto
// próprio — "foi faturado" ficaria errado (pedido do usuário em 2026-09-02:
// PDF/WhatsApp também disponíveis pra pedido cancelado).
function _mensagemFaturamento(p) {
  const nomeVendedor = p.vendedor || p.cod_vendedor || '';
  const saudacao = nomeVendedor ? `Olá ${nomeVendedor}, ` : 'Olá, ';
  if (p.status_spon === 'cancelado' || p.status_spon === 'cancelado_spon') {
    const motivo = p.motivo_cancelamento ? ` Motivo: ${p.motivo_cancelamento}.` : '';
    const onde = p.status_spon === 'cancelado_spon' ? 'no sistema (SPON/Winthor)' : 'no Mercos';
    return `${saudacao}o pedido #${p.numped} foi CANCELADO ${onde}.${motivo}`;
  }
  const linhas = [`${saudacao}seu pedido #${p.numped} foi faturado.`];
  const cortados = _cortadosPorCodigo(p);
  const itensCortados = (p.itens || []).filter(it => cortados[String(it.codprod)]);
  if (itensCortados.length) {
    linhas.push('', 'Houve os seguintes cortes:');
    itensCortados.forEach(it => {
      const ic = cortados[String(it.codprod)];
      linhas.push(`- ${it.descricao}: cortado ${_qt(ic.qt_cortada)} un (faturou ${_qt(ic.qt_faturada)} de ${_qt(it.qt)} pedidos)`);
    });
  }
  return linhas.join('\n');
}

// Extraído de gerarPdfPedido pra poder reusar o mesmo PDF no envio por
// WhatsApp (pedido do usuário em 2026-09-01) sem duplicar o layout —
// devolve o doc do jsPDF sem salvar, quem chama decide o que fazer com ele.
function _construirPdfPedido(p) {
  const { jsPDF } = window.jspdf;
  // Paisagem — a coluna extra de status SPON/corte não cabia na largura de
  // retrato (pedido do usuário em 2026-09-01: "o pdf que gera precisa
  // conter a info do corte").
  const doc = new jsPDF({ orientation: 'landscape' });
  let y = 18;
  doc.setFontSize(14);
  doc.text(`Pedido #${p.numped} — ${p.data}`, 14, y);
  y += 9;
  doc.setFontSize(10);
  [
    `Cliente: ${p.cliente}`,
    `CNPJ: ${_formatCnpj(p.cnpj)}`,
    `Representada: ${p.representada}`,
    `Vendedor: ${p.cod_vendedor}${p.vendedor ? ' - ' + p.vendedor : ''}`,
  ].forEach(linha => { doc.text(linha, 14, y); y += 6; });
  y += 4;
  doc.setFont(undefined, 'bold');
  doc.text('Código', 14, y); doc.text('Produto', 38, y); doc.text('Qtd', 150, y);
  doc.text('Preço', 168, y); doc.text('Subtotal', 192, y); doc.text('Faturado no SPON', 220, y);
  doc.setFont(undefined, 'normal');
  y += 6;
  const cortados = _cortadosPorCodigo(p);
  (p.itens || []).forEach(it => {
    if (y > 190) { doc.addPage('a4', 'landscape'); y = 18; }
    const status = _itemStatusTexto(p, cortados[String(it.codprod)]);
    doc.text(String(it.codprod), 14, y);
    doc.text(String(it.descricao).slice(0, 55), 38, y);
    doc.text(_qt(it.qt), 150, y);
    doc.text(brl(it.preco_liquido), 168, y);
    doc.text(brl(it.subtotal), 192, y);
    doc.setFontSize(8);
    doc.text(status, 220, y);
    doc.setFontSize(10);
    y += 6;
  });
  y += 4;
  doc.setFont(undefined, 'bold');
  doc.text(`Total: ${brl(p.subtotal_pedido)}`, 14, y);
  return doc;
}

function gerarPdfPedido(numped) {
  const p = PEDIDOS.find(x => String(x.numped) === String(numped));
  if (!p) return;
  _construirPdfPedido(p).save(`pedido_${p.numped}.pdf`);
}

// Envia direto pro WhatsApp do VENDEDOR do pedido, pela conta Z-API de
// QUEM ESTÁ LOGADO (não um número fixo da empresa) — pedido do usuário em
// 2026-09-01 (antes era wa.me sem número fixo, abria deixando escolher o
// contato, saindo do celular de quem clicava). O telefone do vendedor não
// fica no pedidos_mercos_data.js (público) — o backend
// (pedidos_mercos_api.py) resolve pelo cadastro de colaborador da própria
// Mercos (esses vendedores não têm cadastro no Winthor) e retransmite pra
// Z-API com o token que só existe no localStorage deste navegador.
// Manda a mensagem curta de faturamento/corte + o mesmo PDF do botão
// "Gerar PDF" anexado (pedido do usuário em 2026-09-01).
async function enviarWhatsapp(numped, btn) {
  const p = PEDIDOS.find(x => String(x.numped) === String(numped));
  if (!p) return;
  const cfg = _lerConfigZapi();
  if (!cfg.instance || !cfg.token || !cfg.client_token) {
    alert('Configure sua conta Z-API primeiro (botão "⚙️ WhatsApp" no topo da página).');
    abrirConfigZapi();
    return;
  }
  const textoOriginal = btn.textContent;
  btn.disabled = true;
  btn.textContent = '📱 Enviando...';
  try {
    // Z-API exige o data URI COMPLETO no campo "document" (com o prefixo
    // "data:application/pdf;base64,"), não só o base64 puro — confirmado
    // 2026-09-02 testando contra conta real (a doc oficial do Z-API mostra
    // o exemplo com o prefixo; mandar só o base64 cru dava "Base64/Url
    // could not be read"). datauristring vem como
    // "data:application/pdf;filename=...;base64,XXXX" — troca o bloco
    // ";filename=...;" por nada, deixando só "data:application/pdf;base64,XXXX".
    const pdfDataUriBruto = _construirPdfPedido(p).output('datauristring');
    const pdfBase64 = pdfDataUriBruto.replace(/;filename=[^;]*;/, ';');
    const resp = await fetch('/api/pedidos-mercos/enviar-whatsapp', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        cod_vendedor: p.cod_vendedor,
        mensagem: _mensagemFaturamento(p),
        zapi_instance: cfg.instance,
        zapi_token: cfg.token,
        zapi_client_token: cfg.client_token,
        pdf_base64: pdfBase64,
        pdf_filename: `pedido_${p.numped}.pdf`,
      }),
    });
    const d = await resp.json().catch(() => ({}));
    if (d.ok) {
      btn.textContent = '✅ Enviado';
      setTimeout(() => { btn.textContent = textoOriginal; btn.disabled = false; }, 3000);
    } else {
      alert(d.motivo || 'Não foi possível enviar o WhatsApp agora.');
      btn.textContent = textoOriginal;
      btn.disabled = false;
    }
  } catch (e) {
    alert('Não foi possível enviar o WhatsApp agora — tente de novo em instantes.');
    btn.textContent = textoOriginal;
    btn.disabled = false;
  }
}

function _formatCnpj(v) {
  if (!v) return '—';
  const s = String(v).padStart(14, '0');
  if (s.length !== 14) return _esc(v);
  return `${s.slice(0,2)}.${s.slice(2,5)}.${s.slice(5,8)}/${s.slice(8,12)}-${s.slice(12)}`;
}

// ── DANFE oficial (a partir das views Oracle SQL_NFE_*, ver buscar_dados_nfe.py) ──
// Pedido do usuário em 2026-09-11: baixar o DANFE de verdade (documento fiscal —
// chave de acesso, código de barras, impostos), diferente do PDF resumido
// comercial que já existia ("Gerar PDF"/"Enviar WhatsApp", que continuam como
// estavam). Layout é best-effort — reconstruído a partir das colunas das views
// (Winthor não expõe o XML assinado por aqui), não é pixel-a-pixel do DANFE
// oficial, mas tem todos os campos obrigatórios pra conferência. Pedido com
// mais de uma nota (numnota_spon.length > 1) gera uma página por nota — busca
// pelo numped_spon (não numnota_spon): NUMERO_NOTA se repete entre filiais
// diferentes no Oracle do SPON (confirmado 2026-09-11), NUM_PEDIDO é a chave
// única de verdade, e buscar_dados_nfe.py já espera essa lista.
async function baixarDanfe(numped, btn) {
  const p = PEDIDOS.find(x => String(x.numped) === String(numped));
  if (!p || !(p.numped_spon || []).length) return;
  const textoOriginal = btn.textContent;
  btn.disabled = true;
  btn.textContent = '📄 Gerando...';
  try {
    const resp = await fetch('/api/pedidos-mercos/dados-nfe', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ numpeds: p.numped_spon }),
    });
    const d = await resp.json().catch(() => ({}));
    if (!d.ok || !(d.notas || []).length) {
      alert(d.motivo || 'Não consegui buscar os dados da NFe agora.');
      return;
    }
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
    d.notas.forEach((nota, i) => {
      if (i > 0) doc.addPage();
      _construirDanfePagina(doc, nota);
    });
    doc.save(`danfe_pedido_${numped}.pdf`);
  } catch (e) {
    alert('Não consegui gerar o DANFE agora — tente de novo em instantes.');
  } finally {
    btn.textContent = textoOriginal;
    btn.disabled = false;
  }
}

function _formatCnpjCpf(digits) {
  const s = String(digits || '').replace(/\D/g, '');
  if (s.length === 14) return `${s.slice(0,2)}.${s.slice(2,5)}.${s.slice(5,8)}/${s.slice(8,12)}-${s.slice(12)}`;
  if (s.length === 11) return `${s.slice(0,3)}.${s.slice(3,6)}.${s.slice(6,9)}-${s.slice(9)}`;
  return s || '—';
}

function _brlNum(v) {
  return Number(v || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function _trunc(s, n) {
  s = String(s || '').trim();
  return s.length > n ? s.slice(0, n - 1) + '…' : s;
}

// Caixa com legenda pequena em cima + valor embaixo — mesmo padrão visual do
// DANFE oficial (campo rotulado dentro de uma borda).
function _danfeCaixa(doc, x, y, w, h, label, valor, fontSize) {
  doc.rect(x, y, w, h);
  doc.setFontSize(5.5);
  doc.text(label, x + 1, y + 2.5, { maxWidth: w - 2 });
  doc.setFontSize(fontSize || 7.5);
  doc.text(_trunc(valor ?? '—', 40), x + 1, y + h - 1.5, { maxWidth: w - 2 });
}

function _construirDanfePagina(doc, n) {
  const M = 8;
  const W = 210 - 2 * M;
  let y = M;

  doc.setFontSize(8);
  doc.setFont(undefined, 'italic');
  doc.text('DANFE reconstruído a partir do Winthor — conferir contra o portal da SEFAZ se precisar de valor fiscal formal', M, y);
  doc.setFont(undefined, 'normal');
  y += 5;

  // Emitente + caixa "DANFE" com chave
  const hTop = 30;
  const wEmit = W * 0.58;
  const wDanfe = W - wEmit - 2;
  doc.rect(M, y, wEmit, hTop);
  doc.setFontSize(8);
  doc.setFont(undefined, 'bold');
  doc.text(_trunc(n.emitente.razao_social, 55), M + 2, y + 5, { maxWidth: wEmit - 4 });
  doc.setFont(undefined, 'normal');
  doc.setFontSize(7);
  [
    _trunc(`${n.emitente.logradouro}, ${n.emitente.numero}${n.emitente.complemento ? ' - ' + n.emitente.complemento : ''}`, 70),
    _trunc(`${n.emitente.bairro} - ${n.emitente.municipio}/${n.emitente.uf} - CEP ${n.emitente.cep}`, 70),
    `CNPJ: ${_formatCnpjCpf(n.emitente.cnpj_cpf)}   IE: ${n.emitente.ie || '—'}`,
    `Fone: ${n.emitente.telefone || '—'}`,
  ].forEach((l, i) => doc.text(l, M + 2, y + 10 + i * 4, { maxWidth: wEmit - 4 }));

  const xDanfe = M + wEmit + 2;
  doc.rect(xDanfe, y, wDanfe, hTop);
  doc.setFontSize(11);
  doc.setFont(undefined, 'bold');
  doc.text('DANFE', xDanfe + wDanfe / 2, y + 6, { align: 'center' });
  doc.setFontSize(6);
  doc.setFont(undefined, 'normal');
  doc.text('Documento Auxiliar da Nota Fiscal Eletrônica', xDanfe + wDanfe / 2, y + 9.5, { align: 'center', maxWidth: wDanfe - 4 });
  doc.text('0 - ENTRADA   1 - SAÍDA :  1', xDanfe + wDanfe / 2, y + 13, { align: 'center' });
  doc.setFontSize(8);
  doc.text(`Nº ${n.numero}   Série ${n.serie}`, xDanfe + wDanfe / 2, y + 17.5, { align: 'center' });
  doc.setFontSize(5.5);
  doc.text('Consulta de autenticidade no portal nacional da NF-e, pela chave de acesso:', xDanfe + wDanfe / 2, y + 21, { align: 'center', maxWidth: wDanfe - 4 });
  doc.setFontSize(6.5);
  doc.text(String(n.chave || '').replace(/(\d{4})(?=\d)/g, '$1 '), xDanfe + wDanfe / 2, y + 25, { align: 'center' });

  y += hTop + 2;

  // Código de barras Code128C da chave de acesso (padrão exigido pro DANFE)
  const hBar = 13;
  doc.rect(M, y, W, hBar);
  try {
    const canvas = document.createElement('canvas');
    JsBarcode(canvas, String(n.chave || ''), { format: 'CODE128C', displayValue: false, margin: 0, height: 40 });
    doc.addImage(canvas.toDataURL('image/png'), 'PNG', M + 2, y + 1.5, 95, hBar - 3);
  } catch (e) { /* sem código de barras não impede o resto do DANFE */ }
  doc.setFontSize(6.5);
  doc.text(`Protocolo de autorização de uso:`, M + 100, y + 5);
  doc.text(`${n.protocolo || '—'}  em  ${n.dthora_autorizacao || '—'}`, M + 100, y + 9.5);
  y += hBar + 2;

  _danfeCaixa(doc, M, y, W, 9, 'NATUREZA DA OPERAÇÃO', n.natureza_operacao, 7);
  y += 9 + 2;

  // Destinatário / Remetente
  const hDest = 22;
  const d = n.destinatario;
  doc.rect(M, y, W, hDest);
  doc.setFontSize(6);
  doc.setFont(undefined, 'bold');
  doc.text('DESTINATÁRIO / REMETENTE', M + 1, y + 3);
  doc.setFont(undefined, 'normal');
  doc.setFontSize(7);
  doc.text(`${_trunc(d.razao_social, 60)}   CNPJ/CPF: ${_formatCnpjCpf(d.cnpj_cpf)}`, M + 1, y + 8, { maxWidth: W - 2 });
  doc.text(_trunc(`${d.logradouro}, ${d.numero}${d.complemento ? ' - ' + d.complemento : ''} - ${d.bairro}`, 100), M + 1, y + 12.5, { maxWidth: W - 2 });
  doc.text(`${d.municipio}/${d.uf} - CEP ${d.cep}   IE: ${d.ie || '—'}   Fone: ${d.telefone || '—'}`, M + 1, y + 17, { maxWidth: W - 2 });
  doc.text(`Emissão: ${n.data_emissao || '—'}   Saída: ${n.data_saida || '—'} ${n.hora_saida || ''}`, M + 1, y + 21, { maxWidth: W - 2 });
  y += hDest + 2;

  // Cálculo do imposto
  const t = n.totais;
  const camposImposto = [
    ['BASE ICMS', _brlNum(t.base_icms)], ['VALOR ICMS', _brlNum(t.valor_icms)],
    ['BASE ICMS ST', _brlNum(t.base_icms_st)], ['VALOR ICMS ST', _brlNum(t.valor_icms_st)],
    ['VALOR IPI', _brlNum(t.valor_ipi)], ['VALOR FRETE', _brlNum(t.valor_frete)],
    ['DESCONTO', _brlNum(t.valor_desconto)], ['TOTAL PRODUTOS', _brlNum(t.valor_produtos)],
    ['TOTAL DA NOTA', _brlNum(t.valor_total)],
  ];
  const hImp = 11;
  const wImp = W / camposImposto.length;
  camposImposto.forEach((c, i) => _danfeCaixa(doc, M + i * wImp, y, wImp, hImp, c[0], c[1], 6.5));
  y += hImp + 2;

  // Transportador / Volumes
  const tr = n.transportador;
  const hTr = 10;
  doc.rect(M, y, W, hTr);
  doc.setFontSize(6);
  doc.setFont(undefined, 'bold');
  doc.text('TRANSPORTADOR / VOLUMES', M + 1, y + 3);
  doc.setFont(undefined, 'normal');
  doc.setFontSize(6.5);
  doc.text(_trunc(
    `${tr.nome || '—'}   CNPJ: ${_formatCnpjCpf(tr.cnpj)}   ${tr.municipio}/${tr.uf}   ` +
    `Placa: ${tr.placa || '—'}${tr.placa_uf ? '/' + tr.placa_uf : ''}   Volumes: ${tr.volumes || 0}   ` +
    `Peso bruto: ${_qt(tr.peso_bruto)} kg   Peso líquido: ${_qt(tr.peso_liquido)} kg`,
    150), M + 1, y + 8, { maxWidth: W - 2 });
  y += hTr + 2;

  // Tabela de itens
  const colunas = [
    { label: 'Código', w: 14 }, { label: 'Descrição', w: 58 }, { label: 'NCM', w: 18 },
    { label: 'CST', w: 10 }, { label: 'CFOP', w: 12 }, { label: 'Un', w: 9 },
    { label: 'Qtd', w: 13 }, { label: 'Vl. Unit.', w: 18 }, { label: 'Vl. Total', w: 19 },
    { label: 'Bc ICMS', w: 18 }, { label: 'Vl ICMS', w: 16 }, { label: '%ICMS', w: 9 },
  ];
  const totalColW = colunas.reduce((s, c) => s + c.w, 0);
  const escala = W / totalColW;
  colunas.forEach(c => c.w *= escala);

  const _linhaTabela = (valores, negrito, altura) => {
    let x = M;
    doc.setFont(undefined, negrito ? 'bold' : 'normal');
    colunas.forEach((c, i) => {
      doc.rect(x, y, c.w, altura);
      doc.text(String(valores[i] ?? ''), x + 1, y + altura - 1.5, { maxWidth: c.w - 2 });
      x += c.w;
    });
    y += altura;
  };

  doc.setFontSize(6);
  _linhaTabela(colunas.map(c => c.label), true, 5);

  doc.setFontSize(6);
  (n.itens || []).forEach(it => {
    if (y + 5 > 297 - 15) { doc.addPage(); y = M; }
    _linhaTabela([
      it.codigo, _trunc(it.descricao, 34), it.ncm, it.cst, it.cfop, it.unidade,
      _qt(it.quantidade), _brlNum(it.valor_unitario), _brlNum(it.valor_total),
      _brlNum(it.base_icms), _brlNum(it.valor_icms), `${_qt(it.aliquota_icms)}%`,
    ], false, 5);
  });
  y += 3;

  if (n.informacoes_complementares) {
    if (y + 10 > 297 - 10) { doc.addPage(); y = M; }
    doc.setFontSize(6.5);
    doc.setFont(undefined, 'bold');
    doc.text('INFORMAÇÕES COMPLEMENTARES', M, y);
    doc.setFont(undefined, 'normal');
    doc.text(_trunc(n.informacoes_complementares, 300), M, y + 4, { maxWidth: W });
  }
}

function _qt(v) {
  if (v === null || v === undefined) return '—';
  return Number(v).toLocaleString('pt-BR', {maximumFractionDigits: 2});
}

function brl(v) {
  return 'R$ ' + Number(v || 0).toLocaleString('pt-BR', {minimumFractionDigits: 2, maximumFractionDigits: 2});
}

function _dataISO(dataBr) {
  if (!dataBr) return '';
  const [d, m, a] = String(dataBr).split('/');
  if (!d || !m || !a) return '';
  return `${a}-${m.padStart(2,'0')}-${d.padStart(2,'0')}`;
}

function _esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function _escAttr(s) {
  return _esc(s).replace(/'/g, '&#39;');
}

function exportarCSV() {
  const lista = _filtrados();
  const header = ['Pedido','Data','Codigo Vendedor','Vendedor','CNPJ','Cliente','Representada','Codigo Produto','Descricao','Qtd Pedida','Preco Liquido','Subtotal','Qtd Faturada SPON','Qtd Cortada','Status SPON','Valor SPON','NUMPED SPON','Nota','Status Logistica','Rota'];
  const linhas = [];
  lista.forEach(p => {
    const cortados = {};
    (p.itens_cortados || []).forEach(ic => { cortados[String(ic.codprod)] = ic; });
    const linhaBase = [
      p.numped, p.data, p.cod_vendedor, p.vendedor, _formatCnpj(p.cnpj), p.cliente, p.representada,
    ];
    const linhaStatus = [
      STATUS_LABEL[p.status_spon] || p.status_spon, p.valor_spon ?? '', (p.numped_spon || []).join(' / '),
      (p.numnota_spon || []).join(' / '), p.status_logistica || '', p.logistica_rota || '',
    ];
    if (!(p.itens || []).length) {
      // Cancelado no Mercos não tem itens — ainda assim entra no CSV com
      // uma linha só (senão sumia do export inteiro).
      linhas.push([...linhaBase, '', '(pedido cancelado, sem itens)', '', '', p.subtotal_pedido, '', '', ...linhaStatus]
        .map(v => `"${String(v??'').replace(/"/g,'""')}"`).join(';'));
      return;
    }
    (p.itens || []).forEach(it => {
      const ic = cortados[String(it.codprod)];
      const temComparacao = STATUS_COM_COMPARACAO.includes(p.status_spon);
      linhas.push([
        ...linhaBase,
        it.codprod, it.descricao, it.qt, it.preco_liquido, it.subtotal,
        ic ? ic.qt_faturada : (temComparacao ? it.qt : ''), ic ? ic.qt_cortada : (temComparacao ? 0 : ''),
        ...linhaStatus,
      ].map(v => `"${String(v??'').replace(/"/g,'""')}"`).join(';'));
    });
  });

  const csv = '﻿' + [header.join(';'), ...linhas].join('\r\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url;
  a.download = `pedidos_mercos_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

// ── Configuração Z-API (token de quem está logado, só no navegador dele) ────
// Pedido do usuário em 2026-09-01: o envio de WhatsApp sai pela Z-API de
// QUEM ESTÁ LOGADO na página (não um número fixo da empresa) — cada
// usuário tem sua própria conta Z-API. O token fica só aqui (localStorage),
// nunca é salvo no nosso backend — a cada envio ele é mandado junto na
// requisição só pra esse backend retransmitir pra Z-API.
const ZAPI_STORAGE_KEY = 'pedidos_mercos_zapi_config';

function _lerConfigZapi() {
  try { return JSON.parse(localStorage.getItem(ZAPI_STORAGE_KEY) || '{}'); }
  catch (e) { return {}; }
}

function abrirConfigZapi() {
  const cfg = _lerConfigZapi();
  document.getElementById('zapi-instance').value = cfg.instance || '';
  document.getElementById('zapi-token').value = cfg.token || '';
  document.getElementById('zapi-client-token').value = cfg.client_token || '';
  document.getElementById('zapi-auto-avisar').checked = !!cfg.auto_avisar;
  document.getElementById('modal-zapi').hidden = false;
}

function fecharConfigZapi() {
  document.getElementById('modal-zapi').hidden = true;
}

// Aviso automático de mudança de status (pedido do usuário em 2026-09-10)
// rodava 100% client-side aqui (setInterval de 3min comparando contra
// localStorage) — migrado pro cron da VPS em 2026-09-11
// (checar_status_pedidos_mercos.py) porque só funcionava de verdade com a
// aba aberta em primeiro plano: celular suspende o timer assim que a aba
// vai pra segundo plano, então na prática quase nunca disparava (achado
// real: vendedora marcou o checkbox e nada foi enviado pro vendedor do
// pedido). O checkbox continua opt-in pelo mesmo motivo de antes (evita
// mensagem em dobro se mais de uma pessoa configurar a própria conta
// Z-API) — só que agora o flag mora no servidor, não mais num
// setInterval daqui. Por isso salvarConfigZapi() sincroniza os mesmos 4
// campos pro backend (best-effort — se a sincronização falhar, o botão
// manual de "Enviar WhatsApp" abaixo continua funcionando normal via
// localStorage, só o aviso automático do servidor fica com a config
// desatualizada até salvar de novo).
function salvarConfigZapi() {
  const cfg = {
    instance: document.getElementById('zapi-instance').value.trim(),
    token: document.getElementById('zapi-token').value.trim(),
    client_token: document.getElementById('zapi-client-token').value.trim(),
    auto_avisar: document.getElementById('zapi-auto-avisar').checked,
  };
  localStorage.setItem(ZAPI_STORAGE_KEY, JSON.stringify(cfg));
  fecharConfigZapi();
  fetch('/api/pedidos-mercos/config-zapi', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(cfg),
  }).catch(e => console.warn('Sincronização da config Z-API com o servidor falhou (aviso automático pode ficar desatualizado):', e));
}
</script>
<div class="modal-overlay" id="modal-zapi" hidden onclick="if (event.target === this) fecharConfigZapi()">
  <div class="modal-card">
    <h3>⚙️ Configurar WhatsApp (Z-API)</h3>
    <p class="modal-sub">Cada usuário usa sua própria conta Z-API pra enviar. Fica salvo só neste navegador.</p>
    <label for="zapi-instance">Instance ID</label>
    <input type="text" id="zapi-instance" placeholder="ex: 3D...">
    <label for="zapi-token">Token</label>
    <input type="text" id="zapi-token" placeholder="ex: A1B2C3...">
    <label for="zapi-client-token">Client-Token</label>
    <input type="text" id="zapi-client-token" placeholder="ex: F...">
    <label class="modal-checkbox">
      <input type="checkbox" id="zapi-auto-avisar">
      Avisar o vendedor automaticamente quando o status do pedido mudar
      (roda no servidor a cada poucos minutos — não precisa manter esta página aberta)
    </label>
    <div class="modal-acoes">
      <button class="btn" onclick="fecharConfigZapi()">Cancelar</button>
      <button class="btn-csv" onclick="salvarConfigZapi()">Salvar</button>
    </div>
  </div>
</div>
<script src="sticky_hscroll.js"></script>
</body>
