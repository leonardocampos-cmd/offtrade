<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Raio X do Cliente — OfftradeHub</title>
  <script src="auth.js"></script>
  <script src="raiox_cliente_detalhe_data.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f1117; --card: #1a1d27; --accent: #f5c518;
      --text: #e2e8f0; --muted: #94a3b8; --border: #2d3144;
      --green: #22c55e; --yellow: #f59e0b; --red: #ef4444;
    }
    body {
      background: var(--bg); color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh; padding: 0 0 48px;
    }
    header {
      background: var(--card); border-bottom: 1px solid var(--border);
      padding: 16px 24px; display: flex; align-items: center; gap: 16px;
      flex-wrap: wrap;
    }
    .logo { font-size: 1.05rem; font-weight: 800; color: var(--accent); }
    .nav { display: flex; gap: 8px; margin-left: auto; flex-wrap: wrap; }
    .nav a {
      color: var(--muted); text-decoration: none; font-size: .82rem;
      padding: 6px 12px; border-radius: 7px; border: 1px solid var(--border);
      transition: all .15s;
    }
    .nav a:hover, .nav a.ativo { border-color: var(--accent); color: var(--accent); }
    .container { max-width: 1100px; margin: 0 auto; padding: 24px 20px; }
    .titulo { font-size: 1.3rem; font-weight: 800; margin-bottom: 4px; }
    .atualizacao { font-size: .78rem; color: var(--muted); margin-bottom: 20px; }

    .busca-wrap { position: relative; max-width: 460px; margin-bottom: 20px; }
    .busca-wrap input {
      width: 100%; padding: 12px 14px; border-radius: 10px;
      border: 1px solid var(--border); background: var(--card); color: var(--text);
      font-size: .95rem; outline: none;
    }
    .busca-wrap input:focus { border-color: var(--accent); }
    .sugestoes {
      position: absolute; top: 100%; left: 0; right: 0; margin-top: 4px;
      background: var(--card); border: 1px solid var(--border); border-radius: 10px;
      max-height: 320px; overflow-y: auto; z-index: 10; display: none;
    }
    .sugestoes.aberto { display: block; }
    .sugestao-item { padding: 10px 14px; cursor: pointer; font-size: .85rem; border-bottom: 1px solid #232738; }
    .sugestao-item:last-child { border-bottom: none; }
    .sugestao-item:hover, .sugestao-item.ativa { background: #232738; }
    .sugestao-nome { color: var(--text); }
    .sugestao-meta { color: var(--muted); font-size: .74rem; margin-top: 2px; }

    .sem-selecao { color: var(--muted); text-align: center; padding: 60px 20px; }
    .filtro-rede-wrap { display: flex; flex-direction: column; gap: 5px; max-width: 320px; margin-bottom: 20px; }
    .filtro-rede-wrap label { font-size: .68rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
    .filtro-rede-wrap select {
      padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--card); color: var(--text); font-size: .88rem; outline: none;
    }
    .filtro-rede-wrap select:focus { border-color: var(--accent); }

    .ficha-header {
      background: var(--card); border: 1px solid var(--border); border-radius: 14px;
      padding: 20px 22px; margin-bottom: 20px; display: flex; justify-content: space-between;
      align-items: flex-start; gap: 16px; flex-wrap: wrap;
    }
    .ficha-nome { font-size: 1.15rem; font-weight: 800; }
    .ficha-razao { font-size: .78rem; color: var(--muted); margin-top: 2px; }
    .ficha-tags { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    .tag {
      font-size: .72rem; padding: 3px 10px; border-radius: 20px; border: 1px solid var(--border);
      color: var(--muted);
    }
    .btn-extrair {
      background: var(--accent); color: #111; border: none; border-radius: 8px;
      padding: 9px 16px; font-size: .82rem; font-weight: 700; cursor: pointer; white-space: nowrap;
    }
    .btn-extrair:hover { background: #d4a90e; }

    .kpi-row { display: flex; gap: 18px; flex-wrap: wrap; margin-bottom: 20px; }
    .kpi-card {
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      padding: 14px 18px; min-width: 140px; flex: 1;
    }
    .kpi-label { font-size: .68rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 4px; }
    .kpi-valor { font-size: 1.2rem; font-weight: 800; }

    .historico-wrap { max-height: 420px; overflow-y: auto; }
    .grid-2 { display: grid; grid-template-columns: 1.2fr 1fr; gap: 18px; }
    @media (max-width: 850px) { .grid-2 { grid-template-columns: 1fr; } }
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 20px;
      margin-bottom: 18px;
    }
    .card-titulo { font-size: .7rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 14px; }
    .meses-chart { display: flex; gap: 6px; align-items: flex-end; height: 120px; }
    .mes-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .mes-bar-bg { width: 100%; height: 90px; display: flex; align-items: flex-end; }
    .mes-bar { width: 100%; background: var(--accent); border-radius: 3px 3px 0 0; opacity: .85; min-height: 2px; }
    .mes-label { font-size: .62rem; color: var(--muted); }

    table { width: 100%; border-collapse: collapse; }
    th {
      text-align: left; font-size: .68rem; color: var(--muted); text-transform: uppercase;
      letter-spacing: .05em; padding: 6px 8px; border-bottom: 1px solid var(--border);
    }
    .historico-wrap th { position: sticky; top: 0; background: var(--card); }
    td { padding: 7px 8px; font-size: .85rem; border-bottom: 1px solid #232738; }
    th:last-child, td:last-child { text-align: right; }
    .part-bar-bg { display: inline-block; width: 50px; height: 5px; background: #2d3144; border-radius: 3px; overflow: hidden; margin-left: 6px; vertical-align: middle; }
    .part-bar-fill { height: 100%; background: var(--accent); border-radius: 3px; }
  </style>
</head>
<body>
  <header>
    <div class="logo">OfftradeHub</div>
    <div class="nav">
      <a href="raiox_clientes.html">Raio X Clientes</a>
      <a href="raiox_vendedores.html">Raio X Vendedores</a>
      <a href="raiox_industrias.html">Raio X Indústrias</a>
      <a href="raiox_oportunidades.html">Raio X Oportunidades</a>
      <a href="index.html">← Painel</a>
    </div>
  </header>

  <div class="container">
    <div class="titulo">Raio X do Cliente</div>
    <div class="atualizacao" id="atualizacao">Carregando…</div>

    <div class="busca-wrap">
      <input type="text" id="busca" placeholder="Buscar cliente por nome...">
      <div class="sugestoes" id="sugestoes"></div>
    </div>

    <div class="filtro-rede-wrap">
      <label for="filtro-rede">Filtrar por rede</label>
      <select id="filtro-rede"></select>
    </div>

    <div id="conteudo"></div>
  </div>

  <script>
    const brl = v => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL', maximumFractionDigits: 0 }).format(v);
    const data = RAIOX_CLIENTE_DETALHE_DATA;
    document.getElementById('atualizacao').textContent = `Atualizado em ${data.atualizado_em}`;

    const params = new URLSearchParams(location.search);
    const ramoFiltro = params.get('ramo') || '';
    const vendedorFiltro = params.get('vendedor') || '';
    const estadoFiltro = params.get('estado') || '';
    const gerenteFiltro = params.get('gerente') || '';
    const supervisorFiltro = params.get('supervisor') || '';
    let redeFiltro = params.get('rede') || '';
    const temFiltro = () => !!(ramoFiltro || vendedorFiltro || estadoFiltro || gerenteFiltro || supervisorFiltro || redeFiltro);
    let clienteAtual = null;

    function listaBase() {
      return data.clientes.filter(c => {
        if (ramoFiltro && c.ramo !== ramoFiltro) return false;
        if (vendedorFiltro && !c.vendedores_cadastro.some(v => `${c.estado}-${v.rca}` === vendedorFiltro)) return false;
        if (estadoFiltro && c.estado !== estadoFiltro) return false;
        if (gerenteFiltro && c.gerente !== gerenteFiltro) return false;
        if (supervisorFiltro && c.supervisor !== supervisorFiltro) return false;
        if (redeFiltro && c.rede !== redeFiltro) return false;
        return true;
      });
    }

    function montaFiltroRede() {
      const sel = document.getElementById('filtro-rede');
      const redes = [...new Set(data.clientes.map(c => c.rede).filter(r => r && r !== 'Sem rede'))].sort();
      sel.innerHTML = ['<option value="">Todas</option>']
        .concat(redes.map(r => `<option value="${r}">${r}</option>`)).join('');
      sel.value = redeFiltro;
      sel.addEventListener('change', () => {
        redeFiltro = sel.value;
        const p = new URLSearchParams(location.search);
        if (redeFiltro) p.set('rede', redeFiltro); else p.delete('rede');
        p.delete('chave');
        history.replaceState(null, '', '?' + p.toString());
        if (temFiltro()) {
          renderListaFiltrada();
        } else {
          document.getElementById('conteudo').innerHTML = '<div class="sem-selecao">Busque um cliente pelo nome acima para ver o Raio X completo.</div>';
        }
      });
    }
    montaFiltroRede();

    function nomeVendedorFiltro() {
      if (!vendedorFiltro) return '';
      for (const c of data.clientes) {
        const v = c.vendedores_cadastro.find(x => `${c.estado}-${x.rca}` === vendedorFiltro);
        if (v) return v.nome;
      }
      return vendedorFiltro;
    }

    function filtrarPorRede(rede) {
      const p = new URLSearchParams();
      p.set('rede', rede);
      location.href = '?' + p.toString();
    }

    function renderListaFiltrada() {
      if (!temFiltro()) return;
      const lista = listaBase().sort((a, b) => b.faturamento_ytd - a.faturamento_ytd);
      const filtrosHtml = [
        estadoFiltro ? `<span class="tag">Estado: ${estadoFiltro}</span>` : '',
        gerenteFiltro ? `<span class="tag">Gerente: ${gerenteFiltro}</span>` : '',
        supervisorFiltro ? `<span class="tag">Supervisor: ${supervisorFiltro}</span>` : '',
        ramoFiltro ? `<span class="tag">Ramo: ${ramoFiltro}</span>` : '',
        vendedorFiltro ? `<span class="tag">Vendedor: ${nomeVendedorFiltro()}</span>` : '',
        redeFiltro ? `<span class="tag">Rede: ${redeFiltro}</span>` : '',
      ].join('');

      const linhas = lista.map(c => `
        <tr data-chave="${c.chave}" style="cursor:pointer">
          <td>${c.nome}</td>
          <td style="color:var(--muted)">${c.estado} · ${c.cidade}</td>
          <td style="text-align:right">${brl(c.faturamento_ytd)}</td>
        </tr>
      `).join('') || '<tr><td colspan="3" style="color:var(--muted)">Nenhum cliente encontrado para este filtro.</td></tr>';

      document.getElementById('conteudo').innerHTML = `
        <div class="card">
          <div class="card-titulo">Clientes filtrados (${lista.length}) ${filtrosHtml}</div>
          <div class="historico-wrap">
            <table>
              <thead><tr><th>Cliente</th><th>Estado · Cidade</th><th style="text-align:right">Faturamento YTD</th></tr></thead>
              <tbody>${linhas}</tbody>
            </table>
          </div>
        </div>
      `;
      document.querySelectorAll('#conteudo tr[data-chave]').forEach(el => {
        el.addEventListener('click', () => selecionarCliente(el.dataset.chave));
      });
    }

    function renderSugestoes(termo) {
      const box = document.getElementById('sugestoes');
      const q = termo.trim().toUpperCase();
      if (!q) { box.classList.remove('aberto'); box.innerHTML = ''; return; }
      const resultados = listaBase()
        .filter(c => c.nome.toUpperCase().includes(q) || c.razao_social.toUpperCase().includes(q))
        .slice(0, 30);
      if (!resultados.length) {
        box.innerHTML = '<div class="sugestao-item" style="color:var(--muted)">Nenhum cliente encontrado.</div>';
        box.classList.add('aberto');
        return;
      }
      box.innerHTML = resultados.map(c => `
        <div class="sugestao-item" data-chave="${c.chave}">
          <div class="sugestao-nome">${c.nome}</div>
          <div class="sugestao-meta">${c.ramo} · ${c.estado} · ${c.cidade} · Cód. ${c.codcli}</div>
        </div>
      `).join('');
      box.classList.add('aberto');
      box.querySelectorAll('.sugestao-item[data-chave]').forEach(el => {
        el.addEventListener('click', () => selecionarCliente(el.dataset.chave));
      });
    }

    document.getElementById('busca').addEventListener('input', function () {
      renderSugestoes(this.value);
    });
    document.addEventListener('click', e => {
      if (!e.target.closest('.busca-wrap')) document.getElementById('sugestoes').classList.remove('aberto');
    });

    function selecionarCliente(chave) {
      const c = data.clientes.find(x => x.chave === chave);
      if (!c) return;
      clienteAtual = c;
      document.getElementById('busca').value = c.nome;
      document.getElementById('sugestoes').classList.remove('aberto');
      history.replaceState(null, '', `?chave=${encodeURIComponent(chave)}${ramoFiltro ? '&ramo=' + encodeURIComponent(ramoFiltro) : ''}`);
      renderFicha(c);
    }

    function renderFicha(c) {
      const vendedores = c.vendedores_cadastro.map(v => `${v.nome} (${v.rca})`).join(', ') || 'Sem vendedor cadastrado';

      const meses = data.meses_com_dado.map(m => ({ mes: m, valor: c.por_mes[m] || 0 }));
      const maxMes = Math.max(...meses.map(m => m.valor), 1);
      const mesesHtml = meses.map(m => `
        <div class="mes-col">
          <div class="mes-bar-bg"><div class="mes-bar" style="height:${Math.max(m.valor / maxMes * 100, 2)}%" title="${brl(m.valor)}"></div></div>
          <div class="mes-label">${m.mes.slice(5)}</div>
        </div>
      `).join('');

      const industriasHtml = (c.top_industrias || []).map(i => `
        <tr>
          <td>${i.fantasia}</td>
          <td>${brl(i.faturamento)}</td>
          <td>${i.pct}%<span class="part-bar-bg"><span class="part-bar-fill" style="width:${Math.min(i.pct * 2, 100)}%"></span></span></td>
        </tr>
      `).join('') || '<tr><td colspan="3" style="color:var(--muted)">Sem compras no período.</td></tr>';

      const vendedoresVendaHtml = (c.top_vendedores || []).map(v => `
        <tr><td>${v.nome}</td><td style="color:var(--muted)">${v.rca}</td><td>${brl(v.faturamento)}</td></tr>
      `).join('') || '<tr><td colspan="3" style="color:var(--muted)">Sem dados.</td></tr>';

      const historicoHtml = (c.historico_compras || []).map(h => `
        <tr>
          <td>${h.data}</td>
          <td>${h.industria}</td>
          <td>${h.produto}</td>
          <td style="text-align:right">${h.quantidade.toLocaleString('pt-BR')}</td>
          <td style="text-align:right">${brl(h.valor)}</td>
        </tr>
      `).join('') || '<tr><td colspan="5" style="color:var(--muted)">Sem compras no período.</td></tr>';

      const souLeonardo = (sessionStorage.getItem('rg_email') || '').toLowerCase() === 'leonardo.campos@rigarr.com.br';
      let inteligenciaHtml = '';
      if (souLeonardo) {
        const alertas = [];
        if (c.em_risco_queda) {
          alertas.push(`<span class="tag" style="border-color:var(--red);color:var(--red)">⚠ Queda de ${c.queda_pct}% (últimos 30d vs. 30d anteriores)</span>`);
        }
        if (c.atrasado_recompra) {
          alertas.push(`<span class="tag" style="border-color:var(--yellow);color:var(--yellow)">⏰ Atrasado: ${c.dias_desde_ultima_compra}d sem comprar (ciclo médio ${c.ciclo_medio_dias}d)</span>`);
        }
        const recomendacoesHtml = (c.recomendacoes || []).map(r => `
          <tr>
            <td>${r.fornecedor}</td>
            <td>${r.penetracao_pct}% dos clientes do ramo compram</td>
            <td style="text-align:right">${brl(r.ticket_medio)}</td>
          </tr>
        `).join('') || '<tr><td colspan="3" style="color:var(--muted)">Sem recomendações (cliente já cobre o essencial do ramo).</td></tr>';

        inteligenciaHtml = `
          <div class="card" style="border-color:var(--accent)">
            <div class="card-titulo" style="color:var(--accent)">🔒 Inteligência comercial (só você vê)</div>
            ${alertas.length ? `<div class="ficha-tags" style="margin-bottom:14px">${alertas.join('')}</div>` : '<div style="color:var(--muted);font-size:.82rem;margin-bottom:14px">Sem alertas de queda ou atraso.</div>'}
            <div class="secao-mini">Recomendações de produto (indústrias que o cliente ainda não compra, mas são comuns no ramo)</div>
            <table>
              <thead><tr><th>Indústria</th><th>Penetração no ramo</th><th>Ticket médio dos compradores</th></tr></thead>
              <tbody>${recomendacoesHtml}</tbody>
            </table>
          </div>
        `;
      }

      document.getElementById('conteudo').innerHTML = `
        <div class="ficha-header">
          <div>
            <div class="ficha-nome">${c.nome}</div>
            <div class="ficha-razao">${c.razao_social} · ${c.estado} · Cód. ${c.codcli}</div>
            <div class="ficha-tags">
              <span class="tag">${c.ramo}</span>
              <span class="tag">${c.estado}</span>
              <span class="tag">${c.cidade}</span>
              ${c.rede && c.rede !== 'Sem rede' ? `<span class="tag" style="cursor:pointer" onclick="filtrarPorRede('${c.rede.replace(/'/g, "\\'")}')" title="Ver todos os clientes desta rede">🔗 ${c.rede}</span>` : ''}
              <span class="tag">${vendedores}</span>
              <span class="tag">Última compra: ${c.ultima_compra || 'N/D'}</span>
            </div>
          </div>
          <button class="btn-extrair" onclick="extrairCliente()">&#128190; Extrair CSV</button>
        </div>

        <div class="kpi-row">
          <div class="kpi-card"><div class="kpi-label">Faturamento YTD</div><div class="kpi-valor">${brl(c.faturamento_ytd)}</div></div>
          <div class="kpi-card"><div class="kpi-label">Média mensal</div><div class="kpi-valor">${brl(c.media_mensal)}</div></div>
          <div class="kpi-card"><div class="kpi-label">Meses ativos</div><div class="kpi-valor">${Object.keys(c.por_mes).length} / ${data.meses_com_dado.length}</div></div>
        </div>

        ${inteligenciaHtml}

        <div class="card">
          <div class="card-titulo">Histórico mensal de compras</div>
          <div class="meses-chart">${mesesHtml}</div>
        </div>

        <div class="card">
          <div class="card-titulo">Histórico detalhado de compras (${(c.historico_compras || []).length})</div>
          <div class="historico-wrap">
            <table>
              <thead><tr><th>Data</th><th>Indústria</th><th>Produto</th><th style="text-align:right">Qtd.</th><th style="text-align:right">Valor</th></tr></thead>
              <tbody>${historicoHtml}</tbody>
            </table>
          </div>
        </div>

        <div class="grid-2">
          <div class="card">
            <div class="card-titulo">Faturamento por indústria</div>
            <table>
              <thead><tr><th>Indústria</th><th>Faturamento</th><th>Participação</th></tr></thead>
              <tbody>${industriasHtml}</tbody>
            </table>
          </div>
          <div class="card">
            <div class="card-titulo">Faturamento por vendedor</div>
            <table>
              <thead><tr><th>Vendedor</th><th>RCA</th><th>Faturamento</th></tr></thead>
              <tbody>${vendedoresVendaHtml}</tbody>
            </table>
          </div>
        </div>
      `;
    }

    function extrairCliente() {
      if (!clienteAtual) return;
      const c = clienteAtual;
      const linhas = [['Mês', 'Faturamento']];
      data.meses_com_dado.forEach(m => linhas.push([m, (c.por_mes[m] || 0).toFixed(2).replace('.', ',')]));
      linhas.push([]);
      linhas.push(['Indústria', 'Faturamento', 'Participação %']);
      (c.top_industrias || []).forEach(i => linhas.push([i.fantasia, i.faturamento.toFixed(2).replace('.', ','), i.pct]));
      linhas.push([]);
      linhas.push(['Vendedor', 'RCA', 'Faturamento']);
      (c.top_vendedores || []).forEach(v => linhas.push([v.nome, v.rca, v.faturamento.toFixed(2).replace('.', ',')]));
      linhas.push([]);
      linhas.push(['Data', 'Indústria', 'Produto', 'Quantidade', 'Valor']);
      (c.historico_compras || []).forEach(h => linhas.push([h.data, h.industria, h.produto, h.quantidade, h.valor.toFixed(2).replace('.', ',')]));

      const csv = linhas.map(l => l.map(v => `"${String(v ?? '').replace(/"/g, '""')}"`).join(';')).join('\n');
      const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `raiox_cliente_${c.estado}_${c.codcli}_${c.nome.replace(/[^a-z0-9]+/gi, '_')}.csv`;
      a.click();
      URL.revokeObjectURL(url);
    }

    document.getElementById('conteudo').innerHTML = '<div class="sem-selecao">Busque um cliente pelo nome acima para ver o Raio X completo.</div>';

    const chaveUrl = params.get('chave');
    if (chaveUrl) {
      selecionarCliente(chaveUrl);
    } else if (temFiltro()) {
      renderListaFiltrada();
    }
  </script>
</body>
</html>
