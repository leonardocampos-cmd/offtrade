  // ── Seção: Metas ──────────────────────────────────────────
  const metasHtml = `
    <div class="detail-card">
      <div class="sec-header" onclick="toggleSec('sec-metas')">
        <div class="sec-title" style="color:var(--accent)">Objetivos</div>
        <span id="sec-metas-ic" class="sec-ic open">&#9660;</span>
      </div>
      <div id="sec-metas" class="sec-body open">
        <div class="metas-grid" style="margin-top:12px">
          ${_metaKpi('Faturamento', m('fat_tt') > 0 ? r('fat_tt') : _fatVendasMes(v.nome, mes), m('fat_tt'), 'fat', _cmpMesAnterior(v, mes, 'fat_tt', 'fat'))}
          ${_metaKpi('Positivação', m('pos_tt') > 0 ? r('pos_tt') : _posVendasMes(v.nome, mes), m('pos_tt'), 'pos', _cmpMesAnterior(v, mes, 'pos_tt', 'pos'))}
          ${_statKpi('Indústrias', r('industrias'), _cmpMesAnterior(v, mes, 'industrias', 'pos'))}
        </div>
        ${_necHtml('fat_tt', fmtFat)}
        ${_necHtml('pos_tt', v2 => Number(v2).toFixed(1) + ' clientes')}
        <div class="stat-row">
          <span class="stat-label">Cadastros no mês</span>
          <span class="stat-val">${v.clientes_cadastrados || 0}</span>
        </div>
        ${m('fat_castas')          > 0 ? buildBar('Castas',          r('fat_castas'),          m('fat_castas'),          'fat') : ''}
        ${m('fat_hob_azeite')      > 0 ? buildBar('HOB + Azeite',    r('fat_hob_azeite'),      m('fat_hob_azeite'),      'fat') : ''}
        ${m('fat_domecq_passport') > 0 ? buildBar('Domecq+Passport', r('fat_domecq_passport'), m('fat_domecq_passport'), 'fat') : ''}
        ${m('fat_pernod')          > 0 ? buildBar('Fat. Pernod',     r('fat_pernod'),          m('fat_pernod'),          'fat') : ''}
        ${m('pos_hob_azeite')      > 0 ? buildBar('Pos. HOB+Azeite', r('pos_hob_azeite'),      m('pos_hob_azeite'),      'pos') : ''}
        ${m('pos_essenza_hob')     > 0 ? buildBar('Pos. Essenza+HOB',r('pos_essenza_hob'),     m('pos_essenza_hob'),     'pos') : ''}
        ${m('pos_reckit')          > 0 ? buildBar('Pos. Reckitt',    r('pos_reckit'),          m('pos_reckit'),          'pos') : ''}
        ${m('pos_crusoe')          > 0 ? buildBar('Pos. Crusoe',     r('pos_crusoe'),          m('pos_crusoe'),          'pos') : ''}
        ${m('pos_tatuzinho')       > 0 ? buildBar('Pos. Tatuzinho',  r('pos_tatuzinho'),       m('pos_tatuzinho'),       'pos') : ''}
        ${m('pos_tial')            > 0 ? buildBar('Pos. Tial',       r('pos_tial'),            m('pos_tial'),            'pos') : ''}
        ${m('pos_redbull')         > 0 ? buildBar('Pos. Red Bull',   r('pos_redbull'),         m('pos_redbull'),         'pos') : ''}
        ${m('pos_pinatti')         > 0 ? buildBar('Pos. Pinatti',    r('pos_pinatti'),         m('pos_pinatti'),         'pos') : ''}
      </div>
    </div>`;

  // ── Seção: Faturamento do mês ─────────────────────────────
  const _vendas  = _ordenarVendasDesc(_vendasDoMes(v.nome, mes));
  // KPIs contam só vendas válidas — devolvidas/canceladas/cortadas ficam
  // visíveis na tabela (destacadas por cor, agrupadas por pedido) mas não
  // entram no faturamento/clientes/itens do topo, senão uma venda já
  // estornada infla esses números.
  const _vendasValidas = _vendas.filter(x => !x.devolvido && !x.cancelado && !x.cancelado_parcial);
  const _fatVend = _vendasValidas.reduce((s, x) => s + x.valor, 0);
  const _nCli    = new Set(_vendasValidas.filter(x => x.offtrade).map(x => x.codcli || x.cliente)).size;
  const _nItens  = _vendasValidas.reduce((s, x) => s + x.qt, 0);
  const _pedidos = _ordenarPedidosDesc(_agruparPedidos(_vendas));

  const vendasHtml = `
    <div class="detail-card">
      <div class="sec-header" onclick="toggleSec('sec-fat')">
        <div>
          <div class="sec-title" style="color:var(--green)">Faturamento do mês</div>
          <div class="sec-meta">${fmtFat(_fatVend)} &middot; ${_nCli} clientes</div>
        </div>
        <span id="sec-fat-ic" class="sec-ic open">&#9660;</span>
      </div>
      <div id="sec-fat" class="sec-body open">
        <div class="vendas-kpis" style="margin-top:12px">
          <div><div class="kpi-label">Faturamento</div><div class="kpi-val">${fmtFat(_fatVend)}</div></div>
          <div><div class="kpi-label">Clientes</div><div class="kpi-val">${_nCli}</div></div>
          <div><div class="kpi-label">Itens</div><div class="kpi-val">${_nItens.toLocaleString('pt-BR')}</div></div>
        </div>
        ${buildPedidosTable(_pedidos)}
        ${_vendas.length > 0 ? `<div style="text-align:right;margin-top:10px"><button class="btn btn-dl" onclick="exportarVendasCSV('${v.nome}', '${mes}')">&#8595; Baixar CSV</button></div>` : ''}
      </div>
    </div>`;

  // ── Seção: Campanhas ──────────────────────────────────────
  const _campConteudo = buildAllCampanhas(v) + buildAmarulaDetail(v, mes) + buildMovingDetail(v, mes) + buildCrusoeDetail(v, mes);
  const campanhasHtml = _campConteudo.trim().length > 80 ? `
    <div class="detail-card">
      <div class="sec-header" onclick="toggleSec('sec-camp')">
        <div class="sec-title" style="color:var(--yellow)">Campanhas</div>
        <span id="sec-camp-ic" class="sec-ic open">&#9660;</span>
      </div>
      <div id="sec-camp" class="sec-body open">${_campConteudo}</div>
    </div>` : '';

  // ── Seção: Não positivados ────────────────────────────────
  const _npList = (v.nao_positivados || []).filter(c => {
    const _comprou = new Set(_vendasDoMes(v.nome, mes).filter(s => !s.devolvido && !s.cancelado && !s.cancelado_parcial).map(s => s.cliente.trim().toUpperCase()));
    return !_comprou.has((c.CLIENTE || '').trim().toUpperCase());
  });
  const _nNP = _npList.length;
  const _nCad = v.clientes_cadastrados || 0;
  const npHtml = `
    <div class="detail-card">
      <div class="sec-header" onclick="toggleSec('sec-np')">
        <div>
          <div class="sec-title" style="color:var(--red)">N&atilde;o positivados</div>
          <div class="sec-meta" style="color:${_nNP > 0 ? 'var(--red)' : 'var(--green)'}">
            ${_nNP > 0 ? _nNP + ' cliente' + (_nNP !== 1 ? 's' : '') : 'Todos positivados &#10003;'}${_nCad > 0 ? ` &middot; ${_nNP}/${_nCad} cadastrados` : ''}
          </div>
        </div>
        <span id="sec-np-ic" class="sec-ic open">&#9660;</span>
      </div>
      <div id="sec-np" class="sec-body open">${buildNaoPosTable(_npList)}</div>
    </div>`;

  // ── Seção: Histórico ─────────────────────────────────────
  const historicoHtml = `
    <div class="detail-card">
      <div class="sec-header" onclick="toggleSec('sec-hist')">
        <div class="sec-title">Hist&oacute;rico</div>
        <span id="sec-hist-ic" class="sec-ic">&#9660;</span>
      </div>
      <div id="sec-hist" class="sec-body">
        ${buildPrevisao(v, pm)}
        <div class="chart-wrap" style="margin-top:14px"><canvas id="chart-fat"></canvas></div>
        <div class="chart-wrap" style="margin-top:12px"><canvas id="chart-pos"></canvas></div>
      </div>
    </div>`;

  document.getElementById('app').innerHTML = `
    <div class="detail-header">
      <div>
        <div class="detail-name">${v.nome}</div>
        <div class="detail-rca">RCA ${v.rca}</div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn" onclick="voltarParaTodos()">&#8592; Todos</button>
      </div>
    </div>
    ${_buildAvisoPedidos(v.nome)}
    ${metasHtml}
    ${vendasHtml}
    ${campanhasHtml}
    ${historicoHtml}
    ${npHtml}`;

  buildCharts(v);
}

// ── Campanhas ─────────────────────────────────────────────

const CAMPANHAS = [
  {
    nome: 'Campanha PERNOD',
    mes: 'Mai/26',
    metricas: [
      {
        nome: 'SKUs distintos vendidos',
        campo: 'bonus_pernod',
        tipo: 'pos',
        tipo_premio: 'direto',
      },
    ],
  },
];

function buildPernodDashboardHTML(realiz) {
  var INV_TOTAL  = 26400;
  var META_POS   = 400;
  var META_TDP   = 1320;
  var META_SKU   = META_TDP / META_POS;
  var posPernod  = realiz ? realiz.posPernod  : 0;
  var paresCount = realiz ? realiz.paresCount : 0;
  var skuPDV     = posPernod > 0 ? paresCount / posPernod : 0;
  var custoPDV   = (INV_TOTAL / META_POS).toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
  var fmtN = v => v.toLocaleString('pt-BR');
  var fmtF = (v, d) => v.toLocaleString('pt-BR', {minimumFractionDigits:d, maximumFractionDigits:d});
  return `
    <div class="pernod-dash">
      <div class="pernod-kpis">
        <div class="pernod-kpi">
          <div class="pernod-kpi-label">Positivação</div>
          <div class="pernod-kpi-val">${fmtN(posPernod)}</div>
          <div class="pernod-kpi-sub">de ${fmtN(META_POS)} objetivo</div>
        </div>
        <div class="pernod-kpi">
          <div class="pernod-kpi-label">TDP</div>
          <div class="pernod-kpi-val">${fmtN(paresCount)}</div>
          <div class="pernod-kpi-sub">de ${fmtN(META_TDP)} objetivo</div>
        </div>
        <div class="pernod-kpi">
          <div class="pernod-kpi-label">SKUs / PDV</div>
          <div class="pernod-kpi-val">${fmtF(skuPDV, 1)}</div>
          <div class="pernod-kpi-sub">objetivo ${fmtF(META_SKU, 1)}</div>
        </div>
      </div>
      <div class="pernod-efic">
        <div>
          <div class="pernod-efic-title">Custo médio por PDV positivado</div>
          <div class="pernod-efic-formula">R$ 26.400 ÷ 400 PDVs</div>
        </div>
        <div class="pernod-efic-val">R$ ${custoPDV}</div>
      </div>
      <hr class="pernod-sep">
      <div class="pernod-rank-title">Bônus por vendedor</div>
    </div>`;
}

function _campanhaGatilhoBar(totalEquipe, m) {
  const p   = Math.min((totalEquipe / m.gatilho) * 100, 100);
  const cls = p >= 100 ? 'green' : p >= 70 ? 'yellow' : 'red';
  const gatilhoLabel = m.tipo === 'fat' ? fmtFat(m.gatilho) : fmtPos(m.gatilho);
  const totalLabel   = m.tipo === 'fat' ? fmtFat(totalEquipe) : fmtPos(totalEquipe);
  const gatilhoOk    = totalEquipe >= m.gatilho;
  return `
    <div class="campanha-gatilho-bar">
      <div class="campanha-gatilho-label">
        <span class="campanha-gatilho-txt">Equipe: ${totalLabel} / ${gatilhoLabel}</span>
        ${gatilhoOk ? '<span class="campanha-gatilho-ok">Gatilho atingido</span>' : `<span class="campanha-gatilho-val pct-${cls}">${p.toFixed(0)}%</span>`}
      </div>
      <div class="bar-bg">
        <div class="bar-fill bar-${cls}" style="width:${p}%"></div>
      </div>
    </div>`;
}

function buildCampanha(mes) {
  const camps = CAMPANHAS.filter(c => c.mes === mes);
  if (!camps.length) return '';

  const medals = ['🥇', '🥈', '🥉'];
  const vendedores = METAS_DATA.vendedores;

  return camps.map(camp => {
    const cols = camp.metricas.map(m => {
      const _campGatilhoCampo = m.gatilho_campo || m.campo;
      const totalEquipe = vendedores.reduce((acc, v) => acc + _mv(_pm(v, mes), m.campo, 'realizado'), 0);
      const totalGatilho = vendedores.reduce((acc, v) => acc + _mv(_pm(v, mes), _campGatilhoCampo, 'realizado'), 0);
      const gatilhoOk   = m.gatilho != null ? totalGatilho >= m.gatilho : true;
      const barHtml     = m.gatilho != null ? _campanhaGatilhoBar(totalGatilho, {...m, tipo: m.gatilho_campo ? 'pos' : m.tipo}) : '';

      let rankHtml = '';

      if (m.tipo_premio === 'direto') {
        const isPernod = camp.nome.includes('PERNOD') && typeof VENDAS_DATA !== 'undefined';

        if (isPernod) {
          // Calcula live de VENDAS_DATA por vendedor (igual ao SP)
          const _vendorStats = vendedores.map(v => {
            const vendas     = (VENDAS_DATA.por_vendedor[v.nome] || {})[mes] || [];
            const pernodVend = vendas.filter(s => s.offtrade && s.fantasia && s.fantasia.toUpperCase().includes('PERNOD'));
            const paresMap   = new Map();
            for (const sv of pernodVend) {
              const key = `${sv.codcli}|${sv.produto}`;
              if (!paresMap.has(key)) paresMap.set(key, sv.produto);
            }
            let bonus = 0;
            for (const [, prod] of paresMap) bonus += prod.toUpperCase().includes('JAMERSON') ? 10 : 5;
            return { nome: v.nome, bonus, pares: paresMap.size, posPernod: new Set(pernodVend.map(s => s.codcli)).size };
          });

          const todaPernod  = vendedores.flatMap(v =>
            ((VENDAS_DATA.por_vendedor[v.nome] || {})[mes] || [])
            .filter(s => s.offtrade && s.fantasia && s.fantasia.toUpperCase().includes('PERNOD'))
          );
          const _posPernod  = new Set(todaPernod.map(s => s.codcli)).size;
          const _paresCount = new Set(todaPernod.map(s => `${s.codcli}|${s.produto}`)).size;

          const participantes = _vendorStats.filter(v => v.bonus > 0).sort((a, b) => b.bonus - a.bonus);

          rankHtml = buildPernodDashboardHTML({posPernod: _posPernod, paresCount: _paresCount})
            + (participantes.length === 0
              ? `<div class="campanha-rank-fora">Nenhum bônus PERNOD registrado ainda.</div>`
              : participantes.map((p, i) => `
                <div class="campanha-ranking-row">
                  <span class="campanha-medal">${['🥇','🥈','🥉'][i] || ''}</span>
                  <span class="campanha-rank-nome">${p.nome}</span>
                  <span class="campanha-rank-val">${p.pares} SKUs &middot; ${p.posPernod} PDVs</span>
                  <span class="campanha-rank-prize">R$\u00a0${p.bonus.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})}</span>
                </div>`).join(''));

        } else {
          const participantes = vendedores
            .map(v => ({ nome: v.nome, val: _mv(_pm(v, mes), m.campo, 'realizado') }))
            .filter(p => p.val > 0)
            .sort((a, b) => b.val - a.val);

          rankHtml = participantes.length === 0
            ? `<div class="campanha-rank-fora">Nenhum bônus registrado ainda.</div>`
            : participantes.map((p, i) => `
              <div class="campanha-ranking-row">
                <span class="campanha-medal">${['🥇','🥈','🥉'][i] || ''}</span>
                <span class="campanha-rank-nome">${p.nome}</span>
                <span class="campanha-rank-prize">R$\u00a0${p.val.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})}</span>
              </div>`).join('');
        }

      } else if (m.tipo_premio === 'ranking') {
        let participantes = vendedores.map(v => ({
          nome: v.nome,
          val:  _mv(_pm(v, mes), m.campo, 'realizado'),
        }));
        if (m.min_participar !== null) participantes = participantes.filter(p => p.val >= m.min_participar);
        participantes.sort((a, b) => b.val - a.val);

        rankHtml = participantes.length === 0
          ? `<div class="campanha-rank-fora">Nenhum vendedor atingiu o mínimo de ${m.min_participar} PDVs.</div>`
          : participantes.slice(0, 3).map((p, i) => {
              const valFmt = m.tipo === 'fat' ? fmtFat(p.val) : fmtPos(p.val);
              return `
              <div class="campanha-ranking-row">
                <span class="campanha-medal">${medals[i]}</span>
                <span class="campanha-rank-nome">${p.nome}</span>
                <span class="campanha-rank-val">${valFmt}</span>
                ${m.premios[i] ? `<span class="campanha-rank-prize">R$\u00a0${m.premios[i]}</span>` : ''}
              </div>`;
            }).join('');

      } else if (m.tipo_premio === 'pct_meta') {
        const rows = vendedores.map(v => {
          const val      = _mv(_pm(v, mes), m.campo, 'realizado');
          const metaInd  = (m.metas_individuais || {})[v.rca] || 0;
          const pct_val  = metaInd > 0 ? Math.min((val / metaInd) * 100, 999) : 0;
          const cls2     = pct_val >= 100 ? 'green' : pct_val >= 70 ? 'yellow' : 'red';
          const atingiu  = val >= metaInd && metaInd > 0;
          const premio   = atingiu && gatilhoOk ? (val * m.premio_pct / 100) : null;
          return { nome: v.nome, val, metaInd, pct_val, cls2, atingiu, premio };
        }).sort((a, b) => b.pct_val - a.pct_val);

        rankHtml = `<div style="margin-top:8px">` + rows.map(r => {
          const valFmt   = fmtFat(r.val);
          const metaFmt  = fmtFat(r.metaInd);
          const pctDisp  = r.pct_val > 999 ? '>999' : r.pct_val.toFixed(0);
          const premioHtml = r.premio !== null
            ? `<span class="campanha-rank-prize">R$\u00a0${r.premio.toLocaleString('pt-BR', {minimumFractionDigits:2,maximumFractionDigits:2})}</span>`
            : `<span class="campanha-rank-val pct-${r.cls2}">${pctDisp}%</span>`;
          return `
          <div class="campanha-ranking-row">
            <span class="campanha-medal">${r.atingiu ? '✅' : '　'}</span>
            <span class="campanha-rank-nome">${r.nome}</span>
            <span class="campanha-rank-val" style="font-size:0.72rem">${valFmt} / ${metaFmt}</span>
            ${premioHtml}
          </div>`;
        }).join('') + `</div>`;
      }

      return `
        <div>
          <div class="campanha-col-title">${m.nome}</div>
          ${barHtml}
          <div class="campanha-ranking">${rankHtml}</div>
        </div>`;
    }).join('');

    const colsClass = camp.metricas.length === 1 ? '' : 'campanha-cols';
    return `
      <div class="campanha-card">
        <div class="campanha-header">
          <span class="campanha-badge">Campanha</span>
          <span class="campanha-nome">${camp.nome}</span>
        </div>
        <div class="${colsClass}">${cols}</div>
      </div>`;
  }).join('');
}

function buildCampanhaDetail(v, mes) {
  const camps = CAMPANHAS.filter(c => c.mes === mes);
  if (!camps.length) return '';

  const medals    = ['🥇', '🥈', '🥉'];
  const vendedores = METAS_DATA.vendedores;

  return camps.map(camp => {
    const rows = camp.metricas.map(m => {
      const val        = _mv(_pm(v, mes), m.campo, 'realizado');
      const _detGatilhoCampo = m.gatilho_campo || m.campo;
      const totalEquipe  = vendedores.reduce((acc, vv) => acc + _mv(_pm(vv, mes), m.campo, 'realizado'), 0);
      const totalGatilho = vendedores.reduce((acc, vv) => acc + _mv(_pm(vv, mes), _detGatilhoCampo, 'realizado'), 0);
      const gatilhoOk  = m.gatilho != null ? totalGatilho >= m.gatilho : true;
      const valFmt     = m.tipo === 'fat' ? fmtFat(val) : fmtPos(val);

      const gatilhoTag = m.gatilho != null
        ? (gatilhoOk
            ? `<span style="font-size:0.65rem;font-weight:700;background:var(--green);color:#000;border-radius:4px;padding:1px 6px">GATILHO: ATIVADO</span>`
            : `<span style="font-size:0.65rem;font-weight:700;background:var(--red);color:#fff;border-radius:4px;padding:1px 6px">GATILHO: DESATIVADO</span>`)
        : '';

      let posicaoHtml = '';
      let premioHtml  = '';

      if (m.tipo_premio === 'direto') {
        const isPernodDet = camp.nome.includes('PERNOD') && typeof VENDAS_DATA !== 'undefined';
        if (isPernodDet) {
          const pv = ((VENDAS_DATA.por_vendedor[v.nome] || {})[mes] || [])
            .filter(s => s.offtrade && s.fantasia && s.fantasia.toUpperCase().includes('PERNOD'));
          const paresMap = new Map();
          for (const sv of pv) {
            const key = `${sv.codcli}|${sv.produto}`;
            if (!paresMap.has(key)) paresMap.set(key, sv.produto);
          }
          let bonus = 0;
          for (const [, prod] of paresMap) bonus += prod.toUpperCase().includes('JAMERSON') ? 10 : 5;
          const pares     = paresMap.size;
          const posPernod = new Set(pv.map(s => s.codcli)).size;
          posicaoHtml = pares > 0
            ? `<span style="font-weight:700;color:var(--text)">${pares} SKUs · ${posPernod} PDVs</span>`
            : `<span class="campanha-rank-fora">Sem vendas Pernod ainda</span>`;
          if (bonus > 0) {
            premioHtml = `<span class="campanha-rank-prize">R$\u00a0${bonus.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})}</span>`;
          }
        } else {
          posicaoHtml = val > 0
            ? `<span style="font-weight:700;color:var(--text)">Bônus acumulado</span>`
            : `<span class="campanha-rank-fora">Sem bônus ainda</span>`;
          if (val > 0) {
            premioHtml = `<span class="campanha-rank-prize">R$\u00a0${val.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})}</span>`;
          }
        }

      } else if (m.tipo_premio === 'ranking') {
        let participantes = vendedores.map(vv => ({
          nome: vv.nome, val: _mv(_pm(vv, mes), m.campo, 'realizado'),
        }));
        if (m.min_participar !== null) participantes = participantes.filter(p => p.val >= m.min_participar);
        participantes.sort((a, b) => b.val - a.val);
        const pos = participantes.findIndex(p => p.nome === v.nome);

        if (m.min_participar !== null && val < m.min_participar) {
          posicaoHtml = `<span class="campanha-rank-val">${valFmt}</span><span class="campanha-rank-fora">Fora (mín. ${m.min_participar} — faltam ${m.min_participar - val})</span>`;
        } else if (pos >= 0 && pos < 3) {
          posicaoHtml = `<span class="campanha-rank-val">${valFmt}</span><span style="font-weight:700">${medals[pos]} ${pos + 1}º lugar</span>`;
          if (gatilhoOk) premioHtml = `<span class="campanha-rank-prize">R$\u00a0${m.premios[pos]}</span>`;
        } else if (pos >= 0) {
          posicaoHtml = `<span class="campanha-rank-val">${valFmt}</span><span style="color:var(--muted)">${pos + 1}º lugar</span>`;
        } else {
          posicaoHtml = `<span class="campanha-rank-fora">Sem vendas</span>`;
        }

      } else if (m.tipo_premio === 'pct_meta') {
        const metaInd = (m.metas_individuais || {})[v.rca] || 0;
        const pct_val = metaInd > 0 ? (val / metaInd) * 100 : 0;
        const pctDisp = pct_val > 999 ? '>999' : pct_val.toFixed(0);
        const cls2    = pct_val >= 100 ? 'green' : pct_val >= 70 ? 'yellow' : 'red';
        const atingiu = val >= metaInd && metaInd > 0;

        posicaoHtml = metaInd === 0
          ? `<span class="campanha-rank-fora">Sem objetivo definido</span>`
          : `<span class="campanha-rank-val">${fmtFat(val)} / ${fmtFat(metaInd)}</span>
             <span class="metric-pct pct-${cls2}" style="font-size:0.75rem">${pctDisp}%</span>`;

        if (atingiu && gatilhoOk) {
          const premio = val * m.premio_pct / 100;
          premioHtml = `<span class="campanha-rank-prize">R$\u00a0${premio.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})}</span>`;
        }
      }

      return `
        <div class="campanha-detail-row">
          <span style="color:var(--muted);font-size:0.78rem">${m.nome}</span>
          <span style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end">
            ${posicaoHtml}${premioHtml ? premioHtml : ''}${gatilhoTag}
          </span>
        </div>`;
    }).join('');

    return `
      <div class="campanha-detail-box">
        <div class="campanha-detail-title">${camp.nome}</div>
        ${rows}
      </div>`;
  }).join('');
}

function buildAllCampanhas(v) {
  return buildCampanhaDetail(v, _getMes());
}

const _AMARULA_MESES = ['Mai/26', 'Jun/26']; // período 25/05–25/06

function buildAmarulaDetail(v, mes) {
  if (typeof AMARULA_DATA === 'undefined') return '';
  if (mes && !_AMARULA_MESES.includes(mes)) return '';
  const medals = ['🥇', '🥈', '🥉'];

  const posIdx = AMARULA_DATA.ranking_positivacao.findIndex(r => r.vendedor === v.nome);
  const fatIdx = AMARULA_DATA.ranking_faturamento.findIndex(r => r.vendedor === v.nome);
  if (posIdx < 0 && fatIdx < 0) return '';

  function rankSpan(idx) {
    if (idx < 0) return '';
    const pos = idx < 3 ? medals[idx] + ' ' + (idx + 1) + 'º' : (idx + 1) + 'º';
    return `<span style="font-weight:700">${pos} lugar</span>`;
  }
  function prizeSpan(idx) {
    return idx === 0 ? `<span class="campanha-rank-prize">R$ 3.000</span>` : '';
  }

  const rows = [];
  if (posIdx >= 0) {
    const val = AMARULA_DATA.ranking_positivacao[posIdx].valor;
    rows.push(`
      <div class="campanha-detail-row">
        <span style="color:var(--muted);font-size:0.78rem">Positivação</span>
        <span style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end">
          <span class="campanha-rank-val">${val.toLocaleString('pt-BR')} PDVs</span>
          ${rankSpan(posIdx)}${prizeSpan(posIdx)}
        </span>
      </div>`);
  }
  if (fatIdx >= 0) {
    const val = AMARULA_DATA.ranking_faturamento[fatIdx].valor;
    rows.push(`
      <div class="campanha-detail-row">
        <span style="color:var(--muted);font-size:0.78rem">Faturamento</span>
        <span style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end">
          <span class="campanha-rank-val">${fmtFat(val)}</span>
          ${rankSpan(fatIdx)}${prizeSpan(fatIdx)}
        </span>
      </div>`);
  }

  return `
    <div class="campanha-detail-box" style="border-color:#d4962a55;background:#1c1810">
      <div class="campanha-detail-title" style="color:#d4962a">Campanha Amarula &middot; 25/05–25/06</div>
      ${rows.join('')}
    </div>`;
}

const _MOVING_METAS_IND = {
  '156':33000,'275':11000,'431':11000,'144':4000,'378':11000,
  '412':6000,'153':8000,'238':5000,'419':7000,'439':3000,
  '417':5000,'379':4000,'450':6000,'471':3000,'158':3000,
  '420':0
};
const _MOVING_GATILHO  = 120000;
const _MOVING_CAMP_INI = new Date(2026, 5,  1); // 01/06/2026
const _MOVING_CAMP_FIM = new Date(2026, 5, 30); // 30/06/2026
const _MOVING_MESES    = ['Jun/26'];

function _movingFatCamp(nomeVendedor) {
  const vd = (typeof VENDAS_DATA !== 'undefined') ? VENDAS_DATA : null;
  if (!vd) return 0;
  let total = 0;
  for (const mes of _MOVING_MESES) {
    const itens = (vd.por_vendedor[nomeVendedor] || {})[mes] || [];
    for (const it of itens) {
      if (it.tipo !== 'Venda') continue;
      if (!(it.produto || '').toUpperCase().includes('MOVING')) continue;
      const [d, m, y] = it.data.split('/').map(Number);
      const dt = new Date(y, m - 1, d);
      if (dt >= _MOVING_CAMP_INI && dt <= _MOVING_CAMP_FIM) total += it.valor || 0;
    }
  }
  return total;
}

function buildMovingDetail(v, mes) {
  if (mes && !_MOVING_MESES.includes(mes)) return '';
  if (_MOVING_METAS_IND[v.rca] === undefined) return '';
  const fatReal = _movingFatCamp(v.nome);
  const metaInd = _MOVING_METAS_IND[v.rca];
  const pctVal  = metaInd > 0 ? (fatReal / metaInd) * 100 : 0;
  const pctDisp = pctVal > 999 ? '>999' : pctVal.toFixed(0);
  const cls     = pctVal >= 100 ? 'green' : pctVal >= 70 ? 'yellow' : 'red';

  const totalEquipe = (METAS_DATA.vendedores || [])
    .filter(vv => _MOVING_METAS_IND[vv.rca] !== undefined)
    .reduce((s, vv) => s + _movingFatCamp(vv.nome), 0);
  const gatilhoOk  = totalEquipe >= _MOVING_GATILHO;
  const gatilhoPct = Math.min((totalEquipe / _MOVING_GATILHO) * 100, 100);
  const gCls       = gatilhoPct >= 100 ? 'green' : gatilhoPct >= 70 ? 'yellow' : 'red';
  const premio     = gatilhoOk ? fatReal * 0.05 : null;

  return `
    <div class="campanha-detail-box" style="border-color:#10b98155;background:#0c1f18">
      <div class="campanha-detail-title" style="color:#10b981">Campanha Moving &middot; 01/06–30/06/2026</div>
      <div class="campanha-detail-row">
        <span style="color:var(--muted);font-size:0.78rem">Fat. Moving · Objetivo ${fmtFat(metaInd)}</span>
        <span style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end">
          <span class="campanha-rank-val">${fmtFat(fatReal)}</span>
          <span class="metric-pct pct-${cls}" style="font-size:0.7rem">${pctDisp}%</span>
          ${premio !== null ? `<span class="campanha-rank-prize" style="color:#10b981">R$ ${premio.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})}</span>` : ''}
        </span>
      </div>
      <div class="campanha-detail-row">
        <span style="color:var(--muted);font-size:0.72rem">Gatilho equipe ${fmtFat(totalEquipe)} / ${fmtFat(_MOVING_GATILHO)}</span>
        ${gatilhoOk
          ? `<span style="font-size:0.65rem;font-weight:700;background:#10b981;color:#000;border-radius:4px;padding:1px 6px">GATILHO: ATIVADO</span>`
          : `<span style="font-size:0.65rem;font-weight:700;background:var(--red);color:#fff;border-radius:4px;padding:1px 6px">GATILHO: ${gatilhoPct.toFixed(0)}%</span>`}
      </div>
      <div class="bar-bg" style="margin-top:5px">
        <div class="bar-fill bar-${gCls}" style="width:${gatilhoPct}%"></div>
      </div>
    </div>`;
}

function buildCrusoeDetail(v, mes) {
  if (typeof CRUSOE_DATA === 'undefined') return '';
  const periodoMeses = ['Jul/26', 'Ago/26'];
  if (mes && !periodoMeses.includes(mes)) return '';

  let time = null, entry = null, idx = -1;
  for (const t of CRUSOE_DATA.times) {
    const i = t.vendedores.findIndex(x => String(x.rca) === String(v.rca));
    if (i >= 0) { time = t; entry = t.vendedores[i]; idx = i; break; }
  }
  if (!entry) return '';

  const medals  = ['🥇', '🥈', '🥉'];
  const rankTxt = idx < 3 ? `${medals[idx]} ${idx + 1}º lugar` : `${idx + 1}º lugar`;
  const prizeSpan = idx === 0 ? `<span class="campanha-rank-prize">${fmtFat(time.premio)}</span>` : '';

  const rows = [];
  function linha(label, valor) {
    rows.push(`<div class="campanha-detail-row"><span style="color:var(--muted);font-size:0.78rem">${label}</span><span>${valor}</span></div>`);
  }

  if (time.id === 'KEY_ACCOUNT') {
    linha('Pedidos', `${entry.pedidos} <span style="color:var(--muted);font-size:.72rem">(${entry.pontos_pedidos} pts)</span>`);
    linha('Novos SKUs', `${entry.novos_skus} <span style="color:var(--muted);font-size:.72rem">(${entry.pontos_novos_skus} pts)</span>`);
    linha('Reativações', `${entry.reativacoes} <span style="color:var(--muted);font-size:.72rem">(${entry.pontos_reativacoes} pts)</span>`);
    if (entry.meta_definida) {
      linha('Objetivo faturamento', `${entry.meta_atingida ? '✓ batida' : 'não batida'} <span style="color:var(--muted);font-size:.72rem">(${entry.pontos_meta} pts)</span>`);
    }
  } else if (time.id === 'ATACAREJO') {
    linha('Positivações', `${entry.positivacoes} <span style="color:var(--muted);font-size:.72rem">(${entry.pontos_positivacao} pts)</span>`);
    linha('Novos SKUs', `${entry.novos_skus} <span style="color:var(--muted);font-size:.72rem">(${entry.pontos_novos_skus} pts)</span>`);
    linha('Pontos por valor de pedido', `${entry.pontos_pedidos_valor} pts`);
  } else {
    linha('Clientes Linha Gourmet', entry.clientes_gourmet);
    linha('Fat. Linha Gourmet', fmtFat(entry.faturamento_gourmet));
  }
  linha('Faturamento Crusoe', fmtFat(entry.faturamento));

  return `
    <div class="campanha-detail-box" style="border-color:#8b5cf655;background:#160f24">
      <div class="campanha-detail-title" style="color:#a78bfa">Campanha Robinson Crusoe &middot; ${time.nome} &middot; ${CRUSOE_DATA.periodo.ini}–${CRUSOE_DATA.periodo.fim}</div>
      ${rows.join('')}
      <div class="campanha-detail-row">
        <span style="font-weight:700">Total de pontos</span>
        <span style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end">
          <span class="campanha-rank-val">${entry.pontos_total} pts</span>
          <span style="font-weight:700">${rankTxt}</span>
          ${prizeSpan}
        </span>
      </div>
    </div>`;
}

// ── Filtro Gerente / Supervisor ───────────────────────────────────────────────

const _ESTADO_ATUAL = 'RJ';

let _filtroGerente    = '';
let _filtroSupervisor = '';

function _estadosAtuais() {
  if (typeof GERENTES_DATA === 'undefined') return [];
  return GERENTES_DATA.estados.filter(e => e.nome === _ESTADO_ATUAL);
}

function _getGerentes() {
  const set = new Set();
  for (const est of _estadosAtuais())
    for (const g of est.gerentes)
      if (g.nome && g.nome !== 'Sem Gerente') set.add(g.nome);
  return [...set].sort();
}

function _getSupervisores(gerente) {
  const set = new Set();
  for (const est of _estadosAtuais())
    for (const g of est.gerentes) {
      if (gerente && g.nome !== gerente) continue;
      for (const s of g.supervisores)
        if (s.nome && s.nome !== 'Sem Supervisor') set.add(s.nome);
    }
  return [...set].sort();
}

function _vendedoresFiltrados() {
  if ((!_filtroGerente && !_filtroSupervisor) || typeof GERENTES_DATA === 'undefined')
    return METAS_DATA.vendedores;
  const nomes = new Set();
  for (const est of _estadosAtuais())
    for (const g of est.gerentes) {
      if (_filtroGerente && g.nome !== _filtroGerente) continue;
      for (const s of g.supervisores) {
        if (_filtroSupervisor && s.nome !== _filtroSupervisor) continue;
        for (const v of s.vendedores) nomes.add(v.nome);
      }
    }
  return METAS_DATA.vendedores.filter(v => nomes.has(v.nome));
}

function _updateSupervisorOpts() {
  const sel = document.getElementById('fil-sup');
  if (!sel) return;
  const sups = _getSupervisores(_filtroGerente);
  sel.innerHTML = '<option value="">Todos os supervisores</option>'
    + sups.map(s => `<option value="${s}" ${s === _filtroSupervisor ? 'selected' : ''}>${s}</option>`).join('');
  if (!sups.includes(_filtroSupervisor)) _filtroSupervisor = '';
}

function _aplicarFiltro(mes) {
  mes = mes || _getMes();
  _mesSel = mes;
  const filtrados = _vendedoresFiltrados();
  document.getElementById('equipe-resumo-wrap').innerHTML = _buildResumoEquipe(filtrados, mes);
  document.getElementById('cards-grid').innerHTML = _buildCards(filtrados, mes);
  _updateSupervisorOpts();
}

function _buildResumoEquipe(vendedores, mes) {
  const totalFat = vendedores.reduce((s, v) => {
    const pm   = _pm(v, mes);
    const fatM = _mv(pm, 'fat_tt', 'meta');
    return s + (fatM > 0 ? _mv(pm, 'fat_tt', 'realizado') : _fatVendasMes(v.nome, mes));
  }, 0);
  const totalFatMeta = vendedores.reduce((s, v) => s + _mv(_pm(v, mes), 'fat_tt', 'meta'), 0);
  const totalPos = vendedores.reduce((s, v) => s + _mv(_pm(v, mes), 'pos_tt', 'realizado'), 0);
  const totalPosMeta = vendedores.reduce((s, v) => s + _mv(_pm(v, mes), 'pos_tt', 'meta'), 0);
  const totalCad = vendedores.reduce((s, v) => s + (v.clientes_cadastrados || 0), 0);
  return `
    <div class="vendas-resumo" style="margin-bottom:18px">
      <div class="vendas-resumo-box">
        <div class="vendas-resumo-label">Faturamento Total</div>
        <div class="vendas-resumo-val">${fmtFat(totalFat)}</div>
        ${totalFatMeta ? `<div style="font-size:.7rem;color:var(--muted);margin-top:2px">Objetivo: ${fmtFat(totalFatMeta)}</div>` : ''}
      </div>
      <div class="vendas-resumo-box">
        <div class="vendas-resumo-label">Positivação</div>
        <div class="vendas-resumo-val">${fmtPos(totalPos)} clientes</div>
        ${totalPosMeta ? `<div style="font-size:.7rem;color:var(--muted);margin-top:2px">Objetivo: ${Math.round(totalPosMeta)} clientes</div>` : ''}
      </div>
      <div class="vendas-resumo-box">
        <div class="vendas-resumo-label">Cadastros no mês</div>
        <div class="vendas-resumo-val">${totalCad}</div>
      </div>
    </div>`;
}

function toggleCardSec(id) {
  const el = document.getElementById(id);
  const ic = document.getElementById(id + '-ic');
  const open = el.classList.toggle('open');
  if (ic) ic.classList.toggle('open', open);
}

function toggleSec(id) { toggleCardSec(id); }

function _metaKpi(label, real, meta, tipo, cmp) {
  if (!meta || meta <= 0) return _statKpi(label, fmt(real, tipo), cmp);
  const p   = Math.min(Math.round(pct(real, meta)), 999);
  const cls = pctClass(p);
  return `<div class="meta-kpi">
    <div class="meta-kpi-label">${label}</div>
    <div class="meta-kpi-vals pct-${cls}">${fmt(real, tipo)}</div>
    <div class="meta-kpi-sub">Objetivo: ${fmt(meta, tipo)} &middot; <span class="pct-${cls}">${p}%</span></div>
    <div class="bar-bg" style="margin-top:6px"><div class="bar-fill bar-${cls}" style="width:${Math.min(p,100)}%"></div></div>
    ${cmp || ''}
  </div>`;
}

function _statKpi(label, val, cmp) {
  return `<div class="meta-kpi">
    <div class="meta-kpi-label">${label}</div>
    <div class="meta-kpi-vals">${val}</div>
    ${cmp || ''}
  </div>`;
}

// Linha "vs mês anterior" pro card de Objetivos: pega o realizado do mês
// anterior e escala pela proporção de dias já passados nesse mês vs o total
// de dias do mês anterior, pra comparar "no mesmo ritmo" em vez do total
// cheio do mês anterior (que enganaria enquanto o mês atual mal começou).
function _cmpMesAnterior(v, mes, campo, tipo) {
  const mesAnt = _mesAnterior(mes);
  const pmAnt = _pm(v, mesAnt);
  const realAnt = _mv(pmAnt, campo, 'realizado');
  if (!realAnt) return '';
  const diasPassados = _diasPassadosNoMes(mes);
  const diasMesAnt = _diasNoMes(mesAnt);
  const proporcao = diasMesAnt > 0 ? Math.min(diasPassados / diasMesAnt, 1) : 0;
  const valorProrata = realAnt * proporcao;
  // Positivação/Indústrias são contagem (não faz sentido "3,7 clientes") —
  // só Faturamento (tipo 'fat') mantém casas decimais (centavos).
  const valorFmt = tipo === 'fat' ? valorProrata : Math.round(valorProrata);
  return `<div class="meta-kpi-sub" style="margin-top:4px;color:var(--muted)">
    ${mesAnt} (até dia ${diasPassados}): ${fmt(valorFmt, tipo)}
  </div>`;
}

function _buildLinhaMeta(label, real, meta, tipo) {
  if (!meta || meta <= 0) {
    // Sem meta cadastrada pro mês (ex: vendedor novo/sem linha na planilha
    // ainda) — mostra o valor realizado mesmo assim, só sem badge/barra de %.
    return `<div class="stat-row">
      <span class="stat-label">${label}</span>
      <span class="stat-val">${fmt(real, tipo)}</span>
    </div>`;
  }
  const p   = Math.min(Math.round(pct(real, meta)), 999);
  const cls = pctClass(p);
  return `<div style="margin:3px 0 10px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:3px">
      <span class="stat-label">${label}</span>
      <span class="pct-badge pct-${cls}">${p}%</span>
    </div>
    <div style="font-size:.78rem;color:var(--muted);margin-bottom:4px">${fmt(real, tipo)} / ${fmt(meta, tipo)}</div>
    <div class="bar-bg"><div class="bar-fill bar-${cls}" style="width:${Math.min(p,100)}%"></div></div>
  </div>`;
}

function _fatVendasMes(nomeVendedor, mes) {
  if (typeof VENDAS_DATA === 'undefined') return 0;
  return ((VENDAS_DATA.por_vendedor[nomeVendedor] || {})[mes] || [])
    .filter(x => !x.devolvido && !x.cancelado && !x.cancelado_parcial).reduce((s, x) => s + x.valor, 0);
}

function _posVendasMes(nomeVendedor, mes) {
  if (typeof VENDAS_DATA === 'undefined') return 0;
  const vendas = (VENDAS_DATA.por_vendedor[nomeVendedor] || {})[mes] || [];
  return new Set(vendas.filter(x => x.offtrade && !x.devolvido && !x.cancelado && !x.cancelado_parcial).map(x => x.codcli || x.cliente)).size;
}

function _fatOrdenacao(v, mes) {
  const pm   = _pm(v, mes);
  const fatM = _mv(pm, 'fat_tt', 'meta');
  return fatM > 0 ? _mv(pm, 'fat_tt', 'realizado') : _fatVendasMes(v.nome, mes);
}

// TIPOVEND vem da PCUSUARI (Oracle) — E = Vendedor Externo, R = Representante.
// Outros valores (ex: I) não têm rótulo definido pro time, então não exibe badge.
function _tipovendBadge(tipovend) {
  const rotulos = { E: 'Externo', R: 'Representante' };
  const rotulo = rotulos[tipovend];
  return rotulo ? `<span class="tipovend-badge tv-${tipovend}">${rotulo}</span>` : '';
}

function _buildCards(vendedores, mes) {
  const ordenados = [...vendedores].sort((a, b) => _fatOrdenacao(b, mes) - _fatOrdenacao(a, mes));
  return ordenados.map((v, idx) => {
    const pm    = _pm(v, mes);
    const fatM  = _mv(pm, 'fat_tt', 'meta');
    const fat   = fatM > 0 ? _mv(pm, 'fat_tt', 'realizado') : _fatVendasMes(v.nome, mes);
    const posM  = _mv(pm, 'pos_tt', 'meta');
    const pos   = posM > 0 ? _mv(pm, 'pos_tt', 'realizado') : _posVendasMes(v.nome, mes);
    const indus = _mv(pm, 'industrias', 'realizado');
    return `
      <div class="vendor-card" data-nome="${v.nome.toLowerCase()}" data-rca="${v.rca}">
        <div class="vendor-name">${v.nome}${_tipovendBadge(v.tipovend)}</div>
        <div class="vendor-rca">RCA ${v.rca}</div>
        ${_buildLinhaMeta('Faturamento', fat, fatM, 'fat')}
        ${_buildLinhaMeta('Positivação', pos, posM, 'pos')}
        <div class="stat-row">
          <span class="stat-label">Indústrias</span>
          <span class="stat-val">${indus}</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">Cadastros no mês</span>
          <span class="stat-val">${v.clientes_cadastrados || 0}</span>
        </div>
        ${buildCampanhaDetail(v, mes)}
        ${buildAmarulaDetail(v, mes)}
        ${buildMovingDetail(v, mes)}
        ${buildCrusoeDetail(v, mes)}
        <div class="card-actions" style="gap:8px">
          <button class="btn" onclick="copyLink('${v.nome.replace(/'/g,"\\'")}', this)">&#128279; Link</button>
          <a class="btn btn-primary" href="?vendedor=${encodeURIComponent(v.nome)}">Ver detalhes</a>
        </div>
      </div>`;
  }).join('');
}
function _buildAvisoPedidosGeral() {
  if (typeof PEDIDOS_DATA === 'undefined') return '';
  // Painel é RJ-only por natureza (metas.html inteiro é RJ) — não mostra
  // pra quem foi restrito a outro estado (2026-08-05).
  const scope = _scopeAtual();
  if (scope.tipo === 'equipe' && !(scope.estados || []).includes('RJ')) return '';
  const lista = (PEDIDOS_DATA.pedidos_feitos || []).filter(p =>
    (p.estado || '').toUpperCase() === 'RJ' && _POSICOES_PROBLEMA_PED[p.posicao]);
  if (!lista.length) return '';

  const porVendedor = {};
  lista.forEach(p => {
    const nome = p.nome || '(sem vendedor)';
    (porVendedor[nome] = porVendedor[nome] || []).push(p);
  });

  const blocos = Object.keys(porVendedor).sort().map(nome => {
    const itens = porVendedor[nome].map(p => `
      <div style="padding:6px 0;border-bottom:1px solid var(--border)">
        <div><strong>Ped ${p.numped}</strong> — ${p.cliente} — ${fmtFat(p.total)} <span style="color:var(--muted)">(${p.posicao})</span></div>
        ${p.motivo ? `<div style="font-size:.72rem;color:var(--muted)">Motivo: ${p.motivo}${(p.motivo_preco_digitado != null && p.motivo_preco_tabela != null) ? ` — ${p.motivo_produto} (digitado ${fmtFat(p.motivo_preco_digitado)} · tabela ${fmtFat(p.motivo_preco_tabela)})` : ''}</div>` : ''}
      </div>`).join('');
    return `
      <div style="margin-top:10px">
        <div style="font-weight:600;font-size:.85rem;color:var(--accent)">${nome} <span style="color:var(--muted);font-weight:400">(${porVendedor[nome].length})</span></div>
        ${itens}
      </div>`;
  }).join('');

  return `
    <div class="detail-card" style="border-color:var(--red)">
      <div class="sec-title" style="color:var(--red)">&#9888; ${lista.length} pedido${lista.length > 1 ? 's' : ''} pendente${lista.length > 1 ? 's' : ''}/bloqueado${lista.length > 1 ? 's' : ''} no sistema (${Object.keys(porVendedor).length} vendedor${Object.keys(porVendedor).length > 1 ? 'es' : ''})</div>
      ${blocos}
    </div>`;
}

function renderAll(vendedores, mes) {
  mes = mes || _getMes();
  _mesSel = mes;
  _filtroGerente    = '';
  _filtroSupervisor = '';
  var cb = document.querySelector('.camp-bar');
  if (cb) cb.style.display = '';

  const mesOpts = _todosMeses().map(mo =>
    `<option value="${mo}" ${mo === mes ? 'selected' : ''}>${mo}</option>`
  ).join('');

  document.getElementById('header-sub').textContent =
    `${mes}  ·  Atualizado ${METAS_DATA.atualizado_em}`;

  document.getElementById('header-actions').innerHTML =
    `<select class="mes-select" onchange="document.getElementById('header-sub').textContent=this.value+' · Atualizado ${METAS_DATA.atualizado_em}';_aplicarFiltro(this.value)">${mesOpts}</select>
     <a class="btn btn-limite" href="https://offtrade.duckdns.org/Credito_e_Cadastro" target="_blank" rel="noopener">&#128196; PEDIR LIMITE E CADASTRO</a>`;

  const _gers = _getGerentes();
  const _sups = _getSupervisores('');
  const filHtml = _gers.length ? `
    <div class="filter-wrap">
      <select id="fil-ger" class="mes-select" onchange="_filtroGerente=this.value;_filtroSupervisor='';_aplicarFiltro(_getMes())">
        <option value="">Todos os gerentes</option>
        ${_gers.map(g => `<option value="${g}">${g}</option>`).join('')}
      </select>
      <select id="fil-sup" class="mes-select" onchange="_filtroSupervisor=this.value;_aplicarFiltro(_getMes())">
        <option value="">Todos os supervisores</option>
        ${_sups.map(s => `<option value="${s}">${s}</option>`).join('')}
      </select>
    </div>` : '';

  document.getElementById('app').innerHTML = `
    ${filHtml}
    ${_buildAvisoPedidosGeral()}
    <div id="equipe-resumo-wrap">${_buildResumoEquipe(METAS_DATA.vendedores, mes)}</div>
    <div class="search-wrap">
      <input class="search-input" type="text" placeholder="Buscar por nome ou RCA..."
        oninput="filterCards(this.value)">
    </div>
    <div class="cards-grid" id="cards-grid">${_buildCards(METAS_DATA.vendedores, mes)}</div>`;
}
function filterCards(q) {
  const q2 = q.toLowerCase().trim();
  document.querySelectorAll('.vendor-card').forEach(card => {
    const match = card.dataset.nome.includes(q2) || card.dataset.rca.includes(q2);
    card.style.display = match ? '' : 'none';
  });
}

// ── Init ──────────────────────────────────────────────────

(function init() {
  if (typeof METAS_DATA === 'undefined') {
    document.getElementById('app').innerHTML = `
      <div class="no-data">
        <p>&#9888; Arquivo <strong>metas_data.js</strong> não encontrado.</p>
        <p style="margin-top:8px;font-size:0.82rem">
          Execute a célula de exportação no notebook <strong>analisedados.ipynb</strong> para gerar os dados.
        </p>
      </div>`;
    return;
  }

  const params = new URLSearchParams(window.location.search);
  const param    = params.get('vendedor') || null;
  const rcaParam = params.get('rca') || null;
  const view   = params.get('view') || 'metas';
  const mesUrl = params.get('mes') || null;

  _mesSel = mesUrl || (METAS_DATA.meses && METAS_DATA.meses[0]) || '';

  if (rcaParam && !param) {
    const vr = METAS_DATA.vendedores.find(x => String(x.rca) === String(rcaParam));
    if (vr) {
      const dest = location.pathname + '?vendedor=' + encodeURIComponent(vr.nome)
        + (view !== 'metas' ? '&view=' + view : '')
        + (mesUrl ? '&mes=' + mesUrl : '');
      location.replace(dest);
      return;
    }
  }

  // Restrição por estado só na visão agregada (sem vendedor específico na
  // URL) — param/rcaParam são sempre vendedor logando e vendo a si mesmo.
  if (!param && !rcaParam) {
    const scope = _scopeAtual();
    if (scope.tipo === 'equipe') {
      METAS_DATA.vendedores = METAS_DATA.vendedores.filter(v => scope.nomes.has(v.nome));
    }
  }

  const v = param
    ? METAS_DATA.vendedores.find(x => x.nome.toLowerCase() === param.toLowerCase())
    : null;

  if (param) {
    if (v) {
      renderDetail(v, _mesSel);
    } else {
      document.getElementById('app').innerHTML = `
        <div class="no-data">
          <p>Vendedor "<strong>${param}</strong>" não encontrado.</p>
          <a class="btn" href="${location.pathname}" style="margin-top:16px">\u2190 Voltar</a>
        </div>`;
    }
  } else {
    renderAll(METAS_DATA.vendedores, _mesSel);
  }
})();
setTimeout(() => location.reload(), 5 * 60 * 1000);
</script>
</body>
</html>
