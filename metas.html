<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <script src="vps_redirect.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Objetivos OFF TRADE RJ</title>
  <script src="metas_data.js"></script>
  <script src="vendas_data.js"></script>
  <script src="pedidos_data.js"></script>
  <script src="amarula_data.js"></script>
  <script src="crusoe_data.js"></script>
  <script src="gerentes_data.js"></script>
  <script src="fontes_status_data.js"></script>
  <script src="fontes_alert.js"></script>
  <script src="pedidos_data.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --card: #1a1d27;
      --card2: #22263a;
      --accent: #f5c518;
      --green: #22c55e;
      --yellow: #eab308;
      --red: #ef4444;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --border: #2d3144;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      padding: 16px;
      max-width: 960px;
      margin: 0 auto;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
      gap: 12px;
    }

    .header-title h1 {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: -0.02em;
    }

    .header-title p {
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 3px;
    }

    /* Botões */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--card2);
      color: var(--text);
      text-decoration: none;
      transition: all 0.15s;
    }
    .btn:hover { border-color: var(--accent); color: var(--accent); }
    .btn-primary { background: var(--accent); color: #111; border-color: var(--accent); font-weight: 700; }
    .btn-primary:hover { background: #d4a90e; color: #111; }
    .btn.copied { border-color: var(--green); color: var(--green); }
    .btn-dl { border-color: #2d6a4f; color: #52b788; }
    .btn-dl:hover { border-color: #52b788; color: #52b788; background: rgba(82,183,136,0.1); }
    .btn-limite { border-color: #1d4ed8; color: #60a5fa; font-weight: 700; }
    .btn-limite:hover { border-color: #60a5fa; color: #93c5fd; background: rgba(96,165,250,0.12); }

    /* ── Barra de campanhas ──────────────────────────── */
    .camp-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      padding: 10px 0 16px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 20px;
    }
    .camp-bar-label {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      flex-shrink: 0;
    }
    .camp-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
      text-decoration: none;
      border: 1px solid;
      transition: opacity .15s, transform .15s;
    }
    .camp-pill:hover { opacity: .85; transform: translateY(-1px); }
    .camp-pill .dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
    .cp-amarula { color: #d4962a; border-color: #d4962a55; background: rgba(212,150,42,.08); }
    .cp-amarula .dot { background: #d4962a; }
    .cp-pernod  { color: #3b82f6; border-color: #3b82f655; background: rgba(59,130,246,.08); }
    .cp-moving  { color: #10b981; border-color: #10b98155; background: rgba(16,185,129,.08); }
    .cp-moving .dot { background: #10b981; }
    .cp-pernod  .dot { background: #3b82f6; }

    /* Ring */
    .ring-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 8px 0 24px;
    }
    .ring-label {
      font-size: 0.72rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 10px;
    }
    .ring-container {
      position: relative;
      width: 150px;
      height: 150px;
    }
    .ring-container svg { transform: rotate(-90deg); }
    .ring-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      width: 100%;
    }
    .ring-pct { font-size: 1.7rem; font-weight: 800; }
    .ring-val { font-size: 0.72rem; color: var(--text); margin-top: 2px; }
    .ring-meta { font-size: 0.65rem; color: var(--muted); }

    /* Cards grid */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 14px;
    }

    .vendor-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
      transition: border-color 0.2s, transform 0.15s;
    }
    .vendor-card:hover { border-color: var(--accent); transform: translateY(-2px); }

    .vendor-name { font-size: 0.95rem; font-weight: 600; margin-bottom: 2px; }
    .vendor-rca { font-size: 0.72rem; color: var(--muted); margin-bottom: 14px; }
    .vendor-card { cursor: pointer; }
    .card-toggle { display:flex; justify-content:space-between; align-items:center; }
    .card-toggle-icon { font-size:0.75rem; color:var(--muted); transition:transform 0.2s; }
    .card-toggle-icon.open { transform:rotate(180deg); }
    .vendor-expand { display:none; margin-top:12px; border-top:1px solid var(--border); padding-top:10px; }
    .vendor-expand.open { display:block; }
    .expand-table { width:100%; border-collapse:collapse; font-size:0.75rem; }
    .expand-table th { color:var(--muted); font-weight:600; text-align:left; padding:4px 0; border-bottom:1px solid var(--border); }
    .expand-table td { padding:4px 0; border-bottom:1px solid var(--border); vertical-align:top; }
    .expand-table tr:last-child td { border-bottom:none; }
    .expand-table .td-right { text-align:right; white-space:nowrap; }
    .stat-row { display:flex; justify-content:space-between; align-items:center; padding:5px 0; border-bottom:1px solid var(--border); font-size:0.8rem; }
    .stat-row:last-of-type { border-bottom:none; }
    .stat-label { color:var(--muted); }
    .stat-val   { font-weight:600; }

    .card-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 14px;
      gap: 8px;
    }

    /* Seção retrátil nos cards (não positivados) */
    .sec-header {
      display: flex; justify-content: space-between; align-items: center;
      cursor: pointer; padding: 8px 0; border-bottom: 1px solid var(--border);
      user-select: none;
    }
    .sec-header:hover .sec-title { color: var(--text); }
    .sec-title { font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
    .sec-ic    { font-size: .65rem; color: var(--muted); transition: transform .2s; }
    .sec-ic.open { transform: rotate(180deg); }
    .sec-body  { display: none; padding-top: 8px; }
    .sec-body.open { display: block; }
    .sec-meta  { font-size: .75rem; color: var(--muted); margin-top: 2px; }

    .vendas-kpis { display:flex; gap:24px; flex-wrap:wrap; margin-bottom:14px; padding-bottom:14px; border-bottom:1px solid var(--border); }
    .kpi-label { font-size:.68rem; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; }
    .kpi-val   { font-size:1.1rem; font-weight:700; margin-top:2px; }

    /* Progress bar */
    .metric { margin-bottom: 12px; }
    .metric-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 5px;
      gap: 8px;
    }
    .metric-name { font-size: 0.75rem; color: var(--muted); flex: 1; }
    .metric-right { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
    .metric-values { font-size: 0.75rem; color: var(--text); }
    .metric-pct {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 5px;
      min-width: 38px;
      text-align: center;
    }
    .pct-green { background: rgba(34,197,94,0.15); color: var(--green); }
    .pct-yellow { background: rgba(234,179,8,0.15); color: var(--yellow); }
    .pct-red { background: rgba(239,68,68,0.15); color: var(--red); }

    .bar-bg { background: var(--card2); border-radius: 99px; height: 5px; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 99px; transition: width 0.8s ease; }
    .bar-green { background: var(--green); }
    .bar-yellow { background: var(--yellow); }
    .bar-red { background: var(--red); }

    .metas-grid { display: flex; flex-wrap: wrap; gap: 10px; margin: 8px 0 10px; }
    .meta-kpi { flex: 1; min-width: 130px; background: var(--card2); border-radius: 8px; padding: 10px 12px; }
    .meta-kpi-label { font-size: .65rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 6px; }
    .meta-kpi-vals  { font-size: .82rem; font-weight: 600; }
    .meta-kpi-sub   { font-size: .68rem; color: var(--muted); margin-top: 2px; }

    /* Detail */
    .detail-header {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    .detail-name { font-size: 1.25rem; font-weight: 700; }
    .detail-rca { font-size: 0.78rem; color: var(--muted); margin-top: 2px; }

    .detail-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px 20px;
      margin-bottom: 12px;
    }

    .section-title {
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 14px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }

    /* Search */
    .search-wrap { margin-bottom: 18px; }
    .search-input {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 16px;
      color: var(--text);
      font-size: 0.9rem;
      outline: none;
    }
    .search-input:focus { border-color: var(--accent); }
    .search-input::placeholder { color: var(--muted); }

    .no-data {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
      line-height: 1.8;
    }
    .no-data strong { color: var(--text); }

    /* Tabela não positivados */
    .nao-pos-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.76rem;
      margin-top: 4px;
    }
    .nao-pos-table th {
      text-align: left;
      color: var(--muted);
      font-weight: 600;
      padding: 6px 8px;
      border-bottom: 1px solid var(--border);
    }
    .nao-pos-table td {
      padding: 7px 8px;
      border-bottom: 1px solid rgba(45,49,68,0.5);
      vertical-align: top;
    }
    .nao-pos-table tr:last-child td { border-bottom: none; }
    .nao-pos-table tr:hover td { background: var(--card2); }
    .nao-pos-cliente { font-weight: 500; color: var(--text); }
    .nao-pos-sub { color: var(--muted); font-size: 0.7rem; margin-top: 2px; }
    .nao-pos-date { color: var(--red); white-space: nowrap; }
    .nao-pos-empty { color: var(--muted); font-size: 0.8rem; padding: 12px 0; }

    .chart-wrap { position: relative; height: 200px; }

    /* Tabela de vendas */
    .vendas-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.76rem;
      margin-top: 4px;
    }
    .vendas-table th {
      text-align: left;
      color: var(--muted);
      font-weight: 600;
      padding: 6px 8px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    .vendas-table td {
      padding: 7px 8px;
      border-bottom: 1px solid rgba(45,49,68,0.5);
      vertical-align: top;
    }
    .vendas-table tr:last-child td { border-bottom: none; }
    .vendas-table tr:hover td { background: var(--card2); }
    .vendas-date  { color: var(--muted); white-space: nowrap; font-size: 0.72rem; }
    .vendas-cli   { font-weight: 500; color: var(--text); }
    .vendas-prod  { color: var(--muted); font-size: 0.72rem; }
    .vendas-qt    { text-align: right; color: var(--text); white-space: nowrap; }
    .vendas-val   { text-align: right; color: var(--accent); white-space: nowrap; font-weight: 600; }
    .vendas-empty { color: var(--muted); font-size: 0.8rem; padding: 12px 0; }

    /* Modal de detalhes do pedido */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.65);
      display: flex; align-items: center; justify-content: center;
      z-index: 999; padding: 16px;
    }
    .modal-pedido {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 20px; max-width: 560px; width: 100%;
      max-height: 80vh; overflow-y: auto;
    }
    .modal-pedido-header {
      display: flex; justify-content: space-between; align-items: flex-start;
      gap: 10px; flex-wrap: wrap;
    }
    .modal-pedido-title { font-size: 0.95rem; font-weight: 700; color: var(--text); }
    .modal-pedido-sub { font-size: 0.76rem; color: var(--muted); margin-top: 3px; }

    .prev-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 4px;
    }
    .prev-box {
      background: var(--card2);
      border-radius: 8px;
      padding: 12px 14px;
    }
    .prev-box-label {
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin-bottom: 10px;
    }
    .prev-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 6px;
    }
    .prev-row-label { font-size: 0.72rem; color: var(--muted); }
    .prev-row-val   { font-size: 0.88rem; font-weight: 700; color: var(--text); }
    .prev-du {
      font-size: 0.65rem;
      color: var(--muted);
      margin-top: 8px;
      padding-top: 6px;
      border-top: 1px solid var(--border);
    }

    .mes-select {
      background: var(--card2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 0.85rem;
      padding: 7px 12px;
      cursor: pointer;
      outline: none;
    }
    .mes-select:focus { border-color: var(--accent); }

    .filter-wrap {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }
    .filter-wrap select { flex: 1; min-width: 180px; }

    .vendas-resumo {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }
    .vendas-resumo-box {
      background: var(--card2);
      border-radius: 8px;
      padding: 10px 16px;
      flex: 1;
      min-width: 120px;
    }
    .vendas-resumo-label { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin-bottom: 4px; }
    .vendas-resumo-val   { font-size: 1rem; font-weight: 700; color: var(--text); }

    @media (max-width: 480px) {
      .cards-grid { grid-template-columns: 1fr; }
      body { padding: 12px; }
    }

    /* ── Campanha ─────────────────────────────────────────── */
    .campanha-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 24px;
    }
    .campanha-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .campanha-badge {
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      background: #7c3aed;
      color: #fff;
      border-radius: 4px;
      padding: 2px 7px;
    }
    .tipovend-badge {
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      border-radius: 4px;
      padding: 2px 7px;
      margin-left: 8px;
    }
    .tipovend-badge.tv-E { background: rgba(59,130,246,.15); color: #3b82f6; border: 1px solid rgba(59,130,246,.3); }
    .tipovend-badge.tv-R { background: rgba(245,197,24,.15); color: var(--accent); border: 1px solid rgba(245,197,24,.3); }
    .campanha-nome {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text);
    }
    .campanha-cols {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    @media (max-width: 600px) {
      .campanha-cols { grid-template-columns: 1fr; }
    }
    .campanha-col-title {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--muted);
      margin-bottom: 10px;
    }
    .campanha-gatilho-bar {
      margin-bottom: 12px;
    }
    .campanha-gatilho-label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }
    .campanha-gatilho-txt { font-size: 0.75rem; color: var(--muted); }
    .campanha-gatilho-val { font-size: 0.78rem; font-weight: 700; }
    .campanha-gatilho-ok {
      display: inline-block;
      font-size: 0.65rem;
      font-weight: 700;
      background: var(--green);
      color: #000;
      border-radius: 4px;
      padding: 1px 6px;
      margin-left: 6px;
    }
    .campanha-ranking {
      margin-top: 10px;
    }
    .campanha-ranking-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.82rem;
    }
    .campanha-ranking-row:last-child { border-bottom: none; }
    .campanha-medal { font-size: 1rem; width: 22px; text-align: center; flex-shrink: 0; }
    .campanha-rank-nome { flex: 1; color: var(--text); font-weight: 600; }
    .campanha-rank-val { color: var(--muted); font-size: 0.78rem; }
    .campanha-rank-prize {
      font-weight: 700;
      color: var(--accent);
      font-size: 0.82rem;
      white-space: nowrap;
    }
    .campanha-rank-fora {
      font-size: 0.7rem;
      color: var(--muted);
      font-style: italic;
    }
    .campanha-detail-box {
      background: #1a1030;
      border: 1px solid #7c3aed55;
      border-radius: 10px;
      padding: 14px 16px;
      margin-top: 16px;
    }
    .campanha-detail-title {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: #a78bfa;
      margin-bottom: 10px;
    }
    .campanha-detail-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 0;
      font-size: 0.82rem;
      border-bottom: 1px solid #2d1f50;
    }
    .campanha-detail-row:last-child { border-bottom: none; }

    /* ── Pernod Dashboard ─────────────────────────────────────── */
    .pernod-dash { margin-bottom: 16px; }
    .pernod-kpis {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 12px;
    }
    .pernod-kpi {
      background: #0d1b2a;
      border: 1px solid #1e3a5f66;
      border-radius: 10px;
      padding: 12px 14px;
      text-align: center;
    }
    .pernod-kpi-label {
      font-size: 0.63rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 5px;
    }
    .pernod-kpi-val {
      font-size: 1.3rem;
      font-weight: 800;
      color: #60a5fa;
    }
    .pernod-kpi-sub {
      font-size: 0.61rem;
      color: var(--muted);
      margin-top: 2px;
    }
    .pernod-charts {
      display: grid;
      grid-template-columns: 1fr 1.6fr;
      gap: 10px;
      margin-bottom: 10px;
    }
    @media (max-width: 560px) { .pernod-charts { grid-template-columns: 1fr; } }
    .pernod-chart-box {
      background: #0d1b2a;
      border: 1px solid #1e3a5f66;
      border-radius: 10px;
      padding: 12px 14px;
    }
    .pernod-chart-title {
      font-size: 0.63rem;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .pernod-donut-wrap { height: 158px; position: relative; }
    .pernod-inc-wrap   { height: 158px; position: relative; }
    .pernod-efic {

<script>
(function () {
  const HASH    = 'b4ba917b95850dc43cce91dba3be9fd1a4f029e18b81d6846a7183839c81d8dd';
  const _p      = new URLSearchParams(location.search);
  const _vend   = _p.get('vendedor');
  const _rca    = _p.get('rca');

  // SSO com o Streamlit (botão "Pedir limite e cadastro" -> Credito_e_Cadastro):
  // renova o cookie offtrade_token aqui também, não só no login.html, porque
  // uma sessão já aberta antes desse recurso existir nunca passa pelo
  // login.html de novo — sem isso o botão continuava pedindo login mesmo com
  // o usuário já autenticado (mesmo esquema de utils.py:_decode_email, que
  // não valida assinatura, só o e-mail no payload).
  function _b64urlEncode(obj) {
    const b64 = btoa(unescape(encodeURIComponent(JSON.stringify(obj))));
    return b64.replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }
  function _refreshSsoCookie(email) {
    if (!email) return;
    const header  = _b64urlEncode({ alg: 'none', typ: 'JWT' });
    const payload = _b64urlEncode({ email });
    const ssoToken = JSON.stringify({ id_token: `${header}.${payload}.sso` });
    document.cookie = 'offtrade_token=' + encodeURIComponent(ssoToken) +
      '; path=/; max-age=' + (60 * 60 * 8) + '; SameSite=Lax; Secure';
  }

  if (sessionStorage.getItem('rg_auth') === HASH) {
    _refreshSsoCookie(sessionStorage.getItem('rg_email'));
    return; // gestor: acesso total
  }

  const _goLogin = () => {
    sessionStorage.setItem('rg_redirect', location.pathname + location.search);
    location.replace('login.html');
  };

  if (!_vend && !_rca) { _goLogin(); return; } // view geral: só gestor

  // view de vendedor: exige sessão com RCA correspondente
  try {
    const s = JSON.parse(sessionStorage.getItem('rg_vendedor') || '{}');
    if (!s.rca) throw 0;
    const rcaUrl = _rca
      ? String(_rca)
      : (() => {
          const vv = (typeof METAS_DATA !== 'undefined' ? METAS_DATA.vendedores : [])
            .find(x => x.nome.toLowerCase() === _vend.toLowerCase());
          return vv ? String(vv.rca) : null;
        })();
    if (!rcaUrl || String(s.rca) !== rcaUrl) throw 0;
    _refreshSsoCookie(s.email);
  } catch { _goLogin(); }
})();
</script>

<script>
// ── Restrição de acesso por estado (2026-08-05) ────────────────────────────
// Cada e-mail listado só vê os vendedores do(s) estado(s) dele na visão
// agregada (sem ?vendedor= na URL). Quem não está na lista continua vendo
// tudo, igual sempre foi — isto é uma exceção pontual pedida pelo Leonardo
// pra esses gestores específicos, não um sistema de permissões genérico.
const SUPER_ADMIN_EMAIL = 'leonardo.campos@rigarr.com.br'; // mesmo valor de utils.py

const RESTRICAO_ACESSO_POR_EMAIL = {
  'danielle.soares@rigarr.com.br':    { estados: ['RJ'] },
  'allan.correa@rigarr.com.br':       { estados: ['RJ'] },
  'marcus.tanamachi@rigarr.com.br':   { estados: ['SP'], excluirPadrao: ['W.S'] },
  'priscilla.zambrano@rigarr.com.br': { estados: ['SP'], excluirPadrao: ['W.S'] },
  'anderson.canaveis@rigarr.com.br':  { estados: ['SP'], excluirPadrao: ['W.S'] },
  'fernando.risson@rigarr.com.br':    { estados: ['MG'] },
  'andre.massensini@rigarr.com.br':   { estados: ['MG'] },
  'erocles.oliveira@rigarr.com.br':   { estados: ['ES'] },
};

function _nomesNoEstado(estado) {
  const nomes = new Set();
  if (typeof GERENTES_DATA === 'undefined') return nomes;
  for (const est of GERENTES_DATA.estados || []) {
    if (est.nome !== estado) continue;
    for (const g of est.gerentes || [])
      for (const s of g.supervisores || [])
        for (const v of s.vendedores || []) nomes.add(v.nome);
  }
  return nomes;
}

function _emailLogado() {
  const m = document.cookie.match(/(?:^|; )offtrade_token=([^;]*)/);
  if (!m) return '';
  try {
    const token = JSON.parse(decodeURIComponent(m[1]));
    const idToken = token.id_token || token.credential || '';
    const b64 = idToken.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
    const payload = JSON.parse(atob(b64 + '='.repeat((4 - b64.length % 4) % 4)));
    return (payload.email || '').toLowerCase();
  } catch { return ''; }
}

// Retorna {tipo:'all'} | {tipo:'equipe', nomes:Set}. Sem regra cadastrada
// pro e-mail = 'all' (fail-open, nunca bloqueia ninguém sem querer).
function _scopeAtual() {
  const email = _emailLogado();
  if (!email || email === SUPER_ADMIN_EMAIL) return { tipo: 'all' };

  const regra = RESTRICAO_ACESSO_POR_EMAIL[email];
  if (!regra) return { tipo: 'all' };

  const nomes = new Set();
  for (const est of regra.estados || []) for (const n of _nomesNoEstado(est)) nomes.add(n);

  for (const padrao of regra.excluirPadrao || []) {
    const re = new RegExp(padrao.replace(/\./g, '\\.'), 'i');
    for (const n of Array.from(nomes)) if (re.test(n)) nomes.delete(n);
  }

  return { tipo: 'equipe', nomes, estados: regra.estados || [] };
}

// ── Utilitários ──────────────────────────────────────────

function fmtFat(val) {
  return 'R$\u00a0' + Number(val).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function fmtPos(val) {
  return Number(val).toLocaleString('pt-BR');
}
function fmt(val, tipo) {
  return tipo === 'fat' ? fmtFat(val) : fmtPos(val);
}

function pct(real, meta) {
  if (!meta || meta === 0) return 0;
  return (real / meta) * 100;
}

function pctClass(p) {
  if (p >= 100) return 'green';
  if (p >= 70)  return 'yellow';
  return 'red';
}

function ringColor(p) {
  if (p >= 100) return '#22c55e';
  if (p >= 70)  return '#eab308';
  return '#ef4444';
}

// ── Componentes HTML ─────────────────────────────────────

function buildRing(pctVal, realFmt, metaFmt) {
  const r = 58, cx = 75, cy = 75;
  const circ = 2 * Math.PI * r;
  const fill = Math.min(pctVal, 100) / 100 * circ;
  const color = ringColor(pctVal);
  const pctDisplay = pctVal > 999 ? '>999%' : pctVal.toFixed(1) + '%';
  return `
    <div class="ring-wrap">
      <div class="ring-label">Faturamento Total</div>
      <div class="ring-container">
        <svg width="150" height="150" viewBox="0 0 150 150">
          <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#22263a" stroke-width="13"/>
          <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}" stroke-width="13"
            stroke-dasharray="${fill} ${circ}" stroke-linecap="round"/>
        </svg>
        <div class="ring-text">
          <div class="ring-pct" style="color:${color}">${pctDisplay}</div>
          <div class="ring-val">${realFmt}</div>
          <div class="ring-meta">objetivo ${metaFmt}</div>
        </div>
      </div>
    </div>`;
}

function buildBar(name, realizado, meta, tipo) {
  const p     = pct(realizado, meta);
  const cls   = pctClass(p);
  const pDisp = p > 999 ? '>999' : p.toFixed(0);
  return `
    <div class="metric">
      <div class="metric-header">
        <span class="metric-name">${name}</span>
        <div class="metric-right">
          <span class="metric-values">${fmt(realizado, tipo)} / ${fmt(meta, tipo)}</span>
          <span class="metric-pct pct-${cls}">${pDisp}%</span>
        </div>
      </div>
      <div class="bar-bg">
        <div class="bar-fill bar-${cls}" style="width:${Math.min(p, 100)}%"></div>
      </div>
    </div>`;
}

// ── Pedidos agrupados (Faturamento do mês) ──────────────────────
// Agrupa os itens (linha a linha) em pedidos/notas: chave preferida é
// 'nunota' (NF) — corte parcial e venda faturada da MESMA nota caem na
// mesma chave quando o Oracle usa o mesmo número pros dois campos (nem
// sempre bate entre schemas, aí o corte vira uma linha própria mesmo assim,
// ver exportacao_meta.py). Sem nunota, usa 'numped' (cancelado antes de
// virar nota não tem nunota). Sem nenhum dos dois, cada item vira seu
// próprio "pedido" de 1 item (não deveria acontecer com os dados atuais,
// é só rede de segurança).
function _chavePedido(v, idx) {
  if (v.nunota) return `NF:${v.nunota}`;
  if (v.numped) return `PED:${v.numped}`;
  return `ITEM:${idx}`;
}

// Cruza com pedidos_data.js (pedidos.py) por sistema+número da nota, pra
// mostrar o status de logística real (EM ROTA, ENTREGUE, etc — Controle de
// Notas / Canhoto Digital) em vez de só "EMITIDO" — pedido do usuário em
// 2026-08-13, mesma fonte que pedidos.html já usa. Só cobre pedidos.py::
// DIAS_JANELA (90 dias) — fora dessa janela, cai de volta pra "EMITIDO"
// genérico (sem dado de logística disponível).
const _logisticaPorChave = {};
if (typeof PEDIDOS_DATA !== 'undefined' && PEDIDOS_DATA.faturados) {
  PEDIDOS_DATA.faturados.forEach(p => {
    if (p.sistema && p.numnota) _logisticaPorChave[`${p.sistema}|${p.numnota}`] = p;
  });
}

function _logisticaDoPedido(sistema, nunota) {
  if (!sistema || !nunota) return null;
  return _logisticaPorChave[`${sistema}|${nunota}`] || null;
}

// Mesma classificação de cor que pedidos.html::_statusLogBadge (mantém o
// mesmo semáforo visual entre as duas páginas).
function _corLogistico(statusRaw) {
  const s = (statusRaw || '').toUpperCase();
  if (s === 'ENTREGUE' || s.includes('ENTREGA TOTAL') || s === 'COMPROVADO')
    return { cor: '#22c55e', bg: 'rgba(34,197,94,.1)' };
  if (s === 'RETORNO' || s.includes('ENTREGA PARCIAL'))
    return { cor: '#f97316', bg: 'rgba(249,115,22,.1)' };
  if (s === 'CANCELADA')
    return { cor: '#ef4444', bg: 'rgba(239,68,68,.1)' };
  if (s === 'EM ROTA')
    return { cor: '#22c55e', bg: 'rgba(34,197,94,.1)' };
  if (s === 'CARREGADO')
    return { cor: '#3b82f6', bg: 'rgba(59,130,246,.1)' };
  return { cor: 'var(--muted)', bg: '' }; // ABERTO ou outro
}

function _statusLogTexto(logistica) {
  if (!logistica) return '';
  return logistica.status_log || (logistica.em_rota ? 'EM ROTA' : '');
}

function _statusPedidoInfo(p) {
  const statusLog = _statusLogTexto(p.logistica);
  if (p.status === 'emitido' && statusLog) {
    const { cor, bg } = _corLogistico(statusLog);
    return { label: statusLog.toUpperCase(), cor, bg };
  }
  switch (p.status) {
    case 'cancelado':     return { label: 'CANCELADO',     cor: '#ef4444', bg: 'rgba(239,68,68,.1)' };
    // Corte parcial mantém a cor/destaque de corte, mas mostra o status de
    // logística ao lado quando existe (pedido do usuário em 2026-08-13) —
    // pedido pode ter sido cortado E já estar em rota/entregue com o
    // restante.
    case 'corte_parcial': return { label: statusLog ? `CORTE PARCIAL · ${statusLog.toUpperCase()}` : 'CORTE PARCIAL', cor: '#f97316', bg: 'rgba(249,115,22,.1)' };
    case 'devolvido':     return { label: 'DEVOLVIDO',     cor: '#a855f7', bg: 'rgba(168,85,247,.1)' };
    case 'bonificado':    return { label: statusLog ? `BONIFICAÇÃO · ${statusLog.toUpperCase()}` : 'BONIFICAÇÃO', cor: '#3b82f6', bg: 'rgba(59,130,246,.1)' };
    default:              return { label: 'EMITIDO',       cor: '#22c55e', bg: '' };
  }
}

function _agruparPedidos(vendas) {
  const grupos = new Map();
  vendas.forEach((v, idx) => {
    const chave = _chavePedido(v, idx);
    if (!grupos.has(chave)) {
      grupos.set(chave, {
        chave, data: v.data, codcli: v.codcli, cliente: v.cliente,
        sistema: v.sistema, nunota: v.nunota,
        itens: [], valor: 0, qt: 0,
      });
    }
    const g = grupos.get(chave);
    g.itens.push(v);
    g.valor += v.valor;
    g.qt += v.qt;
  });
  return Array.from(grupos.values()).map(g => {
    let status = 'emitido';
    if (g.itens.some(it => it.cancelado)) status = 'cancelado';
    else if (g.itens.some(it => it.cancelado_parcial)) status = 'corte_parcial';
    else if (g.itens.every(it => it.devolvido)) status = 'devolvido';
    else if (g.itens.every(it => it.tipo === 'Bonificado')) status = 'bonificado';
    // Cancelado/devolvido não têm nota faturada com rota real (cancelado
    // nunca chega a sair, devolvido é a nota de estorno) — só busca
    // logística pros status que podem coexistir com uma entrega em curso.
    const logistica = (status === 'emitido' || status === 'corte_parcial' || status === 'bonificado')
      ? _logisticaDoPedido(g.sistema, g.nunota) : null;
    return { ...g, status, logistica };
  });
}

function _ordenarPedidosDesc(lista) {
  return lista.slice().sort((a, b) => {
    const [da, ma, ya] = a.data.split('/'); const [db, mb, yb] = b.data.split('/');
    return new Date(yb, mb-1, db) - new Date(ya, ma-1, da);
  });
}

let _pedidosAtuais = [];

function buildPedidosTable(pedidos) {
  _pedidosAtuais = pedidos;
  if (!pedidos || pedidos.length === 0) {
    return `<div class="vendas-empty">Nenhum pedido registrado este mês.</div>`;
  }
  const rows = pedidos.map((p, idx) => {
    const info = _statusPedidoInfo(p);
    const destacar = !!info.bg;
    const ref = p.itens[0];
    const numPedido = ref.nunota ? `NF ${ref.nunota}` : (ref.numped ? `Ped ${ref.numped}` : '—');
    return `
    <tr${destacar ? ` style="background:${info.bg}"` : ''}>
      <td class="vendas-date">${p.data || '—'}</td>
      <td>
        <div class="vendas-cli">${p.codcli ? p.codcli + ' · ' : ''}${p.cliente || '—'}</div>
        <div class="vendas-prod">
          ${numPedido} &middot; ${p.itens.length} ${p.itens.length === 1 ? 'item' : 'itens'}
          <span style="font-size:.62rem;background:${info.bg || 'rgba(34,197,94,.15)'};color:${info.cor};border:1px solid ${info.cor}55;border-radius:4px;padding:1px 5px;font-weight:700;margin-left:4px">${info.label}</span>
        </div>
      </td>
      <td class="vendas-qt">${Number(p.qt).toLocaleString('pt-BR')}</td>
      <td class="vendas-val" style="color:${info.cor || 'var(--accent)'}">${fmtFat(p.valor)}</td>
      <td style="text-align:right"><button class="btn" style="padding:4px 10px;font-size:.7rem" onclick="abrirDetalhesPedido(${idx})">Ver detalhes</button></td>
    </tr>`;
  }).join('');
  return `
    <table class="vendas-table">
      <thead>
        <tr>
          <th>Data</th>
          <th>Cliente / Pedido</th>
          <th style="text-align:right">Qtde</th>
          <th style="text-align:right">Valor</th>
          <th></th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>`;
}

function abrirDetalhesPedido(idx) {
  const p = _pedidosAtuais[idx];
  if (!p) return;
  const info = _statusPedidoInfo(p);
  const ref = p.itens[0];
  const numPedido = ref.nunota ? `Nota ${ref.nunota}` : (ref.numped ? `Pedido ${ref.numped}` : 'Sem identificador');
  const itensHtml = p.itens.map(it => `
    <tr>
      <td>
        ${it.produto || '—'}
        ${it.tipo === 'Bonificado' ? ' <span style="font-size:.6rem;color:#3b82f6;font-weight:700">BON</span>' : ''}
        ${it.devolvido ? ' <span style="font-size:.6rem;color:#a855f7;font-weight:700">DEV</span>' : ''}
        ${it.cancelado ? ' <span style="font-size:.6rem;color:#ef4444;font-weight:700">CANCELADO</span>' : ''}
        ${it.cancelado_parcial ? ' <span style="font-size:.6rem;color:#f97316;font-weight:700">CORTE</span>' : ''}
      </td>
      <td style="color:var(--muted);white-space:nowrap">${it.fantasia || '—'}</td>
      <td style="text-align:right">${Number(it.qt).toLocaleString('pt-BR')}</td>
      <td style="text-align:right">${fmtFat(it.valor)}</td>
    </tr>`).join('');
  const html = `
    <div class="modal-overlay" id="modal-pedido-overlay" onclick="if(event.target===this) fecharDetalhesPedido()">
      <div class="modal-pedido">
        <div class="modal-pedido-header">
          <div>
            <div class="modal-pedido-title">${numPedido}</div>
            <div class="modal-pedido-sub">${p.data || '—'} &middot; ${p.codcli ? p.codcli + ' · ' : ''}${p.cliente || '—'}</div>
          </div>
          <span style="font-size:.68rem;background:${info.bg || 'rgba(34,197,94,.15)'};color:${info.cor};border:1px solid ${info.cor}55;border-radius:5px;padding:2px 8px;font-weight:700;white-space:nowrap">${info.label}</span>
        </div>
        ${p.logistica && (p.logistica.rota || p.logistica.data_entrega) ? `<div style="font-size:.74rem;color:var(--muted);margin-top:6px">${p.logistica.rota ? `Rota: ${p.logistica.rota}${p.logistica.placa ? ' · Placa ' + p.logistica.placa : ''}` : ''}${p.logistica.rota && p.logistica.data_entrega ? ' &middot; ' : ''}${p.logistica.data_entrega ? `Entrega: ${p.logistica.data_entrega.split('-').reverse().join('/')}` : ''}</div>` : ''}
        <table class="vendas-table" style="margin-top:12px">
          <thead>
            <tr><th>Produto</th><th>Fornecedor</th><th style="text-align:right">Qtde</th><th style="text-align:right">Valor</th></tr>
          </thead>
          <tbody>${itensHtml}</tbody>
        </table>
        <div style="text-align:right;margin-top:10px;font-weight:700;color:var(--text)">Total: ${fmtFat(p.valor)}</div>
        <button class="btn" style="margin-top:14px" onclick="fecharDetalhesPedido()">Fechar</button>
      </div>
    </div>`;
  document.body.insertAdjacentHTML('beforeend', html);
}

function fecharDetalhesPedido() {
  const el = document.getElementById('modal-pedido-overlay');
  if (el) el.remove();
}

function buildNaoPosTable(lista) {
  if (!lista || lista.length === 0) {
    return `<div class="nao-pos-empty">Todos os clientes positivados este mês.</div>`;
  }
  const rows = lista.map(c => {
    const prods = (c.produtos || [])
      .filter(p => p.FANTASIA || p.DESCRICAO)
      .map(p => `<div class="nao-pos-sub">${p.FANTASIA}${p.FANTASIA && p.DESCRICAO ? ' · ' : ''}${p.DESCRICAO}</div>`)
      .join('');
    return `
    <tr>
      <td>
        <div class="nao-pos-cliente">
          ${c.CLIENTE || '—'}
          ${c.CODCLI ? `<strong>#${c.CODCLI}</strong>` : ''}
          ${c.BAIRROENT ? `<strong>${c.BAIRROENT}</strong>` : ''}
        </div>
        ${prods}
      </td>
      <td class="nao-pos-date">${c.DTULTCOMP || '—'}</td>
    </tr>`;
  }).join('');
  return `
    <table class="nao-pos-table">
      <thead>
        <tr>
          <th>Cliente</th>
          <th>Últ. compra</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>`;
}

// ── Previsão ──────────────────────────────────────────────

function buildPrevisao(v, pm) {
  const p = v.previsao;
  if (!p) return '';

  function diff(proj, media) {
    if (!media) return '';
    const d = ((proj - media) / media * 100);
    const sign = d >= 0 ? '+' : '';
    const color = d >= 0 ? 'var(--green)' : 'var(--red)';
    return `<span style="font-size:0.7rem;color:${color};margin-left:6px">${sign}${d.toFixed(1)}%</span>`;
  }

  const duRestantes = p.du_total - p.du_passados;

  const fatReal  = pm ? _mv(pm, 'fat_tt', 'realizado') : 0;
  const fatMeta  = pm ? _mv(pm, 'fat_tt', 'meta')      : 0;
  const fatNecDia = duRestantes > 0 ? (fatMeta - fatReal) / duRestantes : 0;
  const fatNecColor = fatNecDia <= 0 ? 'var(--green)' : 'var(--text)';

  const posReal  = pm ? _mv(pm, 'pos_tt', 'realizado') : 0;
  const posMeta  = pm ? _mv(pm, 'pos_tt', 'meta')      : 0;
  const posNecDia = duRestantes > 0 ? (posMeta - posReal) / duRestantes : 0;
  const posNecColor = posNecDia <= 0 ? 'var(--green)' : 'var(--text)';

  return `
    <div class="detail-card">
      <div class="section-title">Previsão de fechamento — ${p.du_passados} de ${p.du_total} dias úteis</div>
      <div class="prev-grid">
        <div class="prev-box">
          <div class="prev-box-label">Faturamento</div>
          <div class="prev-row">
            <span class="prev-row-label">Projeção (ritmo atual)</span>
            <span class="prev-row-val">${fmtFat(p.fat_proj)}${diff(p.fat_proj, p.fat_media_hist)}</span>
          </div>
          <div class="prev-row">
            <span class="prev-row-label">Média 3 meses anteriores</span>
            <span class="prev-row-val" style="color:var(--muted)">${fmtFat(p.fat_media_hist)}</span>
          </div>
          ${duRestantes > 0 ? `
          <div class="prev-row">
            <span class="prev-row-label">Necessário por dia (${duRestantes} dias)</span>
            <span class="prev-row-val" style="color:${fatNecColor}">${fatNecDia <= 0 ? '✓ Objetivo atingido' : fmtFat(fatNecDia)}</span>
          </div>` : ''}
        </div>
        <div class="prev-box">
          <div class="prev-box-label">Positivação</div>
          <div class="prev-row">
            <span class="prev-row-label">Projeção (ritmo atual)</span>
            <span class="prev-row-val">${Number(p.pos_proj).toFixed(0)} clientes${diff(p.pos_proj, p.pos_media_hist)}</span>
          </div>
          <div class="prev-row">
            <span class="prev-row-label">Média 3 meses anteriores</span>
            <span class="prev-row-val" style="color:var(--muted)">${Number(p.pos_media_hist).toFixed(0)} clientes</span>
          </div>
          ${duRestantes > 0 ? `
          <div class="prev-row">
            <span class="prev-row-label">Necessário por dia (${duRestantes} dias)</span>
            <span class="prev-row-val" style="color:${posNecColor}">${posNecDia <= 0 ? '✓ Objetivo atingido' : Number(posNecDia).toFixed(1) + ' clientes'}</span>
          </div>` : ''}
        </div>
      </div>
    </div>`;
}

// ── Gráficos ──────────────────────────────────────────────

const CHART_DEFAULTS = {
  responsive: true,
  maintainAspectRatio: false,
  plugins: { legend: { labels: { color: '#94a3b8', font: { size: 11 }, boxWidth: 14 } } },
  scales: {
    x: { ticks: { color: '#94a3b8', font: { size: 10 } }, grid: { color: '#2d3144' } },
    y: { ticks: { color: '#94a3b8', font: { size: 10 } }, grid: { color: '#2d3144' } },
  }
};

function avgLine(labels, avg) {
  return {
    label: 'Média',
    data: labels.map(() => avg),
    type: 'line',
    borderColor: '#94a3b8',
    borderWidth: 1.5,
    borderDash: [5, 3],
    pointRadius: 0,
    order: 0,
  };
}

function _idxMesmoMesAnoAnterior(labels) {
  if (!labels.length) return -1;
  const [nome, ano] = labels[labels.length - 1].split('/');
  for (let i = 0; i < labels.length - 1; i++) {
    const p = labels[i].split('/');
    if (p[0] === nome && parseInt(p[1], 10) === parseInt(ano, 10) - 1) return i;
  }
  return -1;
}

function _coresBarrasHist(labels, corAtual, corFraca) {
  const idxAtual  = labels.length - 1;
  const idxAnoAnt = _idxMesmoMesAnoAnterior(labels);
  return labels.map((_, i) => {
    if (i === idxAtual)  return corAtual;
    if (i === idxAnoAnt) return 'rgba(168,85,247,0.85)';
    return corFraca;
  });
}

function buildCharts(v) {
  const hist = v.historico || [];
  if (!hist.length) return;

  const labels = hist.map(d => d.mes);

  // -- Faturamento --
  const fatVals = hist.map(d => d.fat);
  const fatAvg  = fatVals.reduce((a, b) => a + b, 0) / fatVals.length;
  new Chart(document.getElementById('chart-fat'), {
    type: 'bar',
    data: {
      labels,
      datasets: [
        {
          label: 'Faturamento',
          data: fatVals,
          backgroundColor: _coresBarrasHist(labels, 'rgba(245,197,24,0.85)', 'rgba(245,197,24,0.4)'),
          borderColor: '#f5c518',
          borderWidth: 1,
          order: 1,
        },
        { ...avgLine(labels, fatAvg), label: `Média ${fmtFat(fatAvg)}` },
      ]
    },
    options: {
      ...CHART_DEFAULTS,
      plugins: {
        ...CHART_DEFAULTS.plugins,
        tooltip: { callbacks: { label: ctx => ctx.dataset.type === 'line'
          ? `Média: ${fmtFat(fatAvg)}`
          : `Fat: ${fmtFat(ctx.raw)}` } }
      },
      scales: {
        x: CHART_DEFAULTS.scales.x,
        y: { ...CHART_DEFAULTS.scales.y, ticks: { ...CHART_DEFAULTS.scales.y.ticks,
          callback: v => 'R$' + (v >= 1000 ? (v/1000).toFixed(0)+'k' : v) } }
      }
    }
  });

  // -- Positivação --
  const posVals = hist.map(d => d.pos);
  const posAvg  = posVals.reduce((a, b) => a + b, 0) / posVals.length;
  new Chart(document.getElementById('chart-pos'), {
    type: 'bar',
    data: {
      labels,
      datasets: [
        {
          label: 'Clientes positivados',
          data: posVals,
          backgroundColor: _coresBarrasHist(labels, 'rgba(34,197,94,0.85)', 'rgba(34,197,94,0.4)'),
          borderColor: '#22c55e',
          borderWidth: 1,
          order: 1,
        },
        { ...avgLine(labels, posAvg), label: `Média ${posAvg.toFixed(1)}` },
      ]
    },
    options: {
      ...CHART_DEFAULTS,
      plugins: {
        ...CHART_DEFAULTS.plugins,
        tooltip: { callbacks: { label: ctx => ctx.dataset.type === 'line'
          ? `Média: ${posAvg.toFixed(1)}`
          : `Clientes: ${ctx.raw}` } }
      },
      scales: {
        x: CHART_DEFAULTS.scales.x,
        y: { ...CHART_DEFAULTS.scales.y, ticks: { ...CHART_DEFAULTS.scales.y.ticks,
          stepSize: 1 } }
      }
    }
  });
}

// ── Mês selecionado (estado global) ──────────────────────────────────────────

let _mesSel = null;
function _getMes() { return _mesSel || (METAS_DATA.meses && METAS_DATA.meses[0]) || ''; }
function _pm(v, mes) { return (v.por_mes || {})[mes] || {}; }
function _mv(pm, campo, sub) { return ((pm[campo] || {})[sub]) || 0; }

// Combina meses de METAS_DATA e VENDAS_DATA, ordenados do mais recente ao mais antigo
const _MESES_ORD = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
function _todosMeses() {
  const _key = m => { const [n, a] = m.split('/'); return (2000 + +a) * 12 + _MESES_ORD.indexOf(n); };
  const set = new Set([
    ...(METAS_DATA.meses || []),
    ...(typeof VENDAS_DATA !== 'undefined' ? VENDAS_DATA.meses : []),
  ]);
  return [...set].sort((a, b) => _key(b) - _key(a));
}

// Mês anterior no formato "Mmm/AA" (ex: "Ago/26" -> "Jul/26")
function _mesAnterior(mes) {
  const [n, a] = mes.split('/');
  let idx = _MESES_ORD.indexOf(n) - 1;
  let ano = +a;
  if (idx < 0) { idx = 11; ano -= 1; }
  return `${_MESES_ORD[idx]}/${String(ano).padStart(2, '0')}`;
}

// Quantos dias corridos tem o mês "Mmm/AA"
function _diasNoMes(mes) {
  const [n, a] = mes.split('/');
  const idx = _MESES_ORD.indexOf(n);
  return new Date(2000 + +a, idx + 1, 0).getDate();
}

// Dias corridos já passados no mês "Mmm/AA": se for o mês corrente de
// verdade, é o dia de hoje; se for um mês já fechado (histórico), é o mês
// inteiro — pra comparação com o mês anterior fazer sentido nos dois casos.
function _diasPassadosNoMes(mes) {
  const mesAtualReal = _todosMeses()[0];
  if (mes === mesAtualReal) return new Date().getDate();
  return _diasNoMes(mes);
}

// ── Download CSV ──────────────────────────────────────────

function downloadCSV(v, mes) {
  mes = mes || _getMes();
  const pm  = _pm(v, mes);
  const sep = ';';
  const atualizado = METAS_DATA.atualizado_em || '';

  function pctStr(real, meta) {
    if (!meta) return '0%';
    return ((real / meta) * 100).toFixed(1) + '%';
  }
  function numBR(n) { return Number(n).toFixed(2).replace('.', ','); }
  function fat(c) { return _mv(pm, c, 'realizado'); }
  function meta(c) { return _mv(pm, c, 'meta'); }

  const rows = [];

  rows.push([`RELATÓRIO DE OBJETIVOS${sep}${v.nome}${sep}RCA ${v.rca}`]);
  rows.push([`Mês${sep}${mes}`]);
  rows.push([`Atualizado em${sep}${atualizado}`]);
  rows.push(['']);

  rows.push([`FATURAMENTO${sep}Objetivo${sep}Realizado${sep}%`]);
  rows.push([`Total${sep}${numBR(meta('fat_tt'))}${sep}${numBR(fat('fat_tt'))}${sep}${pctStr(fat('fat_tt'), meta('fat_tt'))}`]);
  rows.push([`Castas${sep}${numBR(meta('fat_castas'))}${sep}${numBR(fat('fat_castas'))}${sep}${pctStr(fat('fat_castas'), meta('fat_castas'))}`]);
  if (meta('fat_domecq_passport') > 0) rows.push([`Domecq + Passport${sep}${numBR(meta('fat_domecq_passport'))}${sep}${numBR(fat('fat_domecq_passport'))}${sep}${pctStr(fat('fat_domecq_passport'), meta('fat_domecq_passport'))}`]);
  rows.push([`${meta('fat_domecq_passport') > 0 ? 'HOB + Azeite' : 'Azeite + Zé Tona'}${sep}${numBR(meta('fat_hob_azeite'))}${sep}${numBR(fat('fat_hob_azeite'))}${sep}${pctStr(fat('fat_hob_azeite'), meta('fat_hob_azeite'))}`]);
  rows.push(['']);

  rows.push([`POSITIVAÇÃO${sep}Objetivo${sep}Realizado${sep}%`]);
  rows.push([`Total${sep}${meta('pos_tt')}${sep}${fat('pos_tt')}${sep}${pctStr(fat('pos_tt'), meta('pos_tt'))}`]);
  rows.push([`HOB + Azeite${sep}${meta('pos_hob_azeite')}${sep}${fat('pos_hob_azeite')}${sep}${pctStr(fat('pos_hob_azeite'), meta('pos_hob_azeite'))}`]);
  rows.push([`Reckitt${sep}${meta('pos_reckit')}${sep}${fat('pos_reckit')}${sep}${pctStr(fat('pos_reckit'), meta('pos_reckit'))}`]);
  rows.push([`Robinson Crusoe${sep}${meta('pos_crusoe')}${sep}${fat('pos_crusoe')}${sep}${pctStr(fat('pos_crusoe'), meta('pos_crusoe'))}`]);
  rows.push([`Tatuzinho${sep}${meta('pos_tatuzinho')}${sep}${fat('pos_tatuzinho')}${sep}${pctStr(fat('pos_tatuzinho'), meta('pos_tatuzinho'))}`]);
  rows.push([`Red Bull${sep}${meta('pos_redbull')}${sep}${fat('pos_redbull')}${sep}${pctStr(fat('pos_redbull'), meta('pos_redbull'))}`]);
  rows.push([`Pinatti${sep}${meta('pos_pinatti')}${sep}${fat('pos_pinatti')}${sep}${pctStr(fat('pos_pinatti'), meta('pos_pinatti'))}`]);
  rows.push(['']);

  if (v.previsao) {
    const p = v.previsao;
    rows.push([`PREVISÃO DE FECHAMENTO${sep}Dias úteis passados${sep}${p.du_passados} de ${p.du_total}`]);
    rows.push([`Faturamento${sep}Projeção${sep}${numBR(p.fat_proj)}${sep}Média 3m${sep}${numBR(p.fat_media_hist)}`]);
    rows.push([`Positivação${sep}Projeção${sep}${Number(p.pos_proj).toFixed(0)}${sep}Média 3m${sep}${Number(p.pos_media_hist).toFixed(0)}`]);
    rows.push(['']);
  }

  if (v.historico && v.historico.length) {
    rows.push([`HISTÓRICO MENSAL${sep}Faturamento${sep}Positivação`]);
    v.historico.forEach(h => rows.push([`${h.mes}${sep}${numBR(h.fat)}${sep}${h.pos}`]));
    rows.push(['']);
  }

  rows.push([`CLIENTES NÃO POSITIVADOS${sep}Código${sep}Bairro${sep}Última Compra${sep}Marcas`]);
  if (!v.nao_positivados || v.nao_positivados.length === 0) {
    rows.push([`Todos os clientes positivados este mês.`]);
  } else {
    v.nao_positivados.forEach(c => {
      const marcas = (c.produtos || []).map(p => p.FANTASIA || p.DESCRICAO || '').filter(Boolean).join(' | ');
      rows.push([`${c.CLIENTE || ''}${sep}${c.CODCLI || ''}${sep}${c.BAIRROENT || ''}${sep}${c.DTULTCOMP || ''}${sep}${marcas}`]);
    });
  }

  const csv  = '\uFEFF' + rows.map(r => r[0]).join('\r\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url;
  a.download = `metas_${v.nome.replace(/\s+/g, '_')}_${mes.replace('/', '_')}.csv`;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 500);
}

function _vendasDoMes(nomeVendedor, mes) {

function _ordenarVendasDesc(lista) {
  return lista.slice().sort((a, b) => {

function getParam() {
  return new URLSearchParams(window.location.search).get('vendedor') || null;
}

function linkFor(nome) {
  return location.origin + location.pathname + '?vendedor=' + encodeURIComponent(nome);
}

function copyLink(nome, btn) {
  navigator.clipboard.writeText(linkFor(nome)).then(() => {
    btn.classList.add('copied');
    btn.textContent = '\u2713 Copiado!';
    setTimeout(() => {
      btn.classList.remove('copied');
      btn.innerHTML = '\uD83D\uDD17 Copiar link';
    }, 2500);
  });
}

function voltarParaTodos() {
  const HASH = 'b4ba917b95850dc43cce91dba3be9fd1a4f029e18b81d6846a7183839c81d8dd';
  const senha = prompt('Digite a senha para acessar todos os vendedores:');
  if (senha === null) return;
  crypto.subtle.digest('SHA-256', new TextEncoder().encode(senha))
    .then(buf => Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join(''))
    .then(hash => {
      if (hash === HASH) {
        sessionStorage.setItem('rg_auth', HASH);
        window.location.href = location.pathname;
      } else {
        alert('Senha incorreta.');
      }
    });
}

// 'Bloqueado (alçada)' não entra — pedido explícito do usuário em 2026-08-10.
const _POSICOES_PROBLEMA_PED = { 'Pendente': 1, 'Bloqueado': 1 };

function _normNomePedido(s) {
  return (s || '').toUpperCase().replace(/\s*-?\s*OFF\s*TRADE\s*(SP|MG|ES)?\s*/gi, '').replace(/\s*-\s*$/, '').trim();
}

function _pedidosPendentesVendedor(nomeVendedor) {
  if (typeof PEDIDOS_DATA === 'undefined') return [];
  const alvo = _normNomePedido(nomeVendedor);
  return (PEDIDOS_DATA.pedidos_feitos || []).filter(p =>
    _POSICOES_PROBLEMA_PED[p.posicao] && _normNomePedido(p.nome) === alvo);
}

function _buildAvisoPedidos(nomeVendedor) {
  const lista = _pedidosPendentesVendedor(nomeVendedor);
  if (!lista.length) return '';
  const itens = lista.map(p => `
    <div style="padding:6px 0;border-bottom:1px solid var(--border)">
      <div><strong>Ped ${p.numped}</strong> — ${p.cliente} — ${fmtFat(p.total)} <span style="color:var(--muted)">(${p.posicao})</span></div>
      ${p.motivo ? `<div style="font-size:.72rem;color:var(--muted)">Motivo: ${p.motivo}${(p.motivo_preco_digitado != null && p.motivo_preco_tabela != null) ? ` — ${p.motivo_produto} (digitado ${fmtFat(p.motivo_preco_digitado)} · tabela ${fmtFat(p.motivo_preco_tabela)})` : ''}</div>` : ''}
    </div>`).join('');
  return `
    <div class="detail-card" style="border-color:var(--red)">
      <div class="sec-title" style="color:var(--red)">&#9888; ${lista.length} pedido${lista.length > 1 ? 's' : ''} pendente${lista.length > 1 ? 's' : ''}/bloqueado${lista.length > 1 ? 's' : ''}</div>
      <div style="margin-top:10px">${itens}</div>
    </div>`;
}

function renderDetail(v, mes) {
  mes = mes || _getMes();
  _mesSel = mes;
  var cb = document.querySelector('.camp-bar');
  if (cb) cb.style.display = 'none';
  const pm = _pm(v, mes);

  function r(c) { return _mv(pm, c, 'realizado'); }
  function m(c) { return _mv(pm, c, 'meta'); }

  const _p = v.previsao;
  const _duRestantes = _p ? _p.du_total - _p.du_passados : 0;
  const _necHtml = (campo, fmt) => {
    if (!_duRestantes || !m(campo)) return '';
    const necDia = (m(campo) - r(campo)) / _duRestantes;
    const cor = necDia <= 0 ? 'var(--green)' : 'var(--text)';
    const txt = necDia <= 0 ? '&#10003; Objetivo atingido' : `Necess./dia (${_duRestantes}d): ${fmt(necDia)}`;
    return `<div style="font-size:.68rem;color:${cor};margin-top:2px">${txt}</div>`;
  };

  document.getElementById('header-sub').textContent = `Atualizado ${METAS_DATA.atualizado_em}`;
