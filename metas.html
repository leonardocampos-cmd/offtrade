<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Metas OFF TRADE RJ</title>
  <script src="metas_data.js"></script>
  <script src="vendas_data.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --card: #1a1d27;
      --card2: #22263a;
      --accent: #f5c518;
      --green: #22c55e;
      --yellow: #eab308;
      --red: #ef4444;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --border: #2d3144;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      padding: 16px;
      max-width: 960px;
      margin: 0 auto;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
      gap: 12px;
    }

    .header-title h1 {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: -0.02em;
    }

    .header-title p {
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 3px;
    }

    /* Botões */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--card2);
      color: var(--text);
      text-decoration: none;
      transition: all 0.15s;
    }
    .btn:hover { border-color: var(--accent); color: var(--accent); }
    .btn-primary { background: var(--accent); color: #111; border-color: var(--accent); font-weight: 700; }
    .btn-primary:hover { background: #d4a90e; color: #111; }
    .btn.copied { border-color: var(--green); color: var(--green); }
    .btn-dl { border-color: #2d6a4f; color: #52b788; }
    .btn-dl:hover { border-color: #52b788; color: #52b788; background: rgba(82,183,136,0.1); }

    /* Ring */
    .ring-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 8px 0 24px;
    }
    .ring-label {
      font-size: 0.72rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 10px;
    }
    .ring-container {
      position: relative;
      width: 150px;
      height: 150px;
    }
    .ring-container svg { transform: rotate(-90deg); }
    .ring-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      width: 100%;
    }
    .ring-pct { font-size: 1.7rem; font-weight: 800; }
    .ring-val { font-size: 0.72rem; color: var(--text); margin-top: 2px; }
    .ring-meta { font-size: 0.65rem; color: var(--muted); }

    /* Cards grid */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 14px;
    }

    .vendor-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
      transition: border-color 0.2s, transform 0.15s;
    }
    .vendor-card:hover { border-color: var(--accent); transform: translateY(-2px); }

    .vendor-name { font-size: 0.95rem; font-weight: 600; margin-bottom: 2px; }
    .vendor-rca { font-size: 0.72rem; color: var(--muted); margin-bottom: 14px; }

    .card-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 14px;
      gap: 8px;
    }

    /* Progress bar */
    .metric { margin-bottom: 12px; }
    .metric-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 5px;
      gap: 8px;
    }
    .metric-name { font-size: 0.75rem; color: var(--muted); flex: 1; }
    .metric-right { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
    .metric-values { font-size: 0.75rem; color: var(--text); }
    .metric-pct {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 5px;
      min-width: 38px;
      text-align: center;
    }
    .pct-green { background: rgba(34,197,94,0.15); color: var(--green); }
    .pct-yellow { background: rgba(234,179,8,0.15); color: var(--yellow); }
    .pct-red { background: rgba(239,68,68,0.15); color: var(--red); }

    .bar-bg { background: var(--card2); border-radius: 99px; height: 5px; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 99px; transition: width 0.8s ease; }
    .bar-green { background: var(--green); }
    .bar-yellow { background: var(--yellow); }
    .bar-red { background: var(--red); }

    /* Detail */
    .detail-header {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    .detail-name { font-size: 1.25rem; font-weight: 700; }
    .detail-rca { font-size: 0.78rem; color: var(--muted); margin-top: 2px; }

    .detail-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px 20px;
      margin-bottom: 12px;
    }

    .section-title {
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 14px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }

    /* Search */
    .search-wrap { margin-bottom: 18px; }
    .search-input {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 16px;
      color: var(--text);
      font-size: 0.9rem;
      outline: none;
    }
    .search-input:focus { border-color: var(--accent); }
    .search-input::placeholder { color: var(--muted); }

    .no-data {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
      line-height: 1.8;
    }
    .no-data strong { color: var(--text); }

    /* Tabela não positivados */
    .nao-pos-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.76rem;
      margin-top: 4px;
    }
    .nao-pos-table th {
      text-align: left;
      color: var(--muted);
      font-weight: 600;
      padding: 6px 8px;
      border-bottom: 1px solid var(--border);
    }
    .nao-pos-table td {
      padding: 7px 8px;
      border-bottom: 1px solid rgba(45,49,68,0.5);
      vertical-align: top;
    }
    .nao-pos-table tr:last-child td { border-bottom: none; }
    .nao-pos-table tr:hover td { background: var(--card2); }
    .nao-pos-cliente { font-weight: 500; color: var(--text); }
    .nao-pos-sub { color: var(--muted); font-size: 0.7rem; margin-top: 2px; }
    .nao-pos-date { color: var(--red); white-space: nowrap; }
    .nao-pos-empty { color: var(--muted); font-size: 0.8rem; padding: 12px 0; }

    .chart-wrap { position: relative; height: 200px; }

    /* Tabela de vendas */
    .vendas-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.76rem;
      margin-top: 4px;
    }
    .vendas-table th {
      text-align: left;
      color: var(--muted);
      font-weight: 600;
      padding: 6px 8px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    .vendas-table td {
      padding: 7px 8px;
      border-bottom: 1px solid rgba(45,49,68,0.5);
      vertical-align: top;
    }
    .vendas-table tr:last-child td { border-bottom: none; }
    .vendas-table tr:hover td { background: var(--card2); }
    .vendas-date  { color: var(--muted); white-space: nowrap; font-size: 0.72rem; }
    .vendas-cli   { font-weight: 500; color: var(--text); }
    .vendas-prod  { color: var(--muted); font-size: 0.72rem; }
    .vendas-qt    { text-align: right; color: var(--text); white-space: nowrap; }
    .vendas-val   { text-align: right; color: var(--accent); white-space: nowrap; font-weight: 600; }
    .vendas-empty { color: var(--muted); font-size: 0.8rem; padding: 12px 0; }

    .prev-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 4px;
    }
    .prev-box {
      background: var(--card2);
      border-radius: 8px;
      padding: 12px 14px;
    }
    .prev-box-label {
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin-bottom: 10px;
    }
    .prev-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 6px;
    }
    .prev-row-label { font-size: 0.72rem; color: var(--muted); }
    .prev-row-val   { font-size: 0.88rem; font-weight: 700; color: var(--text); }
    .prev-du {
      font-size: 0.65rem;
      color: var(--muted);
      margin-top: 8px;
      padding-top: 6px;
      border-top: 1px solid var(--border);
    }

    .mes-select {
      background: var(--card2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 0.85rem;
      padding: 7px 12px;
      cursor: pointer;
      outline: none;
    }
    .mes-select:focus { border-color: var(--accent); }

    .vendas-resumo {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }
    .vendas-resumo-box {
      background: var(--card2);
      border-radius: 8px;
      padding: 10px 16px;
      flex: 1;
      min-width: 120px;
    }
    .vendas-resumo-label { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin-bottom: 4px; }
    .vendas-resumo-val   { font-size: 1rem; font-weight: 700; color: var(--text); }

    @media (max-width: 480px) {
      .cards-grid { grid-template-columns: 1fr; }
      body { padding: 12px; }
    }
  </style>
</head>
<body>

<header>
  <div class="header-title">
    <h1>&#9679; METAS OFF TRADE RJ</h1>
    <p id="header-sub">Acompanhamento de Metas</p>
  </div>
  <div id="header-actions"></div>
</header>

<div id="app"></div>

<script>
// ── Utilitários ──────────────────────────────────────────

function fmtFat(val) {
  return 'R$\u00a0' + Number(val).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function fmtPos(val) {
  return Number(val).toLocaleString('pt-BR');
}
function fmt(val, tipo) {
  return tipo === 'fat' ? fmtFat(val) : fmtPos(val);
}

function pct(real, meta) {
  if (!meta || meta === 0) return 0;
  return (real / meta) * 100;
}

function pctClass(p) {
  if (p >= 100) return 'green';
  if (p >= 70)  return 'yellow';
  return 'red';
}

function ringColor(p) {
  if (p >= 100) return '#22c55e';
  if (p >= 70)  return '#eab308';
  return '#ef4444';
}

// ── Componentes HTML ─────────────────────────────────────

function buildRing(pctVal, realFmt, metaFmt) {
  const r = 58, cx = 75, cy = 75;
  const circ = 2 * Math.PI * r;
  const fill = Math.min(pctVal, 100) / 100 * circ;
  const color = ringColor(pctVal);
  const pctDisplay = pctVal > 999 ? '>999%' : pctVal.toFixed(1) + '%';
  return `
    <div class="ring-wrap">
      <div class="ring-label">Faturamento Total</div>
      <div class="ring-container">
        <svg width="150" height="150" viewBox="0 0 150 150">
          <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#22263a" stroke-width="13"/>
          <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}" stroke-width="13"
            stroke-dasharray="${fill} ${circ}" stroke-linecap="round"/>
        </svg>
        <div class="ring-text">
          <div class="ring-pct" style="color:${color}">${pctDisplay}</div>
          <div class="ring-val">${realFmt}</div>
          <div class="ring-meta">meta ${metaFmt}</div>
        </div>
      </div>
    </div>`;
}

function buildBar(name, realizado, meta, tipo) {
  const p     = pct(realizado, meta);
  const cls   = pctClass(p);
  const pDisp = p > 999 ? '>999' : p.toFixed(0);
  return `
    <div class="metric">
      <div class="metric-header">
        <span class="metric-name">${name}</span>
        <div class="metric-right">
          <span class="metric-values">${fmt(realizado, tipo)} / ${fmt(meta, tipo)}</span>
          <span class="metric-pct pct-${cls}">${pDisp}%</span>
        </div>
      </div>
      <div class="bar-bg">
        <div class="bar-fill bar-${cls}" style="width:${Math.min(p, 100)}%"></div>
      </div>
    </div>`;
}

function buildVendasTable(lista) {
  if (!lista || lista.length === 0) {
    return `<div class="vendas-empty">Nenhuma venda registrada este mês.</div>`;
  }
  const rows = lista.map(v => `
    <tr>
      <td class="vendas-date">${v.data || '—'}</td>
      <td>
        <div class="vendas-cli">${v.cliente || '—'}</div>
        <div class="vendas-prod">${v.produto || ''}</div>
      </td>
      <td class="vendas-qt">${Number(v.qt).toLocaleString('pt-BR')}</td>
      <td class="vendas-val">${fmtFat(v.valor)}</td>
    </tr>`).join('');
  return `
    <table class="vendas-table">
      <thead>
        <tr>
          <th>Data</th>
          <th>Cliente / Produto</th>
          <th style="text-align:right">Qtde</th>
          <th style="text-align:right">Valor</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>`;
}

function buildNaoPosTable(lista) {
  if (!lista || lista.length === 0) {
    return `<div class="nao-pos-empty">Todos os clientes positivados este mês.</div>`;
  }
  const rows = lista.map(c => {
    const prods = (c.produtos || [])
      .filter(p => p.FANTASIA || p.DESCRICAO)
      .map(p => `<div class="nao-pos-sub">${p.FANTASIA}${p.FANTASIA && p.DESCRICAO ? ' · ' : ''}${p.DESCRICAO}</div>`)
      .join('');
    return `
    <tr>
      <td>
        <div class="nao-pos-cliente">
          ${c.CLIENTE || '—'}
          ${c.CODCLI ? `<strong>#${c.CODCLI}</strong>` : ''}
          ${c.BAIRROENT ? `<strong>${c.BAIRROENT}</strong>` : ''}
        </div>
        ${prods}
      </td>
      <td class="nao-pos-date">${c.DTULTCOMP || '—'}</td>
    </tr>`;
  }).join('');
  return `
    <table class="nao-pos-table">
      <thead>
        <tr>
          <th>Cliente</th>
          <th>Últ. compra</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>`;
}

// ── Previsão ──────────────────────────────────────────────

function buildPrevisao(v) {
  const p = v.previsao;
  if (!p) return '';

  function diff(proj, media) {
    if (!media) return '';
    const d = ((proj - media) / media * 100);
    const sign = d >= 0 ? '+' : '';
    const color = d >= 0 ? 'var(--green)' : 'var(--red)';
    return `<span style="font-size:0.7rem;color:${color};margin-left:6px">${sign}${d.toFixed(1)}%</span>`;
  }

  return `
    <div class="detail-card">
      <div class="section-title">Previsão de fechamento — ${p.du_passados} de ${p.du_total} dias úteis</div>
      <div class="prev-grid">
        <div class="prev-box">
          <div class="prev-box-label">Faturamento</div>
          <div class="prev-row">
            <span class="prev-row-label">Projeção (ritmo atual)</span>
            <span class="prev-row-val">${fmtFat(p.fat_proj)}${diff(p.fat_proj, p.fat_media_hist)}</span>
          </div>
          <div class="prev-row">
            <span class="prev-row-label">Média 3 meses anteriores</span>
            <span class="prev-row-val" style="color:var(--muted)">${fmtFat(p.fat_media_hist)}</span>
          </div>
        </div>
        <div class="prev-box">
          <div class="prev-box-label">Positivação</div>
          <div class="prev-row">
            <span class="prev-row-label">Projeção (ritmo atual)</span>
            <span class="prev-row-val">${Number(p.pos_proj).toFixed(0)} clientes${diff(p.pos_proj, p.pos_media_hist)}</span>
          </div>
          <div class="prev-row">
            <span class="prev-row-label">Média 3 meses anteriores</span>
            <span class="prev-row-val" style="color:var(--muted)">${Number(p.pos_media_hist).toFixed(0)} clientes</span>
          </div>
        </div>
      </div>
    </div>`;
}

// ── Gráficos ──────────────────────────────────────────────

const CHART_DEFAULTS = {
  responsive: true,
  maintainAspectRatio: false,
  plugins: { legend: { labels: { color: '#94a3b8', font: { size: 11 }, boxWidth: 14 } } },
  scales: {
    x: { ticks: { color: '#94a3b8', font: { size: 10 } }, grid: { color: '#2d3144' } },
    y: { ticks: { color: '#94a3b8', font: { size: 10 } }, grid: { color: '#2d3144' } },
  }
};

function avgLine(labels, avg) {
  return {
    label: 'Média',
    data: labels.map(() => avg),
    type: 'line',
    borderColor: '#94a3b8',
    borderWidth: 1.5,
    borderDash: [5, 3],
    pointRadius: 0,
    order: 0,
  };
}

function buildCharts(v) {
  const hist = v.historico || [];
  if (!hist.length) return;

  const labels = hist.map(d => d.mes);

  // -- Faturamento --
  const fatVals = hist.map(d => d.fat);
  const fatAvg  = fatVals.reduce((a, b) => a + b, 0) / fatVals.length;
  new Chart(document.getElementById('chart-fat'), {
    type: 'bar',
    data: {
      labels,
      datasets: [
        {
          label: 'Faturamento',
          data: fatVals,
          backgroundColor: labels.map((_, i) => i === labels.length - 1
            ? 'rgba(245,197,24,0.85)' : 'rgba(245,197,24,0.4)'),
          borderColor: '#f5c518',
          borderWidth: 1,
          order: 1,
        },
        { ...avgLine(labels, fatAvg), label: `Média ${fmtFat(fatAvg)}` },
      ]
    },
    options: {
      ...CHART_DEFAULTS,
      plugins: {
        ...CHART_DEFAULTS.plugins,
        tooltip: { callbacks: { label: ctx => ctx.dataset.type === 'line'
          ? `Média: ${fmtFat(fatAvg)}`
          : `Fat: ${fmtFat(ctx.raw)}` } }
      },
      scales: {
        x: CHART_DEFAULTS.scales.x,
        y: { ...CHART_DEFAULTS.scales.y, ticks: { ...CHART_DEFAULTS.scales.y.ticks,
          callback: v => 'R$' + (v >= 1000 ? (v/1000).toFixed(0)+'k' : v) } }
      }
    }
  });

  // -- Positivação --
  const posVals = hist.map(d => d.pos);
  const posAvg  = posVals.reduce((a, b) => a + b, 0) / posVals.length;
  new Chart(document.getElementById('chart-pos'), {
    type: 'bar',
    data: {
      labels,
      datasets: [
        {
          label: 'Clientes positivados',
          data: posVals,
          backgroundColor: labels.map((_, i) => i === labels.length - 1
            ? 'rgba(34,197,94,0.85)' : 'rgba(34,197,94,0.4)'),
          borderColor: '#22c55e',
          borderWidth: 1,
          order: 1,
        },
        { ...avgLine(labels, posAvg), label: `Média ${posAvg.toFixed(1)}` },
      ]
    },
    options: {
      ...CHART_DEFAULTS,
      plugins: {
        ...CHART_DEFAULTS.plugins,
        tooltip: { callbacks: { label: ctx => ctx.dataset.type === 'line'
          ? `Média: ${posAvg.toFixed(1)}`
          : `Clientes: ${ctx.raw}` } }
      },
      scales: {
        x: CHART_DEFAULTS.scales.x,
        y: { ...CHART_DEFAULTS.scales.y, ticks: { ...CHART_DEFAULTS.scales.y.ticks,
          stepSize: 1 } }
      }
    }
  });
}

// ── Mês selecionado (estado global) ──────────────────────────────────────────

let _mesSel = null;
function _getMes() { return _mesSel || (METAS_DATA.meses && METAS_DATA.meses[0]) || ''; }
function _pm(v, mes) { return (v.por_mes || {})[mes] || {}; }
function _mv(pm, campo, sub) { return ((pm[campo] || {})[sub]) || 0; }

// ── Download CSV ──────────────────────────────────────────

function downloadCSV(v, mes) {
  mes = mes || _getMes();
  const pm  = _pm(v, mes);
  const sep = ';';
  const atualizado = METAS_DATA.atualizado_em || '';

  function pctStr(real, meta) {
    if (!meta) return '0%';
    return ((real / meta) * 100).toFixed(1) + '%';
  }
  function numBR(n) { return Number(n).toFixed(2).replace('.', ','); }
  function fat(c) { return _mv(pm, c, 'realizado'); }
  function meta(c) { return _mv(pm, c, 'meta'); }

  const rows = [];

  rows.push([`RELATÓRIO DE METAS${sep}${v.nome}${sep}RCA ${v.rca}`]);
  rows.push([`Mês${sep}${mes}`]);
  rows.push([`Atualizado em${sep}${atualizado}`]);
  rows.push(['']);

  rows.push([`FATURAMENTO${sep}Meta${sep}Realizado${sep}%`]);
  rows.push([`Total${sep}${numBR(meta('fat_tt'))}${sep}${numBR(fat('fat_tt'))}${sep}${pctStr(fat('fat_tt'), meta('fat_tt'))}`]);
  rows.push([`Castas${sep}${numBR(meta('fat_castas'))}${sep}${numBR(fat('fat_castas'))}${sep}${pctStr(fat('fat_castas'), meta('fat_castas'))}`]);
  rows.push([`Domecq + Passport${sep}${numBR(meta('fat_domecq_passport'))}${sep}${numBR(fat('fat_domecq_passport'))}${sep}${pctStr(fat('fat_domecq_passport'), meta('fat_domecq_passport'))}`]);
  rows.push([`HOB + Azeite${sep}${numBR(meta('fat_hob_azeite'))}${sep}${numBR(fat('fat_hob_azeite'))}${sep}${pctStr(fat('fat_hob_azeite'), meta('fat_hob_azeite'))}`]);
  rows.push(['']);

  rows.push([`POSITIVAÇÃO${sep}Meta${sep}Realizado${sep}%`]);
  rows.push([`Total${sep}${meta('pos_tt')}${sep}${fat('pos_tt')}${sep}${pctStr(fat('pos_tt'), meta('pos_tt'))}`]);
  rows.push([`HOB + Azeite${sep}${meta('pos_hob_azeite')}${sep}${fat('pos_hob_azeite')}${sep}${pctStr(fat('pos_hob_azeite'), meta('pos_hob_azeite'))}`]);
  rows.push([`Reckitt${sep}${meta('pos_reckit')}${sep}${fat('pos_reckit')}${sep}${pctStr(fat('pos_reckit'), meta('pos_reckit'))}`]);
  rows.push([`Robinson Crusoe${sep}${meta('pos_crusoe')}${sep}${fat('pos_crusoe')}${sep}${pctStr(fat('pos_crusoe'), meta('pos_crusoe'))}`]);
  rows.push([`Tatuzinho${sep}${meta('pos_tatuzinho')}${sep}${fat('pos_tatuzinho')}${sep}${pctStr(fat('pos_tatuzinho'), meta('pos_tatuzinho'))}`]);
  rows.push([`Red Bull${sep}${meta('pos_redbull')}${sep}${fat('pos_redbull')}${sep}${pctStr(fat('pos_redbull'), meta('pos_redbull'))}`]);
  rows.push([`Pinatti${sep}${meta('pos_pinatti')}${sep}${fat('pos_pinatti')}${sep}${pctStr(fat('pos_pinatti'), meta('pos_pinatti'))}`]);
  rows.push(['']);

  if (v.previsao) {
    const p = v.previsao;
    rows.push([`PREVISÃO DE FECHAMENTO${sep}Dias úteis passados${sep}${p.du_passados} de ${p.du_total}`]);
    rows.push([`Faturamento${sep}Projeção${sep}${numBR(p.fat_proj)}${sep}Média 3m${sep}${numBR(p.fat_media_hist)}`]);
    rows.push([`Positivação${sep}Projeção${sep}${Number(p.pos_proj).toFixed(0)}${sep}Média 3m${sep}${Number(p.pos_media_hist).toFixed(0)}`]);
    rows.push(['']);
  }

  if (v.historico && v.historico.length) {
    rows.push([`HISTÓRICO MENSAL${sep}Faturamento${sep}Positivação`]);
    v.historico.forEach(h => rows.push([`${h.mes}${sep}${numBR(h.fat)}${sep}${h.pos}`]));
    rows.push(['']);
  }

  rows.push([`CLIENTES NÃO POSITIVADOS${sep}Código${sep}Bairro${sep}Última Compra${sep}Marcas`]);
  if (!v.nao_positivados || v.nao_positivados.length === 0) {
    rows.push([`Todos os clientes positivados este mês.`]);
  } else {
    v.nao_positivados.forEach(c => {
      const marcas = (c.produtos || []).map(p => p.FANTASIA || p.DESCRICAO || '').filter(Boolean).join(' | ');
      rows.push([`${c.CLIENTE || ''}${sep}${c.CODCLI || ''}${sep}${c.BAIRROENT || ''}${sep}${c.DTULTCOMP || ''}${sep}${marcas}`]);
    });
  }

  const csv  = '\uFEFF' + rows.map(r => r[0]).join('\r\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url;
  a.download = `metas_${v.nome.replace(/\s+/g, '_')}_${mes.replace('/', '_')}.csv`;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 500);
}

// ── View de Vendas ───────────────────────────────────────

function _vendasDoMes(nomeVendedor, mes) {
  if (typeof VENDAS_DATA === 'undefined') return [];
  return (VENDAS_DATA.por_vendedor[nomeVendedor] || {})[mes] || [];
}

function _atualizarTabela(nomeVendedor) {
  const mes   = document.getElementById('sel-mes').value;
  const lista = _vendasDoMes(nomeVendedor, mes);

  // Resumo
  const total    = lista.reduce((s, r) => s + r.valor, 0);
  const totalQt  = lista.reduce((s, r) => s + r.qt, 0);
  const nClientes = new Set(lista.map(r => r.cliente)).size;
  document.getElementById('vendas-resumo').innerHTML = `
    <div class="vendas-resumo-box">
      <div class="vendas-resumo-label">Faturamento</div>
      <div class="vendas-resumo-val">${fmtFat(total)}</div>
    </div>
    <div class="vendas-resumo-box">
      <div class="vendas-resumo-label">Itens vendidos</div>
      <div class="vendas-resumo-val">${totalQt.toLocaleString('pt-BR')}</div>
    </div>
    <div class="vendas-resumo-box">
      <div class="vendas-resumo-label">Clientes</div>
      <div class="vendas-resumo-val">${nClientes}</div>
    </div>`;

  document.getElementById('vendas-tabela').innerHTML = buildVendasTable(lista);
}

function exportarVendasCSV(nomeVendedor) {
  const mes   = document.getElementById('sel-mes').value;
  const lista = _vendasDoMes(nomeVendedor, mes);
  const sep   = ';';

  const rows = [
    `VENDAS — ${nomeVendedor} — ${mes}`,
    `Data${sep}Cliente${sep}Produto${sep}Quantidade${sep}Valor (R$)`,
    ...lista.map(s =>
      `${s.data}${sep}${s.cliente}${sep}${s.produto}${sep}${s.qt}${sep}${Number(s.valor).toFixed(2).replace('.', ',')}`
    ),
  ];

  const csv  = '\uFEFF' + rows.join('\r\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url;
  a.download = `vendas_${nomeVendedor.replace(/\s+/g, '_')}_${mes.replace('/', '_')}.csv`;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 500);
}

function renderVendas(v) {
  document.getElementById('header-sub').textContent =
    typeof VENDAS_DATA !== 'undefined'
      ? `Atualizado ${VENDAS_DATA.atualizado_em}`
      : 'Dados de vendas não disponíveis';

  document.getElementById('header-actions').innerHTML = `
    <button class="btn btn-dl" onclick="exportarVendasCSV('${v.nome}')">&#8595; Baixar CSV</button>
    <button class="btn" onclick="voltarParaTodos()">\u2190 Todos</button>`;

  const meses = typeof VENDAS_DATA !== 'undefined' ? VENDAS_DATA.meses : [];
  const opts  = meses.map(m => `<option value="${m}">${m}</option>`).join('');

  document.getElementById('app').innerHTML = `
    <div class="detail-header">
      <div>
        <div class="detail-name">${v.nome}</div>
        <div class="detail-rca">RCA ${v.rca}</div>
      </div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <select id="sel-mes" class="mes-select"
          onchange="_atualizarTabela('${v.nome}')">${opts}</select>
        <button class="btn btn-dl" onclick="exportarVendasCSV('${v.nome}')">&#8595; Baixar CSV</button>
        <a class="btn" href="?vendedor=${encodeURIComponent(v.nome)}">Ver metas</a>
      </div>
    </div>

    <div class="detail-card">
      <div id="vendas-resumo" class="vendas-resumo"></div>
      <div id="vendas-tabela"></div>
    </div>`;

  _atualizarTabela(v.nome);
}

// ── Roteamento por URL ────────────────────────────────────

function getParam() {
  return new URLSearchParams(window.location.search).get('vendedor') || null;
}

function linkFor(nome) {
  return location.origin + location.pathname + '?vendedor=' + encodeURIComponent(nome);
}

function copyLink(nome, btn) {
  navigator.clipboard.writeText(linkFor(nome)).then(() => {
    btn.classList.add('copied');
    btn.textContent = '\u2713 Copiado!';
    setTimeout(() => {
      btn.classList.remove('copied');
      btn.innerHTML = '\uD83D\uDD17 Copiar link';
    }, 2500);
  });
}

function voltarParaTodos() {
  const senha = prompt('Digite a senha para acessar todos os vendedores:');
  if (senha === '918273') {
    window.location.href = location.pathname;
  } else if (senha !== null) {
    alert('Senha incorreta.');
  }
}

// ── Views ─────────────────────────────────────────────────

function renderDetail(v, mes) {
  mes = mes || _getMes();
  _mesSel = mes;
  const pm = _pm(v, mes);

  function r(c) { return _mv(pm, c, 'realizado'); }
  function m(c) { return _mv(pm, c, 'meta'); }

  document.getElementById('header-sub').textContent = `Atualizado ${METAS_DATA.atualizado_em}`;

  const mesOpts = (METAS_DATA.meses || []).map(mo =>
    `<option value="${mo}" ${mo === mes ? 'selected' : ''}>${mo}</option>`
  ).join('');

  document.getElementById('header-actions').innerHTML = `
    <select class="mes-select" onchange="renderDetail(METAS_DATA.vendedores.find(x=>x.nome==='${v.nome}'), this.value)">${mesOpts}</select>
    <button class="btn btn-dl" onclick="downloadCSV(METAS_DATA.vendedores.find(x=>x.nome==='${v.nome}'), '${mes}')">&#8595; Baixar CSV</button>
    <button class="btn" onclick="copyLink('${v.nome}', this)">\uD83D\uDD17 Copiar link</button>`;

  const p = pct(r('fat_tt'), m('fat_tt'));

  document.getElementById('app').innerHTML = `
    <div class="detail-header">
      <div>
        <div class="detail-name">${v.nome}</div>
        <div class="detail-rca">RCA ${v.rca}</div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <a class="btn" href="?vendedor=${encodeURIComponent(v.nome)}&view=vendas">&#128200; Vendas do m&#234;s</a>
        <button class="btn" onclick="voltarParaTodos()">\u2190 Todos os vendedores</button>
      </div>
    </div>

    ${buildRing(p, fmtFat(r('fat_tt')), fmtFat(m('fat_tt')))}

    <div class="detail-card">
      <div class="section-title">Faturamento</div>
      ${buildBar('Total',            r('fat_tt'),              m('fat_tt'),              'fat')}
      ${buildBar('Castas',           r('fat_castas'),          m('fat_castas'),          'fat')}
      ${buildBar('Domecq + Passport',r('fat_domecq_passport'), m('fat_domecq_passport'), 'fat')}
      ${buildBar('HOB + Azeite',     r('fat_hob_azeite'),      m('fat_hob_azeite'),      'fat')}
    </div>

    <div class="detail-card">
      <div class="section-title">Positivação (clientes únicos)</div>
      ${buildBar('Total',           r('pos_tt'),         m('pos_tt'),         'pos')}
      ${buildBar('HOB + Azeite',    r('pos_hob_azeite'), m('pos_hob_azeite'), 'pos')}
      ${buildBar('Reckitt',         r('pos_reckit'),     m('pos_reckit'),     'pos')}
      ${buildBar('Robinson Crusoe', r('pos_crusoe'),     m('pos_crusoe'),     'pos')}
      ${buildBar('Tatuzinho',       r('pos_tatuzinho'),  m('pos_tatuzinho'),  'pos')}
      ${buildBar('Red Bull',        r('pos_redbull'),    m('pos_redbull'),    'pos')}
      ${buildBar('Pinatti',         r('pos_pinatti'),    m('pos_pinatti'),    'pos')}
    </div>

    ${buildPrevisao(v)}

    <div class="detail-card">
      <div class="section-title">Faturamento mensal</div>
      <div class="chart-wrap"><canvas id="chart-fat"></canvas></div>
    </div>

    <div class="detail-card">
      <div class="section-title">Positivação mensal (clientes únicos)</div>
      <div class="chart-wrap"><canvas id="chart-pos"></canvas></div>
    </div>

    <div class="detail-card">
      <div class="section-title">Clientes não positivados (ÚLTIMAS VENDAS)</div>
      ${buildNaoPosTable(v.nao_positivados)}
    </div>`;

  buildCharts(v);
}

function _buildCards(vendedores, mes) {
  return vendedores.map(v => {
    const pm = _pm(v, mes);
    return `
      <div class="vendor-card" data-nome="${v.nome.toLowerCase()}">
        <div class="vendor-name">${v.nome}</div>
        <div class="vendor-rca">RCA ${v.rca}</div>
        ${buildBar('Faturamento Total', _mv(pm,'fat_tt','realizado'), _mv(pm,'fat_tt','meta'), 'fat')}
        ${buildBar('Positivação Total', _mv(pm,'pos_tt','realizado'), _mv(pm,'pos_tt','meta'), 'pos')}
        <div class="card-actions">
          <a class="btn btn-primary" href="?vendedor=${encodeURIComponent(v.nome)}">Ver detalhes</a>
        </div>
      </div>`;
  }).join('');
}

function renderAll(vendedores, mes) {
  mes = mes || _getMes();
  _mesSel = mes;

  const mesOpts = (METAS_DATA.meses || []).map(mo =>
    `<option value="${mo}" ${mo === mes ? 'selected' : ''}>${mo}</option>`
  ).join('');

  document.getElementById('header-sub').textContent =
    `${mes}  ·  Atualizado ${METAS_DATA.atualizado_em}`;

  document.getElementById('header-actions').innerHTML =
    `<select class="mes-select" onchange="_mesSel=this.value; document.getElementById('cards-grid').innerHTML=_buildCards(METAS_DATA.vendedores, this.value); document.getElementById('header-sub').textContent=this.value+' · Atualizado ${METAS_DATA.atualizado_em}'">${mesOpts}</select>`;

  document.getElementById('app').innerHTML = `
    <div class="search-wrap">
      <input class="search-input" type="text" placeholder="Buscar vendedor..."
        oninput="filterCards(this.value)">
    </div>
    <div class="cards-grid" id="cards-grid">${_buildCards(vendedores, mes)}</div>`;
}

function filterCards(q) {
  const q2 = q.toLowerCase().trim();
  document.querySelectorAll('.vendor-card').forEach(card => {
    card.style.display = card.dataset.nome.includes(q2) ? '' : 'none';
  });
}

// ── Init ──────────────────────────────────────────────────

(function init() {
  if (typeof METAS_DATA === 'undefined') {
    document.getElementById('app').innerHTML = `
      <div class="no-data">
        <p>&#9888; Arquivo <strong>metas_data.js</strong> não encontrado.</p>
        <p style="margin-top:8px;font-size:0.82rem">
          Execute a célula de exportação no notebook <strong>analisedados.ipynb</strong> para gerar os dados.
        </p>
      </div>`;
    return;
  }

  const params = new URLSearchParams(window.location.search);
  const param  = params.get('vendedor') || null;
  const view   = params.get('view') || 'metas';
  const mesUrl = params.get('mes') || null;

  _mesSel = mesUrl || (METAS_DATA.meses && METAS_DATA.meses[0]) || '';

  if (param) {
    const v = METAS_DATA.vendedores.find(x =>
      x.nome.toLowerCase() === param.toLowerCase());
    if (v) {
      if (view === 'vendas') renderVendas(v);
      else                   renderDetail(v, _mesSel);
    } else {
      document.getElementById('app').innerHTML = `
        <div class="no-data">
          <p>Vendedor "<strong>${param}</strong>" não encontrado.</p>
          <a class="btn" href="${location.pathname}" style="margin-top:16px">\u2190 Voltar</a>
        </div>`;
    }
  } else {
    renderAll(METAS_DATA.vendedores, _mesSel);
  }
})();
</script>
