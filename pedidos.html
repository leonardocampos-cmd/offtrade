<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <script src="auth.js"></script>
  <script src="fontes_status_data.js"></script>
  <script src="fontes_alert.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pedidos OFF TRADE</title>
  <script src="pedidos_data.js"></script>
  <script src="estoque_data.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f1117; --card: #1a1d27; --card2: #22263a;
      --accent: #f5c518; --blue: #3b82f6; --text: #e2e8f0;
      --muted: #94a3b8; --border: #2d3144; --green: #22c55e;
      --red: #ef4444; --orange: #f97316;
    }
    body {
      background: var(--bg); color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh; padding: 16px;
    }
    header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 20px; padding-bottom: 16px;
      border-bottom: 1px solid var(--border); gap: 12px; flex-wrap: wrap;
    }
    header h1 { font-size: 1.1rem; font-weight: 700; color: var(--accent); }
    header p  { font-size: .8rem; color: var(--muted); margin-top: 3px; }
    .kpis { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
    .kpi {
      background: var(--card); border: 1px solid var(--border); border-radius: 10px;
      padding: 14px 18px; flex: 1; min-width: 160px;
    }
    .kpi .label {
      font-size: .65rem; text-transform: uppercase; letter-spacing: .08em;
      color: var(--muted); margin-bottom: 6px;
    }
    .kpi .val { font-size: 1.25rem; font-weight: 800; }
    .tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
    .tab-btn {
      background: var(--card); border: 1px solid var(--border); color: var(--muted);
      border-radius: 8px; padding: 9px 16px; font-size: .85rem; font-weight: 700;
      cursor: pointer; font-family: inherit;
    }
    .tab-btn.active { background: var(--accent); color: #0f1117; border-color: var(--accent); }
    .controls {
      display: flex; gap: 10px; flex-wrap: wrap;
      margin-bottom: 16px; align-items: center;
    }
    select, input[type=text] {
      background: var(--card); border: 1px solid var(--border);
      color: var(--text); border-radius: 8px; padding: 8px 12px;
      font-size: .88rem; outline: none; font-family: inherit;
    }
    select:focus, input[type=text]:focus { border-color: var(--blue); }
    select { min-width: 240px; }
    input[type=text] { min-width: 220px; }
    .btn-csv {
      background: var(--green); color: #0f1117; border: none;
      border-radius: 8px; padding: 8px 16px; font-size: .88rem;
      font-weight: 700; cursor: pointer; font-family: inherit;
    }
    .btn-csv:hover { opacity: .88; }
    .ms-data { position: relative; }
    .ms-toggle {
      background: var(--card); border: 1px solid var(--border);
      color: var(--text); border-radius: 8px; padding: 8px 12px;
      font-size: .88rem; outline: none; font-family: inherit;
      min-width: 240px; text-align: left; cursor: pointer;
      display: flex; justify-content: space-between; align-items: center; gap: 8px;
    }
    .ms-toggle:hover, .ms-toggle.open { border-color: var(--blue); }
    .ms-toggle span:last-child { color: var(--muted); font-size: .72rem; }
    .ms-panel {
      position: absolute; top: calc(100% + 4px); left: 0; z-index: 20;
      background: var(--card); border: 1px solid var(--border); border-radius: 8px;
      min-width: 240px; max-height: 280px; overflow-y: auto;
      box-shadow: 0 8px 24px rgba(0,0,0,.4); padding: 6px;
    }
    .ms-panel.hidden { display: none; }
    .ms-actions {
      display: flex; justify-content: space-between; padding: 4px 6px 8px;
      border-bottom: 1px solid var(--border); margin-bottom: 4px;
    }
    .ms-actions button {
      background: none; border: none; color: var(--blue); font-size: .76rem;
      cursor: pointer; font-family: inherit; padding: 0;
    }
    .ms-actions button:hover { text-decoration: underline; }
    .ms-option {
      display: flex; align-items: center; gap: 8px; padding: 6px 8px;
      border-radius: 6px; font-size: .85rem; cursor: pointer;
    }
    .ms-option:hover { background: var(--card2); }
    .ms-option input { cursor: pointer; accent-color: var(--accent); }
    .ms-empty { padding: 10px; color: var(--muted); font-size: .82rem; text-align: center; }
    .info { font-size: .8rem; color: var(--muted); margin-left: auto; }
    .table-wrap { overflow-x: auto; border-radius: 10px; border: 1px solid var(--border); }
    table { width: 100%; border-collapse: collapse; font-size: .82rem; }
    thead th {
      background: var(--card2); padding: 10px 12px; text-align: left;
      font-size: .72rem; text-transform: uppercase; letter-spacing: .05em;
      color: var(--muted); border-bottom: 1px solid var(--border);
      white-space: nowrap; cursor: pointer;
    }
    thead th:hover { color: var(--text); }
    tbody tr.linha-pedido { border-bottom: 1px solid var(--border); cursor: pointer; }
    tbody tr.linha-pedido:hover { background: var(--card2); }
    tbody tr.linha-itens td { background: #14161f; padding: 0 12px 12px 34px; }
    tbody tr.linha-itens.oculta { display: none; }
    tbody td { padding: 9px 12px; vertical-align: middle; white-space: nowrap; }
    .cod  { color: var(--muted); font-size: .78rem; font-family: monospace; }
    .rca-badge {
      display: inline-block; background: var(--card2); border: 1px solid var(--border);
      border-radius: 5px; padding: 2px 7px; font-size: .72rem; color: var(--accent);
    }
    .status-badge { display:inline-block; border-radius:20px; padding:2px 8px; font-size:.72rem; font-weight:700; white-space:normal; }
    .status-feito     { background: rgba(59,130,246,.15);  color: var(--blue); }
    .status-faturado  { background: rgba(34,197,94,.15);   color: var(--green); }
    .status-cancelado { background: rgba(239,68,68,.15);   color: var(--red); }
    .status-cortado   { background: rgba(249,115,22,.15);  color: var(--orange); }
    .status-none { color: var(--muted); font-size:.78rem; }
    .status-log-entregue  { background: rgba(34,197,94,.15);  color: var(--green); }
    .status-log-retorno   { background: rgba(249,115,22,.15); color: var(--orange); }
    .status-log-cancelada { background: rgba(239,68,68,.15);  color: var(--red); }
    .status-log-outro     { background: var(--card2); border: 1px solid var(--border); color: var(--text); }
    .status-log-carregado { background: rgba(59,130,246,.15);  color: var(--blue); }
    .status-log-emrota    { background: rgba(34,197,94,.15);   color: var(--green); }
    .status-log-aberto    { background: var(--card2); border: 1px solid var(--border); color: var(--muted); }
    .status-log-devolvido { background: rgba(168,85,247,.15); color: #a855f7; }
    .badge-agendado {
      display: inline-block; background: rgba(59,130,246,.15); color: var(--blue);
      border-radius: 20px; padding: 1px 8px; font-size: .68rem; font-weight: 700;
      white-space: nowrap;
    }
    .badge-corte {
      display: inline-block; background: rgba(249,115,22,.15); color: var(--orange);
      border-radius: 20px; padding: 1px 8px; font-size: .68rem; font-weight: 700;
      white-space: nowrap;
    }
    .badge-rota {
      display: inline-block; background: rgba(34,197,94,.15); color: var(--green);
      border-radius: 20px; padding: 1px 8px; font-size: .68rem; font-weight: 700;
      white-space: nowrap;
    }
    .badge-pago {
      display: inline-block; background: rgba(148,163,184,.15); color: var(--muted);
      border-radius: 20px; padding: 1px 8px; font-size: .68rem; font-weight: 700;
      white-space: nowrap;
    }
    .item-cortado td { color: var(--orange); }
    .badge-posicao {
      display: inline-block; border-radius: 20px; padding: 1px 8px;
      font-size: .68rem; font-weight: 700; white-space: nowrap;
    }
    .badge-posicao-bloqueado  { background: rgba(239,68,68,.15);  color: var(--red); }
    .badge-posicao-liberado   { background: rgba(34,197,94,.15);  color: var(--green); }
    .badge-posicao-pendente   { background: rgba(249,115,22,.15); color: var(--orange); }
    .badge-posicao-digitando  { background: var(--card2); border: 1px solid var(--border); color: var(--muted); }
    .tag-falta {
      display: inline-block; margin-left: 6px; font-size: .68rem; font-weight: 700;
      color: var(--orange);
    }
    .expand-icon { display:inline-block; width: 14px; color: var(--muted); }
    .itens-table { width: 100%; border-collapse: collapse; font-size: .78rem; margin-top: 6px; }
    .itens-table th { text-align:left; color: var(--muted); font-weight: 600; padding: 4px 8px; white-space: normal; }
    .itens-table td { padding: 4px 8px; color: var(--text); white-space: normal; }
    .empty { text-align: center; padding: 48px; color: var(--muted); font-size: .9rem; }

    @media (max-width: 640px) {
      body { padding: 12px; }
      .kpi { min-width: 130px; padding: 12px 14px; }
      select { min-width: 150px; }
      input[type=text] { min-width: 150px; }
      .ms-toggle { min-width: 150px; }
      table { font-size: .76rem; }
      thead th, tbody td { padding: 8px 9px; }
      .hide-mob { display: none; }
    }
  </style>
</head>
<body>

<header>
  <div>
    <h1>📦 PEDIDOS — OFF TRADE</h1>
    <p id="header-sub">—</p>
  </div>
  <a href="index.html" style="color:var(--muted);font-size:.8rem;text-decoration:none">← Painel</a>
</header>

<div class="kpis" id="kpis"></div>

<div class="tabs" id="tabs"></div>

<div class="controls">
  <select id="sel-estado" onchange="onEstadoChange()">
    <option value="">Todos os Estados</option>
  </select>
  <select id="sel-gerente" onchange="onGerenteChange()">
    <option value="">Todos os Gerentes</option>
  </select>
  <select id="sel-supervisor" onchange="onSupervisorChange()">
    <option value="">Todos os Supervisores</option>
  </select>
  <select id="sel-vendedor" onchange="onVendedorChange()">
    <option value="">Todos os Vendedores</option>
  </select>
  <div class="ms-data" id="ms-mes">
    <button type="button" class="ms-toggle" id="ms-mes-toggle" onclick="toggleMesPanel(event)">
      <span id="ms-mes-label">Todos os Meses</span><span>▾</span>
    </button>
    <div class="ms-panel hidden" id="ms-mes-panel"></div>
  </div>
  <div class="ms-data" id="ms-data">
    <button type="button" class="ms-toggle" id="ms-data-toggle" onclick="toggleDataPanel(event)">
      <span id="ms-data-label">Todas as Datas</span><span>▾</span>
    </button>
    <div class="ms-panel hidden" id="ms-data-panel"></div>
  </div>
  <input type="text" id="busca" placeholder="Buscar por cliente, pedido, NF..." oninput="aplicarFiltro()">
  <select id="sel-agendamento" onchange="aplicarFiltro()">
    <option value="">📅 Agendamento</option>
    <option value="sim">Sim</option>
    <option value="nao">Não</option>
  </select>
  <div class="ms-data" id="ms-status">
    <button type="button" class="ms-toggle" id="ms-status-toggle" onclick="toggleStatusPanel(event)">
      <span id="ms-status-label">Status</span><span>▾</span>
    </button>
    <div class="ms-panel hidden" id="ms-status-panel"></div>
  </div>
  <div class="ms-data" id="ms-statuslog">
    <button type="button" class="ms-toggle" id="ms-statuslog-toggle" onclick="toggleStatusLogPanel(event)">
      <span id="ms-statuslog-label">Status Logística</span><span>▾</span>
    </button>
    <div class="ms-panel hidden" id="ms-statuslog-panel"></div>
  </div>
  <button class="btn-csv" onclick="exportarCSV()">⬇ Exportar CSV</button>
  <span class="info" id="info-count"></span>
</div>

<div class="table-wrap">
  <table id="tabela">
    <thead>
      <tr id="thead-row"></tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

<script>
const DATA = typeof PEDIDOS_DATA !== 'undefined' ? PEDIDOS_DATA : null;
const ESTOQUE = typeof ESTOQUE_DATA !== 'undefined' ? ESTOQUE_DATA : null;

const ABAS = [
  {
    chave: 'pedidos_feitos', label: 'Pedidos Feitos', cor: 'status-feito',
    colExtra: { campo: 'sistema', label: 'Sistema', render: p => `<span class="cod">${_esc(p.sistema)}</span>` },
  },
  {
    chave: 'faturados', label: 'Faturados', cor: 'status-faturado',
    colExtra: {
      campo: 'status_log', label: 'Status Logística',
      render: p => `<span class="cod">${_esc(p.sistema)}</span> ${_statusLogBadge(p.status_log)}${_statusSistemaBadge(p.status_sistema)}`
        + (p.status_log === 'RETORNO' && p.motivo_retorno
          ? `<div style="margin-top:4px;color:var(--orange);font-size:.72rem">${_esc(p.motivo_retorno)}</div>`
          : ''),
    },
  },
  {
    chave: 'cancelados', label: 'Cortados/Cancelados', cor: 'status-cancelado',
    colExtra: { campo: 'motivo', label: 'Motivo', render: p => p.motivo ? _esc(p.motivo) : '<span class="status-none">—</span>' },
  },
  {
    chave: 'produtos_cortados', label: 'Produtos Cortados', cor: 'status-cortado', flat: true,
  },
];

const THEAD_PADRAO = `
  <th></th>
  <th class="hide-mob" onclick="ordenarPor('numped')">Pedido</th>
  <th id="th-nf" class="hide-mob" onclick="ordenarPor('numnota')">NF</th>
  <th onclick="ordenarPor('data')">Data</th>
  <th class="hide-mob" onclick="ordenarPor('nome')">Vendedor</th>
  <th class="hide-mob" onclick="ordenarPor('estado')">Estado</th>
  <th class="hide-mob" onclick="ordenarPor('cidade')">Cidade</th>
  <th onclick="ordenarPor('cliente')">Cliente</th>
  <th id="th-extra"></th>
  <th id="th-total" onclick="ordenarPor('total')">Total</th>
`;

const THEAD_CORTADOS = `
  <th onclick="ordenarPor('data')">Data</th>
  <th class="hide-mob" onclick="ordenarPor('nome')">Vendedor</th>
  <th class="hide-mob" onclick="ordenarPor('estado')">Estado</th>
  <th onclick="ordenarPor('cliente')">Cliente</th>
  <th class="hide-mob" onclick="ordenarPor('numped')">Pedido</th>
  <th onclick="ordenarPor('desc')">Produto</th>
  <th class="hide-mob" onclick="ordenarPor('industria')">Indústria</th>
  <th onclick="ordenarPor('qtd_cortada_total')">Qtd Cortada</th>
  <th onclick="ordenarPor('valor_cortado')">Valor Cortado</th>
  <th onclick="ordenarPor('saldo_estoque')">Saldo Estoque</th>
`;

// ── Índice de estoque (empresa+filial+produto -> qtestoque) pra cruzar com
// os produtos cortados. Chaves numéricas normalizadas (parseInt) pra não
// depender do formato exato ("1" vs "1.0") que cada base devolve.
const _estoqueIdx = new Map();
if (ESTOQUE && ESTOQUE.produtos) {
  ESTOQUE.produtos.forEach(p => {
    const fil = parseInt(p.codfilial, 10);
    const prod = parseInt(p.codprod, 10);
    if (Number.isNaN(fil) || Number.isNaN(prod)) return;
    _estoqueIdx.set(`${(p.empresa || '').toUpperCase()}|${fil}|${prod}`, p.qtestoque);
  });
}

function _saldoEstoque(item) {
  const fil = parseInt(item.codfilial, 10);
  const prod = parseInt(item.codprod, 10);
  if (Number.isNaN(fil) || Number.isNaN(prod)) return null;
  const key = `${(item.sistema || '').toUpperCase()}|${fil}|${prod}`;
  return _estoqueIdx.has(key) ? _estoqueIdx.get(key) : null;
}

if (DATA && DATA.produtos_cortados) {
  DATA.produtos_cortados.forEach(p => { p.saldo_estoque = _saldoEstoque(p); });
}

// 'total' do pedido cancelado é sempre 0 (nada foi faturado) — o que importa
// pra essa aba é o valor cortado. pedidos.py já manda 'valor_cortado_total'
// (valor real de PEDIDOS_CANCELADOS.SUBTOT somado por pedido, mais confiável
// que casar produto a produto — ver comentário em pedidos.py); só cai pra
// somar os itens aqui se por algum motivo esse campo não vier (data.js
// antigo, gerado antes dessa mudança).
if (DATA && DATA.cancelados) {
  DATA.cancelados.forEach(p => {
    p.valor_cortado_pedido = p.valor_cortado_total != null
      ? p.valor_cortado_total
      : (p.itens || []).reduce((s, it) => s + (Number(it.valor_cortado) || 0), 0);
  });
}

let _abaAtual = 'pedidos_feitos';
let _ordem = { campo: 'data', asc: false };
let _expandidos = new Set();
let _datasSelecionadas = new Set();
let _statusSelecionados = new Set();
let _mesesSelecionados = new Set();
let _statusLogSelecionados = new Set();

const STATUS_OPCOES = [
  { valor: 'pendente',  label: 'Pendente' },
  { valor: 'liberado',  label: 'Liberado' },
  { valor: 'bloqueado', label: 'Bloqueado' },
];

if (!DATA) {
  document.getElementById('tbody').innerHTML = '<tr><td colspan="10" class="empty">Dados não encontrados. Execute pedidos.py para gerar pedidos_data.js.</td></tr>';
} else {
  document.getElementById('header-sub').textContent =
    'Atualizado ' + DATA.atualizado_em + ' · últimos ' + DATA.periodo_dias + ' dias';
  montarTabs();
  montarEstados();
  montarStatusLog();
  montarStatusPosicaoPanel();
  aplicarFiltro();
}

function montarTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = ABAS.map(a => {
    const qtd = (DATA[a.chave] || []).length;
    const ativo = a.chave === _abaAtual ? 'active' : '';
    return `<button class="tab-btn ${ativo}" onclick="trocarAba('${a.chave}')">${a.label} (${qtd})</button>`;
  }).join('');

  const theadRow = document.getElementById('thead-row');
  if (_abaAtual === 'produtos_cortados') {
    theadRow.innerHTML = THEAD_CORTADOS;
  } else {
    theadRow.innerHTML = THEAD_PADRAO;
    const abaInfo = ABAS.find(a => a.chave === _abaAtual);
    const th = document.getElementById('th-extra');
    if (abaInfo.colExtra) {
      th.style.display = '';
      th.textContent = abaInfo.colExtra.label;
      th.onclick = () => ordenarPor(abaInfo.colExtra.campo);
    } else {
      th.style.display = 'none';
      th.onclick = null;
    }
    document.getElementById('th-nf').style.display = _abaAtual === 'pedidos_feitos' ? 'none' : '';
    const thTotal = document.getElementById('th-total');
    if (_abaAtual === 'cancelados') {
      thTotal.textContent = 'Valor Cortado';
      thTotal.onclick = () => ordenarPor('valor_cortado_pedido');
    } else {
      thTotal.textContent = 'Total';
      thTotal.onclick = () => ordenarPor('total');
    }
  }

  document.getElementById('ms-status').style.display = _abaAtual === 'pedidos_feitos' ? '' : 'none';
  document.getElementById('ms-statuslog').style.display = _abaAtual === 'faturados' ? '' : 'none';
}

function montarStatusLog() {
  const panel = document.getElementById('ms-statuslog-panel');
  if (_abaAtual !== 'faturados') {
    panel.innerHTML = '';
    _statusLogSelecionados.clear();
    _atualizarLabelStatusLog();
    return;
  }
  const valores = [...new Set(_listaAtual().map(p => p.status_log || '(sem status)'))].sort();
  // Remove da seleção valores que sumiram da lista atual (ex: trocou de filtro
  // e um status deixou de existir) — senão ficava "preso" selecionado sem
  // aparecer mais no painel.
  [..._statusLogSelecionados].forEach(v => { if (!valores.includes(v)) _statusLogSelecionados.delete(v); });
  const acoes = `<div class="ms-actions">
    <button type="button" onclick="_selecionarTodosStatusLog()">Selecionar todos</button>
    <button type="button" onclick="_limparStatusLog()">Limpar</button>
  </div>`;
  const opts = valores.map(v => `
    <label class="ms-option">
      <input type="checkbox" value="${v}" ${_statusLogSelecionados.has(v) ? 'checked' : ''} onchange="_toggleStatusLog('${v}', this.checked)">
      ${_esc(v)}
    </label>`).join('');
  panel.innerHTML = acoes + opts;
  _atualizarLabelStatusLog();
}

function _toggleStatusLog(valor, checked) {
  if (checked) _statusLogSelecionados.add(valor); else _statusLogSelecionados.delete(valor);
  _atualizarLabelStatusLog();
  aplicarFiltro();
}

function _selecionarTodosStatusLog() {
  [...new Set(_listaAtual().map(p => p.status_log || '(sem status)'))].forEach(v => _statusLogSelecionados.add(v));
  montarStatusLog();
  aplicarFiltro();
}

function _limparStatusLog() {
  _statusLogSelecionados.clear();
  montarStatusLog();
  aplicarFiltro();
}

function _atualizarLabelStatusLog() {
  const label = document.getElementById('ms-statuslog-label');
  const n = _statusLogSelecionados.size;
  if (n === 0) label.textContent = 'Status Logística';
  else if (n === 1) label.textContent = [..._statusLogSelecionados][0];
  else label.textContent = `${n} status selecionados`;
}

function toggleStatusLogPanel(ev) {
  ev.stopPropagation();
  document.getElementById('ms-statuslog-panel').classList.toggle('hidden');
  document.getElementById('ms-statuslog-toggle').classList.toggle('open');
}

function _totalColunas() {
  if (_abaAtual === 'produtos_cortados') return 9;
  if (_abaAtual === 'pedidos_feitos') return 9;
  const abaInfo = ABAS.find(a => a.chave === _abaAtual);
  return (abaInfo && abaInfo.colExtra) ? 10 : 9;
}

function trocarAba(chave) {
  _abaAtual = chave;
  _expandidos.clear();
  montarTabs();
  montarEstados();
  montarMeses();
  montarStatusLog();
  aplicarFiltro();
}

function _listaAtual() {
  return DATA ? (DATA[_abaAtual] || []) : [];
}

const MES_NOMES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

function _labelMes(m) {
  const [ano, mm] = m.split('-');
  return `${MES_NOMES[parseInt(mm, 10) - 1]}/${ano}`;
}

function ordenarPor(campo) {
  if (_ordem.campo === campo) {
    _ordem.asc = !_ordem.asc;
  } else {
    _ordem = { campo, asc: true };
  }
  aplicarFiltro();
}

function _filtrados() {
  const estado     = document.getElementById('sel-estado').value;
  const gerente    = document.getElementById('sel-gerente').value;
  const supervisor = document.getElementById('sel-supervisor').value;
  const vendedor   = document.getElementById('sel-vendedor').value;
  const busca      = document.getElementById('busca').value.trim().toLowerCase();
  const agendamento = document.getElementById('sel-agendamento').value;
  let lista = _listaAtual().filter(p => {
    const matchEstado     = !estado || p.estado === estado;
    const matchGerente    = !gerente || p.gerente === gerente;
    const matchSupervisor = !supervisor || p.supervisor === supervisor;
    const matchVendedor   = !vendedor || p.nome === vendedor;
    const matchMes        = _mesesSelecionados.size === 0 || _mesesSelecionados.has((p.data_ord || '').slice(0, 7));
    const matchData       = _datasSelecionadas.size === 0 || _datasSelecionadas.has(p.data_ord);
    const matchAgendado   = !agendamento || (agendamento === 'sim' ? !!_agendamento(p.obs) : !_agendamento(p.obs));
    const matchStatus     = _abaAtual !== 'pedidos_feitos' || _statusSelecionados.size === 0 || _statusSelecionados.has(_statusPosicao(p.posicao));
    const matchStatusLog  = _abaAtual !== 'faturados' || _statusLogSelecionados.size === 0 || _statusLogSelecionados.has(p.status_log || '(sem status)');
    const matchBusca = !busca || [p.cliente, p.numped, p.numnota]
      .some(v => v && String(v).toLowerCase().includes(busca));
    return matchEstado && matchGerente && matchSupervisor && matchVendedor && matchMes && matchData && matchAgendado && matchStatus && matchStatusLog && matchBusca;
  });
  const { campo, asc } = _ordem;
  const campoOrd = campo === 'data' ? 'data_ord' : campo;
  lista = [...lista].sort((a, b) => {
    let va = a[campoOrd], vb = b[campoOrd];
    if (typeof va === 'string') { va = va.toLowerCase(); vb = (vb || '').toLowerCase(); }
    if (va < vb) return asc ? -1 : 1;
    if (va > vb) return asc ? 1 : -1;
    return 0;
  });
  return lista;
}

function montarKpis(lista) {
  const cancelados = _abaAtual === 'cancelados';
  const total = lista.reduce((s, p) => s + (Number(cancelados ? p.valor_cortado_pedido : p.total) || 0), 0);
  const qtdClientes = new Set(lista.map(p => p.cliente)).size;
  const flat = _abaAtual === 'produtos_cortados';
  const cardExtra = flat
    ? `<div class="kpi">
        <div class="label">Qtd Total Cortada</div>
        <div class="val">${lista.reduce((s, p) => s + (Number(p.qtd_cortada_total) || 0), 0).toLocaleString('pt-BR')}</div>
      </div>
      <div class="kpi">
        <div class="label">Valor Total Cortado</div>
        <div class="val">${brl(lista.reduce((s, p) => s + (Number(p.valor_cortado) || 0), 0))}</div>
      </div>`
    : '';
  document.getElementById('kpis').innerHTML = `
    <div class="kpi">
      <div class="label">${cancelados ? 'Valor Cortado' : 'Valor Total'}</div>
      <div class="val">${brl(total)}</div>
    </div>
    <div class="kpi">
      <div class="label">${flat ? 'Produtos Cortados' : 'Pedidos'}</div>
      <div class="val">${lista.length}</div>
    </div>
    <div class="kpi">
      <div class="label">Clientes</div>
      <div class="val">${qtdClientes}</div>
    </div>${cardExtra}`;
}

function aplicarFiltro() {
  const lista = _filtrados();
  montarKpis(lista);
  const flat = _abaAtual === 'produtos_cortados';
  document.getElementById('info-count').textContent = lista.length + (flat ? ' produto(s) cortado(s)' : ' pedido(s)');

  const tbody = document.getElementById('tbody');
  const totalCols = _totalColunas();
  if (!lista.length) {
    tbody.innerHTML = `<tr><td colspan="${totalCols}" class="empty">${flat ? 'Nenhum produto cortado encontrado.' : 'Nenhum pedido encontrado.'}</td></tr>`;
    return;
  }

  if (flat) {
    tbody.innerHTML = lista.map(p => `
      <tr class="linha-pedido" style="cursor:default">
        <td>${_esc(p.data)}</td>
        <td class="hide-mob"><span class="rca-badge">${_esc((p.nome || '').replace(' - OFF TRADE', ''))}</span></td>
        <td class="hide-mob">${_esc(p.estado)}</td>
        <td>${_esc(p.cliente)}</td>
        <td class="cod hide-mob">${_esc(p.numped)}</td>
        <td>${_esc(p.desc)}</td>
        <td class="hide-mob">${_esc(p.industria) || '<span class="cod">—</span>'}</td>
        <td>${p.qtd_cortada_total} <span style="color:var(--muted)">/ ${p.qt_original}</span></td>
        <td>${p.valor_cortado != null ? brl(p.valor_cortado) : '<span class="status-none">—</span>'}</td>
        <td>${_saldoBadge(p.saldo_estoque)}</td>
      </tr>`).join('');
    return;
  }

  const abaInfo = ABAS.find(a => a.chave === _abaAtual);
  const mostraNf = _abaAtual !== 'pedidos_feitos';
  tbody.innerHTML = lista.map(p => {
    const chave = p.numped + '_' + p.numnota;
    const expandido = _expandidos.has(chave);
    const agendado = _agendamento(p.obs);
    return `
    <tr class="linha-pedido" onclick="toggleItens('${_esc(chave)}')">
      <td class="expand-icon">${expandido ? '▾' : '▸'}</td>
      <td class="cod hide-mob">${_esc(p.numped)}</td>
      ${mostraNf ? `<td class="cod hide-mob">${_esc(p.numnota) || '—'}</td>` : ''}
      <td>${_esc(p.data)}</td>
      <td class="hide-mob"><span class="rca-badge">${_esc((p.nome || '').replace(' - OFF TRADE',''))}</span></td>
      <td class="hide-mob">${_esc(p.estado)}</td>
      <td class="hide-mob">${_esc(p.cidade)}</td>
      <td>${_esc(p.cliente)}${agendado ? ` <span class="badge-agendado">📅 ${agendado}</span>` : ''}${(_abaAtual === 'faturados' && p.tem_corte) ? ` <span class="badge-corte">✂ CORTE PARCIAL</span>` : ''}${(_abaAtual === 'faturados' && p.pago) ? ` <span class="badge-pago">💰 PAGO</span>` : ''}${_abaAtual === 'pedidos_feitos' ? _posicaoBadge(p.posicao) : ''}</td>
      ${abaInfo.colExtra ? `<td>${abaInfo.colExtra.render(p)}</td>` : ''}
      <td>${brl(_abaAtual === 'cancelados' ? p.valor_cortado_pedido : p.total)}</td>
    </tr>
    <tr class="linha-itens ${expandido ? '' : 'oculta'}" id="itens-${_esc(chave)}">
      <td colspan="${totalCols}">${_montarItens(p)}</td>
    </tr>`;
  }).join('');
}

function _statusPosicao(posicao) {
  const p = (posicao || '').toLowerCase();
  if (p.includes('bloqueado')) return 'bloqueado';
  if (p === 'liberado') return 'liberado';
  if (p === 'pendente') return 'pendente';
  return p;
}

function _posicaoBadge(posicao) {
  if (!posicao || posicao === 'Faturado') return '';
  const cls = { bloqueado: 'badge-posicao-bloqueado', liberado: 'badge-posicao-liberado', pendente: 'badge-posicao-pendente' }[_statusPosicao(posicao)]
    || 'badge-posicao-digitando';
  return ` <span class="badge-posicao ${cls}">${_esc(posicao)}</span>`;
}

function _agendamento(obs) {
  if (!obs) return null;
  // Cobre variações reais vistas nas obs: "ENTREGA AGENDADA: dd/mm/aa",
  // "entrega agendada para o dia dd/mm", "ENTREGAR [dia da semana] dd/mm",
  // "Data entrega: dd/mm/aa", "entregar no dia dd/mm...", "agendado para
  // dia dd/mm" (sem a palavra entreg), datas com ponto (dd.mm) etc. — o
  // texto é livre, então busca "entreg"/"agend" seguido de uma data por perto,
  // aceitando "/", "." ou "-" como separador (checado contra ~650 obs reais).
  const m = obs.match(/(?:entreg|agend)\w*[^\d]{0,30}?(\d{1,2})[/.\-](\d{1,2})(?:[/.\-](\d{2,4}))?/i);
  if (!m) return null;
  const dd = m[1].padStart(2, '0');
  const mm = m[2].padStart(2, '0');
  let yy = m[3];
  if (!yy) yy = String(new Date().getFullYear());
  else if (yy.length === 2) yy = '20' + yy;
  return `${dd}/${mm}/${yy}`;
}

function _montarItens(p) {
  if (!p.itens || !p.itens.length) return '<span class="status-none">Sem itens.</span>';
  const linhas = p.itens.map(it => `
    <tr class="${it.cortado ? 'item-cortado' : ''}"><td>${_esc(it.desc)}${it.cortado ? `<span class="tag-falta">cortou ${it.qtd_cortada_total}</span>` : ''}${it.devolvido ? ' <span style="font-size:.6rem;color:#a855f7;font-weight:700">DEV</span>' : ''}${it.cancelada_pos_nf ? ' <span style="font-size:.6rem;color:var(--red);font-weight:700">CANCELADA</span>' : ''}</td><td>${it.qt}</td><td>${brl(it.val)}</td></tr>
  `).join('');
  const precoMotivo = (p.motivo_preco_digitado != null && p.motivo_preco_tabela != null)
    ? ` <span style="color:var(--muted)">— ${_esc(p.motivo_codprod)} ${_esc(p.motivo_produto)} (digitado ${brl(p.motivo_preco_digitado)} · tabela ${brl(p.motivo_preco_tabela)})</span>`
    : '';
  const motivo = p.motivo ? `<div style="margin-top:6px;color:var(--orange);font-size:.78rem">Motivo: ${_esc(p.motivo)}${precoMotivo}</div>` : '';
  const obs = p.obs ? `<div style="margin-top:6px;color:var(--muted);font-size:.78rem">Obs.: ${_esc(p.obs)}</div>` : '';
  const pedidoCliente = (_abaAtual === 'faturados' && p.pedido_cliente)
    ? `<div style="margin-top:6px;color:var(--muted);font-size:.78rem">Pedido Cliente: ${_esc(p.pedido_cliente)}</div>`
    : '';
  return `<table class="itens-table">
    <thead><tr><th>Produto</th><th>Qtd</th><th>Valor</th></tr></thead>
    <tbody>${linhas}</tbody>
  </table>${motivo}${obs}${pedidoCliente}`;
}

function toggleItens(chave) {
  if (_expandidos.has(chave)) {
    _expandidos.delete(chave);
  } else {
    _expandidos.add(chave);

function _statusBadge(status, cls) {
  if (!status) return '<span class="status-none">—</span>';
  return `<span class="status-badge ${cls}">${_esc(status)}</span>`;
}

function _statusLogBadge(status) {
  if (!status) return '<span class="status-none">—</span>';
  const s = status.toUpperCase();
  // ENTREGUE/RETORNO/CANCELADA vêm da planilha RJ; ENTREGA TOTAL/COMPROVADO,
  // CARREGADO e ABERTO vêm do Canhoto Digital (SP) — mesmo semáforo visual.
  const cls =
    (s === 'ENTREGUE' || s.includes('ENTREGA TOTAL') || s === 'COMPROVADO') ? 'status-log-entregue'
    : (s === 'RETORNO' || s.includes('ENTREGA PARCIAL')) ? 'status-log-retorno'
    : s === 'CANCELADA' ? 'status-log-cancelada'
    : s === 'EM ROTA' ? 'status-log-emrota'
    : s === 'CARREGADO' ? 'status-log-carregado'
    : s === 'ABERTO' ? 'status-log-aberto'
    : 'status-log-outro';
  return `<span class="status-badge ${cls}">${_esc(status)}</span>`;
}

function _statusSistemaBadge(status) {
  if (!status) return '';
  const cls = status.startsWith('DEVOLU') ? 'status-log-devolvido' : 'status-log-cancelada';
  return `<span class="status-badge ${cls}" style="margin-left:4px">${_esc(status)}</span>`;
}

function _saldoBadge(v) {
  if (v === null || v === undefined) return '<span class="status-none">—</span>';
  const cls = v > 0 ? 'status-log-entregue' : 'status-log-cancelada';
  return `<span class="status-badge ${cls}">${Number(v).toLocaleString('pt-BR')}</span>`;
}

function brl(v) {
  return 'R$ ' + Number(v || 0).toLocaleString('pt-BR', {minimumFractionDigits: 2, maximumFractionDigits: 2});
}

function _esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function exportarCSV() {
  const lista = _filtrados();

  if (_abaAtual === 'produtos_cortados') {
    const header = ['Data', 'Vendedor', 'Estado', 'Cliente', 'Pedido', 'Produto', 'Indústria', 'Qtd Cortada', 'Qtd Pedida', 'Valor Cortado', 'Saldo Estoque'];
    const linhas = lista.map(p => [
      p.data,
      (p.nome || '').replace(' - OFF TRADE', ''),
      p.estado,
      p.cliente,
      p.numped,
      p.desc,
      p.industria,
      p.qtd_cortada_total,
      p.qt_original,
      p.valor_cortado ?? '',
      p.saldo_estoque ?? '',
    ].map(v => `"${String(v ?? '').replace(/"/g, '""')}"`).join(';'));
    const csv = '﻿' + [header.join(';'), ...linhas].join('\r\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `pedidos_produtos_cortados_${new Date().toISOString().slice(0, 10)}.csv`;
    a.click();
    URL.revokeObjectURL(url);
    return;
  }

  const abaInfo = ABAS.find(a => a.chave === _abaAtual);
  const cancelados = _abaAtual === 'cancelados';
  const mostraSistema = _abaAtual === 'faturados';
  const header = ['Pedido','NF','Data','Vendedor','Estado','Cidade','Cliente','Agendamento', ...(mostraSistema ? ['Sistema'] : []), ...(abaInfo.colExtra ? [abaInfo.colExtra.label] : []), ...(mostraSistema ? ['Status Sistema'] : []), 'Produto', 'Qtd', 'Valor Produto', cancelados ? 'Valor Cortado' : 'Total Pedido'];
  const linhas = lista.flatMap(p => {
    const itens = (p.itens && p.itens.length) ? p.itens : [{ desc: '', qt: '', val: '' }];
    return itens.map(it => [
      p.numped,
      p.numnota,
      p.data,
      (p.nome || '').replace(' - OFF TRADE',''),
      p.estado,
      p.cidade,
      p.cliente,
      _agendamento(p.obs) || '',
      ...(mostraSistema ? [p.sistema] : []),
      ...(abaInfo.colExtra ? [p[abaInfo.colExtra.campo]] : []),
      ...(mostraSistema ? [p.status_sistema || ''] : []),
      it.desc,
      it.qt,
      it.val,
      cancelados ? p.valor_cortado_pedido : p.total,
    ].map(v => `"${String(v??'').replace(/"/g,'""')}"`).join(';'));
  });

  const csv = '﻿' + [header.join(';'), ...linhas].join('\r\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `pedidos_${_abaAtual}_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}
</script>
