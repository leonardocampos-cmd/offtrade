  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f1117; --card: #1a1d27; --card2: #22263a;
      --accent: #f97316; --green: #22c55e; --yellow: #eab308;
      --red: #ef4444; --text: #e2e8f0; --muted: #94a3b8; --border: #2d3144;
    }
    body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; min-height: 100vh; padding: 16px; max-width: 960px; margin: 0 auto; }
    header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--border); flex-wrap: wrap; gap: 12px; }
    .header-title h1 { font-size: 1.3rem; font-weight: 700; color: var(--accent); letter-spacing: -.02em; }
    .header-title p  { font-size: .78rem; color: var(--muted); margin-top: 3px; }
    .btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 8px; font-size: .8rem; cursor: pointer; border: 1px solid var(--border); background: var(--card2); color: var(--text); text-decoration: none; transition: all .15s; }
    .btn:hover { border-color: var(--accent); color: var(--accent); }
    .btn-primary { background: var(--accent); color: #111; border-color: var(--accent); font-weight: 700; }
    .btn-primary:hover { opacity: .9; }
    .btn-dl { border-color: #2d6a4f; color: #52b788; }
    .btn-dl:hover { border-color: #52b788; background: rgba(82,183,136,.1); }
    .mes-select { background: var(--card2); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 6px 10px; font-size: .82rem; cursor: pointer; outline: none; }
    .mes-select:focus { border-color: var(--accent); }

    .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
    .vendor-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 18px; transition: border-color .2s, transform .15s; }
    .vendor-card:hover { border-color: var(--accent); transform: translateY(-2px); }
    .vendor-name { font-size: .95rem; font-weight: 600; margin-bottom: 2px; }
    .vendor-sub  { font-size: .72rem; color: var(--muted); margin-bottom: 14px; }
    .stat-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--border); font-size: .82rem; }
    .stat-row:last-of-type { border-bottom: none; }
    .stat-label { color: var(--muted); }
    .stat-val   { font-weight: 600; }
    .var-pos { color: var(--green); font-size: .72rem; margin-left: 4px; }
    .var-neg { color: var(--red);   font-size: .72rem; margin-left: 4px; }
    .card-actions { display: flex; justify-content: flex-end; margin-top: 12px; }

    .sec-header { display: flex; justify-content: space-between; align-items: center; cursor: pointer; padding: 10px 0; border-bottom: 1px solid var(--border); user-select: none; }
    .sec-title { font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
    .sec-ic    { font-size: .65rem; color: var(--muted); transition: transform .2s; }
    .sec-ic.open { transform: rotate(180deg); }
    .sec-body  { display: none; padding-top: 12px; }
    .sec-body.open { display: block; }

    .tbl { width: 100%; border-collapse: collapse; font-size: .78rem; }
    .tbl th { color: var(--muted); font-weight: 600; text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--border); font-size: .68rem; text-transform: uppercase; letter-spacing: .05em; }
    .tbl td { padding: 5px 6px; border-bottom: 1px solid #1e2235; vertical-align: top; }
    .tbl tr:last-child td { border-bottom: none; }
    .tbl .td-right { text-align: right; white-space: nowrap; }
    .tbl .td-muted { color: var(--muted); }

    .np-cli-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--border); cursor: pointer; font-size: .8rem; user-select: none; }
    .np-cli-row:last-of-type { border-bottom: none; }
    .np-cli-name  { font-weight: 500; }
    .np-cli-date  { font-size: .72rem; color: var(--muted); white-space: nowrap; margin-left: 8px; }
    .np-cli-ic    { font-size: .6rem; color: var(--muted); margin-left: 6px; }
    .np-prods     { display: none; background: var(--card2); border-radius: 8px; padding: 8px 10px; margin: 4px 0 8px; }
    .np-prods.open { display: block; }
    .vendas-empty { color: var(--muted); font-size: .82rem; padding: 12px 0; }

    /* Modal de detalhes do pedido */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.65);
      display: flex; align-items: center; justify-content: center;
      z-index: 999; padding: 16px;
    }
    .modal-pedido {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 20px; max-width: 560px; width: 100%;
      max-height: 80vh; overflow-y: auto;
    }
    .modal-pedido-header {
      display: flex; justify-content: space-between; align-items: flex-start;
      gap: 10px; flex-wrap: wrap;
    }
    .modal-pedido-title { font-size: 0.95rem; font-weight: 700; color: var(--text); }
    .modal-pedido-sub { font-size: 0.76rem; color: var(--muted); margin-top: 3px; }

    .search-wrap { margin-bottom: 16px; }
    .search-input { width: 100%; background: var(--card); border: 1px solid var(--border); color: var(--text); border-radius: 10px; padding: 10px 14px; font-size: .88rem; outline: none; }
    .search-input:focus { border-color: var(--accent); }

    .detail-header { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
    .detail-name { font-size: 1.1rem; font-weight: 700; }
    .detail-sub  { font-size: .75rem; color: var(--muted); margin-top: 2px; }
    .detail-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 18px; margin-bottom: 16px; }
    .chart-wrap { position: relative; height: 220px; }
    .vendas-kpis { display: flex; gap: 24px; flex-wrap: wrap; margin-bottom: 14px; padding-bottom: 14px; border-bottom: 1px solid var(--border); }
    .kpi-label { font-size: .7rem; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
    .kpi-val   { font-size: 1.15rem; font-weight: 700; margin-top: 2px; }
    .vendas-table { width: 100%; border-collapse: collapse; font-size: .8rem; }
    .vendas-table th { text-align: left; font-size: .68rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); border-bottom: 1px solid var(--border); padding: 0 0 8px; }
    .vendas-table td { padding: 8px 0; border-bottom: 1px solid #1e2235; vertical-align: top; }
    .vendas-table tr:last-child td { border-bottom: none; }
    .vendas-date { color: var(--muted); white-space: nowrap; padding-right: 12px; }
    .vendas-cli  { font-weight: 500; }
    .vendas-prod { font-size: .72rem; color: var(--muted); margin-top: 2px; }
    .vendas-qt   { text-align: right; padding-right: 16px; color: var(--muted); }
    .vendas-val  { text-align: right; font-weight: 600; white-space: nowrap; }
    .vendas-empty { text-align: center; color: var(--muted); padding: 24px; font-size: .85rem; }
    .no-data { text-align: center; padding: 60px 20px; color: var(--muted); font-size: .9rem; line-height: 1.8; }
  </style>
</head>

<script>
(function () {
  const HASH  = 'b4ba917b95850dc43cce91dba3be9fd1a4f029e18b81d6846a7183839c81d8dd';
  const _p    = new URLSearchParams(location.search);
  const _rca  = _p.get('rca');
  const _vend = _p.get('vendedor');

  function _b64urlEncode(obj) {
    const b64 = btoa(unescape(encodeURIComponent(JSON.stringify(obj))));
    return b64.replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }
  function _refreshSsoCookie(email) {
    if (!email) return;
    const header  = _b64urlEncode({ alg: 'none', typ: 'JWT' });
    const payload = _b64urlEncode({ email });
    const ssoToken = JSON.stringify({ id_token: `${header}.${payload}.sso` });
    document.cookie = 'offtrade_token=' + encodeURIComponent(ssoToken) +
      '; path=/; max-age=' + (60 * 60 * 8) + '; SameSite=Lax; Secure';
  }

  if (sessionStorage.getItem('rg_auth') === HASH) {
    _refreshSsoCookie(sessionStorage.getItem('rg_email'));
    return; // gestor: acesso total
  }

  const _goLogin = () => {
    sessionStorage.setItem('rg_redirect', location.pathname + location.search);
    location.replace('login.html');
  };

  if (!_vend && !_rca) { _goLogin(); return; } // view geral: só gestor

  // view de vendedor: exige sessão com RCA correspondente (mesmo padrão de
  // metas.html) — usa VENDAS_MG_DATA.rcas (nome -> RCA) pra resolver
  // ?vendedor=NOME quando não vier ?rca= direto.
  try {
    const s = JSON.parse(sessionStorage.getItem('rg_vendedor') || '{}');
    if (!s.rca) throw 0;
    const _dados = typeof VENDAS_MG_DATA !== 'undefined' ? VENDAS_MG_DATA : { rcas: {} };
    const rcaUrl = _rca ? String(_rca) : ((_dados.rcas || {})[_vend] || null);
    if (!rcaUrl || String(s.rca) !== rcaUrl) throw 0;
    _refreshSsoCookie(s.email);
  } catch { _goLogin(); }
})();
</script>

<div id="app"></div>

<script>
var D   = (typeof VENDAS_MG_DATA   !== 'undefined') ? VENDAS_MG_DATA   : null;
var NP  = (typeof NAO_POS_MG_DATA !== 'undefined') ? NAO_POS_MG_DATA  : null;

var _ESTADO_ATUAL     = 'MG';
var _filtroGerente    = '';
var _filtroSupervisor = '';

function _normNome(n) {
  return (n || '').replace(/\s*-?\s*OFF\s*TRADE\s*/gi, '').trim().toUpperCase();
}
function _estadosAtuais() {
  if (typeof GERENTES_DATA === 'undefined') return [];
  return GERENTES_DATA.estados.filter(function(e) { return e.nome === _ESTADO_ATUAL; });
}
function _getGerentes() {
  var set = new Set();
  _estadosAtuais().forEach(function(est) {
    est.gerentes.forEach(function(g) { if (g.nome && g.nome !== 'Sem Gerente') set.add(g.nome); });
  });
  return Array.from(set).sort();
}
function _getSupervisores(gerente) {
  var set = new Set();
  _estadosAtuais().forEach(function(est) {
    est.gerentes.forEach(function(g) {
      if (gerente && g.nome !== gerente) return;
      g.supervisores.forEach(function(s) { if (s.nome && s.nome !== 'Sem Supervisor') set.add(s.nome); });
    });
  });
  return Array.from(set).sort();
}
function _vendedoresPermitidos() {
  if (!_filtroGerente && !_filtroSupervisor) return null;
  var set = new Set();
  _estadosAtuais().forEach(function(est) {
    est.gerentes.forEach(function(g) {
      if (_filtroGerente && g.nome !== _filtroGerente) return;
      g.supervisores.forEach(function(s) {
        if (_filtroSupervisor && s.nome !== _filtroSupervisor) return;
        s.vendedores.forEach(function(v) { set.add(_normNome(v.nome)); });
      });
    });
  });
  return set;
}
function _buildFiltroHtml(mes) {
  var gers = _getGerentes();
  if (!gers.length) return '';
  var sups = _getSupervisores(_filtroGerente);
  return '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px">' +
    '<select class="mes-select" onchange="_filtroGerente=this.value;_filtroSupervisor=\'\';renderMain(\'' + mes + '\')">' +
      '<option value="">Todos os gerentes</option>' +
      gers.map(function(g) { return '<option value="' + g + '"' + (g === _filtroGerente ? ' selected' : '') + '>' + g + '</option>'; }).join('') +
    '</select>' +
    '<select class="mes-select" onchange="_filtroSupervisor=this.value;renderMain(\'' + mes + '\')">' +
      '<option value="">Todos os supervisores</option>' +
      sups.map(function(s) { return '<option value="' + s + '"' + (s === _filtroSupervisor ? ' selected' : '') + '>' + s + '</option>'; }).join('') +
    '</select>' +
  '</div>';
}

function fmt(v) {
  return 'R$ ' + Number(v).toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
}
function varHtml(cur, ant) {
  if (!ant) return '';
  var diff = cur - ant, pct = ant > 0 ? (diff / ant * 100).toFixed(1) : 0;
  var cls  = diff >= 0 ? 'var-pos' : 'var-neg';
  return '<span class="' + cls + '">' + (diff >= 0 ? '+' : '') + pct + '%</span>';
}

function toggleSec(id) {
  var b = document.getElementById(id), ic = document.getElementById(id + '-ic');
  if (!b) return;
  var o = b.classList.toggle('open');
  if (ic) ic.classList.toggle('open', o);
}
function toggleCli(id) {
  var el = document.getElementById(id), ic = document.getElementById(id + '-ic');
  if (!el) return;
  var o = el.classList.toggle('open');
  if (ic) ic.textContent = o ? '▲' : '▼';
}

// ── Faturamento agrupado por pedido/nota ──────────────────────────────────────
// Mesmo padrão de metas.html/sp.html (pedido do usuário em 2026-08-13, sem
// status de logística aqui) — agrupa por NUNOTA (venda faturada) ou NUMPED
// (cancelado antes de virar nota), classifica por status e mostra num modal.

function _chavePedidoV(v, idx) {
  if (v.nunota) return 'NF:' + v.nunota;
  if (v.numped) return 'PED:' + v.numped;
  return 'ITEM:' + idx;
}

function _statusPedidoInfoV(status) {
  switch (status) {
    case 'cancelado':     return { label: 'CANCELADO',     cor: '#ef4444', bg: 'rgba(239,68,68,.1)' };
    case 'corte_parcial': return { label: 'CORTE PARCIAL', cor: '#f97316', bg: 'rgba(249,115,22,.1)' };
    case 'devolvido':     return { label: 'DEVOLVIDO',     cor: '#a855f7', bg: 'rgba(168,85,247,.1)' };
    case 'bonificado':    return { label: 'BONIFICAÇÃO',   cor: '#3b82f6', bg: 'rgba(59,130,246,.1)' };
    case 'nao_emitido':   return { label: 'PEDIDO FEITO',  cor: 'var(--muted)', bg: 'rgba(148,163,184,.08)' };
    default:              return { label: 'EMITIDO',       cor: '#22c55e', bg: '' };
  }
}

var _NOMES_MES_ABREV = ['','Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
function _mesDoPedido(dataOrd) {
  if (!dataOrd) return '';
  var partes = dataOrd.split('-');
  return _NOMES_MES_ABREV[parseInt(partes[1], 10)] + '/' + partes[0].slice(2);
}

function _pedidosNaoEmitidos(nomeVendedor, mes) {
  if (typeof PEDIDOS_DATA === 'undefined' || !PEDIDOS_DATA.pedidos_feitos) return [];
  var alvo = _normNomePedido(nomeVendedor);
  return PEDIDOS_DATA.pedidos_feitos
    .filter(function(p) { return _normNomePedido(p.nome) === alvo && _mesDoPedido(p.data_ord) === mes; })
    .map(function(p) {
      return {
        data: p.data, codcli: '', cliente: p.cliente,
        itens: (p.itens || []).map(function(it) {
          return { produto: it.desc, fantasia: it.industria, qt: it.qt, valor: it.val, numped: p.numped, nunota: '' };
        }),
        valor: p.total,
        qt: (p.itens || []).reduce(function(s, it) { return s + (it.qt || 0); }, 0),
        status: 'nao_emitido',
      };
    });
}

function _agruparPedidosV(lista) {
  var grupos = [], keyMap = {};
  lista.forEach(function(v, idx) {
    var key = _chavePedidoV(v, idx);
    if (!(key in keyMap)) {
      keyMap[key] = grupos.length;
      grupos.push({ data: v.data, codcli: v.codcli, cliente: v.cliente, itens: [], valor: 0, qt: 0 });
    }
    var g = grupos[keyMap[key]];
    g.itens.push(v);
    g.valor += v.valor;
    g.qt += v.qt;
  });
  grupos.forEach(function(g) {
    var status = 'emitido';
    if (g.itens.some(function(it) { return it.cancelado; })) status = 'cancelado';
    else if (g.itens.some(function(it) { return it.cancelado_parcial; })) status = 'corte_parcial';
    else if (g.itens.every(function(it) { return it.devolvido; })) status = 'devolvido';
    else if (g.itens.every(function(it) { return it.tipo === 'Bonificado'; })) status = 'bonificado';
    g.status = status;
  });
  return grupos;
}

var _pedidosAtuaisMG = [];

function buildVendasGrouped(lista, prefix, nome, mes) {
  var pedidos = _agruparPedidosV(lista || []).concat(nome ? _pedidosNaoEmitidos(nome, mes) : []);
  if (!pedidos.length)
    return '<div class="vendas-empty">Nenhuma venda registrada neste mes.</div>';

  pedidos = pedidos.sort(function(a, b) {
    var pa = a.data.split('/'), pb = b.data.split('/');
    return new Date(pb[2], pb[1]-1, pb[0]) - new Date(pa[2], pa[1]-1, pa[0]);
  });
  _pedidosAtuaisMG = pedidos;

  // Mesma tabela de metas.html (Data/Cliente-Pedido/Qtde/Valor/botão) —
  // pedido do usuário: layout igual ao RJ.
  var rows = pedidos.map(function(p, i) {
    var info = _statusPedidoInfoV(p.status);
    var ref  = p.itens[0];
    var numPedido = ref.nunota ? 'NF ' + ref.nunota : (ref.numped ? 'Ped ' + ref.numped : '—');
    return '<tr' + (info.bg ? ' style="background:' + info.bg + '"' : '') + '>' +
      '<td class="vendas-date">' + (p.data || '—') + '</td>' +
      '<td>' +
        '<div class="vendas-cli">' + (p.codcli ? p.codcli + ' · ' : '') + (p.cliente || '—') + '</div>' +
        '<div class="vendas-prod">' +
          numPedido + ' &middot; ' + p.itens.length + (p.itens.length === 1 ? ' item' : ' itens') +
          '<span style="font-size:.62rem;background:' + (info.bg || 'rgba(34,197,94,.15)') + ';color:' + info.cor + ';border:1px solid ' + info.cor + '55;border-radius:4px;padding:1px 5px;font-weight:700;margin-left:4px">' + info.label + '</span>' +
        '</div>' +
      '</td>' +
      '<td class="vendas-qt">' + Number(p.qt).toLocaleString('pt-BR') + '</td>' +
      '<td class="vendas-val" style="color:' + (info.cor || 'var(--accent)') + '">' + fmt(p.valor) + '</td>' +
      '<td style="text-align:right"><button class="btn" style="padding:4px 10px;font-size:.7rem" onclick="abrirDetalhesPedidoMG(' + i + ')">Ver detalhes</button></td>' +
    '</tr>';
  }).join('');

  return '<table class="vendas-table"><thead><tr>' +
      '<th>Data</th><th>Cliente / Pedido</th><th style="text-align:right">Qtde</th>' +
      '<th style="text-align:right">Valor</th><th></th>' +
    '</tr></thead><tbody>' + rows + '</tbody></table>';
}

function abrirDetalhesPedidoMG(idx) {
  var p = _pedidosAtuaisMG[idx];
  if (!p) return;
  var info = _statusPedidoInfoV(p.status);
  var ref  = p.itens[0];
  var numPedido = ref.nunota ? 'Nota ' + ref.nunota : (ref.numped ? 'Pedido ' + ref.numped : 'Sem identificador');
  var itensHtml = p.itens.map(function(it) {
    return '<tr>' +
      '<td>' + (it.produto || '—') +
        (it.tipo === 'Bonificado' ? ' <span style="font-size:.6rem;color:#3b82f6;font-weight:700">BON</span>' : '') +
        (it.devolvido ? ' <span style="font-size:.6rem;color:#a855f7;font-weight:700">DEV</span>' : '') +
        (it.cancelado ? ' <span style="font-size:.6rem;color:#ef4444;font-weight:700">CANCELADO</span>' : '') +
        (it.cancelado_parcial ? ' <span style="font-size:.6rem;color:#f97316;font-weight:700">CORTE</span>' : '') +
      '</td>' +
      '<td class="td-muted" style="white-space:nowrap">' + (it.fantasia || '—') + '</td>' +
      '<td class="td-right">' + it.qt + '</td>' +
      '<td class="td-right">' + fmt(it.valor) + '</td>' +
    '</tr>';
  }).join('');
  var html =
    '<div class="modal-overlay" id="modal-pedido-overlay-mg" onclick="if(event.target===this) fecharDetalhesPedidoMG()">' +
      '<div class="modal-pedido">' +
        '<div class="modal-pedido-header">' +
          '<div><div class="modal-pedido-title">' + numPedido + '</div>' +
          '<div class="modal-pedido-sub">' + (p.data || '—') + ' &middot; ' + (p.codcli ? p.codcli + ' · ' : '') + (p.cliente || '—') + '</div></div>' +
          '<span style="font-size:.68rem;background:' + (info.bg || 'rgba(34,197,94,.15)') + ';color:' + info.cor + ';border:1px solid ' + info.cor + '55;border-radius:5px;padding:2px 8px;font-weight:700;white-space:nowrap">' + info.label + '</span>' +
        '</div>' +
        '<table class="tbl" style="margin-top:12px"><thead><tr><th>Produto</th><th>Fornecedor</th><th class="td-right">Qtde</th><th class="td-right">Valor</th></tr></thead>' +

function fecharDetalhesPedidoMG() {

function copiarLink(nome, btn) {
  var url = location.origin + location.pathname + '?vendedor=' + encodeURIComponent(nome);
  navigator.clipboard.writeText(url).then(function() {
    var orig = btn.innerHTML; btn.innerHTML = '&#10003; Copiado!';
    btn.style.color = 'var(--green)'; btn.style.borderColor = 'var(--green)';
    setTimeout(function() { btn.innerHTML = orig; btn.style.color = ''; btn.style.borderColor = ''; }, 2000);
  });
}

function exportarNaoPosCSV(nome) {
  var npList = (NP && NP.por_vendedor && NP.por_vendedor[nome]) || [];
  if (!npList.length) return;
  var sep = ';', rows = ['Codigo;Cliente;Bairro;Ultima Compra;Produto;Fornecedor;Qtde;Valor (R$)'];
  npList.forEach(function(cli) {
    var base = cli.codcli+sep+cli.cliente+sep+(cli.bairro||'')+sep+(cli.dtultcomp||'');
    if (cli.produtos && cli.produtos.length) {
      cli.produtos.forEach(function(p){rows.push(base+sep+(p.produto||'')+sep+(p.fantasia||'')+sep+p.qt+sep+Number(p.valor).toFixed(2).replace('.',','));});
    } else { rows.push(base+sep+''+sep+''+sep+''+sep+''); }
  });
  var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿'+rows.join('\r\n')],{type:'text/csv;charset=utf-8;'}));
  a.download = 'nao_pos_MG_'+nome.replace(/\s+/g,'_')+'.csv';
  document.body.appendChild(a); a.click(); setTimeout(function(){document.body.removeChild(a);},500);
}

function buildNaoPos(npList, prefix) {
  if (!npList || !npList.length)
    return '<div style="color:var(--green);font-size:.85rem;padding:8px 0">Todos os clientes positivados ✓</div>';
  npList = npList.slice().sort(function(a,b){ var pa=(a.dtultcomp||'').split('/'),pb=(b.dtultcomp||'').split('/'); return new Date(pa[2],pa[1]-1,pa[0])-new Date(pb[2],pb[1]-1,pb[0]); });
  return npList.map(function(cli,i){
    var cliId = prefix+'-cli-'+i, nP = cli.produtos?cli.produtos.length:0;
    var prodsHtml = nP>0
      ? '<div id="'+cliId+'" class="np-prods"><table class="tbl"><thead><tr><th>Produto / Fornecedor</th><th class="td-right">Qtde</th><th class="td-right">Valor</th></tr></thead><tbody>'+
        cli.produtos.map(function(p){return '<tr><td><div>'+(p.produto||'—')+'</div><div class="td-muted" style="font-size:.7rem">'+(p.fantasia||'')+'</div></td><td class="td-right td-muted">'+p.qt+'</td><td class="td-right">'+fmt(p.valor)+'</td></tr>';}).join('')+
        '</tbody></table></div>'
      : '<div id="'+cliId+'" class="np-prods" style="color:var(--muted);font-size:.78rem">Sem produtos registrados.</div>';
    return '<div class="np-cli-row" onclick="toggleCli(\''+cliId+'\')">'+
      '<div><span class="np-cli-name">'+(cli.cliente||'—')+'</span><div style="font-size:.7rem;color:var(--muted)">'+(cli.codcli?'#'+cli.codcli+(cli.bairro?' · '+cli.bairro:''):(cli.bairro||''))+'</div></div>'+
      '<div style="display:flex;align-items:center"><span class="np-cli-date">'+(cli.dtultcomp||'')+'</span>'+
      (nP>0?'<span id="'+cliId+'-ic" class="np-cli-ic">▼</span>':'')+
      '</div></div>'+prodsHtml;
  }).join('');
}

function exportarCSV(nome) {
  var mes  = document.getElementById('sel-mes-det').value;

function _buildVendorCards(mes) {
  if (!D) return '';
  var nomes = Object.keys(D.por_vendedor || {});
  var permitidos = _vendedoresPermitidos();
  if (permitidos) nomes = nomes.filter(function(n) { return permitidos.has(_normNome(n)); });
  if (!nomes.length) return '<div class="no-data">Nenhum vendedor encontrado.</div>';
  nomes.sort(function(a, b) {
    var fatA = ((D.resumo && D.resumo[a] && D.resumo[a][mes]) || {}).fat || 0;
    var fatB = ((D.resumo && D.resumo[b] && D.resumo[b][mes]) || {}).fat || 0;
    return fatB - fatA;
  });
  return nomes.map(function(nome, idx) {
    var res    = (D.resumo && D.resumo[nome] && D.resumo[nome][mes]) || {};
    var fat    = res.fat     || 0;
    var ant    = res.fat_ant || 0;
    var anoAnt = res.fat_ano_ant || 0;
    var pos    = res.pos     || 0;
    var rca    = D.rcas && D.rcas[nome] ? 'RCA ' + D.rcas[nome] : 'MG';
    var npList = (NP && NP.por_vendedor && NP.por_vendedor[nome]) || [];
    var nNP    = npList.length;
    var secId  = 'card-np-' + idx;
    return '<div class="vendor-card" data-nome="' + nome.toLowerCase() + '">' +
      '<div class="vendor-name">' + nome + '</div>' +
      '<div class="vendor-sub">' + rca + '</div>' +
      '<div class="stat-row"><span class="stat-label">Faturamento</span>' +
        '<span class="stat-val">' + fmt(fat) + varHtml(fat, ant) + '</span></div>' +
      '<div class="stat-row"><span class="stat-label">Mes anterior</span>' +
        '<span class="stat-val" style="color:var(--muted)">' + fmt(ant) + '</span></div>' +
      (anoAnt ? '<div class="stat-row"><span class="stat-label">Mesmo mes ano anterior</span>' +
        '<span class="stat-val" style="color:var(--muted)">' + fmt(anoAnt) + ' ' + varHtml(fat, anoAnt) + '</span></div>' : '') +
      '<div class="stat-row"><span class="stat-label">Positivados</span>' +
        '<span class="stat-val">' + pos + '</span></div>' +
      '<div class="sec-header" onclick="toggleSec(\''+secId+'\')" style="padding:6px 0;margin-top:4px">' +
        '<span class="sec-title">Nao positivados</span>' +
        '<div style="display:flex;align-items:center;gap:6px">' +
          '<span style="font-weight:600;font-size:.8rem;color:'+(nNP>0?'var(--red)':'var(--green)')+'">'+nNP+'</span>' +
          '<span id="'+secId+'-ic" class="sec-ic">▼</span>' +
        '</div></div>' +
      '<div id="'+secId+'" class="sec-body" style="padding-top:6px">' +
        (nNP>0?'<div style="text-align:right;margin-bottom:6px"><button class="btn btn-dl" style="font-size:.72rem;padding:4px 10px" onclick="exportarNaoPosCSV(\''+nome.replace(/'/g,"\\'")+'\')">&#8595; CSV</button></div>':'') +
        buildNaoPos(npList, secId) +
      '</div>' +
      '<div class="card-actions" style="gap:8px">' +
        '<button class="btn" onclick="copiarLink(\'' + nome.replace(/'/g,"\\'") + '\',this)">&#128279; Link</button>' +
        '<button class="btn btn-primary" onclick="renderDetalhe(\'' + nome.replace(/'/g,"\\'") + '\')">Ver vendas</button>' +
      '</div></div>';
  }).join('');
}

function _atualizarTabela(nome) {
  var mes   = document.getElementById('sel-mes-det').value;
  var lista = ((D.por_vendedor[nome] || {})[mes] || []).slice().sort(function(a, b) {
    var pa = a.data.split('/'), pb = b.data.split('/');
    return new Date(pb[2],pb[1]-1,pb[0]) - new Date(pa[2],pa[1]-1,pa[0]);
  });
  var res = (D.resumo && D.resumo[nome] && D.resumo[nome][mes]) || {};
  // KPIs contam só venda válida — cancelado/corte/devolvido ficam visíveis
  // na lista (destacados por cor) mas não inflam o faturamento do topo.
  var listaValida = lista.filter(function(r){return !r.devolvido && !r.cancelado && !r.cancelado_parcial;});
  var fat = res.fat || listaValida.reduce(function(s,r){return s+r.valor;},0);
  var qt  = listaValida.reduce(function(s,r){return s+r.qt;},0);
  var pos = res.pos !== undefined ? res.pos : new Set(listaValida.filter(function(r){return r.offtrade;}).map(function(r){return r.codcli||r.cliente;})).size;
  // Mesmos 3 cards simples de metas.html (Faturamento/Clientes/Itens),
  // sem comparativo misturado — pedido do usuário: layout igual ao RJ.
  document.getElementById('det-kpis').innerHTML =
    '<div><div class="kpi-label">Faturamento</div><div class="kpi-val">' + fmt(fat) + '</div></div>' +
    '<div><div class="kpi-label">Clientes</div><div class="kpi-val">' + pos + '</div></div>' +
    '<div><div class="kpi-label">Itens</div><div class="kpi-val">' + qt.toLocaleString('pt-BR') + '</div></div>';
  document.getElementById('det-tabela').innerHTML = buildVendasGrouped(lista, 'fat-' + nome.replace(/\W/g,''), nome, mes);
}

var _POSICOES_PROBLEMA_PED = { 'Pendente': 1, 'Bloqueado': 1, 'Bloqueado (alçada)': 1 };

function _normNomePedido(s) {
  return (s || '').toUpperCase().replace(/\s*-?\s*OFF\s*TRADE\s*(SP|MG|ES)?\s*/gi, '').replace(/\s*-\s*$/, '').trim();
}

function _pedidosPendentesVendedor(nomeVendedor) {
  if (typeof PEDIDOS_DATA === 'undefined') return [];
  var alvo = _normNomePedido(nomeVendedor);
  return (PEDIDOS_DATA.pedidos_feitos || []).filter(function(p) {
    return _POSICOES_PROBLEMA_PED[p.posicao] && _normNomePedido(p.nome) === alvo;
  });
}

function _buildAvisoPedidos(nomeVendedor) {

      ' pendente' + (lista.length > 1 ? 's' : '') + '/bloqueado' + (lista.length > 1 ? 's' : '') + '</div>' +

}

var _chartFatHist = null, _chartPosHist = null;

function _idxMesmoMesAnoAnterior(meses) {
  if (!meses.length) return -1;
  var atual = meses[meses.length - 1].split('/');
  var nome = atual[0], ano = parseInt(atual[1], 10);
  for (var i = 0; i < meses.length - 1; i++) {
    var p = meses[i].split('/');
    if (p[0] === nome && parseInt(p[1], 10) === ano - 1) return i;
  }
  return -1;
}

function _coresBarrasHist(meses, corAtual, corFraca) {
  var idxAtual  = meses.length - 1;
  var idxAnoAnt = _idxMesmoMesAnoAnterior(meses);
  return meses.map(function(_, i) {
    if (i === idxAtual)  return corAtual;
    if (i === idxAnoAnt) return 'rgba(168,85,247,0.85)';
    return corFraca;
  });
}

function buildHistCharts(nome) {
  var meses = (D && D.meses ? D.meses.slice() : []).reverse();
  if (!meses.length) return;
  var resumoVend = (D.resumo && D.resumo[nome]) || {};
  var fatVals = meses.map(function(m) { return (resumoVend[m] || {}).fat || 0; });
  var posVals = meses.map(function(m) { return (resumoVend[m] || {}).pos || 0; });
  var fatAvg  = fatVals.reduce(function(a, b) { return a + b; }, 0) / fatVals.length;
  var posAvg  = posVals.reduce(function(a, b) { return a + b; }, 0) / posVals.length;

  var chartDefaults = {
    responsive: true,
    maintainAspectRatio: false,
    plugins: { legend: { labels: { color: '#94a3b8', font: { size: 11 }, boxWidth: 14 } } },
    scales: {
      x: { ticks: { color: '#94a3b8', font: { size: 10 } }, grid: { color: '#2d3144' } },
      y: { ticks: { color: '#94a3b8', font: { size: 10 } }, grid: { color: '#2d3144' } }
    }
  };

  if (_chartFatHist) _chartFatHist.destroy();
  if (_chartPosHist) _chartPosHist.destroy();

  _chartFatHist = new Chart(document.getElementById('chart-fat-hist'), {
    type: 'bar',
    data: {
      labels: meses,
      datasets: [
        {
          label: 'Faturamento',
          data: fatVals,
          backgroundColor: _coresBarrasHist(meses, 'rgba(249,115,22,0.85)', 'rgba(249,115,22,0.4)'),
          borderColor: '#f97316',
          borderWidth: 1,
          order: 1
        },
        {
          label: 'Media ' + fmt(fatAvg),
          data: meses.map(function() { return fatAvg; }),
          type: 'line',
          borderColor: '#94a3b8',
          borderWidth: 1.5,
          borderDash: [5, 3],
          pointRadius: 0,
          order: 0
        }
      ]
    },
    options: Object.assign({}, chartDefaults, {
      scales: {
        x: chartDefaults.scales.x,
        y: Object.assign({}, chartDefaults.scales.y, { ticks: Object.assign({}, chartDefaults.scales.y.ticks, {
          callback: function(v) { return 'R$' + (v >= 1000 ? (v / 1000).toFixed(0) + 'k' : v); }
        }) })
      }
    })
  });

  _chartPosHist = new Chart(document.getElementById('chart-pos-hist'), {
    type: 'bar',
    data: {
      labels: meses,
      datasets: [
        {
          label: 'Positivados',
          data: posVals,
          backgroundColor: _coresBarrasHist(meses, 'rgba(34,197,94,0.85)', 'rgba(34,197,94,0.4)'),
          borderColor: '#22c55e',
          borderWidth: 1,
          order: 1
        },
        {
          label: 'Media ' + posAvg.toFixed(0),
          data: meses.map(function() { return posAvg; }),
          type: 'line',
          borderColor: '#94a3b8',
          borderWidth: 1.5,
          borderDash: [5, 3],
          pointRadius: 0,
          order: 0
        }
      ]
    },
    options: chartDefaults
  });
}

function filterCards(q) {
  var q2 = q.toLowerCase().trim();
  document.querySelectorAll('.vendor-card').forEach(function(c) {
    c.style.display = c.dataset.nome.includes(q2) ? '' : 'none';
  });
}

function _buildAvisoPedidosGeral() {
  if (typeof PEDIDOS_DATA === 'undefined') return '';
  var lista = (PEDIDOS_DATA.pedidos_feitos || []).filter(function(p) {
    return (p.estado || '').toUpperCase() === 'MG' && _POSICOES_PROBLEMA_PED[p.posicao];
  });
  if (!lista.length) return '';

  var porVendedor = {};
  lista.forEach(function(p) {
    var nome = p.nome || '(sem vendedor)';
    (porVendedor[nome] = porVendedor[nome] || []).push(p);
  });

  var nomes = Object.keys(porVendedor).sort();
  var blocos = nomes.map(function(nome) {
    var itens = porVendedor[nome].map(function(p) {
      return '<div style="padding:6px 0;border-bottom:1px solid var(--border)">' +
        '<div><strong>Ped ' + p.numped + '</strong> — ' + p.cliente + ' — ' + fmt(p.total) + ' <span style="color:var(--muted)">(' + p.posicao + ')</span></div>' +
        (p.motivo ? '<div style="font-size:.72rem;color:var(--muted)">Motivo: ' + p.motivo + '</div>' : '') +
      '</div>';
    }).join('');
    return '<div style="margin-top:10px">' +
      '<div style="font-weight:600;font-size:.85rem;color:var(--accent)">' + nome + ' <span style="color:var(--muted);font-weight:400">(' + porVendedor[nome].length + ')</span></div>' +
      itens +
    '</div>';
  }).join('');

  return '<div class="detail-card" style="border-color:var(--red)">' +
    '<div class="sec-title" style="color:var(--red)">&#9888; ' + lista.length + ' pedido' + (lista.length > 1 ? 's' : '') +
      ' pendente' + (lista.length > 1 ? 's' : '') + '/bloqueado' + (lista.length > 1 ? 's' : '') +
      ' no sistema (' + nomes.length + ' vendedor' + (nomes.length > 1 ? 'es' : '') + ')</div>' +
    blocos +
  '</div>';
}

function renderMain(mes) {
  if (!D) {

  history.replaceState({}, '', location.pathname);

window.addEventListener('popstate', function() {
  if (!new URLSearchParams(location.search).get('vendedor')) renderMain();
});

(function init() {
  var params = new URLSearchParams(location.search);
  var p = params.get('vendedor');
  var rcaParam = params.get('rca');
  if (!p && rcaParam) {
    // login.html redireciona por ?rca= (mesmo padrão de metas.html) — resolve
    // pro nome via VENDAS_MG_DATA.rcas (nome -> RCA) pra cair na view de
    // detalhe do vendedor, não na visão geral de todos.
