<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <script src="vps_redirect.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acesso — OfftradeHub</title>
  <script src="vendedores_auth_data.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f1117; --card: #1a1d27; --accent: #f5c518;
      --text: #e2e8f0; --muted: #94a3b8; --border: #2d3144; --red: #ef4444;
    }
    body {
      background: var(--bg); color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 16px;
    }
    .box {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 16px; padding: 36px 32px; width: 100%; max-width: 380px;
      display: flex; flex-direction: column; align-items: center; gap: 20px;
    }
    .logo { font-size: 1.4rem; font-weight: 800; color: var(--accent); letter-spacing: -.02em; text-align: center; }
    .logo span { color: var(--muted); font-weight: 400; font-size: .88rem; display: block; margin-top: 4px; }
    .hint { font-size: .76rem; color: var(--muted); text-align: center; line-height: 1.5; }
    .hint strong { color: var(--text); }
    .field { width: 100%; display: flex; flex-direction: column; gap: 7px; }
    label { font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
    input {
      width: 100%; padding: 12px 14px; border-radius: 8px;
      border: 1px solid var(--border); background: var(--bg);
      color: var(--text); font-size: 1rem; outline: none;
      transition: border-color .15s; font-family: inherit;
      -moz-appearance: textfield;
    }
    input[type=number] { text-align: center; font-size: 1.3rem; font-weight: 700; letter-spacing: .12em; }
    input[type=number]::-webkit-outer-spin-button,
    input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }
    input[type=password] { text-align: center; font-size: 1.3rem; font-weight: 700; letter-spacing: .12em; }
    input:focus { border-color: var(--accent); }
    input::placeholder { font-weight: 400; font-size: .9rem; letter-spacing: normal; color: var(--muted); }
    #vend-fields { width: 100%; display: none; flex-direction: column; gap: 14px; }
    button.btn-submit {
      width: 100%; padding: 11px; border-radius: 8px;
      background: var(--accent); color: #111; font-size: .95rem;
      font-weight: 700; border: none; cursor: pointer;
      transition: background .15s; font-family: inherit;
    }
    button.btn-submit:hover { background: #d4a90e; }
    .divider { width: 100%; display: flex; align-items: center; gap: 10px; font-size: .72rem; color: var(--muted); }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }
    #google-btn-wrap { width: 100%; display: flex; justify-content: center; min-height: 44px; }
    .google-btn {
      width: 100%; max-width: 316px; height: 44px; display: flex; align-items: center; justify-content: center;
      gap: 10px; background: #131314; color: #e3e3e3; border: 1px solid #8e918f; border-radius: 8px;
      font-size: .92rem; font-weight: 500; font-family: 'Google Sans', Roboto, inherit; cursor: pointer;
      transition: background .15s;
    }
    .google-btn:hover { background: #1a1a1b; }
    .erro { font-size: .82rem; color: var(--red); text-align: center; min-height: 20px; line-height: 1.4; }

    #loading-overlay {
      position: fixed; inset: 0; background: var(--bg);
      display: none; align-items: center; justify-content: center;
      flex-direction: column; gap: 18px; z-index: 999;
    }
    #loading-overlay.show { display: flex; }
    .chart-bars { display: flex; align-items: flex-end; gap: 6px; height: 56px; }
    .chart-bars span {
      display: block; width: 10px; border-radius: 3px 3px 0 0;
      background: var(--accent);
      animation: chart-grow 1s ease-in-out infinite;
    }
    .chart-bars span:nth-child(1) { height: 18px; animation-delay: -0.45s; }
    .chart-bars span:nth-child(2) { height: 30px; animation-delay: -0.30s; }
    .chart-bars span:nth-child(3) { height: 44px; animation-delay: -0.15s; }
    .chart-bars span:nth-child(4) { height: 56px; animation-delay: 0s; }
    @keyframes chart-grow {
      0%, 100% { transform: scaleY(.45); opacity: .55; }
      50%      { transform: scaleY(1);   opacity: 1;   }
    }
    .loading-text { font-size: .85rem; color: var(--muted); letter-spacing: .02em; }
  </style>
</head>
<body>
  <div id="loading-overlay">
    <div class="chart-bars"><span></span><span></span><span></span><span></span></div>
    <div class="loading-text">Entrando...</div>
  </div>

  <div class="box">
    <div class="logo">OfftradeHub <span>Painel Comercial</span></div>

    <p class="hint">
      <strong>Vendedor:</strong> informe seu RCA, e-mail e senha.<br>
      <strong>Gestor:</strong> deixe o RCA em branco e entre com Google.
    </p>

    <form id="form" style="width:100%;display:flex;flex-direction:column;gap:14px">
      <div class="field">
        <label for="rca">RCA / CODUSUR <span style="font-size:.65rem;font-weight:400">(apenas vendedores)</span></label>
        <input type="number" id="rca" placeholder="Deixe em branco se for gestor" autocomplete="off">
      </div>

      <div id="vend-fields">
        <div class="field">
          <label for="email">E-mail cadastrado</label>
          <input type="email" id="email" placeholder="seu@email.com" autocomplete="off">
        </div>
        <div class="field">
          <label for="pin">Senha</label>
          <input type="password" id="pin" placeholder="······" autocomplete="off">
        </div>
        <button type="submit" class="btn-submit">Entrar</button>
      </div>
    </form>

    <div class="divider" id="divider-google">ou</div>
    <div id="google-btn-wrap">
      <button type="button" id="google-btn" class="google-btn">
        <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
          <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84c-.21 1.13-.84 2.09-1.8 2.73v2.27h2.91c1.7-1.57 2.69-3.88 2.69-6.64z"/>
          <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.17l-2.91-2.27c-.81.54-1.84.86-3.05.86-2.34 0-4.33-1.58-5.04-3.71H.96v2.34C2.44 15.98 5.48 18 9 18z"/>
          <path fill="#FBBC05" d="M3.96 10.71c-.18-.54-.28-1.11-.28-1.71s.1-1.17.28-1.71V4.95H.96C.35 6.17 0 7.55 0 9s.35 2.83.96 4.05l3-2.34z"/>
          <path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0 5.48 0 2.44 2.02.96 4.95l3 2.34C4.67 5.16 6.66 3.58 9 3.58z"/>
        </svg>
        <span>Entrar com Google</span>
      </button>
    </div>

    <div class="erro" id="erro"></div>
  </div>

  <script>
    const AUTH_HASH = 'b4ba917b95850dc43cce91dba3be9fd1a4f029e18b81d6846a7183839c81d8dd';
    const EMAILS_OK = [
      'danielle.soares@rigarr.com.br',
      'allan.correa@rigarr.com.br',
      'leonardo.campos@rigarr.com.br',
      'alexsandro.nunes@rigarr.com.br',
      'giovani.cabral@rigarr.com.br',
      'kaliel.caro@rigarr.com.br',
      'artur.furlan@rigarr.com.br',
      'daniel.diniz@rigarr.com.br',
      'marcus.tanamachi@rigarr.com.br',
      'geovanna.lescano@rigarr.com.br',
      'fernando.risson@rigarr.com.br',
      'erocles.oliveira@rigarr.com.br',
      'andre.massensini@rigarr.com.br',
      'priscilla.zambrano@rigarr.com.br',
      'anderson.canaveis@rigarr.com.br',
    ];

    // SSO com o Streamlit (Preco_Promo): mesmo domínio
    // (nginx roteia tudo por offtrade.duckdns.org), então um cookie aqui já
    // é lido por require_auth() do lado do Streamlit (CookieController lê
    // "offtrade_token" no mesmo formato que o próprio login OAuth2 salva) —
    // sem isso, era preciso logar de novo ao clicar em "Pedir limite e
    // cadastro". O Streamlit só decodifica o e-mail do token, sem checar
    // assinatura (utils.py:_decode_email), então basta o token "parecer"
    // um JWT válido — funciona tanto com o id_token real do Google quanto
    // com um token fabricado localmente pro fluxo de RCA+senha (que nunca
    // passa pelo Google). Definida antes dos atalhos de "já autenticado"
    // abaixo pra poder renovar o cookie mesmo quando o login em si não
    // roda de novo nesta aba.
    function _b64urlEncode(obj) {
      const b64 = btoa(unescape(encodeURIComponent(JSON.stringify(obj))));
      return b64.replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }
    function _setSsoCookie(idToken) {
      const ssoToken = JSON.stringify({ id_token: idToken });
      document.cookie = 'offtrade_token=' + encodeURIComponent(ssoToken) +
        '; path=/; max-age=' + (60 * 60 * 8) + '; SameSite=Lax; Secure';
    }
    function _setSsoCookieParaEmail(email) {
      const header  = _b64urlEncode({ alg: 'none', typ: 'JWT' });
      const payload = _b64urlEncode({ email });
      _setSsoCookie(`${header}.${payload}.sso`);
    }

    // Já autenticado como gestor
    const _stored = sessionStorage.getItem('rg_auth');
    if (_stored === AUTH_HASH) {
      const _email = sessionStorage.getItem('rg_email');
      if (_email) _setSsoCookieParaEmail(_email);
      location.replace('index.html');
    } else if (_stored) {
      sessionStorage.removeItem('rg_auth');
      sessionStorage.removeItem('rg_redirect');
    }

    // Já autenticado como vendedor
    try {
      const sv = JSON.parse(sessionStorage.getItem('rg_vendedor') || '{}');
      if (sv.rca && sv.nome) {
        if (sv.email) _setSsoCookieParaEmail(sv.email);
        location.replace('metas.html?rca=' + encodeURIComponent(sv.rca));
      }
    } catch {}

    function showLoading() {
      document.getElementById('loading-overlay').classList.add('show');
    }
    function hideLoading() {
      document.getElementById('loading-overlay').classList.remove('show');
    }

    function showErro(msg, emailOverride) {
      if (msg) hideLoading();
      document.getElementById('erro').textContent = msg;
      if (msg) _reportarErro(msg, emailOverride);
    }

    // Reporta erro de login pro servidor (rota /api/login-erro, no mesmo
    // serviço do controle_vencimento) — ele que manda o WhatsApp de alerta,
    // pra não expor a chave da Evolution API aqui no navegador. Best-effort:
    // se a rota falhar (offline, deploy pendente etc), não trava o login.
    //
    // emailOverride: no fluxo Google (_onGoogleCode), o e-mail real vem
    // da troca de code em /api/auth/oauth/exchange, não do campo #email (que
    // só existe no fluxo de vendedor por PIN) — sem isso o alerta chegava
    // com "E-mail: —", impossível de saber quem tentou logar (confirmado em
    // 2026-07-24).
    function _reportarErro(msg, emailOverride) {
      try {
        const rca = document.getElementById('rca').value.trim();
        const emailEl = document.getElementById('email');
        const email = emailOverride || (emailEl ? emailEl.value.trim() : '');
        fetch('/api/login-erro', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ rca, email, erro: msg, pagina: location.pathname }),
          keepalive: true,
        }).catch(() => {});
      } catch {}
    }

    // Cada estado tem sua própria página de vendas — sem isso, todo vendedor
    // caía direto em metas.html (só RJ), então quem era de MG/SP/ES via uma
    // tela sem o próprio RCA nela (dado mora em vendas_mg/sp/es_data.js, não
    // em metas_data.js). Roteia pela mesma "estado" já cadastrada em
    // VENDEDORES_AUTH (a mesma usada pra decidir @gmail vs @rigarr acima).
    //
    // NÃO reaproveita rg_redirect pra vendedor: esse valor guarda a última
    // página que a pessoa tentou acessar antes de cair no login (ex: um
    // teste anterior batendo em metas.html) — se reaproveitado, teria
    // prioridade sobre o roteamento por estado e mandaria um vendedor de MG
    // pra metas.html (RJ) só porque foi lá que ele tentou entrar antes
    // (bug confirmado em 2026-07-24). Vendedor sempre recalcula a página
    // certa a partir do estado cadastrado, ignorando qualquer redirect salvo.
    const _PAGINA_POR_ESTADO = { MG: 'mg.html', SP: 'sp.html', ES: 'es.html' };

    // CODUSUR não é único entre estados (ex: 378 é uma pessoa no RJ e outra em
    // MG) — VENDEDORES_AUTH[rca] é uma LISTA de candidatos, não um objeto só;
    // o e-mail informado (por PIN ou Google) é quem desempata qual candidato
    // é o vendedor de verdade (confirmado em 2026-08-03, caso Jeter x Fabio).
    function _candidatosPorRca(rca) {
      return VENDEDORES_AUTH[rca] || [];
    }
    function _acharPorEmail(candidatos, email) {
      return candidatos.find(v => [v.email, v.email2]
        .filter(Boolean).map(e => e.toLowerCase()).includes(email));
    }

    function _doRedirect(rca, vendedor) {
      sessionStorage.removeItem('rg_redirect');
      vendedor = vendedor || {};
      const pagina = _PAGINA_POR_ESTADO[(vendedor.estado || '').toUpperCase()] || 'metas.html';
      const nomeCurto = (vendedor.nome || '').replace(/\s*-\s*OFF TRADE\s*$/i, '').trim();
      location.replace(pagina + '?vendedor=' + encodeURIComponent(nomeCurto || rca));
    }

    // Mostrar campos conforme RCA digitado
    document.getElementById('rca').addEventListener('input', function () {
      showErro('');
      const rca = this.value.trim();
      if (!rca) {
        document.getElementById('vend-fields').style.display    = 'none';
        document.getElementById('divider-google').style.display = 'flex';
        document.getElementById('google-btn-wrap').style.display = 'flex';
        return;
      }
      // Mostra e-mail+senha sempre que o RCA tiver candidato cadastrado,
      // independente do domínio do e-mail — inclui e-mail corporativo de
      // parceiro externo sem Google Workspace (ex: RCA 588/W.S,
      // willianseto@unityatacado.com.br, pedido explícito do usuário em
      // 2026-08-06: SSO do Google não cobre domínio de terceiro). Continua
      // valendo pra webmail pessoal também (ex: JETER LUCIO SOARES, RCA
      // 378/MG, @yahoo.com.br — motivo original de existir esse fluxo,
      // confirmado em 2026-08-03). Quem tem Google Workspace corporativo
      // ainda pode entrar pelo botão do Google, que continua visível.
      const candidatos = _candidatosPorRca(rca);
      if (candidatos.length) {
        document.getElementById('vend-fields').style.display    = 'flex';
        document.getElementById('divider-google').style.display = 'flex';
      } else {
        document.getElementById('vend-fields').style.display    = 'none';
        document.getElementById('divider-google').style.display = 'none';
      }
      document.getElementById('google-btn-wrap').style.display = 'flex';
    });

    // ── Fluxo vendedor: RCA + email + senha ───────────────────────
    // A senha real de cada vendedor vem da PCUSUARI (Oracle) — validada num
    // serviço à parte (login_api.py, /api/auth/login-vendedor) pra nunca
    // expor a senha de ninguém neste JS público (confirmado em 2026-08-03,
    // caso Jeter: cada vendedor tem sua própria senha no ERP, não faz
    // sentido comparar contra um hash único compartilhado como antes).
    document.getElementById('form').addEventListener('submit', async e => {
      e.preventDefault();
      showErro('');
      const rca   = document.getElementById('rca').value.trim();
      const email = document.getElementById('email').value.trim().toLowerCase();
      const pin   = document.getElementById('pin').value;

      if (!rca) return;
      if (!email) { showErro('Digite seu e-mail.'); return; }
      if (!pin)   { showErro('Digite a senha.'); return; }

      const candidatos = _candidatosPorRca(rca);
      if (!candidatos.length) { showErro('RCA não encontrado.'); return; }

      const vendedor = _acharPorEmail(candidatos, email);
      if (!vendedor) {
        showErro('E-mail não corresponde ao RCA informado.');
        return;
      }

      showLoading();
      let resp;
      try {
        resp = await fetch('/api/auth/login-vendedor', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ rca, email, senha: pin }),
        }).then(r => r.json());
      } catch {
        showErro('Não foi possível verificar a senha agora. Tente novamente em instantes.');
        return;
      }
      if (!resp.ok) { showErro(resp.motivo || 'Senha incorreta.'); return; }

      sessionStorage.setItem('rg_vendedor', JSON.stringify({
        rca, nome: vendedor.nome, email: vendedor.email, estado: vendedor.estado
      }));
      _setSsoCookieParaEmail(vendedor.email);
      _doRedirect(rca, vendedor);
    });

    // ── Fluxo Google: vendedor @rigarr ou gestor (sem RCA) ───────
    // Desde 2026-08-31: em vez do "Sign in with Google" simples (só
    // identidade, google.accounts.id), o botão manda pro fluxo OAuth
    // completo em login_api.py (/api/auth/oauth/login), que também pede o
    // escopo gmail.send — pedido explícito do usuário: quem loga com Google
    // aqui já concede de uma vez a permissão de mandar e-mail pelo próprio
    // Gmail (usada por credito_cadastro_api.py), em vez de um consentimento
    // separado só na hora de mandar a solicitação de cadastro/alteração.
    //
    // Chegou a usar google.accounts.oauth2.initCodeClient com ux_mode:
    // 'popup' (evitava navegar pra fora, preservando o campo #rca) — mas
    // testado e descartado: bloqueio de popup é comum demais pra depender
    // disso. Com redirect de página de verdade, o valor do RCA precisa
    // viajar por fora do campo — vai via query string (?rca=) na ida e
    // volta (login_api.py ecoa de volta em ?g=ok&rca=...).
    function _iniciarLoginGoogle() {
      showErro('');
      const rca = document.getElementById('rca').value.trim();
      location.href = '/api/auth/oauth/login?rca=' + encodeURIComponent(rca)
        + '&voltar=' + encodeURIComponent(location.pathname);
    }

    // Depois do round-trip pelo Google, login_api.py já deixou o cookie
    // COOKIE_GMAIL (offtrade_gmail_token) gravado — só falta descobrir QUAL
    // e-mail (o backend não devolve isso na URL de propósito, pra não vazar
    // e-mail no histórico do navegador) e rodar a MESMA lógica de decisão
    // vendedor-vs-gestor que o fluxo por PIN já usa. /api/credito/oauth/status
    // já existe e lê esse mesmo cookie (compartilhado, mesmo path="/") — sem
    // precisar duplicar essa rota aqui.
    async function _continuarAposGoogle(rca) {
      showErro('');
      showLoading();
      let dados;
      try {
        dados = await fetch('/api/credito/oauth/status').then(r => r.json());
      } catch {
        showErro('Não foi possível confirmar o login do Google agora. Tente novamente.');
        return;
      }
      if (!dados.logado || !dados.email) {
        showErro('Não foi possível confirmar seu e-mail do Google.');
        return;
      }
      const email = dados.email.toLowerCase();

      // Vendedor com email @rigarr
      if (rca) {
        const candidatos = _candidatosPorRca(rca);
        if (!candidatos.length) { showErro('RCA não encontrado.', email); return; }
        const vendedor = _acharPorEmail(candidatos, email);
        if (!vendedor) {
          showErro('E-mail não corresponde ao RCA informado.', email);
          return;
        }
        sessionStorage.setItem('rg_vendedor', JSON.stringify({ rca, nome: vendedor.nome, email: vendedor.email, estado: vendedor.estado }));
        _setSsoCookieParaEmail(email);
        _doRedirect(rca, vendedor);
        return;
      }

      // Gestor (sem RCA)
      if (!EMAILS_OK.includes(email)) {
        // Acesso restrito a UMA página específica (pedido do usuário em
        // 2026-08-26) — NÃO marca rg_auth (o flag de "gestor completo" que
        // as ~30 páginas com auth.js aceitam), só o cookie SSO + redireciona
        // direto pra página permitida. A própria página faz a checagem
        // desse e-mail (ver comentário no <head> de promotoria.html) — em
        // qualquer outra página, esse e-mail cai no fluxo normal de rejeição.
        const _ACESSO_RESTRITO = { 'joao.diniz@rigarr.com.br': 'promotoria.html' };
        if (_ACESSO_RESTRITO[email]) {
          _setSsoCookieParaEmail(email);
          sessionStorage.removeItem('rg_redirect');
          location.replace(_ACESSO_RESTRITO[email]);
          return;
        }
        showErro('E-mail não autorizado.', email);
        return;
      }
      sessionStorage.setItem('rg_auth', AUTH_HASH);
      sessionStorage.setItem('rg_email', email);
      _setSsoCookieParaEmail(email);

      const redir = sessionStorage.getItem('rg_redirect') || '';
      sessionStorage.removeItem('rg_redirect');
      location.replace(redir || 'index.html');
    }

    (function () {
      const params = new URLSearchParams(location.search);
      const g = params.get('g');
      if (!g) return;
      const rca = params.get('rca') || '';
      history.replaceState(null, '', location.pathname);
      // Restaura o RCA digitado ANTES de qualquer coisa (não só no erro de
      // transporte) — sem isso, um erro de "e-mail não corresponde ao RCA"
      // (que só se sabe depois da volta do Google) deixava o campo vazio,
      // obrigando a pessoa a redigitar o RCA pra tentar de novo.
      if (rca) document.getElementById('rca').value = rca;
      if (g === 'erro') {
        showErro('Login com Google cancelado ou recusado.');
        return;
      }
      if (g === 'ok') _continuarAposGoogle(rca);
    })();

    document.getElementById('google-btn').addEventListener('click', _iniciarLoginGoogle);
  </script>
</body>
</html>
