<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acesso — Rigarr</title>
  <script src="vendedores_auth_data.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f1117; --card: #1a1d27; --accent: #f5c518;
      --text: #e2e8f0; --muted: #94a3b8; --border: #2d3144; --red: #ef4444;
    }
    body {
      background: var(--bg); color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 16px;
    }
    .box {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 16px; padding: 36px 32px; width: 100%; max-width: 380px;
      display: flex; flex-direction: column; align-items: center; gap: 20px;
    }
    .logo { font-size: 1.4rem; font-weight: 800; color: var(--accent); letter-spacing: -.02em; text-align: center; }
    .logo span { color: var(--muted); font-weight: 400; font-size: .88rem; display: block; margin-top: 4px; }

    .hint {
      font-size: .76rem; color: var(--muted); text-align: center; line-height: 1.5;
    }
    .hint strong { color: var(--text); }

    .field { width: 100%; display: flex; flex-direction: column; gap: 7px; }
    label { font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
    input[type=number] {
      width: 100%; padding: 12px 14px; border-radius: 8px;
      border: 1px solid var(--border); background: var(--bg);
      color: var(--text); font-size: 1.3rem; outline: none;
      transition: border-color .15s; text-align: center;
      font-family: inherit; font-weight: 700; letter-spacing: .12em;
      -moz-appearance: textfield;
    }
    input[type=number]::-webkit-outer-spin-button,
    input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }
    input[type=number]:focus { border-color: var(--accent); }
    input::placeholder { font-weight: 400; font-size: .95rem; letter-spacing: normal; color: var(--muted); }

    #google-btn-wrap { width: 100%; display: flex; justify-content: center; min-height: 44px; }

    .erro { font-size: .82rem; color: var(--red); text-align: center; min-height: 20px; line-height: 1.4; }
  </style>
</head>
<body>
  <div class="box">
    <div class="logo">Rigarr <span>Painel Comercial</span></div>

    <p class="hint">
      <strong>Vendedor:</strong> informe seu RCA abaixo e entre com Google.<br>
      <strong>Gestor:</strong> deixe o RCA em branco e entre com Google.
    </p>

    <div class="field">
      <label for="rca">RCA / CODUSUR <span style="font-size:.65rem;font-weight:400">(apenas vendedores)</span></label>
      <input type="number" id="rca" placeholder="Deixe em branco se for gestor" autocomplete="off">
    </div>

    <div id="google-btn-wrap"></div>

    <div class="erro" id="erro"></div>
  </div>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script>
    const CLIENT_ID  = '966004363576-ucdlgkjtsfffspp03fiqib2dchp012fs.apps.googleusercontent.com';
    const AUTH_HASH  = 'b4ba917b95850dc43cce91dba3be9fd1a4f029e18b81d6846a7183839c81d8dd';
    const EMAILS_OK  = ['danielle.soares@rigarr.com.br','allan.correa@rigarr.com.br','leonardo.campos@rigarr.com.br','alexsandro.nunes@rigarr.com.br','giovani.cabral@rigarr.com.br'];

    // Já autenticado como gestor
    const _stored = sessionStorage.getItem('rg_auth');
    if (_stored === AUTH_HASH) {
      location.replace('index.html');
    } else if (_stored) {
      sessionStorage.removeItem('rg_auth');
      sessionStorage.removeItem('rg_redirect');
    }

    // Já autenticado como vendedor
    try {
      const sv = JSON.parse(sessionStorage.getItem('rg_vendedor') || '{}');
      if (sv.rca && sv.nome) location.replace('metas.html?rca=' + encodeURIComponent(sv.rca));
    } catch {}

    function showErro(msg) { document.getElementById('erro').textContent = msg; }

    function handleCredential(response) {
      showErro('');
      const rca = document.getElementById('rca').value.trim();

      let payload;
      try {
        const b64 = response.credential.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
        payload = JSON.parse(atob(b64 + '='.repeat((4 - b64.length % 4) % 4)));
      } catch {
        showErro('Erro ao processar credencial. Tente novamente.');
        return;
      }

      const email = (payload.email || '').toLowerCase();

      // ── Fluxo vendedor (RCA preenchido) ──────────────────────────
      if (rca) {
        const vendedor = VENDEDORES_AUTH[rca];
        if (!vendedor) {
          showErro('RCA não encontrado. Verifique o número.');
          google.accounts.id.revoke(email, () => {});
          return;
        }
        if (!vendedor.email || email !== vendedor.email.toLowerCase()) {
          showErro('Conta Google não corresponde ao RCA informado.');
          google.accounts.id.revoke(email, () => {});
          return;
        }
        sessionStorage.setItem('rg_vendedor', JSON.stringify({
          rca, nome: vendedor.nome, email
        }));
        location.replace('metas.html?rca=' + encodeURIComponent(rca));
        return;
      }

      // ── Fluxo gestor (sem RCA) ────────────────────────────────────
      if (!EMAILS_OK.includes(email)) {
        showErro('E-mail não autorizado. Informe seu RCA se for vendedor.');
        google.accounts.id.revoke(email, () => {});
        return;
      }
      sessionStorage.setItem('rg_auth', AUTH_HASH);
      location.replace('index.html');
    }

    window.addEventListener('load', () => {
      if (typeof google === 'undefined') return;
      google.accounts.id.initialize({
        client_id: CLIENT_ID,
        callback: handleCredential,
        auto_select: false,
        cancel_on_tap_outside: true,
      });
      google.accounts.id.renderButton(
        document.getElementById('google-btn-wrap'),
        { theme: 'filled_black', size: 'large', shape: 'rectangular', width: 316, locale: 'pt-BR' }
      );
    });
  </script>
</body>
</html>
