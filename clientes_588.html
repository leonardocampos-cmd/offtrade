<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RCA 588 — Clientes Migrados Mai/26</title>
  <script src="clientes_588_data.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:     #0f1117;
      --card:   #1a1d27;
      --card2:  #22263a;
      --accent: #f5c518;
      --green:  #22c55e;
      --yellow: #eab308;
      --red:    #ef4444;
      --text:   #e2e8f0;
      --muted:  #94a3b8;
      --border: #2d3144;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      padding: 20px 16px;
      max-width: 960px;
      margin: 0 auto;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 28px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
      gap: 12px;
    }
    .header-title h1 { font-size: 1.15rem; font-weight: 800; }
    .header-title p  { font-size: .75rem; color: var(--muted); margin-top: 3px; }
    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--card2); color: var(--text);
      border: 1px solid var(--border); border-radius: 8px;
      padding: 7px 14px; font-size: .8rem; cursor: pointer;
      text-decoration: none; white-space: nowrap;
    }
    .btn:hover { border-color: var(--accent); }

    /* ── Resumo ── */
    .resumo {
      display: flex; gap: 12px; flex-wrap: wrap;
      margin-bottom: 24px;
    }
    .resumo-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 20px;
      min-width: 160px;
      flex: 1;
    }
    .resumo-box .label { font-size: .65rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 6px; }
    .resumo-box .val   { font-size: 1.3rem; font-weight: 800; }
    .resumo-box .val.red    { color: var(--red); }
    .resumo-box .val.yellow { color: var(--yellow); }

    /* ── Busca ── */
    .search-wrap { margin-bottom: 16px; }
    .search-input {
      width: 100%; padding: 10px 14px;
      background: var(--card); border: 1px solid var(--border);
      border-radius: 8px; color: var(--text); font-size: .85rem;
    }
    .search-input:focus { outline: none; border-color: var(--accent); }

    /* ── Legenda ── */
    .legenda {
      display: flex; gap: 16px; flex-wrap: wrap;
      margin-bottom: 16px; font-size: .75rem; color: var(--muted);
    }
    .legenda span { display: flex; align-items: center; gap: 6px; }
    .dot-hibrido { width: 8px; height: 8px; border-radius: 50%; background: var(--yellow); display: inline-block; }
    .dot-migrado { width: 8px; height: 8px; border-radius: 50%; background: var(--red);    display: inline-block; }

    /* ── Cards de clientes ── */
    .cliente-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 10px;
      overflow: hidden;
    }
    .cliente-card.hibrido { border-left: 3px solid var(--yellow); }
    .cliente-card.migrado { border-left: 3px solid var(--red);    }

    .cliente-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 16px; cursor: pointer; gap: 12px; flex-wrap: wrap;
      user-select: none;
    }
    .cliente-header:hover { background: var(--card2); }

    .cliente-nome  { font-weight: 700; font-size: .9rem; }
    .cliente-cod   { font-size: .7rem; color: var(--muted); margin-top: 2px; }

    .cliente-meta {
      display: flex; gap: 20px; flex-wrap: wrap;
      font-size: .75rem; color: var(--muted);
    }
    .cliente-meta span b { color: var(--text); }

    .cliente-total-mai {
      font-size: .95rem; font-weight: 800;
      color: var(--red); white-space: nowrap;
    }
    .cliente-card.hibrido .cliente-total-mai { color: var(--yellow); }

    .chevron { font-size: .8rem; color: var(--muted); transition: transform .2s; }
    .cliente-card.open .chevron { transform: rotate(180deg); }

    /* ── Detalhe (expand) ── */
    .cliente-detalhe {
      display: none;
      padding: 0 16px 16px;
      border-top: 1px solid var(--border);
    }
    .cliente-card.open .cliente-detalhe { display: block; }

    .badge-hibrido {
      display: inline-block;
      background: rgba(234,179,8,.15); color: var(--yellow);
      border-radius: 20px; padding: 2px 10px;
      font-size: .65rem; font-weight: 700; letter-spacing: .06em;
      margin-bottom: 12px; margin-top: 12px;
    }

    .vendedor-bloco {
      background: var(--card2);
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 8px;
      overflow: hidden;
    }
    .vendedor-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 14px; cursor: pointer;
      font-size: .82rem;
    }
    .vendedor-header:hover { background: #2a2f45; }
    .vendedor-nome  { font-weight: 700; }
    .vendedor-total { font-weight: 700; color: var(--red); font-size: .85rem; }
    .vendedor-card.hibrido-v .vendedor-total { color: var(--yellow); }

    .itens-tabela {
      display: none;
      width: 100%;
      border-collapse: collapse;
      font-size: .75rem;
    }
    .vendedor-bloco.open .itens-tabela { display: table; }

    .itens-tabela th {
      background: #1e2235;
      color: var(--muted);
      font-weight: 600;
      padding: 6px 14px;
      text-align: left;
      letter-spacing: .04em;
      font-size: .65rem;
      text-transform: uppercase;
    }
    .itens-tabela td { padding: 6px 14px; border-top: 1px solid var(--border); }
    .itens-tabela tr:hover td { background: var(--card2); }
    .val-col { text-align: right; font-variant-numeric: tabular-nums; }

    /* ── Empty state ── */
    .empty { text-align: center; padding: 48px 0; color: var(--muted); font-size: .9rem; }
  </style>
</head>
<body>

<header>
  <div class="header-title">
    <h1>&#9679; RCA 588 — Clientes Migrados</h1>
    <p id="sub">Carregando...</p>
  </div>
  <a class="btn" href="sp.html">&#8592; Voltar</a>
</header>

<div class="resumo" id="resumo"></div>

<div class="legenda">
  <span><span class="dot-migrado"></span> Comprou somente de outro vendedor em Mai/26</span>
  <span><span class="dot-hibrido"></span> Comprou de outro vendedor E também do RCA 588 em Mai/26</span>
</div>

<div class="search-wrap">
  <input class="search-input" type="text" placeholder="Buscar cliente..." oninput="filtrar(this.value)">
</div>

<div id="lista"></div>

<script>
const D = CLIENTES_588_DATA;

function fmtR(v) {
  return 'R$ ' + Number(v).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

// ── Resumo ────────────────────────────────────────────────────────────────────
document.getElementById('sub').textContent =
  `${D.periodo_fid} → ${D.mes_migracao}  ·  Atualizado ${D.atualizado_em}`;

const soMigrados = D.clientes.filter(c => !c.tambem_comprou_588).length;
const hibridos   = D.clientes.filter(c =>  c.tambem_comprou_588).length;

document.getElementById('resumo').innerHTML = `
  <div class="resumo-box">
    <div class="label">Clientes migrados</div>
    <div class="val red">${D.total_clientes}</div>
  </div>
  <div class="resumo-box">
    <div class="label">Só de outro vendedor</div>
    <div class="val red">${soMigrados}</div>
  </div>
  <div class="resumo-box">
    <div class="label">Compraram dos dois</div>
    <div class="val yellow">${hibridos}</div>
  </div>
  <div class="resumo-box">
    <div class="label">Valor comprado de outros em Mai</div>
    <div class="val red">${fmtR(D.valor_total_outros)}</div>
  </div>`;

// ── Render ────────────────────────────────────────────────────────────────────
function renderCard(c) {
  const cls    = c.tambem_comprou_588 ? 'hibrido' : 'migrado';
  const badge  = c.tambem_comprou_588
    ? `<div class="badge-hibrido">&#9888; Também comprou do RCA 588 em Mai/26</div>`
    : '';

  const vendedores = c.por_vendedor.map(v => {
    const linhas = v.itens.map(i =>
      `<tr>
        <td>${i.DATA}</td>
        <td>${i.PRODUTO}</td>
        <td>${i.FANTASIA}</td>
        <td class="val-col">${fmtR(i.VALOR)}</td>
      </tr>`
    ).join('');
    return `
      <div class="vendedor-bloco">
        <div class="vendedor-header" onclick="toggleVend(this)">
          <span class="vendedor-nome">${v.vendedor} <span style="color:var(--muted);font-weight:400">(RCA ${v.codusur})</span></span>
          <span style="display:flex;align-items:center;gap:10px">
            <span class="vendedor-total">${fmtR(v.total)}</span>
            <span class="chevron">&#9660;</span>
          </span>
        </div>
        <table class="itens-tabela">
          <thead><tr>
            <th>Data</th><th>Produto</th><th>Fornecedor</th><th style="text-align:right">Valor</th>
          </tr></thead>
          <tbody>${linhas}</tbody>
        </table>
      </div>`;
  }).join('');

  return `
    <div class="cliente-card ${cls}" data-nome="${c.cliente.toLowerCase()} ${c.codcli}">
      <div class="cliente-header" onclick="toggleCard(this)">
        <div>
          <div class="cliente-nome">${c.cliente}</div>
          <div class="cliente-cod">Cód. ${c.codcli}</div>
        </div>
        <div class="cliente-meta">
          <span>Última compra c/ 588: <b>${c.ultima_compra_rca}</b></span>
          <span>Jan–Abr c/ 588: <b>${fmtR(c.valor_jan_abr)}</b></span>
          <span>Meses ativos: <b>${c.meses_ativos}</b></span>
        </div>
        <div style="display:flex;align-items:center;gap:10px">
          <span class="cliente-total-mai">${fmtR(c.total_mai_outros)}<br>
            <span style="font-size:.65rem;font-weight:400;color:var(--muted)">em Mai c/ outros</span>
          </span>
          <span class="chevron">&#9660;</span>
        </div>
      </div>
      <div class="cliente-detalhe">
        ${badge}
        ${vendedores}
      </div>
    </div>`;
}

function renderLista(lista) {
  const el = document.getElementById('lista');
  if (!lista.length) {
    el.innerHTML = `<div class="empty">Nenhum cliente encontrado.</div>`;
    return;
  }
  el.innerHTML = lista.map(renderCard).join('');
}

renderLista(D.clientes);

// ── Toggle ────────────────────────────────────────────────────────────────────
function toggleCard(header) {
  header.closest('.cliente-card').classList.toggle('open');
}
function toggleVend(header) {
  header.closest('.vendedor-bloco').classList.toggle('open');
}

// ── Filtro ────────────────────────────────────────────────────────────────────
function filtrar(q) {
  const t = q.toLowerCase().trim();
  const filtrado = t
    ? D.clientes.filter(c => (c.cliente + ' ' + c.codcli).toLowerCase().includes(t))
    : D.clientes;
  renderLista(filtrado);
}
</script>
</body>
</html>
