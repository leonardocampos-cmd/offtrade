<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <script src="auth.js"></script>
  <script src="fontes_status_data.js"></script>
  <script src="fontes_alert.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OFF TRADE SP</title>
  <script src="vendas_sp_data.js"></script>
  <script src="nao_pos_sp_data.js"></script>
  <script src="gerentes_data.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117; --card: #1a1d27; --card2: #22263a;
      --accent: #f5c518; --green: #22c55e; --yellow: #eab308;
      --red: #ef4444; --text: #e2e8f0; --muted: #94a3b8; --border: #2d3144;
    }

    body {
      background: var(--bg); color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh; padding: 16px;
      max-width: 960px; margin: 0 auto;
    }

    header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 24px; padding-bottom: 16px;
      border-bottom: 1px solid var(--border); flex-wrap: wrap; gap: 12px;
    }
    .header-title h1 { font-size: 1.3rem; font-weight: 700; color: var(--accent); letter-spacing: -.02em; }
    .header-title p  { font-size: .78rem; color: var(--muted); margin-top: 3px; }

    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 7px 14px; border-radius: 8px; font-size: .8rem;
      cursor: pointer; border: 1px solid var(--border);
      background: var(--card2); color: var(--text);
      text-decoration: none; transition: all .15s;
    }
    .btn:hover { border-color: var(--accent); color: var(--accent); }
    .btn-primary { background: var(--accent); color: #111; border-color: var(--accent); font-weight: 700; }
    .btn-primary:hover { background: #d4a90e; color: #111; }
    .btn-dl { border-color: #2d6a4f; color: #52b788; }
    .btn-dl:hover { border-color: #52b788; background: rgba(82,183,136,.1); }

    .mes-select {
      background: var(--card2); border: 1px solid var(--border);
      color: var(--text); border-radius: 8px; padding: 6px 10px;
      font-size: .82rem; cursor: pointer; outline: none;
    }
    .mes-select:focus { border-color: var(--accent); }

    /* Cards principais */
    .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 14px; }
    .vendor-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 18px;
      transition: border-color .2s, transform .15s;
    }
    .vendor-card:hover { border-color: var(--accent); transform: translateY(-2px); }
    .vendor-name { font-size: .95rem; font-weight: 600; margin-bottom: 2px; }
    .vendor-sub  { font-size: .72rem; color: var(--muted); margin-bottom: 14px; }
    .stat-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 5px 0; border-bottom: 1px solid var(--border); font-size: .8rem;
    }
    .stat-label { color: var(--muted); }
    .stat-val   { font-weight: 600; }
    .card-actions { display: flex; justify-content: flex-end; margin-top: 14px; }

    /* Seção retrátil genérica */
    .sec-header {
      display: flex; justify-content: space-between; align-items: center;
      cursor: pointer; padding: 10px 0;
      border-bottom: 1px solid var(--border);
      user-select: none;
    }
    .sec-header:hover .sec-title { color: var(--text); }
    .sec-title { font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
    .sec-meta  { font-size: .75rem; color: var(--muted); margin-top: 2px; }
    .sec-ic    { font-size: .65rem; color: var(--muted); transition: transform .2s; }
    .sec-ic.open { transform: rotate(180deg); }
    .sec-body  { display: none; padding-top: 12px; }
    .sec-body.open { display: block; }

    /* Não positivados: linha de cliente retrátil */
    .np-toggle { cursor: pointer; user-select: none; }
    .np-toggle:hover .stat-label { color: var(--text); }
    .np-cli-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 6px 0; border-bottom: 1px solid var(--border);
      cursor: pointer; font-size: .8rem; user-select: none;
    }
    .np-cli-row:last-of-type { border-bottom: none; }
    .np-cli-row:hover { color: var(--text); }
    .np-cli-name  { font-weight: 500; }
    .np-cli-bairro { font-size: .72rem; color: var(--muted); }
    .np-cli-date  { font-size: .72rem; color: var(--muted); white-space: nowrap; margin-left: 8px; }
    .np-cli-ic    { font-size: .6rem; color: var(--muted); margin-left: 6px; }
    .np-prods     { display: none; background: var(--card2); border-radius: 8px; padding: 8px 10px; margin: 4px 0 8px; }
    .np-prods.open { display: block; }

    /* Tabelas */
    .tbl { width: 100%; border-collapse: collapse; font-size: .78rem; }
    .tbl th {
      color: var(--muted); font-weight: 600; text-align: left;
      padding: 4px 6px; border-bottom: 1px solid var(--border);
      font-size: .68rem; text-transform: uppercase; letter-spacing: .05em;
    }
    .tbl td { padding: 5px 6px; border-bottom: 1px solid #1e2235; vertical-align: top; }
    .tbl tr:last-child td { border-bottom: none; }
    .tbl .td-right { text-align: right; white-space: nowrap; }
    .tbl .td-muted { color: var(--muted); }

    /* Search */
    .search-wrap { margin-bottom: 16px; }
    .search-input {
      width: 100%; background: var(--card); border: 1px solid var(--border);
      color: var(--text); border-radius: 10px; padding: 10px 14px;
      font-size: .88rem; outline: none;
    }
    .search-input:focus { border-color: var(--accent); }

    /* View de detalhe */
    .detail-header {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 20px; margin-bottom: 16px;
      display: flex; justify-content: space-between; align-items: center;
      flex-wrap: wrap; gap: 12px;
    }
    .detail-name { font-size: 1.1rem; font-weight: 700; }
    .detail-sub  { font-size: .75rem; color: var(--muted); margin-top: 2px; }
    .detail-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 18px; margin-bottom: 16px;
    }
    .vendas-kpis {
      display: flex; gap: 24px; flex-wrap: wrap;
      margin-bottom: 14px; padding-bottom: 14px; border-bottom: 1px solid var(--border);
    }
    .kpi-label { font-size: .7rem; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
    .kpi-val   { font-size: 1.15rem; font-weight: 700; margin-top: 2px; }

    .vendas-table { width: 100%; border-collapse: collapse; font-size: .8rem; }
    .vendas-table th {
      text-align: left; font-size: .68rem; text-transform: uppercase;
      letter-spacing: .06em; color: var(--muted);
      border-bottom: 1px solid var(--border); padding: 0 0 8px;
    }
    .vendas-table td { padding: 8px 0; border-bottom: 1px solid #1e2235; vertical-align: top; }
    .vendas-table tr:last-child td { border-bottom: none; }
    .vendas-date { color: var(--muted); white-space: nowrap; padding-right: 12px; }
    .vendas-cli  { font-weight: 500; }
    .vendas-prod { font-size: .72rem; color: var(--muted); margin-top: 2px; }
    .vendas-qt   { text-align: right; padding-right: 16px; color: var(--muted); }
    .vendas-val  { text-align: right; font-weight: 600; white-space: nowrap; }
    .vendas-empty { text-align: center; color: var(--muted); padding: 24px; font-size: .85rem; }

    .no-data { text-align: center; padding: 60px 20px; color: var(--muted); font-size: .9rem; line-height: 1.8; }

    /* Barra de meta */
    .meta-bar-wrap { margin-top: 8px; }
    .meta-bar-label { display: flex; justify-content: space-between; font-size: .7rem; color: var(--muted); margin-bottom: 4px; }
    .meta-bar-label .meta-pct { font-weight: 700; }
    .meta-bar-label .meta-pct.green { color: var(--green); }
    .meta-bar-label .meta-pct.yellow { color: var(--yellow); }
    .meta-bar-label .meta-pct.red { color: var(--red); }
    .meta-bar-track { height: 5px; background: var(--card2); border-radius: 3px; overflow: hidden; }
    .meta-bar-fill  { height: 100%; border-radius: 3px; transition: width .3s; }
    .meta-bar-fill.green  { background: var(--green); }
    .meta-bar-fill.yellow { background: var(--yellow); }
    .meta-bar-fill.red    { background: var(--red); }

    /* Metas grid no detalhe */
    .metas-grid { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 4px; }
    .meta-kpi { flex: 1; min-width: 130px; background: var(--card2); border-radius: 8px; padding: 10px 12px; }
    .meta-kpi-label { font-size: .65rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 6px; }
    .meta-kpi-vals  { font-size: .82rem; font-weight: 600; }
    .meta-kpi-sub   { font-size: .68rem; color: var(--muted); margin-top: 2px; }

  </style>
</head>
<body>


<header>
  <div class="header-title">
    <h1> OFF TRADE SP</h1>
    <p id="header-sub">Carregando...</p>
  </div>
  <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
    <a class="btn" href="index.html">&#8962; Home</a>
    <a class="btn" href="metas.html">&#8592; RJ</a>
    <div id="header-actions"></div>
  </div>
</header>

<div id="app"></div>

<script>
// ── Utilitários ────────────────────────────────────────────────────────────────

function fmtFat(v) {
  return 'R$ ' + Number(v).toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
}

// ── Filtro Gerente / Supervisor ───────────────────────────────────────────────

var _ESTADO_ATUAL     = 'SP';
var _filtroGerente    = '';
var _filtroSupervisor = '';

function _normNome(n) {
  return (n || '').replace(/\s*-?\s*OFF\s*TRADE\s*/gi, '').trim().toUpperCase();
}
function _estadosAtuais() {
  if (typeof GERENTES_DATA === 'undefined') return [];
  return GERENTES_DATA.estados.filter(function(e) { return e.nome === _ESTADO_ATUAL; });
}
function _getGerentes() {
  var set = new Set();
  _estadosAtuais().forEach(function(est) {
    est.gerentes.forEach(function(g) { if (g.nome && g.nome !== 'Sem Gerente') set.add(g.nome); });
  });
  return Array.from(set).sort();
}
function _getSupervisores(gerente) {
  var set = new Set();
  _estadosAtuais().forEach(function(est) {
    est.gerentes.forEach(function(g) {
      if (gerente && g.nome !== gerente) return;
      g.supervisores.forEach(function(s) { if (s.nome && s.nome !== 'Sem Supervisor') set.add(s.nome); });
    });
  });
  return Array.from(set).sort();
}
function _vendedoresPermitidos() {
  if (!_filtroGerente && !_filtroSupervisor) return null;
  var set = new Set();
  _estadosAtuais().forEach(function(est) {
    est.gerentes.forEach(function(g) {
      if (_filtroGerente && g.nome !== _filtroGerente) return;
      g.supervisores.forEach(function(s) {
        if (_filtroSupervisor && s.nome !== _filtroSupervisor) return;
        s.vendedores.forEach(function(v) { set.add(_normNome(v.nome)); });
      });
    });
  });
  return set;
}
function _buildFiltroHtml(mes) {
  var gers = _getGerentes();
  if (!gers.length) return '';
  var sups = _getSupervisores(_filtroGerente);
  return '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px">' +
    '<select class="mes-select" onchange="_filtroGerente=this.value;_filtroSupervisor=\'\';renderMain(\'' + mes + '\')">' +
      '<option value="">Todos os gerentes</option>' +
      gers.map(function(g) { return '<option value="' + g + '"' + (g === _filtroGerente ? ' selected' : '') + '>' + g + '</option>'; }).join('') +
    '</select>' +
    '<select class="mes-select" onchange="_filtroSupervisor=this.value;renderMain(\'' + mes + '\')">' +
      '<option value="">Todos os supervisores</option>' +
      sups.map(function(s) { return '<option value="' + s + '"' + (s === _filtroSupervisor ? ' selected' : '') + '>' + s + '</option>'; }).join('') +
    '</select>' +
  '</div>';
}

// ── Copiar link do vendedor ───────────────────────────────────────────────────

function exportarNaoPosCSV(nome) {
  var npData = (typeof NAO_POS_SP_DATA !== 'undefined' && NAO_POS_SP_DATA.por_vendedor) || {};
  var npList = npData[nome] || [];
  if (!npList.length) return;

  var sep  = ';';
  var rows = ['Código' + sep + 'Cliente' + sep + 'Bairro' + sep + 'Última Compra' + sep +
              'Produto' + sep + 'Fornecedor' + sep + 'Qtde' + sep + 'Valor (R$)'];

  npList.forEach(function(cli) {
    var base = cli.codcli + sep + cli.cliente + sep + (cli.bairro || '') + sep + (cli.dtultcomp || '');
    if (cli.produtos && cli.produtos.length) {
      cli.produtos.forEach(function(p) {
        rows.push(base + sep + (p.produto || '') + sep + (p.fantasia || '') + sep +
                  p.qt + sep + Number(p.valor).toFixed(2).replace('.', ','));
      });
    } else {
      rows.push(base + sep + '' + sep + '' + sep + '' + sep + '');
    }
  });

  var blob = new Blob(['﻿' + rows.join('\r\n')], {type: 'text/csv;charset=utf-8;'});
  var url  = URL.createObjectURL(blob);
  var a    = document.createElement('a');
  a.href     = url;
  a.download = 'nao_positivados_SP_' + nome.replace(/\s+/g, '_') + '.csv';
  document.body.appendChild(a); a.click();
  setTimeout(function() { document.body.removeChild(a); URL.revokeObjectURL(url); }, 500);
}

function copiarLink(nome, btn) {
  var url = location.origin + location.pathname + '?vendedor=' + encodeURIComponent(nome);
  navigator.clipboard.writeText(url).then(function() {
    var orig = btn.innerHTML;
    btn.innerHTML = '&#10003; Copiado!';
    btn.style.color = 'var(--green)';
    btn.style.borderColor = 'var(--green)';
    setTimeout(function() {
      btn.innerHTML = orig;
      btn.style.color = '';
      btn.style.borderColor = '';
    }, 2000);
  });
}

// ── Toggles ────────────────────────────────────────────────────────────────────

function toggleSec(id) {
  var body = document.getElementById(id);
  var ic   = document.getElementById(id + '-ic');
  if (!body) return;
  var open = body.classList.toggle('open');
  if (ic) ic.classList.toggle('open', open);
}

function toggleCli(id) {
  var el = document.getElementById(id);
  var ic = document.getElementById(id + '-ic');
  if (!el) return;
  var open = el.classList.toggle('open');
  if (ic) ic.textContent = open ? '▲' : '▼';
}

// ── HTML: não positivados (clientes + produtos da última compra) ───────────────

function _parseData(s) {
  var p = (s || '').split('/');
  return p.length === 3 ? new Date(p[2], p[1] - 1, p[0]) : new Date(0);
}

function buildNaoPos(npList, prefix) {
  if (!npList || !npList.length) {
    return '<div style="color:var(--green);font-size:.85rem;padding:8px 0">Todos os clientes positivados ✓</div>';
  }

  npList = npList.slice().sort(function(a, b) {
    return _parseData(a.dtultcomp) - _parseData(b.dtultcomp);
  });

  return npList.map(function(cli, i) {
    var cliId = prefix + '-cli-' + i;
    var nProds = cli.produtos ? cli.produtos.length : 0;

    var prodsHtml = '';
    if (nProds > 0) {
      var rows = cli.produtos.map(function(p) {
        return '<tr>' +
          '<td><div>' + (p.produto || '—') + '</div>' +
              '<div class="td-muted" style="font-size:.7rem">' + (p.fantasia || '') + '</div></td>' +
          '<td class="td-right td-muted">' + p.qt + '</td>' +
          '<td class="td-right">' + fmtFat(p.valor) + '</td>' +
        '</tr>';
      }).join('');
      prodsHtml =
        '<div id="' + cliId + '" class="np-prods">' +
          '<table class="tbl">' +
            '<thead><tr>' +
              '<th>Produto / Fornecedor</th>' +
              '<th class="td-right">Qtde</th><th class="td-right">Valor</th>' +
            '</tr></thead>' +
            '<tbody>' + rows + '</tbody>' +
          '</table>' +
        '</div>';
    } else {
      prodsHtml = '<div id="' + cliId + '" class="np-prods" style="color:var(--muted);font-size:.78rem">Sem produtos registrados na última nota.</div>';
    }

    return '<div class="np-cli-row" onclick="toggleCli(\'' + cliId + '\')">' +
        '<div>' +
          '<span class="np-cli-name">' + (cli.cliente || '—') + '</span>' +
          '<div class="np-cli-bairro">' + (cli.codcli ? '#' + cli.codcli + (cli.bairro ? ' · ' + cli.bairro : '') : (cli.bairro || '')) + '</div>' +
        '</div>' +
        '<div style="display:flex;align-items:center">' +
          '<span class="np-cli-date">' + (cli.dtultcomp || '') + '</span>' +
          (nProds > 0 ? '<span id="' + cliId + '-ic" class="np-cli-ic">▼</span>' : '') +
        '</div>' +
      '</div>' +
      prodsHtml;
  }).join('');
}

// ── Helpers de meta ──────────────────────────────────────────────────────────

function _getMeta(nome, mes) {
  if (typeof VENDAS_SP_DATA === 'undefined') return null;
  var m = (VENDAS_SP_DATA.metas || {})[nome];
  return m ? (m[mes] || null) : null;
}

function _pctCls(p) {
  return p >= 100 ? 'green' : p >= 70 ? 'yellow' : 'red';
}

function _metaBar(real, meta, label) {
  if (!meta || meta <= 0) return '';
  var p    = Math.min(Math.round(real / meta * 100), 150);
  var cls  = _pctCls(p);
  var fill = Math.min(p, 100);
  return '<div class="meta-bar-wrap">' +
    '<div class="meta-bar-label">' +
      '<span>' + label + '</span>' +
      '<span class="meta-pct ' + cls + '">' + p + '%</span>' +
    '</div>' +
    '<div class="meta-bar-track"><div class="meta-bar-fill ' + cls + '" style="width:' + fill + '%"></div></div>' +
  '</div>';
}

function _metaKpi(label, real, meta) {
  if (!meta || meta <= 0) return '';
  var p   = Math.min(Math.round(real / meta * 100), 999);
  var cls = _pctCls(p);
  return '<div class="meta-kpi">' +
    '<div class="meta-kpi-label">' + label + '</div>' +
    '<div class="meta-kpi-vals ' + cls + '">' + fmtFat(real) + '</div>' +
    '<div class="meta-kpi-sub">Meta: ' + fmtFat(meta) + ' &middot; <span class="' + cls + '">' + p + '%</span></div>' +
    _metaBar(real, meta, '') +
  '</div>';
}

// ── Faturamento agrupado por cliente + data ───────────────────────────────────

function buildVendasGrouped(lista, prefix) {
  if (!lista || !lista.length)
    return '<div class="vendas-empty">Nenhuma venda registrada neste mês.</div>';

  // Agrupa por codcli + data
  var groups = [], keyMap = {};
  lista.forEach(function(v) {
    var key = (v.codcli || v.cliente) + '|' + v.data;
    if (!(key in keyMap)) {
      keyMap[key] = groups.length;
      groups.push({ codcli: v.codcli, cliente: v.cliente, data: v.data, fat: 0, produtos: [] });
    }
    var g = groups[keyMap[key]];
    g.fat += v.valor;
    g.produtos.push({ produto: v.produto, fantasia: v.fantasia, qt: v.qt, valor: v.valor });
  });

  return groups.map(function(g, i) {
    var gId  = prefix + '-vg-' + i;
    var rows = g.produtos.map(function(p) {
      return '<tr>' +
        '<td><div>' + (p.produto || '—') + '</div>' +
            '<div class="td-muted" style="font-size:.7rem">' + (p.fantasia || '') + '</div></td>' +
        '<td class="td-right td-muted">' + p.qt + '</td>' +
        '<td class="td-right">' + fmtFat(p.valor) + '</td>' +
      '</tr>';
    }).join('');

    return '<div class="np-cli-row" onclick="toggleCli(\'' + gId + '\')">' +
        '<div><span class="np-cli-name">' + (g.cliente || '—') + '</span></div>' +
        '<div style="display:flex;align-items:center">' +
          '<span class="np-cli-date">' + (g.data || '') + '</span>' +
          '<span id="' + gId + '-ic" class="np-cli-ic">▼</span>' +
        '</div>' +
      '</div>' +
      '<div id="' + gId + '" class="np-prods">' +
        '<table class="tbl"><thead><tr>' +
          '<th>Produto / Fornecedor</th>' +
          '<th class="td-right">Qtde</th><th class="td-right">Valor</th>' +
        '</tr></thead><tbody>' + rows + '</tbody></table>' +
      '</div>';
  }).join('');
}

// ── Cards principais ──────────────────────────────────────────────────────────

function _buildVendorCards(mes) {
  if (typeof VENDAS_SP_DATA === 'undefined') return '';
  var nomes = Object.keys(VENDAS_SP_DATA.por_vendedor || {});
  var permitidos = _vendedoresPermitidos();
  if (permitidos) nomes = nomes.filter(function(n) { return permitidos.has(_normNome(n)); });
  if (!nomes.length) return '<div class="no-data">Nenhum vendedor encontrado.</div>';

  var npData = (typeof NAO_POS_SP_DATA !== 'undefined' && NAO_POS_SP_DATA.por_vendedor) || {};

  return nomes.map(function(nome, idx) {
    var vendas = (VENDAS_SP_DATA.por_vendedor[nome] || {})[mes] || [];
    var fat    = vendas.reduce(function(s, v) { return s + v.valor; }, 0);
    var nCli   = new Set(vendas.filter(function(v) { return v.offtrade; }).map(function(v) { return v.codcli; })).size;
    var npList = npData[nome] || [];
    var nNP    = npList.length;
    var secId  = 'card-np-' + idx;
    var rca    = (VENDAS_SP_DATA.rcas && VENDAS_SP_DATA.rcas[nome]) ? 'RCA ' + VENDAS_SP_DATA.rcas[nome] : 'SP';

    var meta    = _getMeta(nome, mes);
    var real    = ((VENDAS_SP_DATA.realizado || {})[nome] || {})[mes] || {};
    var metaFat = meta ? meta.fat : null;
    var metaPos = meta ? meta.pos : null;
    var realFat = real.fat !== undefined ? real.fat : fat;
    var realPos = real.pos !== undefined ? real.pos : nCli;

    return '<div class="vendor-card" data-nome="' + nome.toLowerCase() + '">' +
      '<div class="vendor-name">' + nome + '</div>' +
      '<div class="vendor-sub">' + rca + '</div>' +
      '<div class="stat-row">' +
        '<span class="stat-label">Faturamento</span>' +
        '<span class="stat-val">' + fmtFat(realFat) + (metaFat ? ' <span style="font-size:.7rem;color:var(--muted)">/ ' + fmtFat(metaFat) + '</span>' : '') + '</span>' +
      '</div>' +
      (metaFat ? _metaBar(realFat, metaFat, 'Fat. vs Meta') : '') +
      '<div class="stat-row" style="margin-top:' + (metaFat ? '8px' : '0') + '">' +
        '<span class="stat-label">Positivados</span>' +
        '<span class="stat-val">' + realPos + (metaPos ? ' <span style="font-size:.7rem;color:var(--muted)">/ ' + metaPos + '</span>' : '') + '</span>' +
      '</div>' +
      (metaPos ? _metaBar(realPos, metaPos, 'Pos. vs Meta') : '') +
      '<div class="sec-header" onclick="toggleSec(\'' + secId + '\')" style="padding:6px 0;margin-top:4px">' +
        '<div>' +
          '<span class="sec-title">Não positivados</span>' +
        '</div>' +
        '<div style="display:flex;align-items:center;gap:6px">' +
          '<span style="font-weight:600;font-size:.8rem;color:' + (nNP > 0 ? 'var(--red)' : 'var(--green)') + '">' + nNP + '</span>' +
          '<span id="' + secId + '-ic" class="sec-ic">▼</span>' +
        '</div>' +
      '</div>' +
      '<div id="' + secId + '" class="sec-body" style="padding-top:6px">' +
        (nNP > 0 ? '<div style="text-align:right;margin-bottom:6px">' +
          '<button class="btn btn-dl" style="font-size:.72rem;padding:4px 10px" ' +
          'onclick="exportarNaoPosCSV(\'' + nome.replace(/'/g,"\\'") + '\')">&#8595; CSV</button>' +
        '</div>' : '') +
        buildNaoPos(npList, secId) +
      '</div>' +
      '<div class="card-actions" style="gap:8px">' +
        '<button class="btn" onclick="copiarLink(\'' + nome.replace(/'/g, "\\'") + '\', this)" title="Copiar link para este vendedor">&#128279; Link</button>' +
        '<button class="btn btn-primary" onclick="renderVendasSP(\'' + nome.replace(/'/g, "\\'") + '\')">Ver vendas</button>' +
      '</div>' +
    '</div>';
  }).join('');
}

// ── View de detalhe do vendedor ───────────────────────────────────────────────

function _atualizarTabelaSP(nome) {
  var mes   = document.getElementById('sel-mes-sp').value;
  var lista = ((VENDAS_SP_DATA.por_vendedor[nome] || {})[mes] || []).slice().sort(function(a, b) {
    var pa = a.data.split('/'), pb = b.data.split('/');
    return new Date(pb[2], pb[1]-1, pb[0]) - new Date(pa[2], pa[1]-1, pa[0]);
  });
  var fat  = lista.reduce(function(s, r) { return s + r.valor; }, 0);
  var qt   = lista.reduce(function(s, r) { return s + r.qt; }, 0);
  var nCli = new Set(lista.filter(function(r) { return r.offtrade; }).map(function(r) { return r.codcli || r.cliente; })).size;

  var meta = _getMeta(nome, mes);
  var real = ((VENDAS_SP_DATA.realizado || {})[nome] || {})[mes] || {};

  document.getElementById('vendas-kpis').innerHTML =
    '<div><div class="kpi-label">Faturamento</div><div class="kpi-val">' + fmtFat(fat) + '</div>' +
      (meta && meta.fat ? '<div style="font-size:.7rem;color:var(--muted)">Meta: ' + fmtFat(meta.fat) + '</div>' : '') + '</div>' +
    '<div><div class="kpi-label">Itens</div><div class="kpi-val">' + qt.toLocaleString('pt-BR') + '</div></div>' +
    '<div><div class="kpi-label">Positivados</div><div class="kpi-val">' + (real.pos !== undefined ? real.pos : nCli) + '</div>' +
      (meta && meta.pos ? '<div style="font-size:.7rem;color:var(--muted)">Meta: ' + meta.pos + '</div>' : '') + '</div>';

  var metasHtml = '';
  if (meta) {
    var kpis = [
      ['Faturamento Total', real.fat  !== undefined ? real.fat  : fat,  meta.fat],
      ['Positivação',       real.pos  !== undefined ? real.pos  : nCli, meta.pos],
    ];
    if (meta.fat_pernod)  kpis.push(['Fat. Pernod',  real.fat_pernod  || 0, meta.fat_pernod]);
    if (meta.fat_crs)     kpis.push(['Fat. CRS',     real.fat_crs     || 0, meta.fat_crs]);
    if (meta.fat_essenza) kpis.push(['Fat. Essenza',  real.fat_essenza || 0, meta.fat_essenza]);

    metasHtml = '<div class="metas-grid">' +
      kpis.map(function(k) { return _metaKpi(k[0], k[1], k[2]); }).join('') +
    '</div>';
  }

  document.getElementById('vendas-metas').innerHTML = metasHtml;
  document.getElementById('vendas-tabela').innerHTML = buildVendasGrouped(lista, 'fat-' + nome.replace(/\W/g,''));
}

function exportarCSV(nome) {
  var mes  = document.getElementById('sel-mes-sp').value;
  var lista = (VENDAS_SP_DATA.por_vendedor[nome] || {})[mes] || [];
  var sep  = ';';
  var rows = ['VENDAS — ' + nome + ' — ' + mes,
              'Data;Cliente;Produto;Quantidade;Valor (R$)'].concat(
    lista.map(function(s) {
      return s.data + sep + s.cliente + sep + s.produto + sep + s.qt + sep +
             Number(s.valor).toFixed(2).replace('.', ',');
    })
  );
  var blob = new Blob(['﻿' + rows.join('\r\n')], {type:'text/csv;charset=utf-8;'});
  var url  = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'vendas_SP_' + nome.replace(/\s+/g,'_') + '_' + mes.replace('/','_') + '.csv';
  document.body.appendChild(a); a.click();
  setTimeout(function() { document.body.removeChild(a); URL.revokeObjectURL(url); }, 500);
}

function renderVendasSP(nome) {
  var meses  = typeof VENDAS_SP_DATA !== 'undefined' ? VENDAS_SP_DATA.meses : [];
  var opts   = meses.map(function(m) { return '<option value="' + m + '">' + m + '</option>'; }).join('');
  var npData = (typeof NAO_POS_SP_DATA !== 'undefined' && NAO_POS_SP_DATA.por_vendedor) || {};
  var npList = npData[nome] || [];
  var nNP    = npList.length;

  history.pushState({}, '', '?vendedor=' + encodeURIComponent(nome));

  document.getElementById('header-actions').innerHTML =
    '<button class="btn btn-dl" onclick="exportarCSV(\'' + nome.replace(/'/g,"\\'") + '\')">&#8595; CSV</button>' +
    '<button class="btn" onclick="renderMain()">&#8592; Todos</button>';

  document.getElementById('app').innerHTML =
    // Cabeçalho do vendedor
    '<div class="detail-header">' +
      '<div><div class="detail-name">' + nome + '</div>' +
      '<div class="detail-sub">' + (VENDAS_SP_DATA.rcas && VENDAS_SP_DATA.rcas[nome] ? 'RCA ' + VENDAS_SP_DATA.rcas[nome] + ' · SP' : 'SP') + '</div></div>' +
      '<select id="sel-mes-sp" class="mes-select" onchange="_atualizarTabelaSP(\'' + nome.replace(/'/g,"\\'") + '\')">' +
        opts + '</select>' +
    '</div>' +

    // Seção: Faturamento do mês
    '<div class="detail-card">' +
      '<div class="sec-header" onclick="toggleSec(\'sec-fat\')">' +
        '<div>' +
          '<div class="sec-title" style="color:var(--green)">Faturamento do mês</div>' +
        '</div>' +
        '<span id="sec-fat-ic" class="sec-ic open">▼</span>' +
      '</div>' +
      '<div id="sec-fat" class="sec-body open">' +
        '<div id="vendas-kpis" class="vendas-kpis" style="margin-top:14px"></div>' +
        '<div id="vendas-metas" style="margin-bottom:14px"></div>' +
        '<div id="vendas-tabela"></div>' +
      '</div>' +
    '</div>' +

    // Seção: Não positivados
    '<div class="detail-card">' +
      '<div class="sec-header" onclick="toggleSec(\'sec-np\')">' +
        '<div>' +
          '<div class="sec-title" style="color:var(--red)">Não positivados</div>' +
          '<div class="sec-meta" style="color:' + (nNP > 0 ? 'var(--red)' : 'var(--green)') + '">' +
            (nNP > 0 ? nNP + ' cliente' + (nNP > 1 ? 's' : '') : 'Todos positivados ✓') +
          '</div>' +
        '</div>' +
        '<span id="sec-np-ic" class="sec-ic open">▼</span>' +
      '</div>' +
      '<div id="sec-np" class="sec-body open">' +
        (nNP > 0 ? '<div style="text-align:right;margin-bottom:8px">' +
          '<button class="btn btn-dl" style="font-size:.75rem;padding:5px 12px" ' +
          'onclick="exportarNaoPosCSV(\'' + nome.replace(/'/g,"\\'") + '\')">&#8595; CSV Não Positivados</button>' +
        '</div>' : '') +
        buildNaoPos(npList, 'det') +
      '</div>' +
    '</div>';

  _atualizarTabelaSP(nome);
}

// ── View principal ────────────────────────────────────────────────────────────

function filterCards(q) {
  var q2 = q.toLowerCase().trim();
  document.querySelectorAll('.vendor-card').forEach(function(c) {
    c.style.display = c.dataset.nome.includes(q2) ? '' : 'none';
  });
}

function renderMain(mes) {
  if (typeof VENDAS_SP_DATA === 'undefined') {
    document.getElementById('header-sub').textContent = 'Dados SP não disponíveis';
    document.getElementById('app').innerHTML =
      '<div class="no-data"><p>&#9888; Arquivo <strong>vendas_sp_data.js</strong> não encontrado.</p></div>';
    return;
  }
  var meses = VENDAS_SP_DATA.meses || [];
  mes = mes || meses[0] || '';

  document.getElementById('header-sub').textContent =
    mes + '  ·  Atualizado ' + (VENDAS_SP_DATA.atualizado_em || '—');

  var mesOpts = meses.map(function(m) {
    return '<option value="' + m + '"' + (m === mes ? ' selected' : '') + '>' + m + '</option>';
  }).join('');

  document.getElementById('header-actions').innerHTML =
    '<select class="mes-select" onchange="renderMain(this.value)">' + mesOpts + '</select>';

  document.getElementById('app').innerHTML =
    '<div style="font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:12px">Vendedores</div>' +
    _buildFiltroHtml(mes) +
    '<div class="search-wrap">' +
      '<input class="search-input" type="text" placeholder="Buscar vendedor..." oninput="filterCards(this.value)">' +
    '</div>' +
    '<div class="cards-grid">' + _buildVendorCards(mes) + '</div>';

  history.replaceState({}, '', location.pathname);
}

// ── Init ──────────────────────────────────────────────────────────────────────

window.addEventListener('popstate', function() {
  if (!new URLSearchParams(location.search).get('vendedor')) renderMain();
});

(function init() {
  var param = new URLSearchParams(location.search).get('vendedor');
  if (param) renderVendasSP(decodeURIComponent(param));
  else renderMain();
})();

setTimeout(function() { location.reload(); }, 5 * 60 * 1000);
</script>
</body>
</html>
