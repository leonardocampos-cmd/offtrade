<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Raio X de Indústrias — Rigarr</title>
  <script src="auth.js"></script>
  <script src="raiox_industrias_data.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f1117; --card: #1a1d27; --accent: #f5c518;
      --text: #e2e8f0; --muted: #94a3b8; --border: #2d3144;
    }
    body {
      background: var(--bg); color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh; padding: 0 0 48px;
    }
    header {
      background: var(--card); border-bottom: 1px solid var(--border);
      padding: 16px 24px; display: flex; align-items: center; gap: 16px;
      flex-wrap: wrap;
    }
    .logo { font-size: 1.05rem; font-weight: 800; color: var(--accent); }
    .nav { display: flex; gap: 8px; margin-left: auto; flex-wrap: wrap; }
    .nav a {
      color: var(--muted); text-decoration: none; font-size: .82rem;
      padding: 6px 12px; border-radius: 7px; border: 1px solid var(--border);
      transition: all .15s;
    }
    .nav a:hover, .nav a.ativo { border-color: var(--accent); color: var(--accent); }
    .container { max-width: 1000px; margin: 0 auto; padding: 24px 20px; }
    .titulo { font-size: 1.3rem; font-weight: 800; margin-bottom: 4px; }
    .atualizacao { font-size: .78rem; color: var(--muted); margin-bottom: 20px; }
    .resumo-total {
      background: var(--card); border: 1px solid var(--border); border-radius: 14px;
      padding: 18px 20px; margin-bottom: 20px; display: flex; gap: 32px; flex-wrap: wrap;
    }
    .kpi-label { font-size: .68rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 4px; }
    .kpi-valor { font-size: 1.25rem; font-weight: 800; }
    .filtro { margin-bottom: 14px; }
    .filtro input {
      width: 100%; max-width: 320px; padding: 9px 12px; border-radius: 8px;
      border: 1px solid var(--border); background: var(--card); color: var(--text);
      font-size: .88rem; outline: none;
    }
    .filtro input:focus { border-color: var(--accent); }
    .filtros-wrap { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 14px; }
    .filtro-vendedor { display: flex; flex-direction: column; gap: 5px; }
    .filtro-vendedor label { font-size: .68rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
    .filtro-vendedor select {
      padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--card); color: var(--text); font-size: .85rem; outline: none;
      min-width: 180px;
    }
    .filtro-vendedor select:focus { border-color: var(--accent); }
    table { width: 100%; border-collapse: collapse; background: var(--card); border-radius: 12px; overflow: hidden; border: 1px solid var(--border); }
    th {
      background: #1f2233; padding: 10px 14px; font-size: .7rem; color: var(--muted);
      text-transform: uppercase; letter-spacing: .05em; text-align: right; font-weight: 600;
    }
    th:first-child, th:nth-child(2) { text-align: left; }
    td { padding: 10px 14px; font-size: .85rem; border-top: 1px solid var(--border); text-align: right; }
    td:first-child, td:nth-child(2) { text-align: left; }
    td:first-child { color: var(--muted); font-weight: 600; }
    tr:hover td { background: #1f2233; }
    .part-bar-bg { display: inline-block; width: 60px; height: 5px; background: #2d3144; border-radius: 3px; overflow: hidden; margin-left: 8px; vertical-align: middle; }
    .part-bar-fill { height: 100%; background: var(--accent); border-radius: 3px; }
    .btn-ver {
      font-size: .74rem; color: var(--accent); text-decoration: none; white-space: nowrap;
      border: 1px solid var(--border); border-radius: 7px; padding: 4px 9px; transition: all .15s;
    }
    .btn-ver:hover { border-color: var(--accent); background: rgba(245,197,24,.08); }
  </style>
</head>
<body>
  <header>
    <div class="logo">Rigarr</div>
    <div class="nav">
      <a href="raiox_clientes.html">Raio X Clientes</a>
      <a href="raiox_vendedores.html">Raio X Vendedores</a>
      <a href="raiox_industrias.html" class="ativo">Raio X Indústrias</a>
      <a href="index.html">← Painel</a>
    </div>
  </header>

  <div class="container">
    <div class="titulo">Raio X de Indústrias — Ranking de Fornecedores</div>
    <div class="atualizacao" id="atualizacao">Carregando…</div>

    <div class="resumo-total" id="resumo-total"></div>

    <div class="filtros-wrap" id="filtros"></div>

    <div class="filtro">
      <input type="text" id="busca" placeholder="Buscar fornecedor...">
    </div>

    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Fornecedor</th>
          <th>Faturamento YTD</th>
          <th>Participação</th>
          <th>Faturamento (mês atual)</th>
          <th>Clientes positivados</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <script>
    const brl = v => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL', maximumFractionDigits: 0 }).format(v);
    const data = RAIOX_INDUSTRIAS_DATA;
    document.getElementById('atualizacao').textContent =
      `Atualizado em ${data.atualizado_em} · mês de referência: ${data.mes_atual}`;

    let filtroEstado = '', filtroGerente = '', filtroSupervisor = '', filtroVendedor = '', buscaTexto = '';

    function vendedoresFiltrados(estado, gerente, supervisor) {
      return (data.vendedores || []).filter(v =>
        (!estado || v.estado === estado) &&
        (!gerente || v.gerente === gerente) &&
        (!supervisor || v.supervisor === supervisor)
      );
    }

    function chavesAtivas() {
      let lista = vendedoresFiltrados(filtroEstado, filtroGerente, filtroSupervisor);
      if (filtroVendedor) lista = lista.filter(v => v.chave === filtroVendedor);
      return lista.map(v => v.chave);
    }

    function semFiltroAlgum() {
      return !filtroEstado && !filtroGerente && !filtroSupervisor && !filtroVendedor;
    }

    function metricasMescladas(fornecedor, chaves) {
      const objs = chaves.map(ch => fornecedor.por_vendedor && fornecedor.por_vendedor[ch]).filter(Boolean);
      if (!objs.length) return null;
      const faturamento_ytd = objs.reduce((s, o) => s + o.faturamento_ytd, 0);
      const clientes_positivados = objs.reduce((s, o) => s + o.clientes_positivados, 0);
      const por_mes = {};
      objs.forEach(o => Object.entries(o.por_mes || {}).forEach(([k, v]) => { por_mes[k] = (por_mes[k] || 0) + v; }));
      const mesAtualKey = Object.keys(por_mes).sort().slice(-1)[0];
      return {
        fantasia: fornecedor.fantasia,
        faturamento_ytd: Math.round(faturamento_ytd * 100) / 100,
        faturamento_mes_atual: Math.round((por_mes[mesAtualKey] || 0) * 100) / 100,
        clientes_positivados,
      };
    }

    function metricasFornecedor(f, chaves, semFiltro) {
      if (semFiltro) return f;
      return metricasMescladas(f, chaves);
    }

    function montaFiltros() {
      const selEstado = document.getElementById('f-estado');
      const selGerente = document.getElementById('f-gerente');
      const selSupervisor = document.getElementById('f-supervisor');
      const selVendedor = document.getElementById('f-vendedor');

      const estados = [...new Set((data.vendedores || []).map(v => v.estado))].sort();
      selEstado.innerHTML = ['<option value="">Todos</option>']
        .concat(estados.map(e => `<option value="${e}">${e}</option>`)).join('');
      selEstado.value = filtroEstado;

      const gerentes = [...new Set(vendedoresFiltrados(filtroEstado, '', '').map(v => v.gerente))].sort();
      selGerente.innerHTML = ['<option value="">Todos</option>']
        .concat(gerentes.map(g => `<option value="${g}">${g}</option>`)).join('');
      selGerente.value = filtroGerente;

      const supervisores = [...new Set(vendedoresFiltrados(filtroEstado, filtroGerente, '').map(v => v.supervisor))].sort();
      selSupervisor.innerHTML = ['<option value="">Todos</option>']
        .concat(supervisores.map(s => `<option value="${s}">${s}</option>`)).join('');
      selSupervisor.value = filtroSupervisor;

      const vendedores = vendedoresFiltrados(filtroEstado, filtroGerente, filtroSupervisor)
        .sort((a, b) => a.nome.localeCompare(b.nome));
      selVendedor.innerHTML = ['<option value="">Todos</option>']
        .concat(vendedores.map(v => `<option value="${v.chave}">${v.nome} (${v.estado} · ${v.rca})</option>`)).join('');
      selVendedor.value = filtroVendedor;

      selEstado.addEventListener('change', () => {
        filtroEstado = selEstado.value; filtroGerente = ''; filtroSupervisor = ''; filtroVendedor = '';
        render();
      });
      selGerente.addEventListener('change', () => {
        filtroGerente = selGerente.value; filtroSupervisor = ''; filtroVendedor = '';
        render();
      });
      selSupervisor.addEventListener('change', () => {
        filtroSupervisor = selSupervisor.value; filtroVendedor = '';
        render();
      });
      selVendedor.addEventListener('change', () => {
        filtroVendedor = selVendedor.value;
        render();
      });
    }

    function render() {
      document.getElementById('filtros').innerHTML = `
        <div class="filtro-vendedor"><label for="f-estado">Estado</label><select id="f-estado"></select></div>
        <div class="filtro-vendedor"><label for="f-gerente">Gerente</label><select id="f-gerente"></select></div>
        <div class="filtro-vendedor"><label for="f-supervisor">Supervisor</label><select id="f-supervisor"></select></div>
        <div class="filtro-vendedor"><label for="f-vendedor">Vendedor</label><select id="f-vendedor"></select></div>
      `;
      montaFiltros();

      const chaves = chavesAtivas();
      const semFiltro = semFiltroAlgum();
      let lista = data.fornecedores
        .map(f => metricasFornecedor(f, chaves, semFiltro))
        .filter(Boolean);

      if (!semFiltro) {
        const totalFiltrado = lista.reduce((s, f) => s + f.faturamento_ytd, 0);
        lista = lista.map(f => ({ ...f, participacao_pct: totalFiltrado ? Math.round(f.faturamento_ytd / totalFiltrado * 10000) / 100 : 0 }));
        lista.sort((a, b) => b.faturamento_ytd - a.faturamento_ytd);
        lista.forEach((f, i) => { f.posicao = i + 1; });
      }

      document.getElementById('resumo-total').innerHTML = `
        <div><div class="kpi-label">Faturamento total YTD</div><div class="kpi-valor">${brl(lista.reduce((s, f) => s + f.faturamento_ytd, 0))}</div></div>
        <div><div class="kpi-label">Fornecedores ativos</div><div class="kpi-valor">${lista.length}</div></div>
      `;

      if (buscaTexto) {
        lista = lista.filter(f => f.fantasia.toUpperCase().includes(buscaTexto));
      }
      renderTabela(lista);
    }

    function renderTabela(lista) {
      document.getElementById('tbody').innerHTML = lista.map(f => `
        <tr>
          <td>${f.posicao}</td>
          <td>${f.fantasia}</td>
          <td>${brl(f.faturamento_ytd)}</td>
          <td>${f.participacao_pct}%<span class="part-bar-bg"><span class="part-bar-fill" style="width:${Math.min(f.participacao_pct * 4, 100)}%"></span></span></td>
          <td>${brl(f.faturamento_mes_atual)}</td>
          <td>${f.clientes_positivados}</td>
          <td><a class="btn-ver" href="raiox_industria_detalhe.html?fornecedor=${encodeURIComponent(f.fantasia)}">Ver detalhe →</a></td>
        </tr>
      `).join('') || '<tr><td colspan="7" style="color:var(--muted)">Nenhum fornecedor encontrado.</td></tr>';
    }

    document.getElementById('busca').addEventListener('input', function () {
      buscaTexto = this.value.trim().toUpperCase();
      render();
    });

    render();
  </script>
</body>
</html>
