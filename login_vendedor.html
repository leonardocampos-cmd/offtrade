<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acesso Vendedor — Rigarr</title>
  <script src="vendedores_auth_data.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f1117; --card: #1a1d27; --accent: #f5c518;
      --text: #e2e8f0; --muted: #94a3b8; --border: #2d3144; --red: #ef4444;
    }
    body {
      background: var(--bg); color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 16px;
    }
    .box {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 16px; padding: 40px 36px; width: 100%; max-width: 360px;
      display: flex; flex-direction: column; align-items: center; gap: 22px;
    }
    .logo { font-size: 1.4rem; font-weight: 800; color: var(--accent); letter-spacing: -.02em; text-align: center; }
    .logo span { color: var(--muted); font-weight: 400; font-size: .88rem; display: block; margin-top: 4px; }
    .field { width: 100%; display: flex; flex-direction: column; gap: 7px; }
    label {
      font-size: .75rem; color: var(--muted);
      text-transform: uppercase; letter-spacing: .06em;
    }
    input[type=number] {
      width: 100%; padding: 12px 14px; border-radius: 8px;
      border: 1px solid var(--border); background: var(--bg);
      color: var(--text); font-size: 1.3rem; outline: none;
      transition: border-color .15s; text-align: center;
      font-family: inherit; font-weight: 700; letter-spacing: .12em;
      -moz-appearance: textfield;
    }
    input[type=number]::-webkit-outer-spin-button,
    input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }
    input[type=number]:focus { border-color: var(--accent); }
    input[type=number]::placeholder {
      font-weight: 400; font-size: .95rem; letter-spacing: normal; color: var(--muted);
    }
    .divider {
      width: 100%; display: flex; align-items: center; gap: 10px;
      color: var(--muted); font-size: .75rem;
    }
    .divider::before, .divider::after {
      content: ''; flex: 1; height: 1px; background: var(--border);
    }
    #google-btn-wrap { width: 100%; display: flex; justify-content: center; min-height: 44px; }
    .erro {
      font-size: .82rem; color: var(--red); text-align: center;
      min-height: 20px; line-height: 1.4;
    }
    .back {
      color: var(--muted); font-size: .78rem; text-decoration: none;
      transition: color .15s;
    }
    .back:hover { color: var(--text); }
  </style>
</head>
<body>
  <div class="box">
    <div class="logo">Rigarr <span>Área do Vendedor</span></div>

    <div class="field">
      <label for="rca">CODUSUR / RCA</label>
      <input type="number" id="rca" placeholder="Ex: 275" autocomplete="off" autofocus>
    </div>

    <div class="divider">entrar com</div>

    <div id="google-btn-wrap"></div>

    <div class="erro" id="erro"></div>

    <a href="index.html" class="back">← Voltar ao painel</a>
  </div>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script>
    const CLIENT_ID = '966004363576-ucdlgkjtsfffspp03fiqib2dchp012fs.apps.googleusercontent.com';

    // Já autenticado → vai direto
    try {
      const s = JSON.parse(sessionStorage.getItem('rg_vendedor') || '{}');
      if (s.rca && s.email) location.replace('vendedor.html');
    } catch {}

    function showErro(msg) {
      document.getElementById('erro').textContent = msg;
    }

    function handleCredential(response) {
      showErro('');
      const rca = document.getElementById('rca').value.trim();

      if (!rca) {
        showErro('Digite seu CODUSUR antes de entrar com Google.');
        return;
      }

      const vendedor = VENDEDORES_AUTH[rca];
      if (!vendedor) {
        showErro('CODUSUR não encontrado. Verifique o número.');
        return;
      }

      let payload;
      try {
        const b64 = response.credential.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
        payload = JSON.parse(atob(b64 + '==='.slice((b64.length % 4) || 4)));
      } catch {
        showErro('Erro ao processar credencial Google. Tente novamente.');
        return;
      }

      const googleEmail = (payload.email || '').toLowerCase();

      if (!vendedor.email) {
        showErro('E-mail não configurado para este RCA. Contate o administrador.');
        return;
      }

      if (googleEmail !== vendedor.email.toLowerCase()) {
        showErro('Conta Google não corresponde ao CODUSUR informado.');
        if (googleEmail) google.accounts.id.revoke(googleEmail, () => {});
        return;
      }

      sessionStorage.setItem('rg_vendedor', JSON.stringify({
        rca,
        nome: vendedor.nome,
        email: googleEmail,
        nome_google: payload.name || vendedor.nome,
      }));

      location.replace('vendedor.html');
    }

    window.addEventListener('load', () => {
      if (typeof google === 'undefined') return;
      google.accounts.id.initialize({
        client_id: CLIENT_ID,
        callback: handleCredential,
        auto_select: false,
        cancel_on_tap_outside: true,
      });
      google.accounts.id.renderButton(
        document.getElementById('google-btn-wrap'),
        { theme: 'filled_black', size: 'large', shape: 'rectangular', width: 288, locale: 'pt-BR' }
      );
    });
  </script>
</body>
</html>
