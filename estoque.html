<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <script src="auth.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estoque — Rigarr</title>
  <script src="estoque_data.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f1117; --card: #1a1d27; --card2: #22263a;
      --accent: #f5c518; --blue: #3b82f6; --text: #e2e8f0;
      --muted: #94a3b8; --border: #2d3144; --green: #22c55e;
      --red: #ef4444; --orange: #f97316;
    }
    body {
      background: var(--bg); color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh; padding: 16px;
    }
    header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 20px; padding-bottom: 16px;
      border-bottom: 1px solid var(--border); gap: 12px; flex-wrap: wrap;
    }
    header h1 { font-size: 1.1rem; font-weight: 700; color: var(--accent); }
    header p  { font-size: .8rem; color: var(--muted); margin-top: 3px; }
    .kpis { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
    .kpi {
      background: var(--card); border: 1px solid var(--border); border-radius: 10px;
      padding: 14px 18px; flex: 1; min-width: 160px;
    }
    .kpi .label {
      font-size: .65rem; text-transform: uppercase; letter-spacing: .08em;
      color: var(--muted); margin-bottom: 6px;
    }
    .kpi .val { font-size: 1.25rem; font-weight: 800; }
    .controls {
      display: flex; gap: 10px; flex-wrap: wrap;
      margin-bottom: 16px; align-items: center;
    }
    select, input[type=text] {
      background: var(--card); border: 1px solid var(--border);
      color: var(--text); border-radius: 8px; padding: 8px 12px;
      font-size: .88rem; outline: none; font-family: inherit;
    }
    select:focus, input[type=text]:focus { border-color: var(--blue); }
    select { min-width: 200px; }
    input[type=text] { min-width: 240px; }
    .chk-flag {
      display: flex; align-items: center; gap: 7px;
      background: var(--card); border: 1px solid var(--border);
      border-radius: 8px; padding: 8px 14px; font-size: .88rem;
      cursor: pointer; user-select: none;
    }
    .chk-flag input { cursor: pointer; accent-color: var(--accent); width: 15px; height: 15px; }
    .btn-csv {
      background: var(--green); color: #0f1117; border: none;
      border-radius: 8px; padding: 8px 16px; font-size: .88rem;
      font-weight: 700; cursor: pointer; font-family: inherit;
    }
    .btn-csv:hover { opacity: .88; }
    .info { font-size: .8rem; color: var(--muted); margin-left: auto; }
    .table-wrap { overflow-x: auto; border-radius: 10px; border: 1px solid var(--border); }
    table { width: 100%; border-collapse: collapse; font-size: .82rem; }
    thead th {
      background: var(--card2); padding: 10px 12px; text-align: left;
      font-size: .72rem; text-transform: uppercase; letter-spacing: .05em;
      color: var(--muted); border-bottom: 1px solid var(--border);
      white-space: nowrap; cursor: pointer;
    }
    thead th:hover { color: var(--text); }
    tbody tr { border-bottom: 1px solid var(--border); }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: var(--card2); }
    tbody td { padding: 9px 12px; vertical-align: middle; white-space: nowrap; }
    .cod  { color: var(--muted); font-size: .72rem; font-family: monospace; }
    .produto-desc { font-weight: 600; white-space: normal; min-width: 200px; }
    .produto-sub  { font-size: .72rem; color: var(--muted); margin-top: 2px; }
    .empresa-badge {
      display: inline-block; background: var(--card2); border: 1px solid var(--border);
      border-radius: 5px; padding: 2px 7px; font-size: .72rem; color: var(--accent);
    }
    .qtd { text-align: right; font-variant-numeric: tabular-nums; }
    .qtd-zero { color: var(--red); font-weight: 700; }
    .qtd-baixo { color: var(--orange); font-weight: 700; }
    .tag-fora-linha {
      display: inline-block; margin-left: 6px; background: rgba(239,68,68,.15);
      color: var(--red); border-radius: 20px; padding: 1px 8px;
      font-size: .65rem; font-weight: 700; white-space: nowrap;
    }
    .empty { text-align: center; padding: 48px; color: var(--muted); font-size: .9rem; }

    @media (max-width: 640px) {
      body { padding: 12px; }
      .kpi { min-width: 130px; padding: 12px 14px; }
      select { min-width: 150px; }
      input[type=text] { min-width: 150px; }
      table { font-size: .76rem; }
      thead th, tbody td { padding: 8px 9px; }
      .hide-mob { display: none; }
    }
  </style>
</head>
<body>

<header>
  <div>
    <h1>📦 ESTOQUE</h1>
    <p id="header-sub">—</p>
  </div>
  <a href="index.html" style="color:var(--muted);font-size:.8rem;text-decoration:none">← Painel</a>
</header>

<div class="kpis" id="kpis"></div>

<div class="controls">
  <select id="sel-empresa" onchange="aplicarFiltro()">
    <option value="">Todas as Empresas</option>
  </select>
  <select id="sel-depto" onchange="aplicarFiltro()">
    <option value="">Todos os Departamentos</option>
  </select>
  <input type="text" id="busca" placeholder="Buscar por produto, código ou fornecedor..." oninput="aplicarFiltro()">
  <label class="chk-flag">
    <input type="checkbox" id="chk-sem-estoque" onchange="aplicarFiltro()"> Só sem estoque
  </label>
  <label class="chk-flag">
    <input type="checkbox" id="chk-risco-ruptura" onchange="aplicarFiltro()"> ⚠ Risco de ruptura (&lt;7 dias)
  </label>
  <label class="chk-flag">
    <input type="checkbox" id="chk-esconder-fora-linha" onchange="aplicarFiltro()" checked> Esconder fora de linha
  </label>
  <button class="btn-csv" onclick="exportarCSV()">⬇ Exportar CSV</button>
  <span class="info" id="info-count"></span>
</div>

<div class="table-wrap">
  <table id="tabela">
    <thead>
      <tr>
        <th onclick="ordenarPor('descricao')">Produto</th>
        <th class="hide-mob" onclick="ordenarPor('fornecedor')">Fornecedor</th>
        <th class="hide-mob" onclick="ordenarPor('departamento')">Departamento / Seção</th>
        <th class="right" style="text-align:right" onclick="ordenarPor('qtestoque')">Estoque (un)</th>
        <th class="hide-mob right" style="text-align:right" onclick="ordenarPor('qtestoquecx')">Estoque (cx)</th>
        <th class="hide-mob right" style="text-align:right" onclick="ordenarPor('qtpendente')">Pendente</th>
        <th class="hide-mob right" style="text-align:right" onclick="ordenarPor('qtbloqueada')">Bloqueado</th>
        <th class="hide-mob right" style="text-align:right" onclick="ordenarPor('qtreserv')">Reservado</th>
        <th class="hide-mob" onclick="ordenarPor('dtultent')">Últ. Entrada</th>
        <th class="hide-mob" onclick="ordenarPor('dtultsaida')">Últ. Saída</th>
        <th class="hide-mob right" style="text-align:right" onclick="ordenarPor('mediavendadia')">Média Venda/dia</th>
        <th class="right" style="text-align:right" onclick="ordenarPor('diasemestoque')">Dias em Estoque</th>
        <th class="right" style="text-align:right" onclick="ordenarPor('diassemvenda')">Dias sem Venda</th>
        <th onclick="ordenarPor('previsaoesgotar')">Previsão de Esgotar</th>
        <th class="hide-mob right" style="text-align:right" onclick="ordenarPor('precounit')">Preço Unit.</th>
        <th class="right" style="text-align:right" onclick="ordenarPor('valorestoque')">Valor em Estoque</th>
        <th onclick="ordenarPor('estado')">Empresa</th>
        <th class="hide-mob" onclick="ordenarPor('codfilial')">Filial</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

<script>
const DATA = typeof ESTOQUE_DATA !== 'undefined' ? ESTOQUE_DATA : null;
let _ordem = { campo: 'descricao', asc: true };

if (!DATA) {
  document.getElementById('tbody').innerHTML = '<tr><td colspan="17" class="empty">Dados não encontrados. Execute exportacao_estoque.py para gerar estoque_data.js.</td></tr>';
} else {
  document.getElementById('header-sub').textContent =
    'Atualizado ' + DATA.atualizado_em + (DATA.fontes_indisponiveis.length ? ' · fontes indisponíveis: ' + DATA.fontes_indisponiveis.join(', ') : '');
  montarFiltros();
  aplicarFiltro();
}

function montarFiltros() {
  const selEmp = document.getElementById('sel-empresa');
  selEmp.innerHTML = '<option value="">Todas as Empresas</option>';
  DATA.estados.forEach(e => {
    const o = document.createElement('option');
    o.value = e; o.textContent = e;
    selEmp.appendChild(o);
  });

  const selDep = document.getElementById('sel-depto');
  selDep.innerHTML = '<option value="">Todos os Departamentos</option>';
  DATA.departamentos.forEach(d => {
    const o = document.createElement('option');
    o.value = d; o.textContent = d;
    selDep.appendChild(o);
  });
}

function montarKpis(lista) {
  const semEstoque = lista.filter(p => p.qtestoque <= 0).length;
  const riscoRuptura = lista.filter(p => p.qtestoque > 0 && p.diasparaesgotar !== null && p.diasparaesgotar < 7).length;
  const valorTotal = lista.reduce((s, p) => s + p.valorestoque, 0);
  document.getElementById('kpis').innerHTML = `
    <div class="kpi">
      <div class="label">Produtos</div>
      <div class="val">${lista.length.toLocaleString('pt-BR')}</div>
    </div>
    <div class="kpi">
      <div class="label">Sem Estoque</div>
      <div class="val" style="color:var(--red)">${semEstoque.toLocaleString('pt-BR')}</div>
    </div>
    <div class="kpi">
      <div class="label">⚠ Risco de Ruptura (&lt;7 dias)</div>
      <div class="val" style="color:var(--orange)">${riscoRuptura.toLocaleString('pt-BR')}</div>
    </div>
    <div class="kpi">
      <div class="label">Valor em Estoque (preço unit.)</div>
      <div class="val">${brl(valorTotal)}</div>
    </div>`;
}

function ordenarPor(campo) {
  if (_ordem.campo === campo) { _ordem.asc = !_ordem.asc; } else { _ordem = { campo, asc: true }; }
  aplicarFiltro();
}

function _filtrados() {
  if (!DATA) return [];
  const empresa = document.getElementById('sel-empresa').value;
  const depto   = document.getElementById('sel-depto').value;
  const busca   = document.getElementById('busca').value.trim().toLowerCase();
  const semEstoque   = document.getElementById('chk-sem-estoque').checked;
  const riscoRuptura = document.getElementById('chk-risco-ruptura').checked;
  const esconderForaLinha = document.getElementById('chk-esconder-fora-linha').checked;

  let lista = DATA.produtos.filter(p => {
    const matchEmpresa = !empresa || p.estado === empresa;
    const matchDepto   = !depto || p.departamento === depto;
    const matchBusca   = !busca || [p.descricao, p.codprod, p.fornecedor, p.fantasia]
      .some(v => v && String(v).toLowerCase().includes(busca));
    const matchEstoque = !semEstoque || p.qtestoque <= 0;
    const matchRisco   = !riscoRuptura || (p.qtestoque > 0 && p.diasparaesgotar !== null && p.diasparaesgotar < 7);
    const matchForaLinha = !esconderForaLinha || !p.foralinha;
    return matchEmpresa && matchDepto && matchBusca && matchEstoque && matchRisco && matchForaLinha;
  });

  const { campo, asc } = _ordem;
  lista = [...lista].sort((a, b) => {
    let va = a[campo], vb = b[campo];
    if (typeof va === 'string') { va = va.toLowerCase(); vb = (vb || '').toLowerCase(); }
    if (va < vb) return asc ? -1 : 1;
    if (va > vb) return asc ? 1 : -1;
    return 0;
  });
  return lista;
}

function aplicarFiltro() {
  const lista = _filtrados();
  montarKpis(lista);
  document.getElementById('info-count').textContent = lista.length.toLocaleString('pt-BR') + ' produto(s)';

  const tbody = document.getElementById('tbody');
  if (!lista.length) {
    tbody.innerHTML = '<tr><td colspan="17" class="empty">Nenhum produto encontrado.</td></tr>';
    return;
  }

  const LIMITE = 2000;
  const exibir = lista.slice(0, LIMITE);

  tbody.innerHTML = exibir.map(p => `
    <tr>
      <td>
        <div class="produto-desc">${_esc(p.descricao)}${p.foralinha ? '<span class="tag-fora-linha">FORA DE LINHA</span>' : ''}</div>
        <div class="produto-sub cod">${p.codprod}${p.fantasia ? ' · ' + _esc(p.fantasia) : ''}</div>
      </td>
      <td class="hide-mob" style="color:var(--muted)">${_esc(p.fornecedor)}</td>
      <td class="hide-mob" style="color:var(--muted);font-size:.78rem">${_esc(p.departamento)}${p.secao ? ' / ' + _esc(p.secao) : ''}</td>
      <td class="qtd ${_qtdCls(p.qtestoque)}">${fmtNum(p.qtestoque)}</td>
      <td class="hide-mob qtd">${fmtNum(p.qtestoquecx)}</td>
      <td class="hide-mob qtd">${fmtNum(p.qtpendente)}</td>
      <td class="hide-mob qtd">${fmtNum(p.qtbloqueada)}</td>
      <td class="hide-mob qtd">${fmtNum(p.qtreserv)}</td>
      <td class="hide-mob">${p.dtultent || '<span style="color:var(--muted)">—</span>'}</td>
      <td class="hide-mob">${p.dtultsaida || '<span style="color:var(--muted)">—</span>'}</td>
      <td class="hide-mob qtd">${p.mediavendadia > 0 ? fmtDec(p.mediavendadia) : '<span style="color:var(--muted)">—</span>'}</td>
      <td class="qtd">${p.diasemestoque !== null && p.diasemestoque !== undefined ? fmtNum(p.diasemestoque) + 'd' : '<span style="color:var(--muted)">—</span>'}</td>
      <td class="qtd">${p.diassemvenda !== null && p.diassemvenda !== undefined ? fmtNum(p.diassemvenda) + 'd' : '<span style="color:var(--muted)">—</span>'}</td>
      <td>${p.previsaoesgotar
          ? `<span class="${_diasCls(p)}">${p.previsaoesgotar}</span>`
          : (p.qtestoque <= 0 ? '<span class="tag-fora-linha">ESGOTADO</span>' : '<span style="color:var(--muted)">—</span>')}</td>
      <td class="hide-mob qtd">${brl(p.precounit)}</td>
      <td class="qtd">${brl(p.valorestoque)}</td>
      <td><span class="empresa-badge">${_esc(p.estado)}</span></td>
      <td class="hide-mob cod">${_esc(p.codfilial)}</td>
    </tr>`).join('');

  if (lista.length > LIMITE) {
    tbody.insertAdjacentHTML('beforeend',
      `<tr><td colspan="17" class="empty">Mostrando ${LIMITE.toLocaleString('pt-BR')} de ${lista.length.toLocaleString('pt-BR')} — refine a busca ou os filtros para ver o restante.</td></tr>`);
  }
}

function _qtdCls(v) {
  if (v <= 0) return 'qtd-zero';
  if (v < 10) return 'qtd-baixo';
  return '';
}

function _diasCls(p) {
  if (p.qtestoque <= 0) return 'qtd-zero';
  if (p.diasparaesgotar === null || p.diasparaesgotar === undefined) return '';
  if (p.diasparaesgotar < 7) return 'qtd-zero';
  if (p.diasparaesgotar < 30) return 'qtd-baixo';
  return '';
}

function fmtNum(v) {
  return Number(v || 0).toLocaleString('pt-BR', { maximumFractionDigits: 0 });
}

function fmtDec(v) {
  return Number(v || 0).toLocaleString('pt-BR', { maximumFractionDigits: 1 });
}

function brl(v) {
  return 'R$ ' + Number(v || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function _esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function exportarCSV() {
  const lista = _filtrados();
  const header = ['Codigo','Produto','Fornecedor','Departamento','Secao','Estoque UN','Estoque CX','Pendente','Bloqueado','Reservado','Ult Entrada','Ult Saida','Media Venda Dia','Dias em Estoque','Dias sem Venda','Previsao Esgotar','Preco Unitario','Valor em Estoque','Empresa','Filial','Fora de Linha'];
  const linhas = lista.map(p => [
    p.codprod, p.descricao, p.fornecedor, p.departamento, p.secao,
    p.qtestoque, p.qtestoquecx, p.qtpendente, p.qtbloqueada, p.qtreserv,
    p.dtultent, p.dtultsaida, p.mediavendadia, p.diasemestoque ?? '', p.diassemvenda ?? '', p.previsaoesgotar,
    p.precounit, p.valorestoque, p.estado, p.codfilial, p.foralinha ? 'Sim' : 'Não',
  ].map(v => `"${String(v ?? '').replace(/"/g,'""')}"`).join(';'));

  const csv = '﻿' + [header.join(';'), ...linhas].join('\r\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url;
  a.download = `estoque_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}
</script>
</body>
</html>
