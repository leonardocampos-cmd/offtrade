<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Promotoria Off Trade</title>
<link rel="manifest" href="/api/promo-app/manifest.webmanifest">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="/api/promo-app/icon-192.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--bg:#0f172a;--card:#1e293b;--card2:#273449;--line:#334155;--tx:#e2e8f0;--mut:#94a3b8;--accent:#3b82f6;--ok:#22c55e;--warn:#f59e0b;--bad:#ef4444}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px}
body{padding-bottom:calc(72px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:20;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--line);display:flex;align-items:center;flex-wrap:wrap;gap:10px}
.coordbar{flex-basis:100%;margin:-2px 0 0;padding:6px 10px;background:#1e3a8a;color:#dbeafe;border-radius:8px;font-size:13px}
header h1{font-size:17px;margin:0;flex:1}
header small{color:var(--mut);display:block;font-weight:400;font-size:12px}
main{padding:14px 16px;max-width:760px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 4px;font-size:16px}
.mut{color:var(--mut);font-size:13px}
.row{display:flex;gap:8px;align-items:center}.row>*{min-width:0}.between{justify-content:space-between}.wrap{flex-wrap:wrap}
.grow{flex:1}
button,.btn{font:inherit;border:0;border-radius:12px;padding:13px 16px;background:var(--accent);color:#fff;font-weight:600;cursor:pointer;min-height:46px}
button.sec{background:var(--card2);color:var(--tx);border:1px solid var(--line)}
button.ok{background:var(--ok);color:#052e16}button.bad{background:var(--bad)}button.warn{background:var(--warn);color:#1c1200}
button.sm{padding:8px 12px;min-height:36px;font-size:14px;border-radius:9px}
button.full{width:100%}button:disabled{opacity:.5}
input,select,textarea{font:inherit;width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:12px;min-height:46px}
textarea{min-height:80px;resize:vertical}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
.badge{display:inline-block;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--card2);color:var(--mut)}
.badge.ok{background:#14532d;color:#86efac}.badge.warn{background:#713f12;color:#fde68a}.badge.bad{background:#7f1d1d;color:#fecaca}.badge.blue{background:#1e3a8a;color:#bfdbfe}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:20}
nav a{flex:1;text-align:center;padding:9px 2px 8px;color:var(--mut);font-size:11px;text-decoration:none}
nav a b{display:block;font-size:20px;line-height:1.2}
nav a.on{color:var(--accent)}
.login{max-width:380px;margin:8vh auto 0;padding:0 16px}
.tabs{display:flex;gap:6px;margin-bottom:12px}.tabs button{flex:1}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:#0b1220;border:1px solid var(--line);padding:11px 16px;border-radius:10px;z-index:100;max-width:90vw;box-shadow:0 6px 24px #0008}
.toast.err{border-color:var(--bad)}
.modal{position:fixed;inset:0;background:#000c;z-index:60;display:flex;align-items:flex-end;justify-content:center}
.modal>div{background:var(--bg);width:100%;max-width:760px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.thumbs img{width:88px;height:88px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.full-img{position:fixed;inset:0;background:#000;z-index:90;display:flex;align-items:center;justify-content:center}.full-img img{max-width:100%;max-height:100%}
#map{height:46vh;border-radius:14px;border:1px solid var(--line);margin-bottom:12px}
.q{border-top:1px solid var(--line);padding:10px 0}.q:first-child{border-top:0}
.dot{width:9px;height:9px;border-radius:50%;background:var(--mut);display:inline-block}.dot.ok{background:var(--ok)}.dot.bad{background:var(--bad)}
.spin{opacity:.6;pointer-events:none}
.leaflet-container{background:#1e293b}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const API = '/api/promo-app/api';
const FOTO = '/api/promo-app/foto/';
const S = { tok: null, perfil: null, nome: '', codusur: null, tela: null, gps: null };
try { Object.assign(S, JSON.parse(localStorage.getItem('promo_sess') || '{}')); } catch (e) {}
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const jsq = s => String(s ?? '').replace(/['"\\<>&\n]/g, '');
const fmtH = ts => ts ? ts.slice(11, 16) : '—';
const fmtDist = m => m == null ? '' : m >= 1000 ? (m / 1000).toFixed(1).replace('.', ',') + ' km' : Math.round(m) + ' m';
const FONTE = { manual: 'local definido pelo gestor', erp: 'coordenada do ERP', endereco: 'endereço', rua: 'endereço (rua)', bairro: 'aproximado (bairro)' };
function badgeLocal(status, dist, fonte) {
  if (status === 'dentro') return `<span class="badge ok">✔ na loja · a ${fmtDist(dist)} · ${FONTE[fonte] || fonte}</span>`;
  if (status === 'fora') return `<span class="badge warn">⚠ fora da loja · a ${fmtDist(dist)} · ${FONTE[fonte] || fonte}</span>`;
  return '<span class="badge">sem localização de referência da loja</span>';
}
const fmtD = d => d.split('-').reverse().join('/');
const hoje = () => new Date(Date.now() - 3 * 3600e3).toISOString().slice(0, 10);   // horário de Brasília
const salvarSessao = () => { try { localStorage.setItem('promo_sess', JSON.stringify({ tok: S.tok, perfil: S.perfil, nome: S.nome, codusur: S.codusur })); } catch (e) {} };

function toast(msg, err) {
  const t = document.createElement('div'); t.className = 'toast' + (err ? ' err' : ''); t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), err ? 5000 : 2500);
}
async function api(path, o = {}) {
  const h = { Authorization: 'Bearer ' + S.tok };
  let body = o.body;
  if (body && !(body instanceof FormData)) { body = JSON.stringify(body); h['Content-Type'] = 'application/json'; }
  let r;
  try { r = await fetch(API + path, { method: o.method || (body ? 'POST' : 'GET'), headers: h, body }); }
  catch (e) { throw new Error('Sem conexão. Tente novamente quando tiver sinal.'); }
  if (r.status === 401 && S.tok) { sair(true); throw new Error('Sessão expirada'); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(j.erro || j.message || 'Erro ' + r.status); e.data = j; e.status = r.status; throw e; }
  return j;
}
// Executa ação mostrando estado "ocupado" no botão e toast de erro
async function agir(btn, fn) {
  if (btn) btn.disabled = true;
  try { return await fn(); } catch (e) { toast(e.message, true); } finally { if (btn) btn.disabled = false; }
}

/* ───────── GPS e foto ───────── */
function getPos() {
  return new Promise((res, rej) => {
    if (!navigator.geolocation) return rej(new Error('Este aparelho não tem GPS'));
    navigator.geolocation.getCurrentPosition(p => res({ lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy }),
      e => rej(new Error(e.code === 1 ? 'Permita o acesso à localização nas configurações do navegador' : 'Não consegui obter a localização — vá para um local aberto e tente de novo')),
      { enableHighAccuracy: true, timeout: 20000, maximumAge: 10000 });
  });
}
const dhBR = () => { const d = new Date(Date.now() - 3 * 3600e3).toISOString(); return d.slice(8, 10) + '/' + d.slice(5, 7) + '/' + d.slice(0, 4) + ' ' + d.slice(11, 19); };

// Abre a câmera, grava a legenda NA imagem (tipo · loja · data/hora · GPS) e devolve um Blob JPEG
function tirarFoto(tipo, loja, pos) {
  return new Promise((res, rej) => {
    const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*'; inp.setAttribute('capture', 'environment');
    inp.onchange = async () => {
      const f = inp.files[0]; if (!f) return rej(new Error('Foto cancelada'));
      try {
        const bmp = await createImageBitmap(f, { imageOrientation: 'from-image' });
        const k = Math.min(1, 1280 / Math.max(bmp.width, bmp.height));
        const c = document.createElement('canvas'); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
        const g = c.getContext('2d'); g.drawImage(bmp, 0, 0, c.width, c.height);
        const fs = Math.max(15, Math.round(c.width / 34));
        const linhas = [tipo.toUpperCase() + ' · ' + loja, dhBR() + (pos ? '  ·  ' + pos.lat.toFixed(5) + ', ' + pos.lng.toFixed(5) : '')];
        const h = fs * 2.9;
        g.fillStyle = 'rgba(0,0,0,.68)'; g.fillRect(0, c.height - h, c.width, h);
        g.fillStyle = '#fff'; g.textBaseline = 'top';
        g.font = '700 ' + fs + 'px sans-serif'; g.fillText(linhas[0].slice(0, 70), fs * .6, c.height - h + fs * .4);
        g.font = fs * .9 + 'px sans-serif'; g.fillText(linhas[1], fs * .6, c.height - h + fs * 1.65);
        c.toBlob(b => res(b), 'image/jpeg', 0.82);
      } catch (e) { rej(new Error('Não consegui processar a foto')); }
    };
    inp.click();
  });
}
const urlFoto = rel => FOTO + rel + '?t=' + encodeURIComponent(S.tok);
function verFoto(rel) {
  const d = document.createElement('div'); d.className = 'full-img'; d.onclick = () => d.remove();
  d.innerHTML = '<img src="' + urlFoto(rel) + '">'; document.body.appendChild(d);
}
function modal(html) {
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = '<div>' + html + '</div>'; m.onclick = e => { if (e.target === m) m.remove(); };
  document.body.appendChild(m); return m;
}

/* ───────── login ───────── */
let loginTab = 'promotor';
function telaLogin() {
  $('#app').innerHTML = `<div class="login"><h1 style="text-align:center">📍 Promotoria</h1><p class="mut" style="text-align:center">Off Trade</p>
  <div class="tabs"><button class="${loginTab === 'promotor' ? '' : 'sec'}" onclick="loginTab='promotor';telaLogin()">Promotor</button>
  <button class="${loginTab === 'gestor' ? '' : 'sec'}" onclick="loginTab='gestor';telaLogin()">Gestor</button></div>
  <div class="card">${loginTab === 'promotor'
      ? '<label>Código (RCA)</label><input id="lc" inputmode="numeric" autocomplete="username"><label>Senha (a mesma do sistema)</label><input id="lp" type="password" autocomplete="current-password">'
      : `<button class="full" id="gb" onclick="loginGoogle()">Entrar com Google</button>
         <p class="mut" style="text-align:center;margin:14px 0 0"><a href="#" style="color:var(--mut)" onclick="$('#sn').style.display='block';$('#lb').style.display='';this.remove();return false">usar senha</a></p>
         <div id="sn" style="display:none"><label>Senha do gestor</label><input id="lp" type="password" autocomplete="current-password"></div>`}
  ${loginTab === 'promotor' ? '<button class="full" style="margin-top:14px" id="lb" onclick="entrar()">Entrar</button>' : '<button class="sec full" style="margin-top:10px;display:none" id="lb" onclick="entrar()">Entrar com senha</button>'}</div></div>`;
}
function loginGoogle() { location.href = '/api/auth/oauth/login?voltar=' + encodeURIComponent('/api/promo-app/'); }
async function voltouDoGoogle() {
  const g = new URLSearchParams(location.search).get('g'); if (!g) return false;
  history.replaceState(null, '', location.pathname); loginTab = 'gestor';
  if (g !== 'ok') { telaLogin(); toast('Login com Google cancelado ou recusado', true); return true; }
  try {
    const r = await fetch(API + '/login-google', { method: 'POST' }); const j = await r.json().catch(() => ({}));
    if (!r.ok) { telaLogin(); toast(j.erro || 'Falha no login', true); return true; }
    Object.assign(S, { tok: j.token, perfil: 'gestor', nome: j.nome, codusur: null, tela: null }); salvarSessao(); iniciar();
  } catch (e) { telaLogin(); toast('Sem conexão', true); }
  return true;
}
async function entrar() {
  const b = $('#lb');
  await agir(b, async () => {
    const isP = loginTab === 'promotor';
    const r = await fetch(API + (isP ? '/login' : '/login-gestor'), { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(isP ? { codusur: $('#lc').value, pin: $('#lp').value } : { senha: $('#lp').value }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.erro || 'Falha no login');
    Object.assign(S, { tok: j.token, perfil: j.perfil, nome: j.nome, codusur: j.codusur || null, tela: null }); salvarSessao(); iniciar();
  });
}
function sair(silencioso) {
  S.tok = null; salvarSessao(); pararGPS();
  if (!silencioso) toast('Você saiu'); telaLogin();
}

/* ───────── rastreio de posição (só com o app aberto — limite do navegador) ───────── */
let watchId = null, ultPing = { t: 0, lat: 0, lng: 0 };
function iniciarGPS() {
  if (watchId !== null || !navigator.geolocation) return;
  segurarTela();
  watchId = navigator.geolocation.watchPosition(p => {
    S.gps = { lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy };
    if (window._me) window._me.setLatLng([S.gps.lat, S.gps.lng]);
    const dt = Date.now() - ultPing.t, mv = Math.hypot(S.gps.lat - ultPing.lat, S.gps.lng - ultPing.lng) * 111000;
    const el = $('#gpsdot'); if (el) el.className = 'dot ok';
    if (dt > 60000 || (mv > 50 && dt > 15000)) {
      ultPing = { t: Date.now(), lat: S.gps.lat, lng: S.gps.lng };
      api('/ping', { body: S.gps }).catch(() => {});
    }
  }, () => { const el = $('#gpsdot'); if (el) el.className = 'dot bad'; }, { enableHighAccuracy: true, maximumAge: 20000, timeout: 30000 });
}
// Mantém a tela acesa (senão o navegador pausa o GPS ao bloquear) e retoma ao voltar pro app
let wake = null;
async function segurarTela() { try { if (navigator.wakeLock && document.visibilityState === 'visible') wake = await navigator.wakeLock.request('screen'); } catch (e) {} }
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible' || S.perfil !== 'promotor' || !S.tok) return;
  segurarTela(); pararGPS(); iniciarGPS();
  getPos().then(p => { S.gps = p; ultPing = { t: Date.now(), lat: p.lat, lng: p.lng }; api('/ping', { body: p }).catch(() => {}); }).catch(() => {});
});
function pararGPS() { if (watchId !== null) navigator.geolocation.clearWatch(watchId); watchId = null; }

/* ───────── shell ───────── */
function shell(titulo, sub, corpo, abas) {
  $('#app').innerHTML = `<header><h1>${esc(titulo)}<small>${esc(sub || '')}</small></h1>
    ${S.perfil === 'promotor' ? '<span class="dot" id="gpsdot" title="GPS"></span>' : ''}
    <button class="sec sm" onclick="sair()">Sair</button>${S.perfil === 'gestor' && S._coord ? `<div class="coordbar">👤 Coordenador: <b>${esc(S._coord)}</b></div>` : ''}</header><main>${corpo}</main>
    <nav>${abas.map(a => `<a href="#" class="${S.tela === a[0] ? 'on' : ''}" onclick="ir('${a[0]}');return false"><b>${a[1]}</b>${a[2]}</a>`).join('')}</nav>`;
  if (S.gps && $('#gpsdot')) $('#gpsdot').className = 'dot ok';
}
function ir(t) { S.tela = t; clearInterval(window._tm); render(); }
function render() {
  if (!S.tok) return telaLogin();
  (S.perfil === 'gestor' ? G : P)[S.tela]().catch(e => toast(e.message, true));
}
function iniciar() {
  if (!S.tok) return telaLogin();
  S.tela = S.tela || (S.perfil === 'gestor' ? 'mapa' : 'hoje');
  if (S.perfil === 'promotor') iniciarGPS();
  if (S.perfil === 'gestor' && !S._coord) api('/g/coordenadores').then(c => { S._coord = c.map(x => x.nome).join(' · '); }).catch(() => {}).finally(render);
  else render();
}

/* ═════════ PROMOTOR ═════════ */
const abasP = [['hoje', '📋', 'Minha rota'], ['mapa', '🗺️', 'Mapa'], ['visita', '✅', 'Visita atual']];
let visitaAtual = null;
const P = {
  async hoje() {
    const d = await api('/eu/hoje'); visitaAtual = d.aberta;
    const est = v => !v ? '<span class="badge">Pendente</span>' : v.out_ts ? `<span class="badge ok">Concluída ${fmtH(v.in_ts)}–${fmtH(v.out_ts)}</span>` : `<span class="badge blue">Em andamento desde ${fmtH(v.in_ts)}</span>`;
    const feitas = d.rota.filter(l => l.visita && l.visita.out_ts).length;
    let h = '';
    if (d.aberta) h += `<div class="card" style="border-color:var(--accent)"><b>Você está em visita:</b> ${esc(d.aberta.loja_nome)}<br><span class="mut">Check-in às ${fmtH(d.aberta.in_ts)}</span><button class="full" style="margin-top:10px" onclick="ir('visita')">Abrir visita</button></div>`;
    h += `<p class="mut">${d.rota.length ? feitas + ' de ' + d.rota.length + ' lojas concluídas' : 'Nenhuma rota definida para hoje.'}</p>`;
    h += d.rota.map(l => `<div class="card"><div class="row between"><h3>${esc(l.ordem)}. ${esc(l.nome)}</h3>${est(l.visita)}</div>
      <div class="mut">${esc(l.endereco)} ${esc(l.cidade)}</div>
      <div class="row wrap" style="margin-top:10px">${!l.visita ? `<button class="sm grow" onclick="fazerCheckin(${l.codcli},'${esc(jsq(l.nome))}',this)">Check-in</button>` : ''}
      ${l.lat ? `<a class="btn sm sec" style="text-decoration:none;text-align:center" target="_blank" href="https://www.google.com/maps/dir/?api=1&destination=${l.lat},${l.lng}">Como chegar</a>` : `<a class="btn sm sec" style="text-decoration:none" target="_blank" href="https://www.google.com/maps/search/${encodeURIComponent(l.endereco + ' ' + l.cidade)}">Como chegar</a>`}</div></div>`).join('');
    if (d.extras.length) h += `<p class="mut">Visitas fora da rota hoje</p>` + d.extras.map(v => `<div class="card row between"><span>${esc(v.loja_nome)}</span>${est(v)}</div>`).join('');
    h += `<button class="sec full" onclick="visitaAvulsa()">＋ Visitar loja fora da rota</button>`;
    shell('Minha rota', esc(S.nome) + ' · ' + fmtD(d.data), h, abasP);
  },
  async mapa(tentativa = 0) {
    const d = await api('/eu/hoje'); visitaAtual = d.aberta;
    const cor = v => !v ? '#64748b' : v.out_ts ? '#22c55e' : '#3b82f6';
    const sem = d.rota.filter(l => !l.ref);
    shell('Mapa da rota', esc(S.nome) + ' · ' + fmtD(d.data),
      `<div id="map" style="height:62vh"></div><div class="row wrap mut" style="gap:14px;margin-bottom:8px"><span><span class="dot" style="background:#64748b"></span> pendente</span><span><span class="dot" style="background:#3b82f6"></span> em andamento</span><span><span class="dot" style="background:#22c55e"></span> concluída</span><span>┅ pino tracejado = local aproximado</span></div>
       ${sem.length ? `<div class="card mut">📍 ${sem.length} loja(s) ainda sem ponto no mapa (localizando pelo endereço): ${sem.map(l => esc(l.nome)).join(', ')}</div>` : ''}
       ${!d.rota.length ? '<div class="card mut">Nenhuma rota definida para hoje.</div>' : ''}`, abasP);
    const m = L.map('map', { zoomControl: true }).setView([-22.9, -43.2], 11);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap', maxZoom: 19 }).addTo(m);
    const pts = [];
    d.rota.filter(l => l.ref).forEach(l => {
      const aprox = l.ref.fonte === 'bairro' || l.ref.fonte === 'rua';
      const ic = L.divIcon({ className: '', iconSize: [32, 32], iconAnchor: [16, 16],
        html: `<div style="width:32px;height:32px;border-radius:50%;background:${cor(l.visita)};color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;border:3px ${aprox ? 'dashed' : 'solid'} #fff;box-shadow:0 2px 8px #0008">${l.ordem}</div>` });
      const st = !l.visita ? 'Pendente' : l.visita.out_ts ? 'Concluída ' + fmtH(l.visita.in_ts) + '–' + fmtH(l.visita.out_ts) : 'Em andamento desde ' + fmtH(l.visita.in_ts);
      L.marker([l.ref.lat, l.ref.lng], { icon: ic }).addTo(m).bindPopup(
        `<b>${esc(l.ordem)}. ${esc(l.nome)}</b><br>${esc(l.endereco)} ${esc(l.cidade)}<br><i>${st}</i>${aprox ? '<br><small>Ponto aproximado (' + esc(FONTE[l.ref.fonte]) + ')</small>' : ''}
         <div style="margin-top:8px;display:flex;gap:6px">${!l.visita ? `<button onclick="fazerCheckin(${l.codcli},'${esc(jsq(l.nome))}',this)" style="padding:6px 10px;min-height:0;font-size:13px">Check-in</button>` : ''}

  clearTimeout(_at); _at = setTimeout(async () => {
    const r = await api('/g/rcas?coordenador=' + ($('#ac') ? $('#ac').value : '') + '&supervisor=' + $('#as').value + '&q=' + encodeURIComponent($('#aq').value));
    $('#ar').innerHTML = r.map(x => `<div class="card row between"><div><b>${esc(x.nome)}</b> <span class="mut">#${x.codusur} ${esc(x.estado || '')} · ${esc(x.coordenador_nome ? x.coordenador_nome + ' › ' : '')}${esc(x.supervisor_nome || '')}</span>${x.bloqueado ? ' <span class="badge">bloqueado no ERP</span>' : ''}</div>${x.promotor ? '<span class="badge ok">já é promotor</span>' : `<button class="sm" onclick="api('/g/promotores',{body:{codusur:${x.codusur}}}).then(()=>{toast('Adicionado — ele entra com a senha do sistema');G.equipe()})">Adicionar</button>`}</div>`).join('');
  }, 100);
}
async function editarTarefa(t) {
  t = t || { titulo: '', descricao: '', perguntas: [{ id: 'p1', texto: '', tipo: 'texto' }] };
  const ps = await promotores(); window._et = JSON.parse(JSON.stringify(t));
  const m = modal(''); window._m = m; desenhaTarefa(ps);
}
function syncTarefa() {
  if ($('#tt')) Object.assign(window._et, { titulo: $('#tt').value, descricao: $('#td').value, codusur: +$('#tu').value || null, data_ini: $('#ti').value, data_fim: $('#tf').value });
}
let _lt = [], _tseq = 0, _tt;
function buscaLojaTarefa() {
  clearTimeout(_tt); const q = $('#tcq').value.trim(), seq = ++_tseq;
  if (!q) return $('#tcr').innerHTML = '';
  $('#tcr').innerHTML = '<p class="mut">Buscando…</p>';
  _tt = setTimeout(async () => {
    const l = await api('/lojas?q=' + encodeURIComponent(q)).catch(() => []);
    if (seq !== _tseq) return;
    _lt = l;
    $('#tcr').innerHTML = l.map((x, i) => `<div class="card row between"><div><b>${esc(x.nome)}</b><div class="mut">${x.codcli} · ${esc(x.cidade)} · vend. ${esc(x.vendedor)}</div></div><button class="sm" onclick="escolheLojaTarefa(${i})">Escolher</button></div>`).join('') || '<p class="mut">Nada encontrado</p>';
  }, 100);
}
function escolheLojaTarefa(i) { syncTarefa(); Object.assign(window._et, { codcli: _lt[i].codcli, loja_nome: _lt[i].nome }); desenhaTarefa(); }
function desenhaTarefa(ps) {
  syncTarefa();
  const t = window._et; window._ps = ps || window._ps;
  window._m.firstChild.innerHTML = `<h3>${t.id ? 'Editar' : 'Nova'} tarefa</h3>
  <label>Título</label><input id="tt" value="${esc(t.titulo)}"><label>Descrição (opcional)</label><input id="td" value="${esc(t.descricao || '')}">
  <label>Promotor</label><select id="tu"><option value="">Todos</option>${optsProm(window._ps, t.codusur)}</select>
  <label>Loja (opcional — vazio = todas as lojas)</label>
  ${t.codcli ? `<div class="card row between" style="margin:0"><span><b>${esc(t.loja_nome || 'Cliente ' + t.codcli)}</b> <span class="mut">#${t.codcli}</span></span><button class="sec sm" onclick="syncTarefa();_et.codcli=null;_et.loja_nome='';desenhaTarefa()">✕</button></div>`
    : `<input id="tcq" placeholder="Buscar loja por nome, código ou cidade" oninput="buscaLojaTarefa()" autocomplete="off"><div id="tcr"></div>`}
  <div class="row"><div class="grow"><label>De</label><input id="ti" type="date" value="${t.data_ini || ''}"></div><div class="grow"><label>Até</label><input id="tf" type="date" value="${t.data_fim || ''}"></div></div>
  <h3 style="margin-top:16px">Perguntas</h3>${t.perguntas.map((p, i) => `<div class="card"><input placeholder="Pergunta ${i + 1}" value="${esc(p.texto)}" oninput="_et.perguntas[${i}].texto=this.value">
    <div class="row" style="margin-top:8px"><select onchange="_et.perguntas[${i}].tipo=this.value;desenhaTarefa()">${[['texto', 'Texto'], ['numero', 'Número'], ['foto', 'Foto'], ['sim_nao', 'Sim/Não'], ['escolha', 'Escolha']].map(o => `<option value="${o[0]}" ${p.tipo === o[0] ? 'selected' : ''}>${o[1]}</option>`).join('')}</select>
    <button class="bad sm" onclick="_et.perguntas.splice(${i},1);desenhaTarefa()">✕</button></div>
    ${p.tipo === 'escolha' ? `<input style="margin-top:8px" placeholder="Opções separadas por vírgula" value="${esc((p.opcoes || []).join(', '))}" oninput="_et.perguntas[${i}].opcoes=this.value.split(',')">` : ''}
    <div class="row wrap" style="margin-top:8px"><label style="margin:0"><input type="checkbox" style="width:auto;min-height:0" ${p.obrigatoria ? 'checked' : ''} onchange="_et.perguntas[${i}].obrigatoria=this.checked"> Obrigatória</label>
    ${p.tipo !== 'foto' ? `<label style="margin:0"><input type="checkbox" style="width:auto;min-height:0" ${p.permite_foto ? 'checked' : ''} onchange="_et.perguntas[${i}].permite_foto=this.checked"> Permite foto</label>` : ''}</div></div>`).join('')}
  <button class="sec full" onclick="_et.perguntas.push({id:'p'+(Date.now()%100000),texto:'',tipo:'texto'});desenhaTarefa()">＋ Pergunta</button>
  <button class="full" style="margin-top:12px" id="tsv">Salvar tarefa</button>`;
  $('#tsv').onclick = () => agir($('#tsv'), async () => {
    syncTarefa();
    await api('/g/tarefas', { body: window._et }); window._m.remove(); toast('Tarefa salva'); G.tarefas();
  });
}

if ('serviceWorker' in navigator) navigator.serviceWorker.register('/api/promo-app/sw.js', { scope: '/api/promo-app/' }).catch(() => {});
voltouDoGoogle().then(feito => { if (!feito) iniciar(); });
</script>
