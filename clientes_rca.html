<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <script src="auth.js"></script>
  <script src="fontes_status_data.js"></script>
  <script src="fontes_alert.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clientes por RCA</title>
  <script src="clientes_rca_data.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f1117; --card: #1a1d27; --card2: #22263a;
      --accent: #f5c518; --blue: #3b82f6; --text: #e2e8f0;
      --muted: #94a3b8; --border: #2d3144; --green: #22c55e;
    }
    body {
      background: var(--bg); color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh; padding: 16px;
    }
    header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 20px; padding-bottom: 16px;
      border-bottom: 1px solid var(--border); gap: 12px; flex-wrap: wrap;
    }
    header h1 { font-size: 1.1rem; font-weight: 700; color: var(--blue); }
    header p  { font-size: .8rem; color: var(--muted); margin-top: 3px; }
    .controls {
      display: flex; gap: 10px; flex-wrap: wrap;
      margin-bottom: 16px; align-items: center;
    }
    select, input[type=text] {
      background: var(--card); border: 1px solid var(--border);
      color: var(--text); border-radius: 8px; padding: 8px 12px;
      font-size: .88rem; outline: none; font-family: inherit;
    }
    select:focus, input[type=text]:focus { border-color: var(--blue); }
    select { min-width: 260px; }
    input[type=text] { min-width: 220px; }
    .btn-csv {
      background: var(--green); color: #0f1117; border: none;
      border-radius: 8px; padding: 8px 16px; font-size: .88rem;
      font-weight: 700; cursor: pointer; font-family: inherit;
    }
    .btn-csv:hover { opacity: .88; }
    .info { font-size: .8rem; color: var(--muted); margin-left: auto; }
    .table-wrap { overflow-x: auto; border-radius: 10px; border: 1px solid var(--border); }
    table { width: 100%; border-collapse: collapse; font-size: .82rem; }
    thead th {
      background: var(--card2); padding: 10px 12px; text-align: left;
      font-size: .72rem; text-transform: uppercase; letter-spacing: .05em;
      color: var(--muted); border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    tbody tr { border-bottom: 1px solid var(--border); cursor: pointer; }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: var(--card2); }
    tbody td { padding: 9px 12px; vertical-align: middle; }
    .cod  { color: var(--muted); font-size: .78rem; font-family: monospace; }
    .cnpj { color: var(--muted); font-size: .78rem; font-family: monospace; white-space: nowrap; }
    .rca-badge {
      display: inline-block; background: var(--card2); border: 1px solid var(--border);
      border-radius: 5px; padding: 2px 7px; font-size: .72rem; color: var(--accent);
      white-space: nowrap;
    }
    .empty { text-align: center; padding: 48px; color: var(--muted); font-size: .9rem; }
    .chk-ka {
      display: flex; align-items: center; gap: 7px;
      background: var(--card); border: 1px solid var(--border);
      border-radius: 8px; padding: 8px 14px; font-size: .88rem;
      cursor: pointer; user-select: none;
    }
    .chk-ka input { cursor: pointer; accent-color: var(--accent); width: 15px; height: 15px; }
    .badge-ka {
      display: inline-block; margin-left: 6px; background: rgba(245,197,24,.15);
      color: var(--accent); border-radius: 20px; padding: 1px 8px;
      font-size: .68rem; font-weight: 700; white-space: nowrap;
    }

    @media (max-width: 640px) {
      body { padding: 12px; }
      select { min-width: 150px; }
      input[type=text] { min-width: 150px; }
      table { font-size: .78rem; }
      thead th, tbody td { padding: 8px 9px; }
      .hide-mob { display: none; }
    }
  </style>
</head>
<body>

<header>
  <div>
    <h1>BASE DE CLIENTES POR RCA</h1>
    <p id="header-sub">—</p>
  </div>
  <a href="index.html" style="color:var(--muted);font-size:.8rem;text-decoration:none">← Painel</a>
</header>

<div class="controls">
  <select id="sel-estado" onchange="onEstadoChange()">
    <option value="">Todos os Estados</option>
  </select>
  <select id="sel-rca" onchange="aplicarFiltro()">
    <option value="">Todos os RCAs</option>
  </select>
  <select id="sel-rede" onchange="aplicarFiltro()">
    <option value="">Todas as Redes</option>
  </select>
  <select id="sel-cidade" onchange="aplicarFiltro()">
    <option value="">Todas as Cidades</option>
  </select>
  <input type="text" id="busca" placeholder="Buscar por nome, fantasia, CNPJ..." oninput="aplicarFiltro()">
  <label class="chk-ka">
    <input type="checkbox" id="chk-ka" onchange="aplicarFiltro()"> ⭐ Key Account
  </label>
  <button class="btn-csv" onclick="exportarCSV()">⬇ Exportar CSV</button>
  <span class="info" id="info-count"></span>
</div>

<div class="table-wrap">
  <table id="tabela">
    <thead>
      <tr>
        <th class="hide-mob">Cód.</th>
        <th class="hide-mob">CNPJ</th>
        <th>Razão Social</th>
        <th>Fantasia</th>
        <th class="hide-mob">Ramo</th>
        <th class="hide-mob">Rede</th>
        <th class="hide-mob">Bairro</th>
        <th>Cidade</th>
        <th>UF</th>
        <th>RCA 1</th>
        <th class="hide-mob">RCA 2</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

<script>
const DATA = typeof CLIENTES_RCA_DATA !== 'undefined' ? CLIENTES_RCA_DATA : null;

// Link fixo por vendedor (metas.html/sp.html/mg.html/es.html, botão "Novos
// Clientes") vem com ?estado=UF&rcas=10,200 — trava o filtro de Estado/RCA
// (esconde os selects, já que RCA 10/200 são os "baldes" de Inativo/Novos
// Clientes, não vendedores de verdade) e muda o clique na linha pra abrir
// raiox.html#clientes travado no estado, em vez do detalhe do cliente —
// pra voltar pra outro estado/RCA é só voltar nesta página.
const _params    = new URLSearchParams(location.search);
const _estadoFixo = _params.get('estado') || '';
const _rcasFixo    = (_params.get('rcas') || '').split(',').map(s => s.trim()).filter(Boolean);
const _modoTravado = !!(_estadoFixo || _rcasFixo.length);

if (!DATA) {
  document.getElementById('tbody').innerHTML = '<tr><td colspan="11" class="empty">Dados não encontrados. Execute o pipeline para gerar clientes_rca_data.js.</td></tr>';
} else {
  document.getElementById('header-sub').textContent = 'Atualizado ' + DATA.atualizado_em;
  montarEstados();
  reconstruirRcas();
  montarRedes();
  montarCidades();
  if (_modoTravado) aplicarTravamento();
  aplicarFiltro();
}

function aplicarTravamento() {
  if (_estadoFixo) {
    const selEstado = document.getElementById('sel-estado');
    selEstado.value = _estadoFixo;
    selEstado.disabled = true;
    reconstruirRcas();
    montarRedes();
    montarCidades();
  }
  if (_rcasFixo.length) {
    const selRca = document.getElementById('sel-rca');
    selRca.style.display = 'none';
    const label = document.createElement('span');
    label.className = 'info';
    label.textContent = 'RCA ' + _rcasFixo.join(', ') + ' (Inativo/Novos Clientes)';
    selRca.insertAdjacentElement('afterend', label);
  }
}

function montarEstados() {
  const atual = document.getElementById('sel-estado').value;
  const sel = document.getElementById('sel-estado');
  sel.innerHTML = '<option value="">Todos os Estados</option>';
  [...new Set(DATA.clientes.map(c => c.estado).filter(Boolean))].sort().forEach(uf => {
    const o = document.createElement('option');
    o.value = uf;
    o.textContent = uf;
    if (uf === atual) o.selected = true;
    sel.appendChild(o);
  });
}

function reconstruirRcas() {
  const estado = document.getElementById('sel-estado').value.trim();
  const rcaAtual = document.getElementById('sel-rca').value;

  // Filtra clientes pelo estado selecionado para montar apenas RCAs relevantes
  const base = !estado ? DATA.clientes : DATA.clientes.filter(c => c.estado === estado);

  const rcaMap = {};
  base.forEach(c => {
    if (c.codusur1) rcaMap[c.codusur1] = c.nome_usur1 || c.codusur1;
    if (c.codusur2) rcaMap[c.codusur2] = c.nome_usur2 || c.codusur2;
  });

  const sel = document.getElementById('sel-rca');
  sel.innerHTML = '<option value="">Todos os RCAs</option>';
  Object.entries(rcaMap)
    .sort((a, b) => (a[1] || '').localeCompare(b[1] || ''))
    .forEach(([cod, nome]) => {
      const o = document.createElement('option');
      o.value = cod;
      o.textContent = `${nome.replace(/ - OFF TRADE.*/i, '')} (${cod})`;
      if (cod === rcaAtual) o.selected = true;
      sel.appendChild(o);
    });

  // Se o RCA anterior não existe mais no estado selecionado, limpa a seleção
  if (rcaAtual && !rcaMap[rcaAtual]) sel.value = '';
}

function montarRedes() {
  const estado = document.getElementById('sel-estado').value.trim();
  const atual = document.getElementById('sel-rede').value;
  const base = !estado ? DATA.clientes : DATA.clientes.filter(c => c.estado === estado);

  const sel = document.getElementById('sel-rede');
  sel.innerHTML = '<option value="">Todas as Redes</option>';
  [...new Set(base.map(c => c.rede).filter(Boolean))].sort().forEach(rede => {
    const o = document.createElement('option');
    o.value = rede;
    o.textContent = rede;
    if (rede === atual) o.selected = true;
    sel.appendChild(o);
  });
  if (atual && !base.some(c => c.rede === atual)) sel.value = '';
}

function montarCidades() {
  const estado = document.getElementById('sel-estado').value.trim();
  const atual = document.getElementById('sel-cidade').value;
  const base = !estado ? DATA.clientes : DATA.clientes.filter(c => c.estado === estado);

  const sel = document.getElementById('sel-cidade');
  sel.innerHTML = '<option value="">Todas as Cidades</option>';
  [...new Set(base.map(c => c.cidade).filter(Boolean))].sort().forEach(cidade => {
    const o = document.createElement('option');
    o.value = cidade;
    o.textContent = cidade;
    if (cidade === atual) o.selected = true;
    sel.appendChild(o);
  });
  if (atual && !base.some(c => c.cidade === atual)) sel.value = '';
}

function onEstadoChange() {
  reconstruirRcas();
  montarRedes();
  montarCidades();
  aplicarFiltro();
}

function _filtrados() {
  if (!DATA) return [];
  const estado = document.getElementById('sel-estado').value.trim();
  const rca    = document.getElementById('sel-rca').value.trim();
  const rede   = document.getElementById('sel-rede').value;
  const cidade = document.getElementById('sel-cidade').value;
  const busca  = document.getElementById('busca').value.trim().toLowerCase();
  const soKA   = document.getElementById('chk-ka').checked;
  return DATA.clientes.filter(c => {
    const matchEstado = !estado || c.estado === estado;
    const matchRca    = _rcasFixo.length
      ? (_rcasFixo.includes(c.codusur1) || _rcasFixo.includes(c.codusur2))
      : (!rca || c.codusur1 === rca || c.codusur2 === rca);
    const matchRede    = !rede || c.rede === rede;
    const matchCidade  = !cidade || c.cidade === cidade;
    const matchKA      = !soKA || c.key_account;
    const matchBusca  = !busca || [c.razao, c.fantasia, c.cnpj, c.codcli, c.ramo, c.rede]
      .some(v => v && v.toLowerCase().includes(busca));
    return matchEstado && matchRca && matchRede && matchCidade && matchKA && matchBusca;
  });
}

function aplicarFiltro() {
  const lista = _filtrados();
  document.getElementById('info-count').textContent = lista.length + ' cliente(s)';

  const tbody = document.getElementById('tbody');
  if (!lista.length) {
    tbody.innerHTML = '<tr><td colspan="11" class="empty">Nenhum cliente encontrado.</td></tr>';
    return;
  }

  tbody.innerHTML = lista.map(c => `
    <tr onclick="abrirDetalhe('${c.estado}', '${c.codcli}')" title="Ver Raio X deste cliente">
      <td class="cod hide-mob">${c.codcli}</td>
      <td class="cnpj hide-mob">${_fmtCnpj(c.cnpj)}</td>
      <td>${_esc(c.razao)}${c.key_account ? '<span class="badge-ka">⭐ KA</span>' : ''}</td>
      <td style="color:var(--muted)">${_esc(c.fantasia)}</td>
      <td class="hide-mob" style="color:var(--muted);font-size:.78rem">${_esc(c.ramo)}</td>
      <td class="hide-mob" style="color:var(--muted);font-size:.78rem">${_esc(c.rede)}</td>
      <td class="hide-mob" style="color:var(--muted)">${_esc(c.bairro)}</td>
      <td style="color:var(--muted)">${_esc(c.cidade)}</td>
      <td style="color:var(--muted);font-size:.78rem;font-weight:700">${c.estado || ''}</td>
      <td>${c.codusur1 ? `<span class="rca-badge">${c.codusur1} · ${_esc(c.nome_usur1.replace(' - OFF TRADE',''))}</span>` : ''}</td>
      <td class="hide-mob">${c.codusur2 ? `<span class="rca-badge">${c.codusur2} · ${_esc(c.nome_usur2.replace(' - OFF TRADE',''))}</span>` : ''}</td>
    </tr>`).join('');
}

function abrirDetalhe(estado, codcli) {
  if (_modoTravado) {
    // Vindo do link fixo por vendedor — abre o Raio X Clientes travado no
    // estado (raiox.html lê ?estado= e repassa pro iframe, que esconde o
    // select de Estado); pra ver outro estado/RCA volta nesta página em vez
    // de mexer no filtro lá.
    location.href = `raiox.html?estado=${encodeURIComponent(estado)}#clientes`;
    return;
  }
  // raiox_cliente_detalhe_data.js só cobre RJ/ES (CRC), SP (SPON) e MG (MGON)
  // — clientes vindos de thekings/CASTAS/GARRIDO (sem equivalente no Raio X)
  // podem não ser encontrados lá; ainda assim navega, a página trata graciosamente.
  location.href = `raiox_cliente_detalhe.html?chave=${encodeURIComponent(estado + '-' + codcli)}`;
}

function _esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function _fmtCnpj(v) {
  const d = String(v || '').replace(/\D/g,'');
  if (d.length === 14) return d.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/,'$1.$2.$3/$4-$5');
  return v || '';
}

function exportarCSV() {
  const lista = _filtrados();
  const header = ['Codigo','CNPJ','Razao Social','Fantasia','Ramo','Rede','Bairro','Cidade','UF','Key Account','Cod RCA1','RCA1','Cod RCA2','RCA2'];
  const linhas = lista.map(c => [
    c.codcli,
    c.cnpj,
    c.razao,
    c.fantasia,
    c.ramo,
    c.rede,
    c.bairro,
    c.cidade,
    c.estado,
    c.key_account ? 'Sim' : 'Não',
    c.codusur1,
    c.nome_usur1.replace(' - OFF TRADE',''),
    c.codusur2,
    c.nome_usur2.replace(' - OFF TRADE',''),
  ].map(v => `"${String(v||'').replace(/"/g,'""')}"`).join(';'));

  const csv = '﻿' + [header.join(';'), ...linhas].join('\r\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  const rca  = document.getElementById('sel-rca');
  const nome = rca.value ? rca.options[rca.selectedIndex].text.replace(/[^a-zA-Z0-9]/g,'_') : 'todos';
  a.href = url;
  a.download = `clientes_rca_${nome}_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}
</script>
</body>
</html>
