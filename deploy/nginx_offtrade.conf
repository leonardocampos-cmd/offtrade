# Config real de /etc/nginx/sites-available/offtrade na VPS (147.79.107.137),
# com o location / trocado para servir estático primeiro e só cair no Streamlit
# (via named location @streamlit) quando o arquivo não existir. Assim /metas
# resolve pra metas.html, e /Credito_e_Cadastro, /Admin_Objetivos, /_stcore/*,
# /static/*, o websocket etc. continuam indo pro Streamlit sem precisar listar
# cada prefixo manualmente.

server {
    listen 80;
    server_name offtrade.duckdns.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name offtrade.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/offtrade.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/offtrade.duckdns.org/privkey.pem;

    root /opt/offtrade-static;

    # Arquivos de dados do dashboard (gerados pelo pipeline a cada poucos
    # minutos) nunca podem ficar em cache do navegador, senão a página mostra
    # "atualizado" mas com dados antigos/sumidos.
    location ~* _data\.js$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location / {
        try_files $uri $uri.html $uri/ @streamlit;
    }

    location @streamlit {
        proxy_pass         http://127.0.0.1:8501;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}
