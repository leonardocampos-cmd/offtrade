<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Raio X de Clientes — OfftradeHub</title>
  <script src="auth.js"></script>
  <script src="raiox_clientes_data.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f1117; --card: #1a1d27; --accent: #f5c518;
      --text: #e2e8f0; --muted: #94a3b8; --border: #2d3144;
      --green: #22c55e; --yellow: #f59e0b; --red: #ef4444;
    }
    body {
      background: var(--bg); color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh; padding: 0 0 48px;
    }
    header {
      background: var(--card); border-bottom: 1px solid var(--border);
      padding: 16px 24px; display: flex; align-items: center; gap: 16px;
      flex-wrap: wrap;
    }
    .logo { font-size: 1.05rem; font-weight: 800; color: var(--accent); }
    .nav { display: flex; gap: 8px; margin-left: auto; flex-wrap: wrap; }
    .nav a {
      color: var(--muted); text-decoration: none; font-size: .82rem;
      padding: 6px 12px; border-radius: 7px; border: 1px solid var(--border);
      transition: all .15s;
    }
    .nav a:hover, .nav a.ativo { border-color: var(--accent); color: var(--accent); }
    .container { max-width: 1100px; margin: 0 auto; padding: 24px 20px; }
    .titulo { font-size: 1.3rem; font-weight: 800; margin-bottom: 4px; }
    .atualizacao { font-size: .78rem; color: var(--muted); margin-bottom: 24px; }
    .grid-canais {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 16px;
    }
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 14px; padding: 20px;
    }
    .card-ramo { font-size: 1.05rem; font-weight: 700; margin-bottom: 14px; }
    .kpi-row { display: flex; gap: 18px; flex-wrap: wrap; margin-bottom: 14px; }
    .kpi { min-width: 100px; }
    .kpi-label { font-size: .68rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 4px; }
    .kpi-valor { font-size: 1.25rem; font-weight: 800; }
    .cobertura-bar-bg { height: 6px; background: #2d3144; border-radius: 3px; overflow: hidden; margin-top: 6px; }
    .cobertura-bar-fill { height: 100%; border-radius: 3px; }
    .secao-mini { font-size: .68rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin: 14px 0 8px; }
    .cidades-list { display: flex; flex-direction: column; gap: 4px; }
    .cidade-nome { color: var(--text); }
    .cidade-item { display: flex; justify-content: space-between; font-size: .82rem; }
    .cidade-qtd { color: var(--muted); font-weight: 600; }
    .meses-mini { display: flex; gap: 3px; align-items: flex-end; height: 36px; margin-top: 6px; }
    .mes-bar { flex: 1; background: var(--accent); border-radius: 2px 2px 0 0; opacity: .75; min-height: 2px; }
    .resumo-total {
      background: var(--card); border: 1px solid var(--border); border-radius: 14px;
      padding: 18px 20px; margin-bottom: 20px; display: flex; gap: 32px; flex-wrap: wrap;
      align-items: center;
    }
    .filtros-wrap { margin-left: auto; display: flex; gap: 14px; flex-wrap: wrap; }
    .filtro-vendedor { display: flex; flex-direction: column; gap: 5px; }
    .filtro-vendedor label { font-size: .68rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
    .filtro-vendedor select {
      padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--bg); color: var(--text); font-size: .85rem; outline: none;
      min-width: 180px;
    }
    .filtro-vendedor select:focus { border-color: var(--accent); }
    .sem-clientes { color: var(--muted); font-size: .85rem; text-align: center; padding: 24px; grid-column: 1/-1; }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .card-header .card-ramo { margin-bottom: 0; }
    .btn-ver {
      font-size: .74rem; color: var(--accent); text-decoration: none; white-space: nowrap;
      border: 1px solid var(--border); border-radius: 7px; padding: 5px 10px; transition: all .15s;
    }
    .btn-ver:hover { border-color: var(--accent); background: rgba(245,197,24,.08); }
  </style>
</head>
<body>
  <script>if (new URLSearchParams(location.search).get('embed')) document.write('<style>header{display:none!important}</style>');</script>
  <header>
    <div class="logo">OfftradeHub</div>
    <div class="nav">
      <a href="raiox.html" target="_top">← Raio X</a>
      <a href="index.html" target="_top">← Painel</a>
    </div>
  </header>

  <div class="container">
    <div class="titulo">Raio X de Clientes — RJ</div>
    <div class="atualizacao" id="atualizacao">Carregando…</div>

    <div class="resumo-total" id="resumo-total"></div>

    <div class="grid-canais" id="grid-canais"></div>
  </div>

  <script>
    const brl = v => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL', maximumFractionDigits: 0 }).format(v);
    const cobCor = p => p >= 40 ? 'var(--green)' : p >= 20 ? 'var(--yellow)' : 'var(--red)';

    const data = RAIOX_CLIENTES_DATA;
    document.getElementById('atualizacao').textContent =
      `Atualizado em ${data.atualizado_em} · mês de referência: ${data.mes_atual}`;

    // ?estado=UF (vindo de raiox.html, repassado do link "Novos Clientes" em
    // clientes_rca.html) — trava o filtro de Estado nessa aba embutida, pra
    // quem quiser outro estado voltar em clientes_rca.html em vez de mexer aqui.
    const _estadoTravado = new URLSearchParams(location.search).get('estado') || '';
    let filtroEstado = _estadoTravado, filtroGerente = '', filtroSupervisor = '', filtroVendedor = '';

    function vendedoresFiltrados(estado, gerente, supervisor) {
      return (data.vendedores || []).filter(v =>
        (!estado || v.estado === estado) &&
        (!gerente || v.gerente === gerente) &&
        (!supervisor || v.supervisor === supervisor)
      );
    }

    function chavesAtivas() {
      let lista = vendedoresFiltrados(filtroEstado, filtroGerente, filtroSupervisor);
      if (filtroVendedor) lista = lista.filter(v => v.chave === filtroVendedor);
      return lista.map(v => v.chave);
    }

    function semFiltroAlgum() {
      return !filtroEstado && !filtroGerente && !filtroSupervisor && !filtroVendedor;
    }

    function metricasMescladas(canal, chaves) {
      const objs = chaves.map(ch => canal.por_vendedor && canal.por_vendedor[ch]).filter(Boolean);
      if (!objs.length) return null;
      const total_clientes = objs.reduce((s, o) => s + o.total_clientes, 0);
      const clientes_ativos_mes = objs.reduce((s, o) => s + o.clientes_ativos_mes, 0);
      const faturamento_ytd = objs.reduce((s, o) => s + o.faturamento_ytd, 0);
      const cobertura_pct = total_clientes ? Math.round(clientes_ativos_mes / total_clientes * 1000) / 10 : 0;
      const por_mes = {};
      objs.forEach(o => Object.entries(o.por_mes || {}).forEach(([k, v]) => { por_mes[k] = (por_mes[k] || 0) + v; }));
      const nMeses = Object.keys(por_mes).length || 1;
      const cidadesMap = {};
      objs.forEach(o => (o.top_cidades || []).forEach(c => { cidadesMap[c.cidade] = (cidadesMap[c.cidade] || 0) + c.clientes; }));
      const top_cidades = Object.entries(cidadesMap).sort((a, b) => b[1] - a[1]).slice(0, 10).map(([cidade, clientes]) => ({ cidade, clientes }));
      return {
        total_clientes, clientes_ativos_mes, cobertura_pct,
        faturamento_ytd: Math.round(faturamento_ytd * 100) / 100,
        media_mensal: Math.round(faturamento_ytd / nMeses * 100) / 100,
        por_mes, top_cidades,
      };
    }

    function metricasCanal(c, chaves, semFiltro) {
      if (semFiltro) return c;
      return metricasMescladas(c, chaves);
    }

    function render() {
      const chaves = chavesAtivas();
      const semFiltro = semFiltroAlgum();
      const canaisComDado = data.canais
        .map(c => ({ ramo: c.ramo, m: metricasCanal(c, chaves, semFiltro) }))
        .filter(x => x.m);

      const totalClientes = canaisComDado.reduce((s, x) => s + x.m.total_clientes, 0);
      const totalFatYtd = canaisComDado.reduce((s, x) => s + x.m.faturamento_ytd, 0);
      const totalAtivos = canaisComDado.reduce((s, x) => s + x.m.clientes_ativos_mes, 0);

      document.getElementById('resumo-total').innerHTML = `
        <div><div class="kpi-label">Total de clientes (todos os canais)</div><div class="kpi-valor">${totalClientes.toLocaleString('pt-BR')}</div></div>
        <div><div class="kpi-label">Ativos em ${data.mes_atual}</div><div class="kpi-valor">${totalAtivos.toLocaleString('pt-BR')}</div></div>
        <div><div class="kpi-label">Faturamento YTD</div><div class="kpi-valor">${brl(totalFatYtd)}</div></div>
        <div><div class="kpi-label">Canais mapeados</div><div class="kpi-valor">${canaisComDado.length}</div></div>
        <div class="filtros-wrap">
          <div class="filtro-vendedor"><label for="filtro-estado">Estado</label><select id="filtro-estado"></select></div>
          <div class="filtro-vendedor"><label for="filtro-gerente">Gerente</label><select id="filtro-gerente"></select></div>
          <div class="filtro-vendedor"><label for="filtro-supervisor">Supervisor</label><select id="filtro-supervisor"></select></div>
          <div class="filtro-vendedor"><label for="filtro-rca">Vendedor</label><select id="filtro-rca"></select></div>
        </div>
      `;
      montaFiltros();

      const grid = document.getElementById('grid-canais');
      if (!canaisComDado.length) {
        grid.innerHTML = '<div class="sem-clientes">Este filtro não tem clientes em nenhum canal mapeado.</div>';
        return;
      }

      const paramsLink = new URLSearchParams();
      if (filtroEstado) paramsLink.set('estado', filtroEstado);
      if (filtroGerente) paramsLink.set('gerente', filtroGerente);
      if (filtroSupervisor) paramsLink.set('supervisor', filtroSupervisor);
      if (filtroVendedor) paramsLink.set('vendedor', filtroVendedor);

      grid.innerHTML = canaisComDado.map(({ ramo, m }) => {
        const meses = data.meses_com_dado.map(mes => m.por_mes[mes] || 0);
        const maxMes = Math.max(...meses, 1);
        const barrasMes = meses.map(v => `<div class="mes-bar" style="height:${Math.max(v / maxMes * 100, 3)}%" title="${brl(v)}"></div>`).join('');
        const cidades = (m.top_cidades || []).slice(0, 6).map(ci => `
          <div class="cidade-item"><span class="cidade-nome">${ci.cidade}</span><span class="cidade-qtd">${ci.clientes}</span></div>
        `).join('') || '<div class="cidade-item"><span class="cidade-nome">Sem dados de cidade</span></div>';

        return `
          <div class="card">
            <div class="card-header">
              <div class="card-ramo">${ramo}</div>
              <a class="btn-ver" href="raiox_cliente_detalhe.html?ramo=${encodeURIComponent(ramo)}${paramsLink.toString() ? '&' + paramsLink.toString() : ''}&embed=1">Ver clientes →</a>
            </div>
            <div class="kpi-row">
              <div class="kpi">
                <div class="kpi-label">Total na base</div>
                <div class="kpi-valor">${m.total_clientes.toLocaleString('pt-BR')}</div>
              </div>
              <div class="kpi">
                <div class="kpi-label">Cobertura (${data.mes_atual})</div>
                <div class="kpi-valor" style="color:${cobCor(m.cobertura_pct)}">${m.cobertura_pct}%</div>
                <div class="cobertura-bar-bg"><div class="cobertura-bar-fill" style="width:${Math.min(m.cobertura_pct,100)}%;background:${cobCor(m.cobertura_pct)}"></div></div>
              </div>
            </div>
            <div class="kpi-row">
              <div class="kpi">
                <div class="kpi-label">Faturamento YTD</div>
                <div class="kpi-valor">${brl(m.faturamento_ytd)}</div>
              </div>
              <div class="kpi">
                <div class="kpi-label">Média mensal</div>
                <div class="kpi-valor">${brl(m.media_mensal)}</div>
              </div>
            </div>
            <div class="secao-mini">Evolução mensal</div>
            <div class="meses-mini">${barrasMes}</div>
            <div class="secao-mini">Top cidades</div>
            <div class="cidades-list">${cidades}</div>
          </div>
        `;
      }).join('');
    }

    function montaFiltros() {
      const selEstado = document.getElementById('filtro-estado');
      const selGerente = document.getElementById('filtro-gerente');
      const selSupervisor = document.getElementById('filtro-supervisor');
      const selVendedor = document.getElementById('filtro-rca');

      const estados = [...new Set((data.vendedores || []).map(v => v.estado))].sort();
      selEstado.innerHTML = ['<option value="">Todos</option>']
        .concat(estados.map(e => `<option value="${e}">${e}</option>`)).join('');
      selEstado.value = filtroEstado;
      if (_estadoTravado) selEstado.disabled = true;

      const gerentes = [...new Set(vendedoresFiltrados(filtroEstado, '', '').map(v => v.gerente))].sort();
      selGerente.innerHTML = ['<option value="">Todos</option>']
        .concat(gerentes.map(g => `<option value="${g}">${g}</option>`)).join('');
      selGerente.value = filtroGerente;

      const supervisores = [...new Set(vendedoresFiltrados(filtroEstado, filtroGerente, '').map(v => v.supervisor))].sort();
      selSupervisor.innerHTML = ['<option value="">Todos</option>']
        .concat(supervisores.map(s => `<option value="${s}">${s}</option>`)).join('');
      selSupervisor.value = filtroSupervisor;

      const vendedores = vendedoresFiltrados(filtroEstado, filtroGerente, filtroSupervisor)
        .sort((a, b) => a.nome.localeCompare(b.nome));
      selVendedor.innerHTML = ['<option value="">Todos</option>']
        .concat(vendedores.map(v => `<option value="${v.chave}">${v.nome} (${v.estado} · ${v.rca})</option>`)).join('');
      selVendedor.value = filtroVendedor;

      selEstado.addEventListener('change', () => {
        filtroEstado = selEstado.value; filtroGerente = ''; filtroSupervisor = ''; filtroVendedor = '';
        render();
      });
      selGerente.addEventListener('change', () => {
        filtroGerente = selGerente.value; filtroSupervisor = ''; filtroVendedor = '';
        render();
      });
      selSupervisor.addEventListener('change', () => {
        filtroSupervisor = selSupervisor.value; filtroVendedor = '';
        render();
      });
      selVendedor.addEventListener('change', () => {
        filtroVendedor = selVendedor.value;
        render();
      });
    }

    render();
  </script>
</body>
</html>
