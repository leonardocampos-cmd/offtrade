<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <script src="auth.js"></script>
  <script src="fontes_status_data.js"></script>
  <script src="fontes_alert.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campanha Robinson Crusoe</title>
  <script src="crusoe_data.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           #0a0f14;
      --card:         #121a22;
      --card2:        #1a2530;
      --accent:       #2ea7c9;
      --accent-light: #7fd4ea;
      --green:        #4ade80;
      --text:         #e6edf2;
      --muted:        #7f93a1;
      --border:       #223140;
      --teal-grad:    linear-gradient(135deg, #2ea7c9, #1c7a94);
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      padding: 16px;
      max-width: 920px;
      margin: 0 auto;
    }

    /* ── Header ──────────────────────────────────────────────── */
    header {
      text-align: center;
      padding: 28px 20px 22px;
      margin-bottom: 22px;
      border-bottom: 1px solid var(--border);
    }
    .camp-badge {
      display: inline-block;
      background: var(--teal-grad);
      color: #fff;
      font-size: 0.62rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      padding: 3px 12px;
      border-radius: 20px;
      margin-bottom: 12px;
    }
    header h1 {
      font-size: 2rem;
      font-weight: 800;
      color: var(--accent);
      letter-spacing: -0.02em;
      margin-bottom: 4px;
    }
    .camp-sub {
      font-size: 0.78rem;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .camp-periodo {
      display: inline-block;
      background: var(--card2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 5px 16px;
      font-size: 0.85rem;
      color: var(--accent-light);
      font-weight: 600;
      margin-bottom: 18px;
    }
    .camp-premio-box {
      display: inline-block;
      background: var(--card2);
      border: 1px solid #2ea7c944;
      border-radius: 10px;
      padding: 10px 28px;
      text-align: center;
    }
    .camp-premio-label {
      font-size: 0.63rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .camp-premio-val {
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--accent);
    }

    /* ── Criterios ────────────────────────────────────────────── */
    .criterios {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 16px;
    }
    .criterio-chip {
      background: var(--card2);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 5px 14px;
      font-size: 0.68rem;
      color: var(--muted);
    }
    .criterio-chip strong { color: var(--accent-light); }

    /* ── Ranking ──────────────────────────────────────────────── */
    .rank-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 20px;
    }
    .rank-header {
      padding: 13px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card2);
    }
    .rank-title {
      font-size: 0.88rem;
      font-weight: 700;
    }
    .rank-prize-label {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--accent);
    }
    .rank-list { padding: 4px 0; }

    .vend-row {
      padding: 16px;
      border-bottom: 1px solid rgba(34,49,64,0.6);
    }
    .vend-row:last-child { border-bottom: none; }
    .vend-row.primeiro {
      background: linear-gradient(90deg, #0e2a33, #121a22);
      border-left: 3px solid var(--accent);
    }
    .vend-top {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    .vend-pos {
      font-size: 1.1rem;
      width: 26px;
      text-align: center;
      flex-shrink: 0;
    }
    .vend-nome {
      flex: 1;
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text);
    }
    .vend-pontos-box { text-align: right; flex-shrink: 0; }
    .vend-pontos {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--accent-light);
    }
    .vend-pontos-label {
      font-size: 0.6rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .vend-prize-tag {
      display: inline-block;
      background: var(--teal-grad);
      color: #fff;
      font-size: 0.6rem;
      font-weight: 800;
      padding: 1px 8px;
      border-radius: 4px;
      margin-top: 3px;
    }

    .vend-breakdown {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .bd-item {
      background: var(--card2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 6px;
      text-align: center;
    }
    .bd-label {
      font-size: 0.58rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin-bottom: 3px;
    }
    .bd-val {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text);
    }
    .bd-pts {
      font-size: 0.6rem;
      color: var(--accent);
      font-weight: 600;
      margin-top: 2px;
    }
    .bd-item.nd .bd-val { color: var(--muted); }

    .vend-faturamento {
      margin-top: 10px;
      font-size: 0.75rem;
      color: var(--muted);
      text-align: right;
    }
    .vend-faturamento strong { color: var(--accent-light); }

    .rank-empty {
      padding: 40px 16px;
      text-align: center;
      color: var(--muted);
      font-size: 0.85rem;
      line-height: 1.6;
    }

    /* ── Footer ──────────────────────────────────────────────── */
    .nav-back { display:inline-flex; align-items:center; gap:6px; color:var(--muted); font-size:0.8rem; text-decoration:none; margin-bottom:20px; transition:color .15s; }
    .nav-back:hover { color:var(--accent-light); }

    footer {
      text-align: center;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.72rem;
      line-height: 1.8;
    }
    footer strong { color: var(--text); }

    @media (max-width: 620px) {
      header h1 { font-size: 1.5rem; }
      .vend-breakdown { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>

  <a class="nav-back" href="index.html">&#8592; Home</a>

  <header>
    <div class="camp-badge">Campanha Ativa</div>
    <h1>Campanha Robinson Crusoe</h1>
    <p class="camp-sub">Key Account — Clientes RJ</p>
    <div class="camp-periodo" id="periodo"></div>
    <div class="camp-premio-box">
      <div class="camp-premio-label">Prêmio (maior pontuação)</div>
      <div class="camp-premio-val" id="premio-val"></div>
    </div>
    <div class="criterios">
      <span class="criterio-chip"><strong>+1 pt</strong> por pedido</span>
      <span class="criterio-chip"><strong>+5 pts</strong> novo SKU (60d)</span>
      <span class="criterio-chip"><strong>+5 pts</strong> reativação (60d)</span>
      <span class="criterio-chip"><strong>+5 pts</strong> meta batida</span>
    </div>
  </header>

  <div class="rank-card">
    <div class="rank-header">
      <span class="rank-title">Ranking</span>
      <span class="rank-prize-label" id="rank-prize-label"></span>
    </div>
    <div class="rank-list" id="rank-list"></div>
  </div>

  <footer>
    Atualizado em <strong id="atualizado"></strong>
    &bull; Empate: maior faturamento leva; empate no faturamento, ambos levam
    &bull; Refresh em <strong><span id="countdown">5:00</span></strong>
  </footer>

  <script>
    const D = CRUSOE_DATA;
    const MEDALS = ['🥇', '🥈', '🥉'];

    document.getElementById('atualizado').textContent = D.atualizado_em;
    document.getElementById('periodo').textContent = `${D.periodo.ini} a ${D.periodo.fim}`;

    function fmtMoeda(v) {
      return v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    }

    document.getElementById('premio-val').textContent = fmtMoeda(D.premio);
    document.getElementById('rank-prize-label').textContent = `🥇 ${fmtMoeda(D.premio)}`;

    function buildRanking() {
      const el = document.getElementById('rank-list');
      const rows = D.vendedores || [];
      if (!rows.length) {
        el.innerHTML = '<div class="rank-empty">Sem dados da campanha ainda.<br>A campanha comeca em 01/07/2026.</div>';
        return;
      }

      // Determina quem leva o premio: maior pontos_total; empate quebrado por
      // faturamento; se tambem empatado no faturamento, ambos levam.
      const maxPontos = Math.max(...rows.map(r => r.pontos_total));
      const empatadosPontos = rows.filter(r => r.pontos_total === maxPontos);
      const maxFat = Math.max(...empatadosPontos.map(r => r.faturamento));
      const vencedores = new Set(
        empatadosPontos.filter(r => r.faturamento === maxFat).map(r => r.rca)
      );

      el.innerHTML = rows.map((r, i) => {
        const pos = i < 3 ? MEDALS[i] : (i + 1);
        const ganhou = vencedores.has(r.rca);
        const rowCls = ganhou ? ' primeiro' : '';
        const metaVal = r.meta_definida
          ? (r.meta_atingida ? '✅ Batida' : `${fmtMoeda(r.faturamento)} / ${fmtMoeda(r.meta_valor)}`)
          : 'N/D';
        return `
          <div class="vend-row${rowCls}">
            <div class="vend-top">
              <span class="vend-pos">${pos}</span>
              <span class="vend-nome">${r.vendedor}</span>
              <div class="vend-pontos-box">
                <div class="vend-pontos">${r.pontos_total} pts</div>
                <div class="vend-pontos-label">pontuação</div>
                ${ganhou ? '<div class="vend-prize-tag">🏆 Prêmio</div>' : ''}
              </div>
            </div>
            <div class="vend-breakdown">
              <div class="bd-item">
                <div class="bd-label">Pedidos</div>
                <div class="bd-val">${r.pedidos}</div>
                <div class="bd-pts">+${r.pontos_pedidos} pts</div>
              </div>
              <div class="bd-item">
                <div class="bd-label">Novos SKUs</div>
                <div class="bd-val">${r.novos_skus}</div>
                <div class="bd-pts">+${r.pontos_novos_skus} pts</div>
              </div>
              <div class="bd-item">
                <div class="bd-label">Reativações</div>
                <div class="bd-val">${r.reativacoes}</div>
                <div class="bd-pts">+${r.pontos_reativacoes} pts</div>
              </div>
              <div class="bd-item${r.meta_definida ? '' : ' nd'}">
                <div class="bd-label">Meta</div>
                <div class="bd-val" style="font-size:0.72rem">${metaVal}</div>
                <div class="bd-pts">+${r.pontos_meta} pts</div>
              </div>
            </div>
            <div class="vend-faturamento">Faturamento: <strong>${fmtMoeda(r.faturamento)}</strong></div>
          </div>`;
      }).join('');
    }

    buildRanking();

    // ── Countdown auto-refresh (5 min) ────────────────────────
    let secs = 300;
    setInterval(() => {
      secs--;
      if (secs <= 0) { location.reload(); return; }
      const m = Math.floor(secs / 60);
      const s = String(secs % 60).padStart(2, '0');
      document.getElementById('countdown').textContent = `${m}:${s}`;
    }, 1000);
  </script>
</body>
</html>
