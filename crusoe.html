<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <script src="auth.js"></script>
  <script src="fontes_status_data.js"></script>
  <script src="fontes_alert.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campanha Robinson Crusoe</title>
  <script src="crusoe_data.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           #0a0f14;
      --card:         #121a22;
      --card2:        #1a2530;
      --accent:       #2ea7c9;
      --accent-light: #7fd4ea;
      --green:        #4ade80;
      --text:         #e6edf2;
      --muted:        #7f93a1;
      --border:       #223140;
      --teal-grad:    linear-gradient(135deg, #2ea7c9, #1c7a94);
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      padding: 16px;
      max-width: 920px;
      margin: 0 auto;
    }

    /* ── Header ──────────────────────────────────────────────── */
    header {
      text-align: center;
      padding: 28px 20px 22px;
      margin-bottom: 22px;
      border-bottom: 1px solid var(--border);
    }
    .camp-badge {
      display: inline-block;
      background: var(--teal-grad);
      color: #fff;
      font-size: 0.62rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      padding: 3px 12px;
      border-radius: 20px;
      margin-bottom: 12px;
    }
    header h1 {
      font-size: 2rem;
      font-weight: 800;
      color: var(--accent);
      letter-spacing: -0.02em;
      margin-bottom: 4px;
    }
    .camp-sub {
      font-size: 0.78rem;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .camp-periodo {
      display: inline-block;
      background: var(--card2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 5px 16px;
      font-size: 0.85rem;
      color: var(--accent-light);
      font-weight: 600;
    }

    /* ── Time (secao) ─────────────────────────────────────────── */
    .time-block { margin-bottom: 32px; }
    .time-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 10px;
      padding: 0 2px;
    }
    .time-nome {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--text);
    }
    .time-premio {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--accent);
    }

    /* ── Criterios ────────────────────────────────────────────── */
    .criterios {
      display: flex;
      justify-content: flex-start;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }
    .criterio-chip {
      background: var(--card2);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 5px 14px;
      font-size: 0.68rem;
      color: var(--muted);
    }
    .criterio-chip strong { color: var(--accent-light); }

    /* ── Ranking ──────────────────────────────────────────────── */
    .rank-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }
    .rank-header {
      padding: 13px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card2);
    }
    .rank-title {
      font-size: 0.88rem;
      font-weight: 700;
    }
    .rank-prize-label {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--accent);
    }
    .rank-list { padding: 4px 0; }

    .vend-row {
      padding: 16px;
      border-bottom: 1px solid rgba(34,49,64,0.6);
    }
    .vend-row:last-child { border-bottom: none; }
    .vend-row.primeiro {
      background: linear-gradient(90deg, #0e2a33, #121a22);
      border-left: 3px solid var(--accent);
    }
    .vend-top {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    .vend-pos {
      font-size: 1.1rem;
      width: 26px;
      text-align: center;
      flex-shrink: 0;
    }
    .vend-nome {
      flex: 1;
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text);
    }
    .vend-pontos-box { text-align: right; flex-shrink: 0; }
    .vend-pontos {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--accent-light);
    }
    .vend-pontos-label {
      font-size: 0.6rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .vend-prize-tag {
      display: inline-block;
      background: var(--teal-grad);
      color: #fff;
      font-size: 0.6rem;
      font-weight: 800;
      padding: 1px 8px;
      border-radius: 4px;
      margin-top: 3px;
    }

    .vend-breakdown {
      display: grid;
      gap: 8px;
    }
    .bd-item {
      background: var(--card2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 6px;
      text-align: center;
    }
    .bd-label {
      font-size: 0.58rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin-bottom: 3px;
    }
    .bd-val {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text);
    }
    .bd-pts {
      font-size: 0.6rem;
      color: var(--accent);
      font-weight: 600;
      margin-top: 2px;
    }
    .bd-item.nd .bd-val { color: var(--muted); }

    .vend-faturamento {
      margin-top: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      color: var(--muted);
    }
    .vend-faturamento strong { color: var(--accent-light); }

    .vend-toggle {
      background: none;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--accent-light);
      font-size: 0.68rem;
      font-weight: 600;
      padding: 3px 10px;
      cursor: pointer;
    }
    .vend-toggle:hover { border-color: var(--accent); }

    .vendas-detail {
      margin-top: 10px;
      overflow-x: auto;
    }
    .vendas-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.72rem;
    }
    .vendas-table th {
      text-align: left;
      color: var(--muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      font-size: 0.6rem;
      padding: 6px 8px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    .vendas-table td {
      padding: 6px 8px;
      border-bottom: 1px solid rgba(34,49,64,0.5);
      vertical-align: top;
    }
    .vendas-table td:nth-child(4),
    .vendas-table td:nth-child(5) { white-space: nowrap; text-align: right; }
    .pts-badge {
      display: inline-block;
      background: var(--card2);
      border: 1px solid #2ea7c944;
      color: var(--accent);
      font-size: 0.6rem;
      font-weight: 600;
      padding: 1px 6px;
      border-radius: 4px;
      margin: 1px 3px 1px 0;
      white-space: nowrap;
    }
    .vendas-empty {
      padding: 12px;
      text-align: center;
      color: var(--muted);
      font-size: 0.75rem;
    }

    .rank-empty {
      padding: 40px 16px;
      text-align: center;
      color: var(--muted);
      font-size: 0.85rem;
      line-height: 1.6;
    }

    /* ── Footer ──────────────────────────────────────────────── */
    .nav-back { display:inline-flex; align-items:center; gap:6px; color:var(--muted); font-size:0.8rem; text-decoration:none; margin-bottom:20px; transition:color .15s; }
    .nav-back:hover { color:var(--accent-light); }

    footer {
      text-align: center;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.72rem;
      line-height: 1.8;
    }
    footer strong { color: var(--text); }

    @media (max-width: 620px) {
      header h1 { font-size: 1.5rem; }
    }
  </style>
</head>
<body>

  <a class="nav-back" href="index.html">&#8592; Home</a>

  <header>
    <div class="camp-badge">Campanha Ativa</div>
    <h1>Campanha Robinson Crusoe</h1>
    <p class="camp-sub">Key Account &middot; Atacarejo &middot; Convenience &mdash; Clientes RJ</p>
    <div class="camp-periodo" id="periodo"></div>
  </header>

  <div id="times-container"></div>

  <footer>
    Atualizado em <strong id="atualizado"></strong>
    &bull; Empate: maior faturamento leva; empate no faturamento, ambos levam
    &bull; Refresh em <strong><span id="countdown">5:00</span></strong>
  </footer>

  <script>
    const D = CRUSOE_DATA;
    const MEDALS = ['🥇', '🥈', '🥉'];

    document.getElementById('atualizado').textContent = D.atualizado_em;
    document.getElementById('periodo').textContent = `${D.periodo.ini} a ${D.periodo.fim}`;

    function fmtMoeda(v) {
      return v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    }

    // Cada time tem seus próprios campos de breakdown, já que os critérios
    // de pontuação (ver campanha_crusoe.py) não são iguais entre times.
    const BREAKDOWN_CONFIG = {
      KEY_ACCOUNT: [
        { label: 'Pedidos', val: r => r.pedidos, pts: r => r.pontos_pedidos },
        { label: 'Novos SKUs', val: r => r.novos_skus, pts: r => r.pontos_novos_skus },
        { label: 'Reativações', val: r => r.reativacoes, pts: r => r.pontos_reativacoes },
        {
          label: 'Objetivo', pts: r => r.pontos_meta, nd: r => !r.meta_definida,
          val: r => r.meta_definida
            ? (r.meta_atingida ? '✅ Batida' : `${fmtMoeda(r.faturamento)} / ${fmtMoeda(r.meta_valor)}`)
            : 'N/D',
        },
      ],
      ATACAREJO: [
        { label: 'Positivações', val: r => r.positivacoes, pts: r => r.pontos_positivacao },
        { label: 'Novos SKUs', val: r => r.novos_skus, pts: r => r.pontos_novos_skus },
        { label: 'Pedidos (valor)', val: r => r.pedidos, pts: r => r.pontos_pedidos_valor },
      ],
      CONVENIENCE: [
        { label: 'Clientes Gourmet', val: r => r.clientes_gourmet, pts: r => r.pontos_total },
      ],
    };

    function pontosBadges(lista) {
      return (lista || []).map(p => `<span class="pts-badge">${p.tipo} +${p.pontos}</span>`).join('') || '—';
    }

    function buildVendasTable(vendedor, timeId) {
      const vendas = vendedor.vendas || [];
      if (!vendas.length) {
        return '<div class="vendas-empty">Sem vendas no período.</div>';
      }

      let bodyHtml = '';
      if (timeId === 'CONVENIENCE') {
        bodyHtml = vendas.map(v => `
          <tr>
            <td>${v.data}</td>
            <td>${v.cliente}</td>
            <td>${v.produto}</td>
            <td>${v.qt}</td>
            <td>${fmtMoeda(v.valor)}</td>
            <td>${pontosBadges(v.pontuacoes)}</td>
          </tr>`).join('');
      } else {
        bodyHtml = vendas.map(pedido => pedido.itens.map((item, idx) => {
          const badges = [];
          if (idx === 0) {
            (pedido.eventos || []).forEach(e => badges.push({ tipo: e.tipo, pontos: e.pontos }));
          }
          (item.pontuacoes || []).forEach(p => badges.push(p));
          return `
            <tr>
              <td>${idx === 0 ? pedido.data : ''}</td>
              <td>${idx === 0 ? pedido.cliente : ''}</td>
              <td>${item.produto}</td>
              <td>${item.qt}</td>
              <td>${fmtMoeda(item.valor)}</td>
              <td>${pontosBadges(badges)}</td>
            </tr>`;
        }).join('')).join('');
      }

      return `
        <table class="vendas-table">
          <thead><tr><th>Data</th><th>Cliente</th><th>Produto</th><th>Qt</th><th>Valor</th><th>Pontuação</th></tr></thead>
          <tbody>${bodyHtml}</tbody>
        </table>`;
    }

    function buildVendRow(r, pos, ganhou, breakdown, timeId) {
      const rowCls = ganhou ? ' primeiro' : '';
      const bdHtml = breakdown.map(cfg => `
        <div class="bd-item${cfg.nd && cfg.nd(r) ? ' nd' : ''}">
          <div class="bd-label">${cfg.label}</div>
          <div class="bd-val" style="font-size:0.82rem">${cfg.val(r)}</div>
          <div class="bd-pts">+${cfg.pts(r)} pts</div>
        </div>`).join('');
      const detailId = `vendas-${timeId}-${r.rca}`;
      return `
        <div class="vend-row${rowCls}">
          <div class="vend-top">
            <span class="vend-pos">${pos}</span>
            <span class="vend-nome">${r.vendedor}</span>
            <div class="vend-pontos-box">
              <div class="vend-pontos">${r.pontos_total} pts</div>
              <div class="vend-pontos-label">pontuação</div>
              ${ganhou ? '<div class="vend-prize-tag">🏆 Prêmio</div>' : ''}
            </div>
          </div>
          <div class="vend-breakdown" style="grid-template-columns: repeat(${breakdown.length}, 1fr)">${bdHtml}</div>
          <div class="vend-faturamento">
            <button class="vend-toggle" onclick="const el=document.getElementById('${detailId}'); const oculto = el.style.display==='none'; el.style.display = oculto ? 'block' : 'none'; this.textContent = oculto ? 'Ocultar vendas ▲' : 'Ver vendas ▼';">Ver vendas ▼</button>
            <span>Faturamento: <strong>${fmtMoeda(r.faturamento)}</strong></span>
          </div>
          <div class="vendas-detail" id="${detailId}" style="display:none">${buildVendasTable(r, timeId)}</div>
        </div>`;
    }

    function buildTimeBlock(time) {
      const rows = time.vendedores || [];
      const breakdown = BREAKDOWN_CONFIG[time.id] || [];
      const criteriosHtml = (time.criterios || [])
        .map(c => `<span class="criterio-chip"><strong>${c.valor}</strong> ${c.label}</span>`)
        .join('');

      let listHtml;
      if (!rows.length) {
        listHtml = '<div class="rank-empty">Sem dados da campanha ainda.<br>A campanha comeca em 01/07/2026.</div>';
      } else {
        // Determina quem leva o premio do time: maior pontos_total; empate
        // quebrado por faturamento; se tambem empatado no faturamento, ambos levam.
        const maxPontos = Math.max(...rows.map(r => r.pontos_total));
        const empatadosPontos = rows.filter(r => r.pontos_total === maxPontos);
        const maxFat = Math.max(...empatadosPontos.map(r => r.faturamento));
        const vencedores = new Set(
          empatadosPontos.filter(r => r.faturamento === maxFat).map(r => r.rca)
        );
        listHtml = rows.map((r, i) => {
          const pos = i < 3 ? MEDALS[i] : (i + 1);
          return buildVendRow(r, pos, vencedores.has(r.rca), breakdown, time.id);
        }).join('');
      }

      return `
        <div class="time-block">
          <div class="time-header">
            <span class="time-nome">${time.nome}</span>
            <span class="time-premio">🏆 ${fmtMoeda(time.premio)}</span>
          </div>
          <div class="criterios">${criteriosHtml}</div>
          <div class="rank-card">
            <div class="rank-header">
              <span class="rank-title">Ranking</span>
              <span class="rank-prize-label">🥇 ${fmtMoeda(time.premio)}</span>
            </div>
            <div class="rank-list">${listHtml}</div>
          </div>
        </div>`;
    }

    document.getElementById('times-container').innerHTML =
      (D.times || []).map(buildTimeBlock).join('');

    // ── Countdown auto-refresh (5 min) ────────────────────────
    let secs = 300;
    setInterval(() => {
      secs--;
      if (secs <= 0) { location.reload(); return; }
      const m = Math.floor(secs / 60);
      const s = String(secs % 60).padStart(2, '0');
      document.getElementById('countdown').textContent = `${m}:${s}`;
    }, 1000);
  </script>
</body>
</html>
