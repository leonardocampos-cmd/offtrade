<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <script src="auth.js"></script>
  <script src="fontes_status_data.js"></script>
  <script src="fontes_alert.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entregas OFF TRADE</title>
  <script src="entregas_data.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:     #0f1117;
      --card:   #1a1d27;
      --card2:  #22263a;
      --accent: #f5c518;
      --green:  #22c55e;
      --yellow: #eab308;
      --orange: #f97316;
      --red:    #ef4444;
      --blue:   #60a5fa;
      --text:   #e2e8f0;
      --muted:  #94a3b8;
      --border: #2d3144;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      padding: 16px;
      max-width: 780px;
      margin: 0 auto;
    }

    header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
      gap: 12px;
      flex-wrap: wrap;
    }

    .header-title h1 {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: -0.02em;
    }

    .header-title p {
      font-size: 0.72rem;
      color: var(--muted);
      margin-top: 4px;
    }

    .header-title .vendedor-nome {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text);
      margin-top: 5px;
    }

    select {
      background: var(--card2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 0.82rem;
      cursor: pointer;
      min-width: 200px;
      max-width: 300px;
    }
    select:focus { outline: none; border-color: var(--accent); }

    /* ── Summary ── */
    .summary {
      display: flex;
      gap: 10px;
      margin-bottom: 18px;
    }

    .badge {
      flex: 1;
      padding: 12px 14px;
      border-radius: 10px;
      background: var(--card);
      border: 1px solid var(--border);
    }

    .badge .cnt  { font-size: 1.7rem; font-weight: 800; display: block; line-height: 1; }
    .badge .lbl  { font-size: 0.68rem; color: var(--muted); margin-top: 4px; display: block; text-transform: uppercase; letter-spacing: 0.05em; }
    .badge .val  { font-size: 0.78rem; font-weight: 600; margin-top: 3px; display: block; }
    .badge .sub  { font-size: 0.68rem; color: var(--muted); margin-top: 1px; display: block; }

    .badge-rota      { border-color: #14532d; }
    .badge-rota      .cnt, .badge-rota      .val { color: var(--green); }
    .badge-entregue  { border-color: #166534; }
    .badge-entregue  .cnt, .badge-entregue  .val { color: #4ade80; }
    .badge-noemit    { border-color: #713f12; }
    .badge-noemit    .cnt, .badge-noemit    .val { color: var(--yellow); }
    .badge-semrota   { border-color: #1e3a5f; }
    .badge-semrota   .cnt, .badge-semrota   .val { color: var(--blue); }
    .badge-naoentreg { border-color: #7f1d1d; }
    .badge-naoentreg .cnt, .badge-naoentreg .val { color: var(--red); }
    .badge-canc      { border-color: #3f3f46; }
    .badge-canc      .cnt, .badge-canc      .val { color: var(--muted); }

    .tag-naoentreg { background: #450a0a; color: #fca5a5; border: 1px solid #7f1d1d; }
    .tag-vend      { background: #1e2a3a; color: #93c5fd; border: 1px solid #1e3a5f; font-weight: 600; }

    /* ── Tabs ── */
    .tabs {
      display: flex;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    .tab-btn {
      padding: 8px 20px;
      border: none;
      background: none;
      color: var(--muted);
      font-size: 0.85rem;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      font-weight: 600;
      transition: all 0.15s;
    }
    .tab-btn.active             { color: var(--accent); border-bottom-color: var(--accent); }
    .tab-btn:hover:not(.active) { color: var(--text); }

    .section         { display: none; }
    .section.visible { display: block; }

    /* ── Cards ── */
    .empty-msg {
      text-align: center;
      color: var(--muted);
      padding: 48px 0;
      font-size: 0.88rem;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 10px;
    }
    .card.cancelado { border-color: #7f1d1d; opacity: .75; }
    .card:last-child { margin-bottom: 0; }

    .card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
    }

    .card-cliente { font-weight: 700; font-size: 0.95rem; line-height: 1.3; }
    .card-total   { font-size: 0.92rem; font-weight: 700; color: var(--accent); white-space: nowrap; }

    .card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      align-items: center;
      margin-bottom: 6px;
    }

    .tag {
      display: inline-block;
      font-size: 0.67rem;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 4px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .tag-rota     { background: #052e16; color: #4ade80;  border: 1px solid #166534; }
    .tag-nf       { background: #172554; color: var(--blue); border: 1px solid #1e40af; }
    .tag-ped      { background: var(--card2); color: var(--muted); border: 1px solid var(--border); }
    .tag-data     { background: var(--card2); color: var(--muted); border: 1px solid var(--border); }
    .tag-cancel   { background: #450a0a; color: #fca5a5; border: 1px solid #7f1d1d; }
    .tag-bloq     { background: #422006; color: #fdba74; border: 1px solid #7c2d12; }
    .tag-entregue { background: #052e16; color: #86efac; border: 1px solid #166534; }
    .tag-devol    { background: #431407; color: #fb923c; border: 1px solid #9a3412; }
    .tag-status   { background: var(--card2); color: var(--muted); border: 1px solid var(--border); }

    .motivo {
      margin-top: 7px;
      font-size: 0.74rem;
      background: #1c1a00;
      border: 1px solid #713f12;
      border-radius: 6px;
      padding: 6px 10px;
      color: var(--orange);
    }
    .motivo strong { color: var(--yellow); }

    .obs {
      margin-top: 7px;
      font-size: 0.74rem;
      color: var(--yellow);
      background: #1c1500;
      border: 1px solid #713f12;
      border-radius: 6px;
      padding: 5px 10px;
    }

    .justificativa-wrap { margin-top: 9px; }
    .justificativa-wrap label {
      font-size: 0.65rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.06em; color: var(--muted); display: block; margin-bottom: 4px;
    }
    .justificativa-input {
      width: 100%; background: var(--card2); border: 1px solid var(--border);
      border-radius: 6px; color: var(--text); font-size: 0.78rem;
      padding: 6px 10px; resize: vertical; min-height: 52px;
      font-family: inherit; outline: none;
    }
    .justificativa-input:focus { border-color: var(--accent); }
    .justificativa-input.saved { border-color: #166534; }

    .itens-toggle {
      margin-top: 8px;
      font-size: 0.72rem;
      color: var(--accent);
      cursor: pointer;
      background: none;
      border: none;
      padding: 0;
      display: block;
      font-family: inherit;
    }
    .itens-toggle:hover { text-decoration: underline; }

    .itens-list {
      margin-top: 8px;
      border-top: 1px solid var(--border);
      padding-top: 8px;
    }

    .item-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.76rem;
      color: var(--muted);
      padding: 4px 0;
      gap: 8px;
    }
    .item-row + .item-row { border-top: 1px solid #1e2233; }
    .item-desc { flex: 1; }
    .item-qt   { white-space: nowrap; color: var(--text); font-weight: 600; }
    .item-val  { white-space: nowrap; color: var(--text); font-weight: 600; }
  </style>
</head>
<body>

<header>
  <div class="header-title">
    <h1>&#x1F69A; Entregas OFF TRADE</h1>
    <p id="header-sub">—</p>
    <div class="vendedor-nome" id="header-vendedor" style="display:none"></div>
  </div>
  <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
    <select id="vendedor-select" onchange="renderVendedor()" style="display:none"></select>
    <a id="btn-voltar-metas" href="#"
       style="display:none;background:#3b82f6;color:#fff;padding:8px 14px;border-radius:8px;font-size:.85rem;font-weight:600;text-decoration:none">
      ← Meus Objetivos
    </a>
    <a href="index.html" style="background:var(--card2,#22263a);border:1px solid var(--border,#2d3144);color:var(--text,#e2e8f0);padding:7px 14px;border-radius:8px;font-size:.8rem;text-decoration:none">&#8962; Home</a>
  </div>
</header>
<script>
(function () {
  const v = new URLSearchParams(location.search).get('v');
  if (v) {
    const btn = document.getElementById('btn-voltar-metas');
    btn.href = 'metas.html?vendedor=' + encodeURIComponent(v);
    btn.style.display = 'inline-block';
  }
})();
</script>

<div class="summary">
  <div class="badge badge-rota">
    <span class="cnt" id="cnt-rota">—</span>
    <span class="lbl">Em Rota hoje</span>
    <span class="val" id="val-rota">—</span>
    <span class="sub" id="sub-rota"></span>
  </div>
  <div class="badge badge-entregue">
    <span class="cnt" id="cnt-entregue">—</span>
    <span class="lbl">Entregues</span>
    <span class="val" id="val-entregue">—</span>
  </div>
  <div class="badge badge-semrota">
    <span class="cnt" id="cnt-semrota">—</span>
    <span class="lbl">Emitido / Sem Rota</span>
    <span class="val" id="val-semrota">—</span>
  </div>
  <div class="badge badge-noemit">
    <span class="cnt" id="cnt-noemit">—</span>
    <span class="lbl">Não Emitido</span>
    <span class="val" id="val-noemit">—</span>
  </div>
  <div class="badge badge-naoentreg">
    <span class="cnt" id="cnt-naoentreg">—</span>
    <span class="lbl">Não Entregue</span>
    <span class="val" id="val-naoentreg">—</span>
  </div>
  <div class="badge badge-canc">
    <span class="cnt" id="cnt-canc">—</span>
    <span class="lbl">Canceladas</span>
    <span class="val" id="val-canc">—</span>
  </div>
</div>

<div class="tabs">
  <button class="tab-btn active" onclick="switchTab('rota',      this)">Em Rota</button>
  <button class="tab-btn"        onclick="switchTab('entregue',  this)">Entregues</button>
  <button class="tab-btn"        onclick="switchTab('semrota',   this)">Emitido / Sem Rota</button>
  <button class="tab-btn"        onclick="switchTab('noemit',    this)">Não Emitido</button>
  <button class="tab-btn" style="color:var(--red)"
          onclick="switchTab('naoentreg', this)">⚠ Não Entregue</button>
  <button class="tab-btn"        onclick="switchTab('canc',      this)">Canceladas</button>
</div>

<div id="sec-rota"      class="section visible"></div>
<div id="sec-entregue"  class="section"></div>
<div id="sec-semrota"   class="section"></div>
<div id="sec-noemit"    class="section"></div>
<div id="sec-naoentreg" class="section"></div>
<div id="sec-canc"      class="section"></div>

<script>
const D = (typeof ENTREGAS_DATA !== 'undefined') ? ENTREGAS_DATA : null;

// ── URL param ?v=NOME ──────────────────────────────────────────────────────────
const _urlV = new URLSearchParams(location.search).get('v');

function fmt(v) {
  return 'R$ ' + v.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function escHtml(s) {
  return String(s||'')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Tags de status ─────────────────────────────────────────────────────────────

function tagStatusPed(s) {
  if (!s) return '';
  const u = s.toUpperCase();
  if (u === 'C' || u.includes('CANCEL')) return `<span class="tag tag-cancel">Cancelado</span>`;
  if (u === 'B' || u.includes('BLOQ'))   return `<span class="tag tag-bloq">Bloqueado</span>`;
  return '';
}

function tagStatusLog(s) {
  if (!s) return '';
  const u = s.toUpperCase();
  if (u.includes('ENTREGUE'))            return `<span class="tag tag-entregue">Entregue</span>`;
  if (u.includes('DEVOL'))               return `<span class="tag tag-devol">Devolvido</span>`;
  if (u.includes('CANCEL'))              return `<span class="tag tag-cancel">Cancelado</span>`;
  return `<span class="tag tag-status">${escHtml(s)}</span>`;
}

// ── Render ─────────────────────────────────────────────────────────────────────

function _tagVendedor(nomeVend) {
  return `<span class="tag tag-vend">${escHtml(nomeVend.replace(/ - OFF TRADE$/i,''))}</span>`;
}

function _flatLista(key) {
  return D.vendedores.flatMap(v =>
    (v[key] || []).map(p => Object.assign({}, p, {_vendedor: v.nome}))
  );
}

function renderVendedor() {
  if (!D) return;
  const nome = _urlV || document.getElementById('vendedor-select').value;

  let emRota, semRota, naoEmitido, naoEntregue, canceladas;

  if (nome === 'Todos') {
    emRota      = _flatLista('em_rota');
    semRota     = _flatLista('emitido_s_rota');
    naoEmitido  = _flatLista('nao_emitido');
    naoEntregue = _flatLista('nao_entregue');
    canceladas  = _flatLista('canceladas');
  } else {
    const v = D.vendedores.find(x => x.nome === nome);
    if (!v) return;
    emRota      = v.em_rota;
    semRota     = v.emitido_s_rota || [];
    naoEmitido  = v.nao_emitido;
    naoEntregue = v.nao_entregue   || [];
    canceladas  = v.canceladas     || [];
  }

  const entregues = emRota.filter(p => (p.status_log || '').toUpperCase().includes('ENTREGUE'));

  const totRota     = emRota.reduce((s,p)=>s+p.total, 0);
  const totEntregue = entregues.reduce((s,p)=>s+p.total, 0);
  const totSemRota  = semRota.reduce((s,p)=>s+p.total, 0);
  const totNoemit   = naoEmitido.reduce((s,p)=>s+p.total, 0);
  const totNaoEntreg= naoEntregue.reduce((s,p)=>s+p.total, 0);
  const totCanc     = canceladas.reduce((s,p)=>s+p.total, 0);

  const cancelados = emRota.filter(p => {
    const u = p.status_ped.toUpperCase();
    return u === 'C' || u.includes('CANCEL');
  }).length;

  document.getElementById('cnt-rota').textContent    = emRota.length;
  document.getElementById('val-rota').textContent    = fmt(totRota);
  document.getElementById('sub-rota').textContent    = cancelados > 0 ? `${cancelados} cancelado(s)` : '';
  document.getElementById('cnt-entregue').textContent = entregues.length;
  document.getElementById('val-entregue').textContent = fmt(totEntregue);
  document.getElementById('cnt-semrota').textContent = semRota.length;
  document.getElementById('val-semrota').textContent = fmt(totSemRota);
  document.getElementById('cnt-noemit').textContent  = naoEmitido.length;
  document.getElementById('val-noemit').textContent  = fmt(totNoemit);
  document.getElementById('cnt-naoentreg').textContent = naoEntregue.length;
  document.getElementById('val-naoentreg').textContent = fmt(totNaoEntreg);
  document.getElementById('cnt-canc').textContent    = canceladas.length;
  document.getElementById('val-canc').textContent    = fmt(totCanc);

  document.getElementById('sec-rota').innerHTML      = renderCards(emRota,      'rota');
  document.getElementById('sec-entregue').innerHTML  = renderCards(entregues,   'entregue');
  document.getElementById('sec-semrota').innerHTML   = renderCards(semRota,     'semrota');
  document.getElementById('sec-noemit').innerHTML    = renderCards(naoEmitido,  'noemit');
  document.getElementById('sec-naoentreg').innerHTML = renderCards(naoEntregue, 'naoentreg');
  document.getElementById('sec-canc').innerHTML      = renderCards(canceladas,  'canc');
}

const _emptyMsg = {
  rota:      'Nenhum pedido em rota hoje.',
  entregue:  'Nenhuma entrega confirmada hoje.',
  semrota:   'Nenhuma NF emitida aguardando rota.',
  noemit:    'Nenhum pedido pendente de emissão.',
  naoentreg: 'Nenhuma entrega não realizada registrada.',
  canc:      'Nenhum pedido cancelado nos últimos 90 dias.',
};

function renderCards(pedidos, prefixo) {
  if (!pedidos.length) {
    return `<div class="empty-msg">${_emptyMsg[prefixo] || '—'}</div>`;
  }

  return pedidos.map((p, i) => {
    const isCancelado = p.status_ped.toUpperCase() === 'C' || p.status_ped.toUpperCase().includes('CANCEL');
    const toggleId = `itens-${prefixo}-${i}`;

    const tagPed   = `<span class="tag tag-ped">Ped.&nbsp;${escHtml(p.numped)}</span>`;
    const tagNf    = p.numnota ? `<span class="tag tag-nf">NF&nbsp;${escHtml(p.numnota)}</span>` : '';
    const tagRota  = p.rota    ? `<span class="tag tag-rota">${escHtml(p.rota)}</span>` : '';
    const tagData  = p.data    ? `<span class="tag tag-data">${escHtml(p.data)}</span>` : '';
    const tagSPed  = tagStatusPed(p.status_ped);
    const tagSLog  = tagStatusLog(p.status_log);
    const tagVend  = p._vendedor ? _tagVendedor(p._vendedor) : '';

    const motivoAlertaHtml = p.motivo_alerta
      ? `<div class="motivo"><strong>⚠ Motivo (alerta):</strong> ${escHtml(p.motivo_alerta)}</div>`
      : '';

    const tagNaoEntreg = p.motivo_alerta !== undefined
      ? `<span class="tag tag-naoentreg">Não Entregue</span>`
      : '';

    const motivoHtml = p.motivo
      ? `<div class="motivo"><strong>Motivo:</strong> ${escHtml(p.motivo)}</div>`
      : '';

    const obsHtml = p.obs
      ? `<div class="obs">Obs: ${escHtml(p.obs)}</div>`
      : '';

    let justHtml = '';
    if (prefixo === 'naoentreg') {
      const jKey = _justKey(p);
      const jVal = escHtml(localStorage.getItem(jKey) || '');
      const saved = !!localStorage.getItem(jKey);
      justHtml = `<div class="justificativa-wrap">
        <label>Justificativa</label>
        <textarea class="justificativa-input${saved ? ' saved' : ''}"
          placeholder="Digite a justificativa para a não entrega…"
          oninput="saveJust('${jKey}', this)">${jVal}</textarea>
      </div>`;
    }

    const itensHtml = p.itens.map(it =>
      `<div class="item-row">
        <span class="item-desc">${escHtml(it.desc)}</span>
        <span class="item-qt">${it.qt}&nbsp;un</span>
        <span class="item-val">${fmt(it.val)}</span>
      </div>`
    ).join('');

    const n = p.itens.length;

    return `<div class="card${isCancelado ? ' cancelado' : ''}">
      <div class="card-header">
        <span class="card-cliente">${escHtml(p.cliente) || '—'}</span>
        <span class="card-total">${fmt(p.total)}</span>
      </div>
      <div class="card-tags">${tagVend}${tagPed}${tagNf}${tagRota}${tagData}${tagSPed}${tagSLog}${tagNaoEntreg}</div>
      ${motivoAlertaHtml}${motivoHtml}${obsHtml}${justHtml}
      <button class="itens-toggle" onclick="toggleItens('${toggleId}',this)">
        Ver ${n} item${n !== 1 ? 'ns' : ''}
      </button>
      <div class="itens-list" id="${toggleId}" style="display:none">${itensHtml}</div>
    </div>`;
  }).join('');
}

function _justKey(p) {
  const nf = String(p.numnota || '').replace(/\D/g, '') || p.numped;
  return 'just_' + nf;
}

function saveJust(key, el) {
  const val = el.value;
  if (val.trim()) {
    localStorage.setItem(key, val);
    el.classList.add('saved');
  } else {
    localStorage.removeItem(key);
    el.classList.remove('saved');
  }
}

function toggleItens(id, btn) {
  const el   = document.getElementById(id);
  const open = el.style.display === 'none';
  el.style.display = open ? 'block' : 'none';
  if (!open) {
    const n = el.querySelectorAll('.item-row').length;
    btn.textContent = `Ver ${n} item${n !== 1 ? 'ns' : ''}`;
  } else {
    btn.textContent = 'Ocultar itens';
  }
}

function switchTab(tab, btn) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  ['rota','entregue','semrota','noemit','naoentreg','canc'].forEach(t =>
    document.getElementById('sec-' + t).classList.toggle('visible', t === tab)
  );
}

// ── Init ───────────────────────────────────────────────────────────────────────

if (!D) {
  document.body.innerHTML =
    '<p style="color:var(--red);padding:24px">Erro: entregas_data.js não encontrado. Execute entregas.py primeiro.</p>';
} else {
  const dataRota = D.data_rota || '';
  document.getElementById('header-sub').textContent =
    `Atualizado: ${D.atualizado_em}${dataRota ? '  ·  Rota: ' + dataRota : ''}`;

  if (_urlV) {
    // Modo vendedor: trava no nome da URL, não mostra seletor
    const v = D.vendedores.find(x => x.nome === _urlV);
    if (v) {
      const el = document.getElementById('header-vendedor');
      el.textContent = v.nome;
      el.style.display = 'block';
      renderVendedor();
    } else {
      document.body.innerHTML = `<p style="color:var(--red);padding:24px">Vendedor não encontrado: ${escHtml(_urlV)}</p>`;
    }
  } else {
    // Modo admin: mostra seletor
    const sel = document.getElementById('vendedor-select');
    sel.style.display = '';
    const optTodos = document.createElement('option');
    optTodos.value = optTodos.textContent = 'Todos';
    sel.appendChild(optTodos);
    D.vendedores.forEach(v => {
      const opt = document.createElement('option');
      opt.value = opt.textContent = v.nome;
      sel.appendChild(opt);
    });
    renderVendedor();

  }
}
</script>

</body>
</html>
