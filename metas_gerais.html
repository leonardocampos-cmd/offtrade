<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <script src="auth.js"></script>
  <script src="fontes_status_data.js"></script>
  <script src="fontes_alert.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Objetivos Gerais — OFF TRADE</title>
  <script src="metas_gerais_data.js"></script>
  <script src="gerentes_data.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f1117; --card: #1a1d27; --card2: #22263a;
      --accent: #f5c518; --green: #22c55e; --yellow: #eab308;
      --red: #ef4444; --blue: #60a5fa;
      --text: #e2e8f0; --muted: #94a3b8; --border: #2d3144;
    }
    body {
      background: var(--bg); color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh; padding: 16px;
      max-width: 1100px; margin: 0 auto;
    }
    header {
      display: flex; justify-content: space-between; align-items: flex-start;
      margin-bottom: 24px; padding-bottom: 16px;
      border-bottom: 1px solid var(--border); flex-wrap: wrap; gap: 12px;
    }
    .header-title h1 { font-size: 1.25rem; font-weight: 700; color: var(--accent); letter-spacing: -.02em; }
    .header-title p  { font-size: .75rem; color: var(--muted); margin-top: 3px; }
    .btn {
      display: inline-flex; align-items: center; padding: 7px 14px;
      border-radius: 8px; font-size: .8rem; cursor: pointer;
      border: 1px solid var(--border); background: var(--card2);
      color: var(--text); text-decoration: none; transition: all .15s;
    }
    .btn:hover { border-color: var(--accent); color: var(--accent); }

    /* ── Estado cards ── */
    .estados-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 12px; margin-bottom: 20px;
    }
    .estado-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 16px;
    }
    .estado-card.total { border-color: var(--accent); }
    .estado-nome  { font-size: .68rem; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin-bottom: 4px; }
    .estado-fat   { font-size: 1.35rem; font-weight: 800; line-height: 1; }
    .estado-meta  { font-size: .72rem; color: var(--muted); margin-top: 3px; }
    .estado-ant   { font-size: .72rem; margin-top: 2px; }
    .estado-nec   { font-size: .68rem; color: var(--muted); margin-top: 6px; text-align: right; }

    .bar-track { background: var(--card2); border-radius: 99px; height: 5px; margin: 8px 0 4px; overflow: hidden; }
    .bar-fill  { height: 100%; border-radius: 99px; }
    .bar-green  { background: var(--green); }
    .bar-yellow { background: var(--yellow); }
    .bar-red    { background: var(--red); }

    .pct-badge {
      display: inline-block; font-size: .72rem; font-weight: 700;
      padding: 1px 7px; border-radius: 5px; margin-left: 6px;
    }
    .pct-green  { background: rgba(34,197,94,.15);  color: var(--green); }
    .pct-yellow { background: rgba(234,179,8,.15);  color: var(--yellow); }
    .pct-red    { background: rgba(239,68,68,.15);  color: var(--red); }

    /* ── Seção título ── */
    .sec-title {
      font-size: .68rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: .08em; color: var(--muted);
      margin: 24px 0 12px; padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }

    /* ── Tabela de indústrias ── */
    .ind-table { width: 100%; border-collapse: collapse; font-size: .82rem; }
    .ind-table th {
      text-align: left; padding: 6px 10px;
      font-size: .65rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: .07em; color: var(--muted);
      border-bottom: 1px solid var(--border);
    }
    .ind-table th.right { text-align: right; }
    .ind-table td { padding: 8px 10px; border-bottom: 1px solid #1e2235; vertical-align: middle; }
    .ind-table tr:last-child td { border-bottom: none; }
    .ind-table tr:hover td { background: var(--card2); }
    .ind-table .right { text-align: right; white-space: nowrap; }
    .ind-table .fat   { font-weight: 700; }
    .ind-table .muted { color: var(--muted); font-size: .75rem; }

    .estado-pill {
      display: inline-block; font-size: .65rem; font-weight: 700;
      padding: 1px 6px; border-radius: 4px; margin: 1px;
      background: var(--card2); border: 1px solid var(--border);
    }
    .estado-pill.rj { background: rgba(96,165,250,.12); border-color: #1e40af; color: var(--blue); }
    .estado-pill.sp { background: rgba(34,197,94,.12);  border-color: #166534; color: var(--green); }
    .estado-pill.es { background: rgba(245,197,24,.12); border-color: #854d0e; color: var(--yellow); }
    .estado-pill.mg { background: rgba(239,68,68,.12);  border-color: #7f1d1d; color: var(--red); }

    .var-pos { color: var(--green); }
    .var-neg { color: var(--red); }

    /* ── Search ── */
    .search-wrap { margin-bottom: 14px; }
    .search-input {
      width: 100%; background: var(--card); border: 1px solid var(--border);
      color: var(--text); border-radius: 10px; padding: 9px 14px;
      font-size: .88rem; outline: none;
    }
    .search-input:focus { border-color: var(--accent); }

    .table-wrap { background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow-x: auto; -webkit-overflow-scrolling: touch; }

    /* ── Hierarquia gerentes ── */
    .ger-row {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 10px; overflow: hidden; margin-bottom: 8px;
    }
    .ger-header, .sup-header {
      display: flex; align-items: center; gap: 10px;
      padding: 12px 16px; cursor: pointer; transition: background .1s;
    }
    .ger-header:hover { background: var(--card2); }
    .sup-header { padding-left: 34px; background: var(--card2); }
    .sup-header:hover { background: rgba(255,255,255,.04); }
    .ger-toggle { font-size: .75rem; color: var(--muted); width: 14px; flex-shrink:0; transition: transform .2s; }
    .ger-toggle.open { transform: rotate(90deg); }
    .lv-ger  { font-size:.58rem;font-weight:700;text-transform:uppercase;letter-spacing:.09em;
               color:var(--accent);background:rgba(245,197,24,.1);border:1px solid rgba(245,197,24,.25);
               border-radius:4px;padding:1px 5px;flex-shrink:0; }
    .lv-sup  { font-size:.58rem;font-weight:700;text-transform:uppercase;letter-spacing:.09em;
               color:var(--blue);background:rgba(96,165,250,.1);border:1px solid rgba(96,165,250,.25);
               border-radius:4px;padding:1px 5px;flex-shrink:0; }
    .lv-vend { font-size:.58rem;font-weight:700;text-transform:uppercase;letter-spacing:.09em;
               color:#a78bfa;background:rgba(167,139,250,.1);border:1px solid rgba(167,139,250,.25);
               border-radius:4px;padding:1px 5px;flex-shrink:0; }
    .ger-nome { flex:1; font-size:.87rem; font-weight:600; }
    .ger-fat  { font-size:.88rem;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;white-space:nowrap;margin-left:auto; }
    .ger-qt   { font-size:.7rem;color:var(--muted);margin-left:14px;white-space:nowrap; }
    .sups-body, .vends-body { display: none; border-top: 1px solid var(--border); }
    .sups-body.open, .vends-body.open { display: block; }
    .sup-row { border-bottom: 1px solid var(--border); }
    .sup-row:last-child { border-bottom: none; }
    .vend-row {
      display:flex;align-items:center;gap:10px;
      padding:8px 16px 8px 58px;background:var(--bg);
      border-top:1px solid var(--border);
    }
    .vend-rca { font-size:.65rem;color:var(--muted);background:var(--card2);
                border:1px solid var(--border);border-radius:4px;padding:1px 5px;flex-shrink:0; }

    @media (max-width: 600px) {
      .estados-grid { grid-template-columns: 1fr 1fr; }
      .hide-mob { display: none; }
      .ger-qt { display: none; }
    }
  </style>
</head>
<body>

<header>
  <div class="header-title">
    <h1>&#127758; Objetivos Gerais — OFF TRADE</h1>
    <p id="header-sub">—</p>
  </div>
  <div style="display:flex;gap:8px;align-items:center">
    <div id="mes-toggle" style="display:flex;gap:4px;background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:3px">
      <button id="btn-mes-atual" onclick="setMes('atual')" style="padding:5px 12px;border-radius:6px;border:none;cursor:pointer;font-size:.78rem;font-weight:700;background:var(--accent);color:#111;transition:all .15s">—</button>
      <button id="btn-mes-ant"   onclick="setMes('ant')"   style="padding:5px 12px;border-radius:6px;border:none;cursor:pointer;font-size:.78rem;font-weight:700;background:transparent;color:var(--muted);transition:all .15s">—</button>
    </div>
    <a class="btn" href="index.html">&#8962; Home</a>
  </div>
</header>

<div id="app"></div>

<script>
const D = (typeof METAS_GERAIS_DATA !== 'undefined') ? METAS_GERAIS_DATA : null;

let _mesSel = 'atual';

function setMes(sel) {
  _mesSel = sel;
  const bA = document.getElementById('btn-mes-atual');
  const bP = document.getElementById('btn-mes-ant');
  bA.style.background = sel === 'atual' ? 'var(--accent)' : 'transparent';
  bA.style.color      = sel === 'atual' ? '#111' : 'var(--muted)';
  bP.style.background = sel === 'ant'   ? 'var(--accent)' : 'transparent';
  bP.style.color      = sel === 'ant'   ? '#111' : 'var(--muted)';
  render();
}

if (!D) {
  document.getElementById('app').innerHTML =
    '<p style="color:var(--red);padding:32px">Erro: metas_gerais_data.js não encontrado.<br>Execute exportacao_metas_gerais.py primeiro.</p>';
} else {
  // Labels dos botões
  document.getElementById('btn-mes-atual').textContent = D.mes;
  document.getElementById('btn-mes-ant').textContent   = D.mes_ant || 'Ant.';
  document.getElementById('header-sub').textContent =
    `Atualizado: ${D.atualizado_em}  ·  ${D.mes}  ·  Dia ${D.dias_corridos}/${D.dias_no_mes}`;
  render();
}

function brl(v) {
  return 'R$ ' + Number(v).toLocaleString('pt-BR', {minimumFractionDigits: 2, maximumFractionDigits: 2});
}
function brlk(v) {
  if (v >= 1e6) return 'R$ ' + (v / 1e6).toLocaleString('pt-BR', {minimumFractionDigits: 2, maximumFractionDigits: 2}) + ' M';
  if (v >= 1e3) return 'R$ ' + (v / 1e3).toLocaleString('pt-BR', {minimumFractionDigits: 1, maximumFractionDigits: 1}) + ' K';
  return brl(v);
}
function pctCls(p) { return p >= 100 ? 'green' : p >= 70 ? 'yellow' : 'red'; }
function varHtml(cur, ant) {
  if (!ant) return '';
  const diff = cur - ant;
  const pct  = ant > 0 ? (diff / ant * 100).toFixed(1) : 0;
  const cls  = diff >= 0 ? 'var-pos' : 'var-neg';
  const sign = diff >= 0 ? '+' : '';
  return `<span class="${cls}">${sign}${pct}%</span>`;
}

function estadoCard(e, isTotal) {
  const ant  = _mesSel === 'ant';
  const fat  = ant ? e.fat_ant_completo : e.fat;
  const pct  = ant ? (e.meta > 0 ? e.fat_ant_completo / e.meta * 100 : 0) : e.pct;
  const cls  = pctCls(pct);
  const fill = Math.min(pct, 100).toFixed(1);
  const nec  = (!ant && e.nec_dia > 0)
    ? `<div class="estado-nec">Nec./dia: ${brl(e.nec_dia)}</div>`
    : '';
  const antRow = ant ? '' : `
      <div class="estado-ant muted" style="font-size:.7rem;margin-top:2px">
        Ant. ${brlk(e.fat_ant)} ${varHtml(e.fat, e.fat_ant)}
      </div>`;
  return `
    <div class="estado-card${isTotal ? ' total' : ''}">
      <div class="estado-nome">${e.label || e.estado}</div>
      <div style="display:flex;align-items:baseline;gap:8px;margin-top:6px">
        <div class="estado-fat pct-${cls}">${brlk(fat)}</div>
        <span class="pct-badge pct-${cls}">${pct.toFixed(1)}%</span>
      </div>
      <div class="estado-meta">Objetivo: ${brlk(e.meta)}</div>
      ${antRow}
      <div class="bar-track"><div class="bar-fill bar-${cls}" style="width:${fill}%"></div></div>
      ${nec}
    </div>`;
}

function kpiHtml(label, val, ant, fmt) {
  const diff = val - ant;
  const pct  = ant > 0 ? (diff / ant * 100).toFixed(1) : null;
  const cls  = diff >= 0 ? 'var-pos' : 'var-neg';
  const sign = diff >= 0 ? '+' : '';
  const varTag = pct !== null
    ? `<span class="${cls}" style="font-size:.75rem;font-weight:700;margin-left:6px">${sign}${pct}%</span>`
    : '';
  return `
    <div style="background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 18px;flex:1;min-width:160px">
      <div style="font-size:.65rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:6px">${label}</div>
      <div style="font-size:1.25rem;font-weight:800;display:flex;align-items:baseline;gap:4px">
        ${fmt(val)}${varTag}
      </div>
      <div style="font-size:.7rem;color:var(--muted);margin-top:3px">Anterior: ${fmt(ant)}</div>
    </div>`;
}

function render() {
  const t   = D.total;
  const r   = D.resumo || {};
  const ant = _mesSel === 'ant';

  const fatKpi = ant ? (r.fat_ant_completo || t.fat_ant_completo) : (r.fat || t.fat);
  const posKpi = ant ? (r.pos_ant_completo || 0) : (r.pos || 0);

  // Resumo geral no topo
  const resumoHtml = `
    <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px">
      ${kpiHtml('Faturamento Total', fatKpi, ant ? t.fat : t.fat_ant, brl)}
      ${kpiHtml('Positivação Total', posKpi, ant ? (r.pos || 0) : (r.pos_ant || 0), v => Math.round(v).toLocaleString('pt-BR'))}
    </div>`;

  const tTotal = ant
    ? {label:'TOTAL GERAL', estado:'TOTAL', meta:t.meta, fat:t.fat_ant_completo, fat_ant:t.fat_ant, fat_ant_completo:t.fat_ant_completo, pct: t.meta>0?t.fat_ant_completo/t.meta*100:0, nec_dia:0}
    : {label:'TOTAL GERAL', estado:'TOTAL', meta:t.meta, fat:t.fat, fat_ant:t.fat_ant, fat_ant_completo:t.fat_ant_completo, pct:t.pct, nec_dia:t.nec_dia};

  // Cards de estado + total (só estados com faturamento ou positivação > 0)
  const estadosComMovimento = D.estados.filter(e => {
    const fat = ant ? e.fat_ant_completo : e.fat;
    const pos = ant ? e.pos_ant_completo : e.pos;
    return fat > 0 || pos > 0;
  });
  const estadosHtml = `
    <div class="sec-title">Faturamento por Estado</div>
    <div class="estados-grid">
      ${estadoCard(tTotal, true)}
      ${estadosComMovimento.map(e => estadoCard(e, false)).join('')}
    </div>`;

  // Tabela de indústrias
  const estadosCols = D.estados.map(e => e.estado);

  const rowsHtml = D.industrias.map((ind, i) => {
    const varH   = varHtml(ind.fat, ind.fat_ant);
    const pills  = estadosCols
      .filter(e => (ind.por_estado[e] || 0) > 0)
      .map(e => `<span class="estado-pill ${e.toLowerCase()}">${e} ${brlk(ind.por_estado[e])}</span>`)
      .join('');
    return `<tr>
      <td style="font-weight:600;min-width:180px">${ind.fantasia}</td>
      <td class="right fat">${brl(ind.fat)}</td>
      <td class="right muted">${brl(ind.fat_ant)}</td>
      <td class="right" style="white-space:nowrap">${varH}</td>
      <td class="hide-mob">${pills}</td>
    </tr>`;
  }).join('');

  const industriasHtml = `
    <div class="sec-title">Faturamento por Indústria (Top ${D.industrias.length})</div>
    <div class="search-wrap">
      <input class="search-input" type="text" placeholder="Filtrar por indústria…" oninput="filterIndustrias(this.value)">
    </div>
    <div class="table-wrap">
      <table class="ind-table" id="ind-table">
        <thead>
          <tr>
            <th>Fornecedor / Marca</th>
            <th class="right">Faturamento</th>
            <th class="right">Mês Anterior</th>
            <th class="right">Var.</th>
            <th class="hide-mob">Por Estado</th>
          </tr>
        </thead>
        <tbody id="ind-body">${rowsHtml}</tbody>
      </table>
    </div>`;

  const gerentesHtml = buildGerentesSection();
  document.getElementById('app').innerHTML = resumoHtml + estadosHtml + gerentesHtml + industriasHtml;
  mountGerentesTree();
}

function estadoPillsHtml(estados) {
  if (!estados || !estados.length) return '';
  return estados.map(e => `<span class="estado-pill ${e.toLowerCase()}">${e}</span>`).join('');
}

function buildGerentesSection() {
  if (typeof GERENTES_DATA === 'undefined' || !GERENTES_DATA.estados || !GERENTES_DATA.estados.length) return '';
  const ant    = _mesSel === 'ant';
  const mes    = (ant ? GERENTES_DATA.meses[1] : GERENTES_DATA.meses[0]) || '';
  const fatMes = pm => (pm[mes] || {}).fat || 0;
  const qtMes  = pm => (pm[mes] || {}).qt  || 0;
  const numFmt = v => Number(v).toLocaleString('pt-BR');

  let idx = 0;
  const empSorted = [...GERENTES_DATA.estados]
    .filter(emp => fatMes(emp.por_mes) > 0 || qtMes(emp.por_mes) > 0)
    .sort((a, b) => fatMes(b.por_mes) - fatMes(a.por_mes));

  const rows = empSorted.map(emp => {
    const efat = fatMes(emp.por_mes);
    const eqt  = qtMes(emp.por_mes);
    const ei   = idx++;

    const gerRows = [...emp.gerentes].sort((a, b) => fatMes(b.por_mes) - fatMes(a.por_mes)).map(ger => {
      const gfat = fatMes(ger.por_mes);
      const gqt  = qtMes(ger.por_mes);
      const gi   = idx++;

      const supRows = [...ger.supervisores].sort((a, b) => fatMes(b.por_mes) - fatMes(a.por_mes)).map(sup => {
        const sfat = fatMes(sup.por_mes);
        const sqt  = qtMes(sup.por_mes);
        const si   = idx++;

        const vendRows = [...sup.vendedores].sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR')).map(vend => {
          const vfat = fatMes(vend.por_mes);
          const vqt  = qtMes(vend.por_mes);
          const vEst = vend.estado ? `<span class="estado-pill ${vend.estado.toLowerCase()}">${vend.estado}</span>` : '';
          return `<div class="vend-row">
            <span class="lv-vend">Vendedor</span>
            ${vend.rca ? `<span class="vend-rca">${vend.rca}</span>` : ''}
            ${vEst}
            <span class="ger-nome" style="font-weight:400">${vend.nome}</span>
            <span class="ger-fat" style="font-size:.8rem">${brl(vfat)}</span>
            <span class="ger-qt">${numFmt(vqt)} un</span>
          </div>`;
        }).join('');

        return `<div class="sup-row">
          <div class="sup-header" data-target="t${si}">
            <span class="ger-toggle">▶</span>
            <span class="lv-sup">Supervisor</span>
            ${estadoPillsHtml(sup.estados)}
            <span class="ger-nome">${sup.nome}</span>
            <span class="ger-fat">${brl(sfat)}</span>
            <span class="ger-qt">${numFmt(sqt)} un</span>
          </div>
          <div class="vends-body" id="t${si}">${vendRows}</div>
        </div>`;
      }).join('');

      return `<div class="sup-row">
        <div class="sup-header" data-target="t${gi}">
          <span class="ger-toggle">▶</span>
          <span class="lv-ger">Gerente</span>
          ${estadoPillsHtml(ger.estados)}
          <span class="ger-nome">${ger.nome}</span>
          <span class="ger-fat">${brl(gfat)}</span>
          <span class="ger-qt">${numFmt(gqt)} un</span>
        </div>
        <div class="sups-body" id="t${gi}">${supRows}</div>
      </div>`;
    }).join('');

    return `<div class="ger-row">
      <div class="ger-header" data-target="t${ei}">
        <span class="ger-toggle">▶</span>
        <span style="font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:.09em;
                     color:#22c55e;background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.25);
                     border-radius:4px;padding:1px 5px;flex-shrink:0">Estado</span>
        <span class="ger-nome">${emp.nome}</span>
        <span class="ger-fat">${brl(efat)}</span>
        <span class="ger-qt">${numFmt(eqt)} un</span>
      </div>
      <div class="sups-body" id="t${ei}">${gerRows}</div>
    </div>`;
  }).join('');

  return `<div class="sec-title">Faturamento por Gerente — ${mes}</div>${rows}`;
}

function mountGerentesTree() {
  document.querySelectorAll('.ger-header, .sup-header').forEach(btn => {
    btn.addEventListener('click', () => {
      const target = document.getElementById(btn.dataset.target);
      if (!target) return;
      const open = target.classList.toggle('open');
      btn.querySelector('.ger-toggle').classList.toggle('open', open);
    });
  });
}

function filterIndustrias(q) {
  const q2 = q.toLowerCase().trim();
  document.querySelectorAll('#ind-body tr').forEach(tr => {
    const nome = tr.cells[0] ? tr.cells[0].textContent.toLowerCase() : '';
    tr.style.display = nome.includes(q2) ? '' : 'none';
  });
}
</script>
<script src="sticky_hscroll.js"></script>
</body>
</html>
